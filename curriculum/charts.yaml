# Lab Teknikal — latihan baca grafik harga NYATA (data beku di data/chart/).
#
# ATURAN PENTING:
# - Data chart = file beku data/chart/<id>.csv — JANGAN diubah/refresh; kunci
#   jawaban terikat ke angka-angka di file itu (dijaga scripts/verify_charts.py).
# - `fakta` = angka yang dihitung ulang verifier via chartfacts.py; harus persis.
#   Format: `nama: nilai` atau `nama: {nilai: X, ...param}`.
# - modul: dasar | level | indikator | praktik.
# - jenis: line | candle | praktik. Drill `praktik` tidak pakai pilihan/jawaban,
#   tapi `kunci` + `kunci_fakta` (+`kunci_faktor`) + `toleransi_pct`.
# - tingkat: mudah→20 XP · sedang→35 XP · sulit→50 XP.
# - pilihan 4 opsi, hanya SATU yang benar (hindari opsi yang ikut benar).

