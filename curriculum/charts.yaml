    Blok 1: high 79.970 / low 62.649 → blok 2: high 82.262 / low 76.248 → blok 3: high 81.433 / low 76.163.
    High naik lalu TURUN (79.970 → 82.262 → 81.433), low naik lalu stagnan. Struktur naik sejati seperti tangga: high naik DAN low naik, dua-duanya.
    Jadi jawabannya: belum struktur naik — BTC sedang konsolidasi di bawah puncak 82.000-an.
  petunjuk:
  - Bandingkan high tiap blok dulu, lalu low tiap blok.
