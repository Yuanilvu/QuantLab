# ============================================================
# BAB 14 — BACKTEST & EVALUASI
# Sample size, overfitting, risk-adjusted return,
# in-sample vs out-of-sample.
# ============================================================
bab: 14
track: quant
judul: "Backtest & Evaluasi"
emoji: "🔬"
deskripsi: "Backtest yang bagus itu eksperimen ilmiah. Waspadai jebakan overfitting, sample kecil, dan metrik yang menipu."
pelajaran:
  - id: "14-1"
    judul: "Metrik yang Jujur"
    menit: 5
    materi: |
      Laporan backtest yang menipu cuma menyebut **return**. Laporan jujur menyebut:

      - **Return %** — berapa hasilnya
      - **Max drawdown** — luka terdalam
      - **Win rate** — frekuensi menang
      - **Profit factor** — total win ÷ total loss (>1 = untung)
      - **Sharpe ratio** — return ÷ volatilitas. >1 bagus, >2 luar biasa untuk strategi harian
      - **Jumlah trade** — berapa banyak sampel

      Dua strategi return sama 40%/tahun? Satu maxDD 5%, satu lagi 35%. Yang pertama bisa dipasang leverage 3x → 120% dengan DD 15%. Yang kedua sudah di ujung kemampuan. **Risk-adjusted return** (Sharpe, Calmar = return/maxDD) yang membandingkan dengan adil.

      Aturan jempol: strategi dengan < 30 trade = anekdot, bukan bukti. < 100 trade = masih ngarang. Butuh ratusan trade + out-of-sample (uji di data yang belum pernah dipakai) untuk mulai percaya.
    kode: |
      trades = [120, -45, 80, -30, 200]     # hasil per trade (Rp)
      wins = [trade for trade in trades if trade > 0]
      profit_factor = sum(wins) / abs(sum(trade for trade in trades if trade < 0))
      print(f"Profit factor: {profit_factor:.2f} | jumlah trade: {len(trades)}")
    penjelasan: "Profit factor > 1 = untung. Tapi n=5 trade terlalu kecil untuk disimpulkan apa-apa."
  - id: "14-2"
    judul: "Overfitting: Menghafal vs Belajar"
    menit: 5
    materi: |
      Overfitting = strategi yang **menghafal data lampau**, bukan menangkap pola sebenarnya. Gejalanya: backtest in-sample (di data yang dipakai menyetel) luar biasa — return 300%. Out-of-sample (data baru) atau live trading? Jeblok.

      Penyebab umum:
      1. **Terlalu banyak parameter** — 5 parameter × 10 nilai = 100.000 kombinasi. Salah satunya pasti cocok dengan masa lalu secara kebetulan.
      2. **Memilih kombinasi terbaik** — memilah 1.000 backtest, ambil yang terbaik = multiple testing. Makin banyak dicoba, makin besar peluang juara palsu. Yang terbaik sering yang paling overfit.
      3. **Look-ahead bias** — memakai data yang belum tersedia di titik sinyal (misal close hari ini untuk keputusan intraday, atau revisi data).

      Pertahanan: **walk-forward** (train 2 tahun, test 1 tahun berikutnya, geser), parameter minimal, dan **out-of-sample wajib**. Strategi cuma jalan di data yang dipakai menyetelnya? Strategi itu tidak ada — cuma kebetulan.
    kode: |
      # Overfit: parameter dipilih dari data yang sama
      # Walk-forward: train 2019-2021, test 2022, geser...
      print("Kalau cuma jalan di data latih → overfit")
    penjelasan: "Backtest yang terlalu bagus = tanda bahaya. Walk-forward + out-of-sample adalah pengawalnya."
skenario:
  - id: "s14-1"
    judul: "20 Trade, 80% Win Rate"
    emoji: "🎯"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Strategi baru kamu: backtest 20 trade, win rate 80%, return +34% dalam 3 bulan. Kamu mau langsung pasang modal besar. Evaluasimu?
    pilihan:
      - "Langsung all-in — 80% win rate itu luar biasa"
      - "Pasang modal kecil dulu — 20 trade terlalu sedikit untuk dipercaya"
      - "Tolak total — win rate di atas 70% pasti overfit"
      - "Naikkan leverage — biar profit makin besar"
    jawaban: 1
    penjelasan: |
      20 trade = sampel terlalu kecil. Standar error win rate = √(0.8×0.2/20) ≈ 9%. Win rate asli bisa 71% atau 89%. Plus: 20 trade itu dari 1 kombinasi parameter, dipilih dari ratusan. Kemungkinan besar kebetulan. Langkah benar: **modal kecil (paper/1-2% risk) dulu**. Kumpulkan 50-100 trade lagi sebelum menaikkan ukuran. All-in di 20 trade = judi. "Pasti overfit" juga asumsi berlebihan. Leverage = mempercepat kehancuran kalau sampelnya bias.
    kode: |
      jumlah_trade = 20
      win_rate = 0.8
      se = (win_rate * (1 - win_rate) / jumlah_trade) ** 0.5
      print(f"SE win rate: {se*100:.1f}%")   # 8.9%
      # interval 95%: 62% - 98% → terlalu lebar untuk all-in
    hasil:
      - ret: -18.5
        dd: 21.0
        win: 15
        note: "All-in: ternyata win rate asli 55% (keberuntungan sampel). 4 bulan kemudian equity -18.5%."
      - ret: 6.2
        dd: 4.0
        win: 71
        note: "Modal kecil: strategi ternyata valid (win rate asli 62%). Kamu naikkan sizing bertahap, hasil 6.2% dengan DD terkontrol."
      - ret: 0.0
        dd: 0.0
        win: 45
        note: "Menolak total: strategi ini sebenarnya punya edge kecil. Kamu kehilangan peluang karena skeptis berlebihan."
      - ret: -31.0
        dd: 35.0
        win: 10
        note: "Leverage 3x di sampel kecil: drawdown asli 21% jadi 63% equity. Hampir margin call."
    petunjuk:
      - "Berapa standar error win rate dari 20 trade?"
      - "Sampel kecil + memilih parameter terbaik = apa namanya?"
  - id: "s14-2"
    judul: "Return vs Drawdown"
    emoji: "⚖️"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Dua strategi untuk modal $1.000:
      - **A**: return 40%/tahun, max drawdown 35%
      - **B**: return 25%/tahun, max drawdown 8%
      Mana yang lebih baik secara risk-adjusted?
    pilihan:
      - "A — return lebih tinggi, itu yang penting"
      - "B — Calmar ratio (return/maxDD) jauh lebih baik: 3.1 vs 1.1"
      - "Sama saja — keduanya untung"
      - "A — drawdown 35% masih normal untuk trader kripto"
    jawaban: 1
    penjelasan: |
      Calmar A = 40/35 = **1.14**. Calmar B = 25/8 = **3.13**. B memberi 3x return per unit drawdown. Lebih penting: B bisa dipasang leverage 2x → return 50% dengan DD 16%. Masih jauh lebih kecil dari DD A. Drawdown bukan hiasan. Dia menentukan risiko kehancuran dan biaya psikologis. Strategi DD 35% butuh recovery 54% setelah puncak DD. Sebagian besar trader menyerah di tengah jalan.
    kode: |
      calmar_strategi_a = 40 / 35     # 1.14
      calmar_strategi_b = 25 / 8      # 3.12
      print(f"Strategi A: Calmar {calmar_strategi_a:.2f}")
      print(f"Strategi B: Calmar {calmar_strategi_b:.2f}")
    hasil:
      - ret: 40.0
        dd: 35.0
        win: 30
        note: "A dijalankan: return 40% tercapai, tapi kamu nyerah di DD 28% di bulan 7 (butuh recovery 39%). Realisasi cuma +8%."
      - ret: 50.0
        dd: 15.9
        win: 78
        note: "B + leverage 2x: return 50% dengan DD cuma 16%. Risk-adjusted menang telak, dan kamu bisa tidur nyenyak."
      - ret: 25.0
        dd: 8.0
        win: 60
        note: "Kamu pilih B tanpa leverage: 25% dengan DD 8% — solid, tapi kamu meninggalkan 25% lagi di meja dengan leverage moderat."
      - ret: 12.0
        dd: 35.0
        win: 25
        note: "A dengan mental 'kripto emang gitu': DD 35% terjadi, kamu diamond-hand sampai recovery 9 bulan. Efisiensi modal buruk."
    petunjuk:
      - "Bandingkan return ÷ maxDD untuk keduanya."
      - "Strategi DD kecil bisa di-leverage; DD besar tidak bisa."
  - id: "s14-3"
    judul: "200 Kombinasi Parameter"
    emoji: "🕳️"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Kamu otomasi pencarian parameter: 200 kombinasi MA cepat/lambat di-backtest data 5 tahun IHSG, lalu ambil yang return tertinggi (95%/tahun, Sharpe 3.1). Kamu pasang live dengan parameter itu. Tiga bulan kemudian: return -4%, Sharpe 0.2. Apa yang terjadi?
    pilihan:
      - "Market berubah — bukan salah strategi, tunggu aja"
      - "Parameter overfit: 200 percobaan, yang terbaik = kebetulan statistik"
      - "Backtest-nya salah hitung — cek ulang kodenya"
      - "Strategi butuh waktu lebih lama untuk bekerja"
    jawaban: 1
    penjelasan: |
      Multiple testing: coba 200 kombinasi, ambil terbaik. Dengan 5% false-positive per percobaan (hasil hebat palsu), kamu HARUS dapat beberapa kombinasi yang tampak hebat murni kebetulan. Expected false positives ≈ 200 × 5% = 10. Sharpe 3.1 dari seleksi 200 percobaan ≈ Sharpe 1.0-1.5 yang jujur. Ini bukan "market berubah" — edge-nya tidak pernah ada. Perbaikan: **walk-forward** (tiap periode test pakai parameter dari periode SEBELUMNYA), kurangi parameter, dan sisihkan out-of-sample 30% data paling akhir yang TIDAK pernah dipakai untuk seleksi.
    kode: |
      import random
      random.seed(42)
      # 200 percobaan → beberapa pasti 'hebat' karena kebetulan
      trials = [random.uniform(-2, 2) for _ in range(200)]
      best = max(trials)
      print(f"Sharpe terbaik dari 200 cobaan: {best:.2f}")
      # padahal distribusi aslinya nol (tidak ada edge)
    hasil:
      - ret: -4.0
        dd: 6.5
        win: 30
        note: "Menunggu 'market kembali': 9 bulan kemudian tetap -6%. Tidak ada yang kembali — edge-nya memang tidak pernah ada."
      - ret: 0.0
        dd: 0.0
        win: 68
        note: "Diagnosis benar: kamu berhenti, audit parameter dengan walk-forward, dan menemukan parameter stabil yang return-nya 12%/thn (jujur)."
      - ret: -4.0
        dd: 6.5
        win: 25
        note: "Kode backtest sudah benar — justru itu masalahnya: 200 percobaan MEMANG menghasilkan juara palsu. Cek ulang tidak menyelesaikan apa-apa."
      - ret: -7.8
        dd: 9.2
        win: 20
        note: "'Tunggu lebih lama' = membuang modal pada strategi tanpa edge. 6 bulan kemudian -7.8%."
    petunjuk:
      - "200 percobaan, ambil terbaik — berapa yang 'hebat' karena kebetulan?"
      - "Cara menguji: parameter dari masa lalu, diuji di masa depan."
  - id: "s14-4"
    judul: "Sinyal yang Melihat Masa Depan"
    emoji: "🔮"
    sulit: "sulit"
    xp: 50
    menit: 6
    cerita: |
      Backtest BTC 3 tahun: sinyal MA dihitung dari harga close hari ini. Backtest menganggap entry terjadi di close yang sama. Hasilnya: +46% per tahun, Sharpe 2.4. Live? Kamu baru bisa entry setelah close — harga besok. Strategi ini layak?
    pilihan:
      - "Layak — close dan entry di hari yang sama itu normal"
      - "Tidak layak — look-ahead bias (pakai data masa depan). Sinyal dari close T harus dieksekusi T+1"
      - "Layak — pakai leverage kecil saja"
      - "Tidak layak — kurangi jumlah parameter dulu"
    jawaban: 1
    penjelasan: |
      Sinyal dihitung dari close hari ini. Order masuk setelah close. Eksekusi nyata terjadi di harga berikutnya. Backtest yang entry di close yang sama memakai harga yang belum bisa kamu raih. Itu look-ahead bias: strategi diam-diam melihat masa depan. Buktinya: entry di open hari berikutnya, return turun dari 46% ke 11% per tahun. Sharpe 2.4 jadi 0.8. Edge 46% itu palsu. Yang nyata hanya 11%. Perbaikan: sinyal dari close T, entry di open atau close T+1. Data sinyal harus selalu lebih tua dari data eksekusi. Kalau edge hilang setelah diperbaiki, edge itu memang tidak pernah ada.
    kode: |
      # Sinyal dari close T → eksekusi baru bisa T+1
      bias = 46       # entry di close yang sama (mustahil live)
      jujur = 11      # entry di open hari berikutnya
      print(f"{bias}%/tahun (bias) vs {jujur}%/tahun (jujur)")
    hasil:
      - ret: -6.5
        dd: 8.0
        win: 20
        note: "Live dipasang tanpa perbaikan: 4 bulan -6.5%. Return 46% tidak pernah nyata."
      - ret: 12.0
        dd: 4.5
        win: 74
        note: "Backtest diperbaiki: +11% per tahun asli. Dengan sizing disiplin, live +12%."
      - ret: -3.0
        dd: 4.0
        win: 28
        note: "Leverage memperbesar loss. Masalah waktu eksekusi tidak terselesaikan."
      - ret: -2.5
        dd: 4.0
        win: 22
        note: "Parameter bukan akar masalah. Masalahnya: entry memakai harga masa depan."
    petunjuk:
      - "Bisakah kamu entry tepat di harga close yang baru terjadi?"
      - "Kapan ordermu benar-benar terisi?"
  - id: "s14-5"
    judul: "Dua Kandidat Strategi"
    emoji: "🧪"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Hasil riset dua strategi, data 2021-2023. Strategi A: 34 trade, profit factor 2,2, return 48% per tahun. Strategi B: 520 trade, profit factor 1,35, return 17% per tahun. Keduanya lalu diuji di 2024, data yang tidak disentuh saat riset. A: -6%. B: +14%. Kamu danai yang mana?
    pilihan:
      - "A. PF 2,2 dan return 48% jauh lebih unggul"
      - "B. 520 trade dan hasil 2024 positif = bukti lebih kuat"
      - "Bagi 50:50. Dua-duanya hasil riset, risiko terbagi"
      - "A dengan modal kecil dulu. Kalau jalan, naikkan"
    jawaban: 1
    penjelasan: |
      Strategi A menunjukkan pola overfit klasik. In-sample 48%, out-of-sample -6%. Edge hilang di data yang belum pernah dilihat. Dengan 34 trade, PF 2,2 bisa muncul dari keberuntungan. Strategi B konsisten: 17% di data riset, 14% di data baru. 520 trade = sampel cukup untuk mulai percaya. Danai B. A dengan modal kecil tetap salah: kamu memberi uang ke strategi yang buktinya menolak. Bagi 50:50 = setengah modal di strategi tanpa bukti. Ujian paling jujur: out-of-sample. Hasil bagus di data lama saja tidak cukup. Kalau edge hilang di data baru, edge itu tidak pernah ada.
    kode: |
      # A: in-sample bagus, out-of-sample jeblok = overfit
      strategi_a = {"trade": 34, "profit_factor": 2.2, "in_sample": 48, "out_sample": -6}
      strategi_b = {"trade": 520, "profit_factor": 1.35, "in_sample": 17, "out_sample": 14}
      print("Strategi A: 48% vs -6% - tidak konsisten")
      print("Strategi B: 17% vs +14% - konsisten, sampel besar")
    hasil:
      - ret: -6.0
        dd: 8.0
        win: 22
        note: "A live 6 bulan: -6%. Out-of-sample tidak bohong. Kamu berhenti."
      - ret: 14.0
        dd: 3.5
        win: 76
        note: "B live setahun: +14%. Mirip hasil uji 2024. Bukti konsisten bisa dipercaya."
      - ret: 4.0
        dd: 5.5
        win: 50
        note: "Separuh A -6%, separuh B +14%. Total +4%. Strategi tanpa bukti tetap menggerus."
      - ret: -1.5
        dd: 2.5
        win: 30
        note: "Modal kecil mengecilkan luka jadi -1,5%. Tapi alokasi ke A tetap salah."
    petunjuk:
      - "Bandingkan in-sample dan out-of-sample tiap strategi."
      - "Mana yang lebih bisa dipercaya: 34 trade atau 520 trade?"


  - id: "s14-6"
    judul: "Profit Factor"
    emoji: "🪙"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Backtest strategi barumu: 12 trade. Total win $1.200, total loss $800.
      Profit factor = 1,5. Kamu mau langsung pasang modal besar. Evaluasi yang
      benar?
    pilihan:
      - "PF 1,5 lebih dari 1 = untung. All-in!"
      - "PF 1,5 = untung, tapi 12 trade terlalu sedikit — bisa kebetulan"
      - "PF harus di atas 2 — 1,5 berarti rugi"
      - "PF 1,5 = win rate 50%"
    jawaban: 1
    penjelasan: |
      PF = total win ÷ total loss = 1.200 ÷ 800 = 1,5. Di atas 1 = untung: setiap
      $1 risiko menghasilkan $1,5. Tapi 12 trade = anekdot. Satu trade besar bisa
      mengubah segalanya: kalau $700 win berasal dari satu trade, tanpa dia PF = 0,7
      (rugi). Standar error-nya besar. Kesimpulan aman: PF 1,5 itu menjanjikan,
      belum terbukti. Jalan: modal kecil dulu, kumpulkan 50-100 trade. PF di bawah 1
      = rugi, bukan "harus 2". PF juga bukan win rate — dua metrik berbeda yang
      sering tertukar.
    kode: |
      total_win = 1200
      total_loss = 800
      profit_factor = total_win / total_loss
      print(f"Profit factor: {profit_factor:.2f}")
      print("Jumlah trade: 12 — sampel terlalu kecil")
    hasil:
      - ret: -8.0
        dd: 10.0
        win: 15
        note: "All-in: 12 trade itu kebetulan. Live 4 bulan: −8%."
      - ret: 5.0
        dd: 2.5
        win: 70
        note: "Paper trade 60 kali: PF asli 1,2. Masih positif — modal dinaikkan bertahap, +5%."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "PF 1,5 jelas untung. Kamu melewatkan strategi valid karena patokan keliru."
      - ret: -8.0
        dd: 10.0
        win: 18
        note: "PF dan win rate tidak sama. Salah paham dasar, keputusan ikut salah."
    petunjuk:
      - "PF = total win ÷ total loss."
      - "Dua belas trade cukup untuk disimpulkan?"
  - id: "s14-7"
    judul: "Annualisasi Sharpe"
    emoji: "🗓️"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Strategi bulananmu: return rata-rata +1,2% per bulan, std 2,4%. Sharpe
      bulanan = 0,5. Berapa Sharpe tahunannya? Catatan: Sharpe di-annualisasi
      dengan √12, bukan ×12.
    pilihan:
      - "6,0 — 0,5 × 12"
      - "1,73 — 0,5 × √12"
      - "0,5 — tidak perlu annualisasi"
      - "0,14 — 0,5 ÷ √12"
    jawaban: 1
    penjelasan: |
      Sharpe bulanan 0,5 artinya return 0,5 std per bulan. Setahun ada 12 bulan:
      return dikali 12, tapi std cuma naik √12 — volatilitas tumbuh dengan akar
      waktu. Sharpe tahunan = 0,5 × √12 = 0,5 × 3,46 = 1,73. Angka 1,73 termasuk
      sehat untuk strategi bulanan (acuan: di atas 1 bagus). "6,0" = mengalikan 12
      tanpa √ — salah: itu menganggap risiko naik 12x lipat, padahal cuma 3,46x.
      "0,5" = lupa konversi, tidak bisa dibandingkan dengan Sharpe tahunan strategi
      lain. "0,14" = arah pembagian terbalik.
    kode: |
      sharpe_bulanan = 0.5
      sharpe_tahunan = sharpe_bulanan * 12 ** 0.5
      print(f"Sharpe tahunan: {sharpe_tahunan:.2f}")
    hasil:
      - ret: 3.0
        dd: 9.0
        win: 30
        note: "Kamu pikir Sharpe 6,0 (luar biasa), pasang leverage 4x. DD 18% bikin menyerah: realisasi +3%."
      - ret: 9.0
        dd: 4.0
        win: 72
        note: "Sharpe 1,73 = solid. Leverage 1,5x, DD terkontrol, +9%."
      - ret: 6.0
        dd: 4.0
        win: 45
        note: "Tanpa annualisasi kamu salah bandingkan dengan strategi lain yang angka tahunannya."
      - ret: -2.0
        dd: 6.0
        win: 20
        note: "0,14 = pembagian terbalik. Kamu anggap strategi jelek dan berhenti — padahal 1,73."
    petunjuk:
      - "Volatilitas tumbuh dengan akar waktu, return tumbuh linear."
      - "0,5 × √12 = ?"
  - id: "s14-8"
    judul: "Walk-Forward"
    emoji: "🚶"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Data 2016-2021. Kamu optimasi parameter MA di 2016-2019 (in-sample): +22%
      per tahun. Uji di 2020-2021 (out-of-sample): +8%. Sistem walk-forward
      (optimasi ulang tiap tahun, diuji di tahun berikutnya): rata-rata +11% per
      tahun, konsisten. Parameter mana yang kamu bawa ke live?
    pilihan:
      - "Parameter 2016-2019 — return +22% jauh lebih tinggi"
      - "Walk-forward — OOS cuma 36% dari IS = overfit; +11% konsisten lebih bisa dipercaya"
      - "Tolak semua — OOS harus sama dengan IS"
      - "Gabungkan: trade parameter IS dan OOS bersamaan"
    jawaban: 1
    penjelasan: |
      Parameter terbaik di data lama sering overfit: +22% in-sample, tapi cuma +8%
      di data yang belum pernah dilihat — 64% edge-nya hilang. Walk-forward tidak
      mencari "satu parameter ajaib": tiap tahun optimasi di data LALU, lalu diuji
      di tahun BERIKUTNYA yang belum dipakai. Hasilnya +11% konsisten — lebih rendah
      dari janji 22%, tapi nyata. Aturan: backtest terbaik = yang paling jujur,
      bukan yang paling tinggi. "OOS harus sama dengan IS" tidak realistis —
      degradasi wajar, yang berbahaya degradasi ekstrem. Mencampur IS dan OOS =
      optimasi ulang di data uji = overfit lagi.
    kode: |
      in_sample = 22
      out_sample = 8
      rasio = out_sample / in_sample
      print(f"OOS = {rasio*100:.0f}% dari IS — degradasi besar")
      print("Walk-forward: +11%/tahun konsisten — pilih ini")
    hasil:
      - ret: -4.0
        dd: 9.0
        win: 22
        note: "Live pakai parameter 2016-2019: 2022 cuma +2%. Janji 22% tidak pernah nyata."
      - ret: 11.0
        dd: 5.0
        win: 74
        note: "Walk-forward live 2022-2023: +10,5% dan +11%. Dekat dengan uji — bukti edge nyata."
      - ret: 0.0
        dd: 0.0
        win: 35
        note: "Standar mustahil itu menolak strategi sehat. WF +11% dengan degradasi wajar justru bagus."
      - ret: -2.0
        dd: 7.0
        win: 25
        note: "Mencampur IS + OOS = optimasi di data uji. Overfit lagi: −2%."
    petunjuk:
      - "22% menjadi 8%: berapa persen edge yang hilang?"
      - "Apa beda walk-forward dengan memilih parameter sekali saja?"
  - id: "s14-9"
