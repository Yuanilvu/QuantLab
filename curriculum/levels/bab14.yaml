    emoji: "👻"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Kamu menguji 1.000 kombinasi parameter di data 5 tahun. Asumsi: 10% kombinasi
      benar-benar punya edge, 90% sisanya tidak. Tes statistik: 5% false positive
      (α) dan daya deteksi 60% untuk yang punya edge. Berapa bagian dari hasil
      "signifikan" yang sebenarnya palsu?
    pilihan:
      - "5% — sesuai α, kecil"
      - "Sekitar 43% — 45 palsu dari 105 yang signifikan, hampir separuhnya hantu"
      - "60% — sesuai daya deteksi"
      - "90% — mayoritas kombinasi tidak punya edge"
    jawaban: 1
    penjelasan: |
      Dari 1.000 kombinasi: 100 punya edge nyata. Daya deteksi 60% → 60 terdeteksi
      signifikan. Sisanya 900 tanpa edge: α 5% → 900 × 5% = 45 muncul "signifikan"
      karena kebetulan. Total yang lolos = 60 + 45 = 105. Yang palsu = 45 ÷ 105 =
      43%. Ini p-hacking dalam angka: makin banyak yang kamu coba, makin banyak
      hantu yang lolos. α 5% berlaku per percobaan, bukan per proyek. Implikasi:
      temuan "signifikan" dari seleksi 1.000 percobaan wajib diuji ulang di data
      baru — hampir separuhnya mati di sana. "5%" = salah baca α. "60%" = salah
      baca daya deteksi. "90%" = salah baca proporsi dasar.
    kode: |
      kombinasi = 1000
      beredge = 0.10 * kombinasi
      terdeteksi = beredge * 0.60
      palsu = 0.90 * kombinasi * 0.05
      signifikan = terdeteksi + palsu
      print(f"Signifikan: {signifikan:.0f} | Palsu: {palsu:.0f} ({palsu/signifikan*100:.0f}%)")
