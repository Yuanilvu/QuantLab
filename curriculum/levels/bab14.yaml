      - ret: -4.0
        dd: 6.0
        win: 22
        note: "90% itu proporsi dasar, bukan proporsi palsu di antara yang signifikan."
    petunjuk:
      - "Berapa kombinasi yang benar punya edge dan terdeteksi?"
      - "Berapa false positive dari 900 yang tidak punya edge?"
      - "Palsu ÷ total signifikan = ?"
