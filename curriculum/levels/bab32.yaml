pelajaran:
  - id: "32-1"
    judul: "Confusion Matrix: Kenapa Akurasi Menipu"
    menit: 5
    materi: |
      Data kita: **620 pengajuan pinjaman UMKM**. Hasil akhirnya: **164 Macet** dan **456 Lancar**. Jadi Macet hanya 164/620 = **26,5%** dari data.

      Sekarang perhatikan: model yang tidak belajar apa pun dan SELALU menebak "Lancar" sudah benar 456 dari 620 → akurasi **0,735**. Angka ini disebut **baseline** — batas yang wajib dikalahkan. Kalau modelmu cuma 0,74, dia tidak lebih pintar dari tebakan buta.

      **Akurasi** = (tebakan benar) / (semua data). Masalahnya: akurasi tidak bilang kesalahan JENIS APA yang terjadi.

      **Confusion matrix** = tabel 4 kotak:
      - **TP** (True Positive): aslinya Macet, ditebak Macet → tertangkap.
      - **TN** (True Negative): aslinya Lancar, ditebak Lancar → aman.
      - **FP** (False Positive): aslinya Lancar, ditebak Macet → alarm palsu.
      - **FN** (False Negative): aslinya Macet, ditebak Lancar → LOLOS. Ini yang paling mahal bagi bank.

      Contoh nyata: model logreg (5 fitur) diuji pada 155 pengajuan → TP = 22, TN = 106, FP = 8, FN = 19.
      - Akurasi = (22 + 106) / 155 = 128/155 = **0,83**. Terlihat bagus!
      - **Precision** = dari yang DITANGKAP, berapa yang benar Macet = TP / (TP + FP) = 22 / 30 = **0,73**.
      - **Recall** = dari SEMUA Macet asli, berapa yang tertangkap = TP / (TP + FN) = 22 / 41 = **0,54**.

      Recall 0,54 artinya 19 dari 41 Macet lolos dari deteksi. Akurasi 0,83 tidak memberi tahu itu. Di kelas tidak seimbang (26,5% vs 73,5%), precision dan recall lebih jujur daripada akurasi.
    kode: |
      import pandas as pd
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression
      from sklearn.metrics import confusion_matrix

      data = pd.read_csv("/soaldata/kredit_umkm_bersih.csv")
      fitur = ["omzet_bulanan_juta", "lama_usaha_bulan", "pinjaman_diajukan_juta", "riwayat_telat_12m", "skor_kredit"]
      X = data[fitur]
      y = (data["status"] == "Macet").astype(int)
      X_latih, X_uji, y_latih, y_uji = train_test_split(X, y, test_size=0.25, random_state=1, stratify=y)
      model = LogisticRegression(max_iter=1000)
      model.fit(X_latih, y_latih)
      tn, fp, fn, tp = confusion_matrix(y_uji, model.predict(X_uji)).ravel()
      print(f"TP = {tp} -- Macet, ditebak Macet (tertangkap)")
      print(f"TN = {tn} -- Lancar, ditebak Lancar (aman)")
      print(f"FP = {fp} -- Lancar, ditebak Macet (alarm palsu)")
      print(f"FN = {fn} -- Macet, ditebak Lancar (LOLOS)")
      print(f"Akurasi = {(tp + tn) / len(y_uji):.2f}")
      print(f"Precision = {tp / (tp + fp):.2f} | Recall = {tp / (tp + fn):.2f}")
    penjelasan: "Akurasi 0,83 terdengar bagus, padahal 26,5% data Macet dan model bodoh sudah dapat 0,735. Precision 0,73 = 22 dari 30 tangkapan benar. Recall 0,54 = baru 22 dari 41 Macet tertangkap, 19 lolos. Di kelas tidak seimbang, precision dan recall lebih penting daripada akurasi."
  - id: "32-2"
    judul: "Cross-Validation & Overfitting"
    menit: 6
    materi: |
      Satu kali split bisa hoki atau sial. Buktinya dari data kita: model dan data sama, cuma `random_state` split yang diganti → akurasi data uji 0,774; 0,781; 0,794; 0,806; 0,813; 0,826. Mau melapor yang mana? Kalau kebetulan dapat 0,826, laporanmu terlalu bagus. Kalau dapat 0,774, terlalu jelek.

      Obatnya: **cross-validation** (CV). Data dipotong jadi 5 bagian. Tiap bagian pernah jadi data uji, lalu hasilnya dirata-rata. Contoh nyata untuk logreg: lipatan 0,782; 0,815; 0,839; 0,766; 0,782 → CV-5 = **0,797**. Semua data kebagian jadi uji, tidak ada yang terbuang, dan hasilnya jauh lebih stabil.

      **Overfitting** = model menghafal data latih, bukan belajar pola. Contoh nyata: pohon keputusan tanpa batas kedalaman → akurasi LATIH 1,000 (sempurna!), tapi CV-3 cuma 0,689. Pohon itu hafal 620 baris, tapi di data baru sering salah. Bandingkan `max_depth=4`: latih 0,792, CV-3 0,752. Aturan praktis: **selisih latih vs CV yang besar = tanda overfitting**.

      Sebaliknya **underfitting**: latih dan CV sama-sama rendah (misal 0,65 dan 0,64) → model terlalu sederhana, tambah fitur atau kompleksitas.

      Jadi: pilih model dari skor **CV**, bukan skor latih. Data uji disimpan untuk penilaian terakhir, sekali saja.
    kode: |
      import pandas as pd
      from sklearn.model_selection import cross_val_score
      from sklearn.tree import DecisionTreeClassifier

      data = pd.read_csv("/soaldata/kredit_umkm_bersih.csv")
      X = data[["riwayat_telat_12m", "skor_kredit", "pinjaman_diajukan_juta"]]
      y = (data["status"] == "Macet").astype(int)

      pohon_bebas = DecisionTreeClassifier(random_state=1)
      cv_bebas = cross_val_score(pohon_bebas, X, y, cv=3).mean()
      print(f"Tanpa batas: latih {pohon_bebas.fit(X, y).score(X, y):.3f} | CV-3 {cv_bebas:.3f}")

      pohon_batas = DecisionTreeClassifier(max_depth=4, random_state=1)
      cv_batas = cross_val_score(pohon_batas, X, y, cv=3).mean()
      print(f"max_depth=4: latih {pohon_batas.fit(X, y).score(X, y):.3f} | CV-3 {cv_batas:.3f}")
    penjelasan: "Satu split = satu lemparan dadu. Model sama, data sama, cuma random_state ganti → 0,774 sampai 0,826. CV-5 memotong data jadi 5, tiap potongan pernah jadi uji → 0,797 lebih stabil. Pohon tanpa batas: latih 1,000 tapi CV-3 0,689 = overfitting (hafal). max_depth=4: latih 0,792, CV-3 0,752."
