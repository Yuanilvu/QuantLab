  - id: "p32-2"
    judul: "Bandingkan Dua Model dengan CV"
    emoji: "🔬"
    tingkat: sedang
    xp: 40
    menit: 7
    cerita: |
      Gunakan sklearn! Data ada di /soaldata/kredit_umkm_bersih.csv. Fitur: riwayat_telat_12m, skor_kredit, pinjaman_diajukan_juta. Target: Macet = 1, Lancar = 0. Baca satu angka dari input: jumlah lipatan (fold). Nilai DUA model dengan cross_val_score pada SEMUA data, lalu cetak rata-rata skornya: baris 1 = LogisticRegression(max_iter=1000), baris 2 = DecisionTreeClassifier(max_depth=4, random_state=1). Format 3 desimal.
    input_spec: |
      Satu baris: jumlah lipatan CV (mis. 3 atau 5).
    output_spec: |
      Baris 1: rata-rata skor CV LogisticRegression (3 desimal).
      Baris 2: rata-rata skor CV DecisionTreeClassifier (3 desimal).
    contoh:
      - input: "3"
        output: "0.765\n0.752"
      - input: "5"
        output: "0.771\n0.747"
    tes:
      - input: "3"
        output: "0.765\n0.752"
      - input: "5"
        output: "0.771\n0.747"
      - input: "8"
        output: "0.766\n0.753"
      - input: "10"
        output: "0.763\n0.745"
    solusi: |
      import pandas as pd
      from sklearn.model_selection import cross_val_score
      from sklearn.linear_model import LogisticRegression
      from sklearn.tree import DecisionTreeClassifier

      lipatan = int(input())
      data = pd.read_csv("/soaldata/kredit_umkm_bersih.csv")
      X = data[["riwayat_telat_12m", "skor_kredit", "pinjaman_diajukan_juta"]]
      y = (data["status"] == "Macet").astype(int)
      skor_logreg = cross_val_score(LogisticRegression(max_iter=1000), X, y, cv=lipatan).mean()
      skor_pohon = cross_val_score(DecisionTreeClassifier(max_depth=4, random_state=1), X, y, cv=lipatan).mean()
      print(f"{skor_logreg:.3f}")
      print(f"{skor_pohon:.3f}")
    petunjuk:
      - "cross_val_score(model, X, y, cv=lipatan) lalu .mean()."
      - "Uji dua model di data yang sama, bandingkan skor rata-ratanya."
    tugas:
      - "Baca jumlah lipatan CV dari input."
      - "Baca CSV /soaldata/kredit_umkm_bersih.csv, ambil 3 fitur, dan buat target Macet (1/0)."
      - "Nilai dua model dengan cross_val_score: LogisticRegression dan DecisionTreeClassifier(max_depth=4, random_state=1)."
      - "Cetak rata-rata skor tiap model dengan 3 desimal, satu per baris."
    starter: |
