  - id: "s32-8"
    judul: "Hitung Precision & Recall Lalu Bertindak"
    emoji: "🧮"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Model menolak 30 pengajuan (ditebak Macet). Dari 30 itu, 22 benar Macet dan 8 ternyata Lancar. Di data uji ada 41 Macet asli. Berapa precision dan recall model ini, dan tindakan mana yang paling masuk akal?
    pilihan:
      - "Precision 0,54 dan recall 0,73 — naikkan ambang vonis"
      - "Precision 0,73 dan recall 0,54 — turunkan ambang vonis Macet supaya lebih banyak Macet tertangkap, sambil memantau precision"
      - "Precision 0,73 dan recall 0,54 — sudah bagus, tidak usah diapa-apakan"
      - "Recall 0,54 artinya 54% tebakan Macet salah"
    jawaban: 1
    penjelasan: |
      Precision = 22 / (22 + 8) = 22/30 = **0,733**. Recall = 22 / 41 = **0,537**. Jadi 41 - 22 = **19 Macet lolos** — hampir setengah. Akurasi model ini 0,83 dan kelihatan aman, padahal separuh kasus mahal terlewat. Tindakan: turunkan ambang keputusan (misal dari 0,5 ke 0,35) supaya lebih banyak pengajuan dicurigai Macet → recall naik, walau precision turun karena alarm palsu bertambah. Bisa juga tambah fitur yang benar-benar relevan. Yang jelas salah: diam saja karena akurasi sudah 0,83. Dan 0,54 BUKAN "54% tebakan salah" — artinya 54% Macet asli berhasil tertangkap; sisanya 46% lolos. Membalik precision dan recall artinya salah membaca arah pecahan (yang dibagi berapa).
    kode: |
      tertangkap, salah_tangkap, total_macet = 22, 8, 41
      presisi = tertangkap / (tertangkap + salah_tangkap)
      recall = tertangkap / total_macet
      print(f"Precision = {tertangkap}/{tertangkap + salah_tangkap} = {presisi:.3f}")
      print(f"Recall = {tertangkap}/{total_macet} = {recall:.3f}")
      print(f"Macet lolos = {total_macet - tertangkap} pengajuan")
    hasil:
      - ret: -6.0
        dd: 24.0
        win: 12
        note: "Pecahannya kebalik: precision 0,73, recall 0,54. Naikkan ambang = makin banyak lolos."
      - ret: 15.0
        dd: 7.0
        win: 85
        note: "Benar: precision 0,73, recall 0,54, 19 Macet lolos → turunkan ambang."
      - ret: 3.0
        dd: 20.0
        win: 25
        note: "Akurasi 0,83 tidak menyelamatkan 19 Macet yang lolos."
      - ret: -8.0
        dd: 30.0
        win: 10
        note: "Recall 0,54 = 54% Macet tertangkap, bukan 54% tebakan salah."
    petunjuk:
      - "Precision = 22 dibagi (22 + 8). Recall = 22 dibagi 41."
      - "Berapa Macet yang lolos? 41 - 22 = ?"
      - "Kalau Macet lolos banyak, ambang vonis perlu diturunkan."
  - id: "s32-9"
    judul: "Dua Split, Dua Cerita"
    emoji: "🎲"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Model sama, data sama (620 baris). Kamu ganti `random_state` split 25%: dapat 0,774 dan 0,826. CV-5 memberi lipatan 0,782; 0,815; 0,839; 0,766; 0,782. Laporan mana yang paling jujur, dan berapa selisih dua split itu?
    pilihan:
      - "0,826 — angka terbaik"
      - "0,774 — angka terburuk, biar tidak sombong"
      - "CV-5 = 0,797; selisih dua split = 0,052"
      - "Rata-rata dua split = 0,800, jadi sama saja dengan CV"
    jawaban: 2
    penjelasan: |
      Model dan data tidak berubah — yang berubah hanya pembagian data. Hasilnya 0,774 sampai 0,826: selisihnya 0,826 - 0,774 = **0,052** (5,2 poin persen). Satu split cuma satu lemparan dadu. CV-5 lebih jujur karena semua baris pernah jadi data uji: (0,782 + 0,815 + 0,839 + 0,766 + 0,782) / 5 = 3,984 / 5 = **0,797**. Laporan yang baik menulis CV-5 0,797 sekaligus rentang lipatan 0,766-0,839, karena rentang menunjukkan kestabilan. Rata-rata dua split kebetulan 0,800 — tapi itu hanya dua sampel, bukan pengukuran sistematis; kalau split ketiga dicoba, angkanya bisa bergeser lagi.
    kode: |
      lipatan = [0.782, 0.815, 0.839, 0.766, 0.782]
      cv5 = sum(lipatan) / len(lipatan)
      print(f"CV-5 = {cv5:.3f} (rentang {min(lipatan):.3f}-{max(lipatan):.3f})")
      print(f"Dua split: 0.774 dan 0.826 -> selisih {0.826 - 0.774:.3f}")
    hasil:
      - ret: -8.0
        dd: 28.0
        win: 12
        note: "0,826 = split yang hoki; di data lain bisa 0,774."
      - ret: 2.0
        dd: 6.0
        win: 30
        note: "0,774 juga satu lemparan dadu, cuma arah sebaliknya."
      - ret: 16.0
        dd: 3.0
        win: 88
        note: "Benar: CV-5 0,797 dan selisih split 0,052."
      - ret: 4.0
        dd: 18.0
        win: 28
        note: "Kebetulan 0,800, tapi rata-rata dua sampel bukan CV."
    petunjuk:
      - "Selisih = 0,826 - 0,774."
      - "Jumlahkan 5 lipatan, lalu bagi 5."
      - "Rentang lipatan memberi tahu seberapa stabil modelnya."
  - id: "s32-10"
    judul: "Hitung Biaya Dua Ambang"
    emoji: "💰"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      1.000 pengajuan, 265 di antaranya Macet asli. Model ketat: menolak 200 pengajuan, 180 benar Macet. Model longgar: menolak 400 pengajuan, 240 benar Macet. Satu kredit Macet merugikan 25 juta; satu calon baik yang ditolak menghilangkan keuntungan 2 juta. Total kerugian mana yang lebih kecil?
    pilihan:
      - "Model ketat — 180 x 25 = 4.500 juta"
      - "Model longgar — 625 + 320 = 945 juta, sedangkan model ketat 2.125 + 40 = 2.165 juta"
      - "Sama saja, karena Macet asli tetap 265"
      - "Model ketat, karena precision-nya 0,90"
    jawaban: 1
    penjelasan: |
      Hitung dua-duanya sampai tuntas. Model ketat: Macet lolos = 265 - 180 = 85 → 85 x 25 juta = **2.125 juta**. Calon baik ditolak = 200 - 180 = 20 → 20 x 2 juta = **40 juta**. Total **2.165 juta**. Model longgar: Macet lolos = 265 - 240 = 25 → 25 x 25 juta = **625 juta**. Calon baik ditolak = 400 - 240 = 160 → 160 x 2 juta = **320 juta**. Total **945 juta**. Model ketat memang punya precision lebih tinggi (180/200 = 0,90 vs 240/400 = 0,60), tapi kerugiannya 2.165/945 ≈ **2,3 kali lebih besar**. Rahasianya: satu Macet lolos menelan 25 juta, sedangkan satu calon baik hilang cuma 2 juta — 12,5 kali lebih murah. Jadi di kompetisi, hitung dulu biaya tiap jenis kesalahan sebelum memilih metrik.
    kode: |
      ketat = (265 - 180) * 25 + (200 - 180) * 2
      longgar = (265 - 240) * 25 + (400 - 240) * 2
      print(f"Ambang ketat: {ketat} juta")
      print(f"Ambang longgar: {longgar} juta")
      print(f"Ketat {ketat / longgar:.1f} kali lebih mahal")
    hasil:
      - ret: -14.0
        dd: 32.0
        win: 10
        note: "180 x 25 bukan total kerugian: Macet lolos 85 dan calon baik ditolak 20 juga dihitung."
      - ret: 17.0
        dd: 2.0
        win: 90
        note: "Benar: 2.165 vs 945 juta. Longgar 2,3 kali lebih murah."
      - ret: 0.0
        dd: 15.0
        win: 20
        note: "Macet asli sama, tapi berapa yang lolos berbeda-beda."
      - ret: -10.0
        dd: 25.0
        win: 18
        note: "Precision 0,90 tidak menghapus 85 Macet yang lolos."
    petunjuk:
      - "Macet lolos = 265 - yang tertangkap. Lalu x 25 juta."
      - "Calon baik ditolak = total ditolak - yang benar Macet. Lalu x 2 juta."
      - "Jumlahkan dua kerugian itu untuk tiap model."
soal:
  - id: "p32-1"
    judul: "Hitung Akurasi, Precision, Recall"
    emoji: "🧾"
    tingkat: mudah
    xp: 25
    menit: 6
    cerita: |
      Confusion matrix memberi 4 angka. Baca TP, TN, FP, FN (satu angka per baris). Hitung tiga metrik tanpa sklearn, lalu cetak dengan 2 desimal dalam PERSEN:
      baris 1 = akurasi = (TP + TN) / (TP + TN + FP + FN) x 100
      baris 2 = precision = TP / (TP + FP) x 100
      baris 3 = recall = TP / (TP + FN) x 100
    input_spec: |
      4 baris: TP, TN, FP, FN (angka bulat).
    output_spec: |
      3 baris: akurasi, precision, recall — persen dengan 2 desimal.
    contoh:
      - input: "22\n106\n8\n19"
        output: "82.58\n73.33\n53.66"
      - input: "50\n40\n10\n0"
        output: "90.00\n83.33\n100.00"
    tes:
      - input: "22\n106\n8\n19"
        output: "82.58\n73.33\n53.66"
      - input: "50\n40\n10\n0"
        output: "90.00\n83.33\n100.00"
      - input: "5\n80\n15\n5"
        output: "80.95\n25.00\n50.00"
      - input: "1\n1\n1\n1"
        output: "50.00\n50.00\n50.00"
    solusi: |
      tp = int(input())
      tn = int(input())
      fp = int(input())
      fn = int(input())
      total = tp + tn + fp + fn
      akurasi = (tp + tn) / total * 100
      precision = tp / (tp + fp) * 100
      recall = tp / (tp + fn) * 100
      print(f"{akurasi:.2f}")
      print(f"{precision:.2f}")
      print(f"{recall:.2f}")
    petunjuk:
      - "Akurasi memakai SEMUA empat kotak: (TP + TN) / total."
      - "Precision hanya dari yang ditangkap: TP / (TP + FP)."
      - "Recall dari semua Macet asli: TP / (TP + FN)."
    tugas:
      - "Baca 4 angka: TP, TN, FP, FN (satu per baris)."
      - "Hitung akurasi, precision, dan recall dalam persen."
      - "Cetak ketiganya dengan 2 desimal, satu per baris."
