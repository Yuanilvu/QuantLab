panduan:
  intro: Model jadi itu gampang — membuktikan dia benar-benar bagus itu seninya. Ini panduannya.
  materi:
  - label: '📄 Slide: Rakamin 08.1 — Model Evaluation'
    slug: rakamin
    path: 08 - Supervised Learning/1 - Model Evaluation.pdf
  - label: '📄 Slide: Pacmann — Validation Set Approach'
    slug: pacmann
    path: Basic Machine Learning Algorithm/Resampling Method/06 Validation Set Approach.pdf
  - label: '📄 Slide: Pacmann — Cross Validation'
    slug: pacmann
    path: Basic Machine Learning Algorithm/Resampling Method/07 Cross Validation.pdf
  - label: '📄 Slide: Pacmann — Bias-Variance Tradeoff'
    slug: pacmann
    path: Basic Machine Learning Algorithm/Theoretical Supervised Learning/08 Bias Variance Trade off.pdf
  teori:
  - "**Confusion matrix** = tabel 4 kotak untuk menguji model klasifikasi: TP (asli Macet, ditebak Macet), TN (asli Lancar, ditebak Lancar), FP (asli Lancar, ditebak Macet — alarm palsu), FN (asli Macet, ditebak Lancar — lolos). Di contoh data uji 155 pengajuan: TP 22, TN 106, FP 8, FN 19, dengan 41 Macet asli. Kotak inilah bahan mentah semua metrik klasifikasi (slide Rakamin 08.1)."
  - "**Akurasi = tebakan benar ÷ semua data**, dan di dataset ini tebakan buta (selalu menjawab Lancar) sudah benar 456/620 = **0,7355**. Angka itu baseline: lantai yang wajib dilewati sebelum modelmu boleh disebut berguna. Model berakurasi 0,74 umumnya memang cuma menebak kelas mayoritas — tidak belajar apa pun."
  - "Akurasi **menipu saat kelas tidak seimbang**: model contoh kita tampak aman dengan akurasi 0,83, padahal 19 dari 41 Macet lolos. Karena itu slide Rakamin 08.1 menganjurkan **presisi, recall, F1, dan ROC-AUC**; untuk kasus imbalance, AUC sering paling jujur karena mengukur kemampuan memisahkan dua kelas tanpa terpaku satu ambang."
  - "**Precision** menjawab dari semua yang ditahan, berapa yang benar Macet = TP ÷ (TP + FP) = 22 ÷ 30 = 0,73. **Recall** menjawab dari semua Macet asli, berapa yang tertangkap = TP ÷ (TP + FN) = 22 ÷ 41 = 0,54. Satu tabel yang sama melahirkan tiga angka berbeda (akurasi 0,83, precision 0,73, recall 0,54) karena masing-masing menjawab pertanyaan yang berbeda."
  - "**Kapan peduli yang mana:** lihat harga tiap jenis kesalahan. Di kasus kredit, satu Macet lolos merugikan 25 juta sedangkan satu calon baik yang ditolak hanya 2 juta — FN 12,5 kali lebih mahal, jadi recall yang dijaga. Di kasus spam atau skrining penyakit, arahnya bisa terbalik. Metrik dipilih dari biaya kesalahan, bukan dari angka yang paling bagus."
  - "**Satu split bisa keberuntungan:** model dan data sama, hanya `random_state` diganti, akurasi data uji bergerak dari 0,774 sampai 0,826. **Cross-validation** (k = 5 atau 10) memotong data, tiap potongan bergiliran jadi data uji, lalu skornya dirata-rata — di sini CV-5 = 0,7968 dari lipatan 0,7823 · 0,8145 · 0,8387 · 0,7661 · 0,7823. Sebaran antar lipatan juga penting: rentang sempit berarti model stabil (slide Pacmann Cross Validation)."
  - "**CV untuk memilih, data uji sekali saja.** Pilih model dan parameter dari skor CV di data latih, latih ulang model final dengan seluruh data latih, lalu buka data uji SEKALI di akhir sebagai ujian akhir. Menilai 20 percobaan di data uji yang sama lalu mengambil yang terbaik membuat data uji bocor ke proses pemilihan dan skornya jadi terlalu optimistis."
  - "**Overfit = hafal data latih, gagal di data baru** (bias-variance tradeoff): pohon tanpa batas memberi akurasi latih 1,000 tapi CV-3 hanya 0,689 — selisih 0,311, alarm menghafal. Pohon `max_depth=4` memberi latih 0,792 dan CV-3 0,752 — selisih 0,040, wajar. Obatnya: data latih lebih banyak, fitur lebih sedikit, regularisasi, atau kompleksitas dibatasi (slide Pacmann Bias-Variance Tradeoff)."
  - "**Underfit = model terlalu sederhana:** akurasi latih dan CV sama-sama rendah, seperti logreg yang hanya memakai omzet (latih 0,735, CV-5 0,735 — persis baseline). Obatnya kebalikan overfit: tambah fitur yang relevan atau tambah kompleksitas model. Selisih latih vs CV yang kecil bukan berarti sehat kalau keduanya rendah."
  - Di dataset kredit ini, tebakan mayoritas saja sudah ±0,76, jadi mulailah laporan dari perbandingan terhadap baseline itu. Sertakan confusion matrix, precision, dan recall kelas Macet — bukan hanya akurasi — lalu jelaskan metrik mana yang kamu pilih dan alasannya; juri menilai kualitas pertimbanganmu, bukan cuma angka terbesarnya.
