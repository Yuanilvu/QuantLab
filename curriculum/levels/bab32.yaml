      - "Selisih 0,31 vs 0,04 — mana yang menghafal?"
  - id: "s32-7"
    judul: "Test Set Dicicipi 20 Kali"
    emoji: "👀"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Kamu mencoba 20 kombinasi fitur dan model. Semuanya diukur di test set yang SAMA, lalu kamu ambil yang terbaik: 0,842. Padahal rata-rata 20 percobaan itu 0,773. Apa risikonya?
    pilihan:
      - "Tidak ada risiko — memilih yang terbaik itu wajar"
      - "Skor 0,842 sebagian hoki: test set ikut jadi bahan pemilihan. Pilih model pakai CV di data latih; test set dibuka SEKALI di akhir"
      - "Risikonya cuma waktu komputasi 20 kali"
      - "Aman, asal 20 model itu dilatih dengan data yang sama"
    jawaban: 1
    penjelasan: |
      Rata-rata 20 percobaan = 0,773, yang terbaik = 0,842. Selisih 0,069 itu sebagian bukan keunggulan model, tapi keberuntungan pada satu test set. Kalau model juara diuji di test set lain, skornya biasanya turun. Ini disebut test set bocor ke proses pemilihan: kamu memakai test set berkali-kali sebagai "penilai", jadi keputusanmu ikut menyesuaikan kebetulan data itu. Aturan yang benar: pilih model dan atur parameternya memakai CV di DATA LATIH. Test set disimpan rapat dan dibuka sekali saja di akhir — seperti ujian akhir, bukan latihan harian.
    kode: |
