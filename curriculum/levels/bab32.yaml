        note: "Benar: selisih 0,04 vs 0,31. B lebih jujur."
      - ret: -8.0
        dd: 28.0
        win: 15
        note: "Lebih dalam tanpa batas = lebih cepat menghafal."
      - ret: 1.0
        dd: 15.0
        win: 25
        note: "Kirim dua model? Kompetisi minta satu. Pilih dari skor CV."
    petunjuk:
