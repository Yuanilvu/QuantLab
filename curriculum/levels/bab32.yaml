    emoji: "🔁"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Datamu cuma 200 baris. Kamu split sekali (150 latih / 50 uji) → akurasi 0,86. Teman hanya mengubah `random_state` → 0,61. Mana angka yang kamu laporkan?
    pilihan:
      - "0,86 — angka terbaik, itu yang dicari juri"
      - "Pakai cross-validation 5-fold: semua baris kebagian jadi data uji, hasilnya rata-rata 5 pengukuran"
      - "0,61 — pilih yang paling pesimis biar aman"
      - "Rata-rata keduanya: (0,86 + 0,61) / 2 = 0,735"
    jawaban: 1
    penjelasan: |
      Dengan 200 baris, satu split menyisakan 50 baris uji. Satu tebakan salah = 1/50 = **0,02** perubahan akurasi. Nasib 5-10 baris sudah bisa menggeser laporan sebesar 0,1 — itu yang terjadi saat 0,86 berubah jadi 0,61 hanya karena `random_state` berganti. Split tunggal di data kecil tidak bisa dipercaya. CV 5-fold: 200/5 = **40 baris** jadi uji, diulang 5 kali sampai semua baris pernah jadi uji, lalu dirata-rata. Mengambil angka terbaik = menipu diri; mengambil yang terburuk = terlalu takut; rata-rata dua split tetap cuma dua sampel. Yang benar: ukur berkali-kali secara sistematis.
    kode: |
