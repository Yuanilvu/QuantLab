  - id: "s32-5"
    judul: "Split Sekali atau Cross-Validation?"
    emoji: "🔁"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Datamu cuma 200 baris. Kamu split sekali (150 latih / 50 uji) → akurasi 0,86. Teman hanya mengubah `random_state` → 0,61. Mana angka yang kamu laporkan?
    pilihan:
      - "0,86 — angka terbaik, itu yang dicari juri"
      - "Pakai cross-validation 5-fold: semua baris kebagian jadi data uji, hasilnya rata-rata 5 pengukuran"
      - "0,61 — pilih yang paling pesimis biar aman"
      - "Rata-rata keduanya: (0,86 + 0,61) / 2 = 0,735"
    jawaban: 1
    penjelasan: |
      Dengan 200 baris, satu split menyisakan 50 baris uji. Satu tebakan salah = 1/50 = **0,02** perubahan akurasi. Nasib 5-10 baris sudah bisa menggeser laporan sebesar 0,1 — itu yang terjadi saat 0,86 berubah jadi 0,61 hanya karena `random_state` berganti. Split tunggal di data kecil tidak bisa dipercaya. CV 5-fold: 200/5 = **40 baris** jadi uji, diulang 5 kali sampai semua baris pernah jadi uji, lalu dirata-rata. Mengambil angka terbaik = menipu diri; mengambil yang terburuk = terlalu takut; rata-rata dua split tetap cuma dua sampel. Yang benar: ukur berkali-kali secara sistematis.
    kode: |
      total = 200
      baris_uji = total // 4
      print(f"Satu split: {baris_uji} baris uji -> 1 salah = {1 / baris_uji * 100:.1f}%")
      print(f"CV-5: {total // 5} baris uji x 5 putaran, semua kebagian uji")
    hasil:
      - ret: -6.0
        dd: 25.0
        win: 20
        note: "0,86 cuma satu lemparan dadu. Di data uji lain bisa 0,61."
      - ret: 13.0
        dd: 5.0
        win: 85
        note: "Benar: CV-5 memakai semua 200 baris sebagai uji, hasilnya stabil."
      - ret: 2.0
        dd: 5.0
        win: 30
        note: "0,61 juga benar tapi terlalu pesimis — masih satu split saja."
      - ret: 3.0
        dd: 10.0
        win: 35
        note: "Rata-rata dua split bukan pengukuran sistematis."
    petunjuk:
      - "Di data kecil, satu split = nasib 50 baris saja."
      - "CV berputar: tiap bagian pernah jadi uji, lalu dirata-rata."
  - id: "s32-6"
    judul: "Overfit atau Wajar?"
    emoji: "🌳"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Pohon A tanpa batas kedalaman: akurasi latih 1,000, CV-3 0,689. Pohon B dengan `max_depth=4`: latih 0,792, CV-3 0,752. Mana yang kamu kirim ke kompetisi?
    pilihan:
      - "A — latihnya sempurna, 1,000"
      - "B — selisih latih vs CV kecil (0,04); selisih A besar (0,31) tanda menghafal"
      - "A — pohon yang lebih dalam selalu lebih pintar"
      - "Kirim keduanya, biar juri yang memilih"
    jawaban: 1
    penjelasan: |
      Hitung selisihnya. Pohon A: 1,000 - 0,689 = **0,311**. Pohon tanpa batas menghafal 620 baris latih sampai sempurna, tapi di data yang belum pernah dilihat (lipatan CV) dia jatuh ke 0,689 — lebih buruk daripada pohon dangkal. Pohon B: 0,792 - 0,752 = **0,040**. Selisih kecil = model belajar pola, bukan hafalan. Pemilihan model memakai skor CV (data yang belum dilihat), bukan skor latih. Catatan penting: CV-3 B = 0,752 masih di atas baseline 0,735, tapi hanya tipis. Langkah berikutnya bukan menambah kedalaman pohon, melainkan menambah atau memperbaiki fitur.
    kode: |
      latih_a, cv_a = 1.000, 0.689
      latih_b, cv_b = 0.792, 0.752
      print(f"Pohon A: selisih latih-CV {latih_a - cv_a:.3f} (hafal)")
      print(f"Pohon B: selisih latih-CV {latih_b - cv_b:.3f} (wajar)")
    hasil:
      - ret: -12.0
        dd: 30.0
        win: 10
        note: "Latih 1,000 itu hafalan. Di data baru jatuh ke 0,689."
      - ret: 13.0
