      Bot X: rata-rata (2+4+4+2) ÷ 4 = 3%. Jarak tiap angka ke 3: 1, 1, 1, 1 → sebaran 1.
      Bot Y: rata-rata (8−2+8+2) ÷ 4 = 4%. Jarak ke 4: 4, 6, 4, 2 → sebaran 4.
      Return per unit risiko (versi sederhana Sharpe): X = 3 ÷ 1 = 3,0. Y = 4 ÷ 4 = 1,0.
      X menghasilkan 3% per unit risiko; Y cuma 1%. Rata-rata Y memang lebih tinggi,
      tapi risikonya 4x lipat — drawdown Y sempat 10% (dari +8% ke −2%).
      Trader profesional pilih X: hasilnya bisa diprediksi dan aman dinaikkan ukurannya.
    kode: |
      return_x = [2, 4, 4, 2]
      return_y = [8, -2, 8, 2]
      def sebaran(data):
          rata = sum(data) / len(data)
          return sum(abs(x - rata) for x in data) / len(data)
      rasio_x = (sum(return_x) / 4) / sebaran(return_x)
      rasio_y = (sum(return_y) / 4) / sebaran(return_y)
      print(f"X: {rasio_x:.1f} vs Y: {rasio_y:.1f}")   # 3.0 vs 1.0
