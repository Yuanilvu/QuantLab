  - id: "s2-2"
    judul: "Sama Rata, Beda Getaran"
    emoji: "🌊"
    sulit: "sedang"
    xp: 35
    menit: 4
    cerita: |
      Dua strategi, return bulanan rata-rata SAMA (+2%/bulan):
      - **A**: +2%, +2%, +2%, +2%, +2%, +2%
      - **B**: +8%, -4%, +7%, -3%, +6%, -2%
      Modal kamu cuma cukup untuk satu strategi. Pilih mana?
    pilihan:
      - "B — kadang naik 8%, lebih seru"
      - "A — return sama, tapi hasilnya stabil (sebaran kecil)"
      - "Tidak bisa dibandingkan — rata-ratanya sama"
      - "B — yang naik 8% berarti lebih pintar"
    jawaban: 1
    penjelasan: |
      Rata-rata sama (+2%), tapi sebarannya beda total. A nol getaran, B liar.

      Strategi A lebih baik: hasilnya bisa diprediksi. Drawdown (turun dari harga puncak) kecil — B sempat -4% dan -3%. Aman di-leverage 2x → +4%/bulan dengan risiko terkendali.

      "Lebih seru" = lebih berisiko, bukan lebih pintar. Ini versi sederhana Sharpe ratio (return ÷ sebaran), ukuran yang dipakai seluruh industri.
    kode: |
      return_a = [2, 2, 2, 2, 2, 2]
      return_b = [8, -4, 7, -3, 6, -2]
      rata_return_a = sum(return_a) / len(return_a)
      rata_return_b = sum(return_b) / len(return_b)
      print(f"Rata-rata return Strategi A = {rata_return_a:.0f}%")
      print(f"Rata-rata return Strategi B = {rata_return_b:.0f}%")
      # sama-sama 2% — tapi siapa yang bisa kamu tiduri?  → A
    hasil:
