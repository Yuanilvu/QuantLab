      Total lembar = 400. Rata-rata = 340.000 ÷ 400 = **Rp850**.
      Opsi 900 = rata-rata dua harga (1.000 + 800) ÷ 2 — lupa jumlah lembarnya beda.
      Opsi 800 = menganggap semua kebeli di harga baru. Opsi 1.000 = mengabaikan pembelian kedua.
      Dengan rata-rata 850, BRPT cukup naik ke 935 (+10%) untuk untung 10% — tidak perlu balik ke 1.000.
    kode: |
      total_biaya = 100 * 1000 + 300 * 800
      total_lembar = 100 + 300
      harga_rata2 = total_biaya / total_lembar
      print(f"Rata-rata harga beli = Rp{harga_rata2:.0f}")   # 850
    hasil:
