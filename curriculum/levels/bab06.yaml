  - id: "p6-3"
    judul: "Rata-rata Harga"
    emoji: "📊"
    tingkat: sulit
    xp: 55
    menit: 10
    cerita: |
      Baca angka N (berapa hari), lalu N baris harga (satu harga per baris). Cetak TOTAL semua harga, lalu RATA-RATA-nya (pembulatan ke bawah / bilangan bulat).
    input_spec: |
      Baris 1: N (jumlah hari). N baris berikutnya: harga harian (angka bulat, satu per baris).
    output_spec: |
      Baris 1: total semua harga. Baris 2: rata-rata (total // N).
    contoh:
      - input: "3\n1000\n2000\n3000"
        output: "6000\n2000"
      - input: "2\n500\n700"
        output: "1200\n600"
    tes:
      - input: "3\n1000\n2000\n3000"
        output: "6000\n2000"
      - input: "4\n1000\n1100\n900\n1000"
        output: "4000\n1000"
      - input: "2\n500\n700"
        output: "1200\n600"
      - input: "1\n999"
        output: "999\n999"
    solusi: |
      n = int(input())
      total = 0
      for i in range(n):
          total += int(input())
      print(total)
      print(total // n)
    petunjuk:
      - "Baca n dulu, lalu loop n kali membaca harga."
      - "Rata-rata = total // n (pembulatan ke bawah)."
  - id: "p6-4"
    judul: "Harga Tertinggi & Terendah"
    emoji: "📊"
    tingkat: sulit
    xp: 55
    menit: 10
    cerita: |
      Baca N (jumlah hari), lalu N baris harga. Cetak harga TERTINGGI dan TERENDAH, masing-masing di baris sendiri. (Kerjakan dengan loop — jangan pakai list dulu, nanti di Bab 17 ada cara lebih singkat.)
    input_spec: |
      Baris 1: N. N baris berikutnya: harga harian.
    output_spec: |
      Baris 1: harga tertinggi. Baris 2: harga terendah.
    contoh:
      - input: "4\n1000\n2000\n500\n1500"
        output: "2000\n500"
      - input: "3\n700\n700\n700"
        output: "700\n700"
    tes:
      - input: "4\n1000\n2000\n500\n1500"
        output: "2000\n500"
      - input: "3\n700\n700\n700"
        output: "700\n700"
      - input: "1\n999"
        output: "999\n999"
      - input: "5\n50\n80\n20\n60\n90"
        output: "90\n20"
    solusi: |
      n = int(input())
      tertinggi = -1
      terendah = 10 ** 9
      for i in range(n):
          h = int(input())
          if h > tertinggi:
              tertinggi = h
          if h < terendah:
              terendah = h
      print(tertinggi)
      print(terendah)
    petunjuk:
      - "Mulai dengan tertinggi = -1 dan terendah = angka sangat besar."
      - "Di tiap loop, bandingkan dan perbarui keduanya."
