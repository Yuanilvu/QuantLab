      - "Tidak mungkin — Python tidak bisa pegang data sebanyak itu"
    jawaban: 1
    penjelasan: |
      Loop memproses 250 angka, bahkan 250.000, dengan kode sama pendeknya: `total = 0`, lalu `for setiap harga: total += harga`, akhirnya `total / 250`. Inilah kekuatan quant: **kode tidak peduli datanya 250 atau 2,5 juta.** Polanya sama. Ini juga dasar moving average (Bab 13).

      Menulis 250 variabel manual = rawan salah ketik. Kalkulator = harus salin satu-satu. "Tidak mungkin"? Salah. Python justru dibuat untuk ini.
    kode: |
