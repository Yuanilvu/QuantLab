deskripsi: "Data pasar = ribuan angka. Perulangan (loop) membuat komputer memproses semuanya tanpa lelah."
pelajaran:
  - id: "6-1"
    judul: "Ulangi dengan for"
    menit: 5
    materi: |
      Data harga saham: ratusan ribu angka. Manusia tidak mungkin membaca satu-satu. Komputer bisa, pakai **loop** (perulangan).

      ```python
      for i in range(5):
          print(i)
      ```
      Mencetak 0, 1, 2, 3, 4. `range(5)` = daftar angka 0 sampai 4 (mulai dari 0!).

      Mau mulai dari 1? `range(1, 6)` = 1, 2, 3, 4, 5. Mau sampai n? `range(1, n + 1)`.

      Bayangkan untuk data: "untuk setiap hari, cetak harganya". Loop + data = kekuatan quant. Kamu tidak perlu melihat 1.000 harga. Python yang melihat semuanya untukmu.
    kode: |
      for i in range(1, 6):
          print(f"Hari {i}")
      # Hari 1, Hari 2, ... Hari 5
    penjelasan: "for i in range(...) mengulang. range(a, b) = a sampai b-1. Indentasi menentukan isi loop."
  - id: "6-2"
    judul: "Menjumlah dalam Loop"
    menit: 5
    materi: |
      Pekerjaan paling umum di quant: **menjumlahkan banyak angka**. Polanya:

      ```python
      total = 0
      for i in range(5):
          harga = int(input())   # baca 5 harga, satu per baris
          total = total + harga  # timbun ke total
      rata2 = total / 5
      print(rata2)
      ```

      `total = total + harga` artinya: ambil total lama, tambah harga baru, simpan lagi. Bisa ditulis pendek: `total += harga`. Ini namanya **akumulasi**.

      Kenapa penting? Rata-rata harga, total profit, jumlah trade, volume — semua pakai pola ini. Setelah bisa loop, kamu bisa hitung moving average (rata-rata harga n hari terakhir, Bab 13) dari data nyata: jumlahkan n harga terakhir, bagi n.
    kode: |
      total = 0
      for i in range(3):
          total += 100   # 3x tambah 100
      print(f"Total = {total}")
    penjelasan: "Akumulasi: total += nilai. Loop + akumulasi = rata-rata, total, dan semua statistik."
