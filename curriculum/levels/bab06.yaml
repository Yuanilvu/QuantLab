    emoji: "💡"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Kamu punya data harga TLKM 250 hari (satu angka per hari). Mau hitung rata-rata 250 hari itu. Tanpa loop, kamu harus menulis `harga1 + harga2 + ... + harga250` — 250 variabel! Apa cara yang benar?
