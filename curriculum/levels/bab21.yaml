# ============================================================
# BAB 21 — PROYEK AKHIR: BOT CARRY PERTAMAMU (TRACK: QUANT)
# Merakit semua pelajaran: math + python + finance + quant.
# ============================================================
bab: 21
track: quant
judul: "Proyek Akhir: Bot Carry Pertamamu"
emoji: "🤖"
deskripsi: "Semua pelajaran bermuara ke sini: merancang bot funding rate carry — dari angka, kode, risiko, sampai rencana live. Kamu sekarang membangun, bukan cuma menjawab."
pelajaran:
  - id: "21-1"
    judul: "Merakit Semua Pelajaran"
    menit: 5
    materi: |
      Bot carry = mesin yang menerima funding rate (Bab 1), mengambil keputusan (Bab 15), dan menghitung ukuran (Bab 2 & 7). Hasilnya dievaluasi dengan statistik (Bab 6). Semua dijalankan tanpa emosi (Bab 5).

      Perjalananmu:
      - **Math** (11-13): persen, rata-rata, EV — bahasa angkanya.
      - **Python** (14-17): variabel, if, loop, fungsi — tangan yang mengeksekusi.
      - **Finance** (18-20): bunga, pasar, risiko — konteks dunianya.
      - **Quant** (1-10): funding carry, risk management, sinyal, backtest, eksekusi — cara kerja profesionalnya.

      Bot yang baik bukan kode rumit — justru SEBALIKNYA: aturan SEDERHANA yang dijalankan KONSISTEN. Komponen minimum:
      1. **Data**: funding rate + harga (dari exchange).
      2. **Aturan entry**: kapan buka posisi (mis. annualized funding > 15%).
      3. **Sizing**: risiko tetap (2% equity, stop 2×ATR — ATR = jarak wajar gerak harga harian).
      4. **Aturan exit**: kapan tutup (target, stop, funding turun).
      5. **Monitoring**: log + alert + kill switch (Bab 10).
    kode: |
      def keputusan(funding_annual, harga, ma20):
          if funding_annual > 0.15 and harga > ma20:
              return "SHORT CARRY"   # terima funding + searah trend
          return "FLAT"
      print(keputusan(0.21, 4100, 4000))   # SHORT CARRY
    penjelasan: "Bot = aturan sederhana + konsistensi. Data → aturan → keputusan → monitoring."
  - id: "21-2"
    judul: "Checklist Go-Live"
    menit: 5
    materi: |
      Sebelum bot menyentuh uang sungguhan, ceklis wajib:

      **1. Angka** (Bab 1, 6): annualisasi funding benar (×3×365)? EV positif? Sample backtest cukup (>100 trade)?
      **2. Kode** (Bab 14-17): aturan jelas, logika if benar (Bab 15-2: logika terbalik!), data tidak salah index (Bab 17-1).
      **3. Risiko** (Bab 2, 7): risiko per trade 1-2%? Stop 2×ATR? Drawdown maksimal ditetapkan?
      **4. Backtest jujur** (Bab 4): sudah termasuk fee & slippage (selisih harga eksekusi vs minta)? Walk-forward? Bukan cuma parameter terbaik dari 200 percobaan?
      **5. Eksekusi** (Bab 5, 10): idempotent order (client order ID)? Kill switch? Alert ke HP? Reconciliation?

      Kalau SATU saja belum jelas, jawabannya: **paper trade dulu** (Bab 10). Jalankan bot di mode simulasi 2-4 minggu. Bandingkan dengan ekspektasi, baru naikkan ukuran bertahap. Bot yang baik lahir dari proses, bukan dari satu malam ngoding.
    kode: |
      checklist = ["annualisasi", "EV positif", "sizing 2%", "stop 2xATR",
                   "fee+slippage", "kill switch", "alert", "paper trade"]
      for item in checklist:
          print(f"[ ] {item}")
    penjelasan: "8 item ceklis. Ada yang belum dicentang? Maka belum go-live."
skenario:
  - id: "s21-1"
    judul: "Aturan Entry Pertama"
    emoji: "🚦"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Bot carry pertamamu butuh aturan ENTRY yang jelas. Data: BTC funding 0,04% per 8 jam (annualized ≈ 43,8%). Aturan entry mana yang PALING MASUK AKAL untuk memulai?
    pilihan:
      - "Buka short setiap saat — funding positif = uang gratis"
      - "Short saat annualized funding > 15% DAN harga tidak sedang crash (cek trend) — dengan stop ketat"
      - "Short saat funding > 0 — berapa pun, kapan pun"
      - "Tidak perlu aturan — lihat chart lalu putuskan manual"
    jawaban: 1
    penjelasan: |
      Aturan entry yang baik itu SPESIFIK dan punya FILTER. Threshold funding: 15%+ annualized = cukup menarik. Filter arah: jangan short saat harga crash — carry kalah oleh loss harga (Bab 1-2). Selalu pakai stop. "Selalu short" = mengabaikan risiko harga (Bab 1). "Funding > 0 kapan pun" = sinyal lemah. "Putuskan manual" = bukan bot — itu menghidupkan emosi (Bab 5). Bot = aturan yang bisa ditulis, diuji, dan dijalankan 24 jam.
    kode: |
      funding_annual = 0.438
      if funding_annual > 0.15:
          print("ENTRY SHORT — dengan stop 2xATR")
      else:
          print("FLAT — tunggu funding lebih menarik")
    hasil:
      - ret: -8.0
        dd: 9.0
        win: 20
        note: "Short terus: market pump 2 minggu, funding 0,44% tidak menutup loss harga 8%. Carry bukan alasan melawan trend."
      - ret: 5.2
        dd: 1.8
        win: 70
        note: "Threshold 15% + filter trend + stop: 2 trade bagus dalam sebulan, +5,2% dengan DD kecil."
      - ret: -3.5
        dd: 4.0
        win: 35
        note: "Funding > 0 tanpa threshold: entry di funding 3%/tahun — tipis, sekali harga melawan langsung loss. Net -3,5%."
      - ret: -2.0
        dd: 3.0
        win: 25
        note: "Manual: 3 dari 4 keputusan terpengaruh emosi. Itu bukan bot, itu gambling berjadwal."
    petunjuk:
      - "Aturan entry harus spesifik: KAPAN dan SYARAT apa?"
      - "Carry tanpa filter arah harga = bom waktu."
  - id: "s21-2"
    judul: "Sizing Bot Carry"
    emoji: "📐"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Botmu siap: equity $1.000, risiko per trade 2%, stop 5% dari entry. Berapa ukuran posisi (notional) yang harus dipasang bot?
    pilihan:
      - "$1.000 — full, biar carry-nya maksimal"
      - "$400 — risiko $20 ÷ stop 5% = $400 notional"
      - "$2.000 — leverage 2x biar cuan dobel"
      - "$100 — paling aman"
    jawaban: 1
    penjelasan: |
      Ukuran = risiko ÷ stop% = (1000 × 2%) ÷ 5% = $20 ÷ 0,05 = **$400**. Kalau stop kena, rugi persis $20 (2% equity). Full $1.000 = risiko $50 (5% equity — 2,5x lipat aturan). Leverage $2.000 = risiko $100 (10%!) — satu stop loss = sebulan profit hilang. $100 = risiko cuma 1% — terlalu kecil, bot tidak efisien. Sizing otomatis di kode: `size = (equity * risk_pct) / stop_pct` — persis rumus Bab 2 & 7.
    kode: |
      equity = 1000
      risk_pct = 0.02
      stop_pct = 0.05
      ukuran_posisi = equity * risk_pct / stop_pct
      print(f"Ukuran posisi = ${ukuran_posisi:.0f}")   # $400
    hasil:
      - ret: -10.0
        dd: 10.0
        win: 15
        note: "Full $1.000: stop kena = -5% equity. Dua stop = -10%. Bot mati sebelum berkembang."
      - ret: 6.5
        dd: 2.0
        win: 74
        note: "$400 benar: tiap stop = -$20 persis. 3 bulan: +6,5% dengan DD 2%."
      - ret: -15.0
        dd: 15.0
        win: 10
        note: "Leverage 2x: 1 stop = -10% equity. Sebulan: 2 stop = -15%."
      - ret: 2.0
        dd: 0.5
        win: 40
        note: "$100 terlalu kecil: return bot 2% — kalah sama inflasi, dan bot tidak teruji dengan risiko nyata."
    petunjuk:
      - "Risiko per trade = 2% × $1.000 = ?"
      - "Ukuran = risiko ÷ stop (0,05)."
  - id: "s21-3"
    judul: "Go-Live atau Tidak?"
    emoji: "🚀"
    sulit: "sulit"
    xp: 50
    menit: 6
    cerita: |
      Botmu: backtest 2 tahun +18%/tahun (net fee). Paper trade 3 minggu: 5 sinyal valid, tapi **slippage aktual 2x asumsi** (0,2% vs 0,1%). Ada 1 order timeout — retry dobel, ketahuan saat reconciliation. Hasil paper: +1,1% (ekspektasi +1,8%). Keputusan?
    pilihan:
      - "Go-live full ukuran — backtest bagus, paper profit"
      - "Go-live ukuran 1/2 dengan asumsi slippage baru (0,2%), perbaiki retry idempotent, pantau 4 minggu"
      - "Tunda semua — bot terbukti gagal"
      - "Go-live dengan leverage 2x — slippage kecil, aman"
    jawaban: 1
    penjelasan: |
      Paper trade menemukan DUA masalah nyata (slippage 2x, retry dobel). Itu justru TUJUAN paper trade (Bab 10): menemukan masalah sebelum uang sungguhan. Deviasi 0,7% dari ekspektasi < 20% → bot tetap layak. Tapi perbaiki dulu: bug retry (idempotency) dan asumsi slippage 0,2%. Lalu go-live 1/2 ukuran selama 4 minggu. "Full ukuran" mengabaikan temuan paper. "Tunda semua" overreact — deviasi kecil, bug ketahuan lebih awal. "Leverage 2x" memperbesar risiko di fase uji.
    kode: |
      deviasi = (1.8 - 1.1) / 1.8   # 0.39 → 39%? tidak...
      # deviasi slippage: asumsi 0.1% → aktual 0.2%
      # keputusan: perbaiki bug, update asumsi, ukuran 1/2
      print("Paper = tes sebelum api. Fix → 1/2 ukuran → pantau.")
    hasil:
      - ret: -7.0
        dd: 8.0
        win: 18
        note: "Full ukuran: slippage 0,2% makan 40% edge. 2 bulan: -7% dan semangat hancur."
      - ret: 9.0
        dd: 2.5
        win: 72
        note: "Fix + 1/2 ukuran: 4 minggu stabil, naik ke 3/4, akhirnya full. Setahun: +9% dengan proses yang benar."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Tunda total: bot sebenarnya valid (deviasi kecil, bug bisa difix). Kamu kehilangan 6 bulan karena perfeksionisme."
      - ret: -12.0
        dd: 12.0
        win: 10
        note: "Leverage 2x di fase uji: slippage + retry bug × leverage = -12%. Menguji dengan utang = bodoh."
    petunjuk:
      - "Apa yang ditemukan paper trade? Dua masalah nyata."
      - "Deviasi < 20% dari ekspektasi = layak lanjut dengan perbaikan."
  - id: "s21-4"
    judul: "Sabar atau Paksa?"
    emoji: "⏳"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Bot carry-mu jalan 4 bulan. Profit +7%. Aturan entry: short saat annualized funding > 15%. Dua bulan terakhir funding cuma 8-12%. Bot flat terus — tidak ada satu pun entry. Kamu mulai tidak sabar. Catatan backtest: 60 trade dengan funding 8-15% rata-rata −0,3% per trade. 45 trade dengan funding > 15% rata-rata +1,1% per trade. Keputusanmu?
    pilihan:
      - "Turunkan threshold ke 8% — bot harus tetap bekerja"
      - "Pertahankan 15% — biarkan flat. Aturan dibuat dari data, bukan dari bosan"
      - "Short manual sekarang — 'sekali ini saja', 12% masih lumayan"
      - "Balik arah: long besar — funding rendah artinya pasar mau naik"
    jawaban: 1
    penjelasan: |
      Data bicara lebih keras dari rasa bosan. Band 8-15%: −0,3% per trade. Itu ekspektasi negatif setelah fee — main di sana berarti sengaja rugi. Band > 15%: +1,1% per trade. Simulasi 100 trade: band rendah −30%; band tinggi +110%. Flat bukan kegagalan. Modal utuh, siap dipakai saat funding naik lagi. Funding itu siklus; dua bulan kering itu normal. Ubah aturan hanya kalau ada data baru (evaluasi kuartalan). Bukan karena tidak sabar. Long saat funding rendah = menebak arah pasar — di luar keahlian carry.
    kode: |
      ev_rendah = -0.3 * 100     # 100 trade di funding 8-15%
      ev_tinggi = 1.1 * 100      # 100 trade di funding >15%
      print(f"EV band rendah: {ev_rendah:.0f}%")
      print(f"EV band tinggi: {ev_tinggi:.0f}%")
      print("Keputusan: tetap 15% — flat itu valid")
    hasil:
      - ret: -1.5
        dd: 2.0
        win: 22
        note: "Threshold 8%: 5 trade di band lemah (rata-rata −0,3%) → −1,5%."
      - ret: 3.3
        dd: 0.8
        win: 80
        note: "Flat 5 minggu. Funding naik ke 19% → 3 trade +1,1% → +3,3%."
      - ret: -2.4
        dd: 2.4
        win: 15
        note: "'Sekali ini saja': harga naik 2%, stop kena → −2,4%. Disiplin mulai retak."
      - ret: -5.5
        dd: 5.5
        win: 12
        note: "Long paksa 2x: harga turun 2,8%. Stop kena → −5,5%."
    petunjuk:
      - "Bandingkan EV dua band pakai angka dari cerita."
      - "Bosan bukan alasan mengubah aturan — data yang berhak."
  - id: "s21-5"
    judul: "Aturan Exit Berbunyi"
    emoji: "🚪"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Bot carry-mu masuk SHORT saat funding 22%. Aturan exit yang kamu tulis: funding turun di bawah 15%, ATAU target +2% tercapai, ATAU stop kena. Hari ini funding 11%. Posisi masih +1,2%. Aturan exit sudah berbunyi. Apa yang kamu lakukan?
    pilihan:
      - "Tahan dulu: target +2% tinggal sedikit lagi"
      - "Exit sekarang: aturan exit sudah berbunyi (funding di bawah 15%)"
      - "Longgarkan aturan: exit kalau funding di bawah 5%"
      - "Tutup setengah, sisanya biarkan jalan"
    jawaban: 1
    penjelasan: |
      Aturan exit berbunyi karena funding 11% lebih kecil dari 15%. Artinya alasan posisi dibuka sudah hilang. Carry (pendapatan funding) sekarang tipis, tapi risiko harga tetap penuh. Exit sekarang = +1,2% terkunci. "Tunggu target" = mengubah aturan di tengah jalan. Setelah exit, funding terus turun ke 6% dan harga naik 1,8%. Yang tahan: profit menguap, stop kena di −1,0%. Melonggarkan aturan = aturanmu tidak pernah dipatuhi. Tutup setengah = kompromi yang tidak ada di aturan. Bot = aturan ditulis, diuji, lalu DIJALANKAN. Aturan diubah hanya dengan data baru, bukan perasaan "tinggal dikit".
    kode: |
      funding = 11
      if funding < 15:
          print("EXIT: +1.2% terkunci")
      else:
          print("Tahan")
    hasil:
      - ret: 0.4
        dd: 2.6
        win: 25
        note: "Tahan: funding turun ke 6%, harga naik. Stop kena. Profit +1,2% menguap jadi +0,4%."
      - ret: 1.2
        dd: 0.0
        win: 80
        note: "Exit benar di +1,2%. Sebulan kemudian funding 20% lagi, bot entry baru. Disiplin utuh."
      - ret: -0.6
        dd: 1.8
        win: 20
        note: "Aturan dilonggarkan diam-diam: exit baru terjadi di funding 5%, posisi sudah −0,6%."
      - ret: 0.8
        dd: 1.2
        win: 35
        note: "Setengah posisi tetap kena stop: cuma +0,8%. Aturan exit tidak setengah-setengah."
    petunjuk:
      - "Aturan exit berbunyi. Apa isi aturan yang kamu tulis sendiri?"
      - "Mengubah aturan di tengah posisi = keputusan emosi."
  - id: "s21-6"
    judul: "Annualisasi Funding"
    emoji: "🕒"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Funding rate BTC: 0,02% per 8 jam (dibayar 3x sehari). Threshold entry botmu: annualized funding > 15%. Annualisasi = x3x365. Berapa annualized-nya, dan apakah lolos threshold?
    pilihan:
      - "7,3% — di bawah threshold, bot tetap flat"
      - "21,9% — lolos threshold, kandidat entry"
      - "2,19% — di bawah threshold"
      - "0,73% — jauh di bawah"
    jawaban: 1
    penjelasan: |
      Funding dibayar 3x sehari (setiap 8 jam). Setahun: 3 x 365 = 1.095 kali bayar. Annualized = 0,02% x 1.095 = 21,9%. Itu di atas 15% → lolos threshold, masuk kandidat entry (tetap dengan filter arah harga dan stop, bab 21-1). Opsi 7,3% = lupa dikali 3 (menganggap funding dibayar sekali sehari). 2,19% dan 0,73% = salah posisi desimal atau salah periode. Kesalahan annualisasi mengubah keputusan: 7,3% membuatmu melewatkan sinyal valid; angka kegedean membuatmu entry di funding sampah. Selalu hitung: rate x 3 x 365 — ini item pertama ceklis go-live (bab 21-2).
    kode: |
      rate_per_8jam = 0.0002
      annualized = rate_per_8jam * 3 * 365
      print(f"Annualized funding: {annualized*100:.1f}%")
      print(f"Lolos threshold 15%: {'YA' if annualized > 0.15 else 'TIDAK'}")
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Anggap 7,3%: bot flat 6 minggu, funding 18-22% dilewati semua. +0%."
      - ret: 4.8
        dd: 1.2
        win: 75
        note: "21,9% benar: 4 entry valid bulan itu, +4,8% dengan stop disiplin."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "2,19%: flat terus, sinyal bagus terlewat."
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "0,73%: salah hitung total — tidak pernah entry."
    petunjuk:
      - "Berapa kali funding dibayar dalam sehari?"
      - "Kalikan rate x 3 x 365, lalu bandingkan dengan 15%."
  - id: "s21-7"
    judul: "Backtest Lupa Biaya"
    emoji: "🧾"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Backtest bot carry: +0,28% per trade GROSS (belum potong biaya). Biaya nyata: fee 0,04% per sisi (masuk + keluar) dan slippage 0,04% per trade. Berapa net per trade, dan apakah bot layak?
    pilihan:
      - "+0,28% — biaya kecil, abaikan saja"
      - "+0,16% — 0,28 dikurangi (0,08 fee + 0,04 slippage). Masih positif: layak, tapi tipis — pantau ketat"
      - "-0,12% — biaya dihitung dobel: rugi"
      - "+0,24% — potong fee 0,04% saja"
    jawaban: 1
    penjelasan: |
      Biaya round-trip: fee 0,04% x 2 sisi = 0,08%, plus slippage 0,04% → total 0,12% per trade. Net = 0,28 - 0,12 = +0,16% per trade. Masih positif → bot layak diuji (paper dulu), TAPI edge cuma 0,16%: sekali slippage ekstra langsung habis. Kalau backtest lupa biaya, kamu overestimate 75% (0,28 vs 0,16). "+0,28% abaikan biaya" = backtest bohong — item ceklis bab 21-2: fee + slippage wajib masuk. "+0,24%" cuma potong fee satu sisi. "-0,12%" = biaya dihitung dobel. Bot dengan net tipis begini wajib: ukuran kecil, eksekusi limit, audit slippage tiap minggu.
    kode: |
      gross = 0.28
      biaya_roundtrip = 0.04 * 2 + 0.04
      net = gross - biaya_roundtrip
      print(f"Net per trade: {net:.2f}%")
    hasil:
      - ret: -4.0
        dd: 6.0
        win: 20
        note: "Anggap 0,28%: sizing kegedean 75%. Slippage nyata menghabiskan edge, 3 bulan -4%."
      - ret: 6.8
        dd: 3.0
        win: 68
        note: "Net 0,16% dipakai: ukuran pas, paper 3 minggu, lalu live kecil. +6,8% setahun."
      - ret: -2.5
        dd: 4.0
        win: 25
        note: "Biaya dihitung dobel: bot dianggap rugi lalu dibuang. Padahal net positif."
      - ret: 1.5
        dd: 8.0
        win: 30
        note: "Potong fee satu sisi saja: sizing tetap kegedean. DD 8% — lebih liar dari rencana."
    petunjuk:
      - "Fee dua sisi: masuk + keluar = 0,08%."
      - "Net = gross - (fee 2 sisi + slippage)."
      - "Edge 0,16% itu tipis — apa implikasinya untuk ukuran posisi?"
  - id: "s21-8"
    judul: "Aturan Drawdown Maksimum"
    emoji: "🛑"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Aturan botmu: kalau equity turun 15% dari puncak (peak), bot STOP TOTAL — mati sampai kamu audit manual. Equity: puncak $1.050, sekarang $890. Apakah aturan berbunyi? Apa aksimu?
    pilihan:
      - "Lewati — 15,2% cuma lewat 0,2 poin, nanggung berhenti"
      - "Stop total — DD = (1.050 - 890) / 1.050 = 15,2% > 15%: aturan berbunyi, audit dulu"
      - "Kurangi ukuran setengah — kompromi yang bijak"
      - "Tambah posisi — harga sedang murah setelah turun"
    jawaban: 1
    penjelasan: |
      Drawdown = (1.050 - 890) / 1.050 = 160 / 1.050 = 15,2% — LEWAT ambang 15%. Aturan berbunyi: stop total. Kenapa harus kaku? 15% bukan angka ajaib — itu batas yang kamu tetapkan saat tenang, sebelum drawdown mengaburkan penilaian. "Lewati 0,2 poin" = awal dari menggeser batas: minggu depan 16%, bulan depan 20%. Kurangi setengah = mengubah aturan di tengah jalan (bab 21-5). Tambah posisi = averaging down tanpa data baru — judi. Stop total bukan hukuman: bot mati, modal $890 utuh, kamu audit: kenapa DD tembus? Siklus funding? Strategi rusak? Data baru → keputusan baru yang tenang.
    kode: |
      puncak = 1050
      sekarang = 890
      drawdown = (puncak - sekarang) / puncak * 100
      if drawdown > 15:
          print(f"DD {drawdown:.1f}% > 15% — STOP TOTAL, audit dulu")
      else:
          print(f"DD {drawdown:.1f}% — masih aman")
    hasil:
      - ret: -6.0
        dd: 22.0
        win: 10
        note: "Batas digeser diam-diam: DD lanjut ke 22% sebelum berhenti paksa. Modal terkikis."
      - ret: -1.2
        dd: 15.2
        win: 40
        note: "Stop di -15,2%: modal $890 utuh. Audit: sizing 3% (bukan 2%) sejak update — diperbaiki."
      - ret: -3.5
        dd: 18.0
        win: 25
        note: "Setengah ukuran tanpa audit: penyebabnya (sizing salah) tetap jalan, DD lanjut ke 18%."
      - ret: -8.0
        dd: 25.0
        win: 8
        note: "Averaging down di drawdown tanpa data baru: tren lanjut turun. -8%, nyaris margin call."
    petunjuk:
      - "Hitung DD: (1.050 - 890) / 1.050 x 100 = ?"
      - "Batas dibuat saat tenang — jangan digeser saat panik."
      - "Stop total = modal utuh + data untuk audit."
  - id: "s21-9"
    judul: "Juara Backtest vs Parameter Stabil"
    emoji: "🔮"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Bot carry: 3 parameter (threshold funding, stop ATR, filter tren). Kamu uji 200 kombinasi di 3 tahun data. Kombinasi juara: +32% per tahun (in-sample). Walk-forward (bab 21-2): semua 200 kombinasi diuji di 2 tahun data berikutnya — juara in-sample cuma +6%, padahal rata-rata semua kombinasi +11% dan konfigurasi standarmu (threshold 15%, stop 2xATR) +12%. Keputusan?
    pilihan:
      - "Go-live dengan kombinasi juara — 32% itu bukti terbaik"
      - "Pakai konfigurasi standar yang stabil (+12% out-sample) — juara in-sample = overfit"
      - "Gabungkan 200 kombinasi jadi satu bot raksasa"
      - "Ulangi pencarian 200 kombinasi di data yang sama sampai dapat juara baru"
    jawaban: 1
    penjelasan: |
      Data bicara: juara in-sample +32% cuma menghasilkan +6% di data baru — DI BAWAH rata-rata semua kombinasi (+11%). Itu tanda overfit: parameternya menghafal masa lalu, bukan menangkap aturan yang bertahan. Konfigurasi standar yang sederhana justru +12% out-sample — stabil karena tidak menempel pada noise. Ceklis bab 21-2: "bukan cuma parameter terbaik dari 200 percobaan". Go-live dengan juara = menguji hipotesis yang sudah terbukti rapuh. Bot raksasa 200 kombinasi = overfit yang di-ensemble — tetap overfit. Mengulang pencarian di data yang sama = memilih pemenang dari undian yang sama. Parameter yang bertahan di data baru lebih berharga daripada yang maksimal di data lama.
    kode: |
      hasil_oos = {"kombinasi_juara": 6, "rata_rata_200_kombinasi": 11, "konfigurasi_standar": 12}
      for nama, oos in hasil_oos.items():
          print(f"Out-sample {nama}: {oos}%")
    hasil:
      - ret: -10.0
        dd: 12.0
        win: 15
        note: "Juara in-sample go-live: klaim 32% ternyata optimistis. Dua kuartal: -10%."
      - ret: 11.0
        dd: 4.0
        win: 72
        note: "Standar yang stabil: +12% out-sample terbukti. Setahun live: +11% — sesuai ekspektasi."
      - ret: 2.0
        dd: 9.0
        win: 25
        note: "Ensembel 200 kombinasi: rata-rata dari banyak overfit. Kinerja 2%."
      - ret: -5.0
        dd: 10.0
        win: 20
        note: "Mengulang pencarian di data sama: juara baru tetap overfit. Butuh data baru, bukan iterasi."
    petunjuk:
      - "Bandingkan out-sample: juara 6% vs standar 12% vs rata-rata 11%."
      - "Yang menghafal masa lalu tidak bertahan di data baru."
      - "Ceklis bab 21-2: walk-forward, bukan cuma parameter terbaik."
  - id: "s21-10"
    judul: "Win Rate Tinggi, Dompet Tipis"
    emoji: "🎲"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Dua kandidat bot carry, sama-sama 100 trade backtest. Bot X: win rate 60%, rata-rata menang +0,5%, rata-rata kalah -0,6%. Bot Y: win rate 45%, rata-rata menang +1,1%, rata-rata kalah -0,5%. Kamu pilih yang mana?
    pilihan:
      - "Bot X — 60% win rate jauh lebih meyakinkan"
      - "Bot Y — EV X = 0,06%, EV Y = 0,22% per trade. EV yang menentukan, bukan win rate"
      - "Bot X — win rate tinggi pasti drawdown lebih kecil"
      - "Tidak bisa dibandingkan — beda gaya trading"
    jawaban: 1
    penjelasan: |
      Hitung ekspektasi: EV = (peluang menang x rata-rata menang) - (peluang kalah x rata-rata kalah). Bot X: 0,6 x 0,5 - 0,4 x 0,6 = 0,30 - 0,24 = +0,06% per trade. Bot Y: 0,45 x 1,1 - 0,55 x 0,5 = 0,495 - 0,275 = +0,22% per trade. Y menang 3,7x lipat per trade — walau win rate-nya cuma 45%. Win rate tinggi dengan reward/risk 0,83 (0,5/0,6) tidak bisa menutup kekalahan. 100 trade: X sekitar +6%, Y sekitar +22% (sebelum biaya). "Win rate tinggi = DD kecil" tidak otomatis: X kalah 0,6% pada 40% trade — rentetan rugi bisa panjang. Untuk carry, Y (menang besar jarang, kalah kecil sering) cocok dengan funding yang kadang spike. Ukur EV, lalu biaya, lalu DD — bukan sekadar persentase menang.
    kode: |
      ev_x = 0.60 * 0.5 - 0.40 * 0.6
      ev_y = 0.45 * 1.1 - 0.55 * 0.5
      print(f"EV Bot X: {ev_x:.2f}% per trade")
      print(f"EV Bot Y: {ev_y:.2f}% per trade")
    hasil:
      - ret: 6.0
        dd: 8.0
        win: 60
        note: "Bot X: EV 0,06%. 100 trade = +6% sebelum biaya 0,12% — nyaris impas."
      - ret: 22.0
        dd: 9.0
        win: 45
        note: "Bot Y: EV 0,22% x 100 trade = +22% sebelum biaya. Kalah sering tapi kecil — kurva tetap naik."
      - ret: 6.0
        dd: 8.5
        win: 58
        note: "Bot X tetap X: win rate 60% tidak mengubah EV 0,06%."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Tidak memilih = keputusan ditunda. Uang tidak bekerja."
    petunjuk:
      - "EV = (win rate x rata-rata menang) - (loss rate x rata-rata kalah)."
      - "Hitung EV kedua bot dulu, baru bandingkan."
      - "Win rate tinggi + reward/risk kecil = bisa kalah total."
