  - id: "s26-9"
    judul: "Porsi Nilai TLKM"
    emoji: "🥧"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Portofolio: TLKM harga 4000 (200 lembar), BBRI harga 4500 (100 lembar), CUAN harga 1500 (100 lembar). Analyzer harus melapor: berapa PERSEN nilai portofolio ada di TLKM? (nilai = harga x lembar)
    pilihan:
      - "50% — TLKM 200 lembar dari total 400 lembar"
      - "57,1% — nilai TLKM 800.000 dari total nilai 1.400.000"
      - "40% — harga TLKM 4000 dari total harga 10.000"
      - "33,3% — 1 dari 3 saham"
    jawaban: 1
    penjelasan: |
      Nilai tiap posisi: TLKM 4000 x 200 = 800.000; BBRI 4500 x 100 = 450.000; CUAN 1500 x 100 = 150.000. Total = 1.400.000. Porsi TLKM = 800.000 / 1.400.000 = 57,1%. Porsi LEMBAR (200/400 = 50%) salah: lembar tidak mencerminkan uang karena harga tiap saham beda. Porsi HARGA (4000/10.000 = 40%) juga salah: harga per lembar bukan nilai posisi. 33,3% = bagi rata tiga saham. Analyzer yang benar: buat kolom nilai (harga x lembar) dulu, lalu porsi tiap posisi dari total. Porsi nilai = dasar membaca konsentrasi risiko: satu posisi 57% berarti portofolio sangat bergantung pada TLKM.
    kode: |
      import pandas as pd
      df = pd.DataFrame({"nama": ["TLKM", "BBRI", "CUAN"],
                         "harga": [4000, 4500, 1500], "lembar": [200, 100, 100]})
      df["nilai"] = df["harga"] * df["lembar"]
      porsi_tlkm = df["nilai"][0] / df["nilai"].sum() * 100
      print(f"Porsi TLKM: {porsi_tlkm:.1f}%")
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "Porsi lembar ≠ porsi nilai — harga tiap saham berbeda."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Benar: 800.000 / 1.400.000 = 57,1%."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "4000/10.000 = porsi harga per lembar — jumlah lembarnya tidak masuk hitungan."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Bagi rata mengabaikan ukuran posisi masing-masing."
    petunjuk:
      - "Nilai posisi = harga x lembar. Hitung tiga-tiganya."
      - "Porsi = nilai TLKM ÷ total nilai semua posisi."
      - "800.000 ÷ 1.400.000 x 100 = ?"
