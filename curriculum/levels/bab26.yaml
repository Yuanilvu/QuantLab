    cerita: |
      DataFrame portofoliomu punya kolom nama, harga, dan vol (jumlah lembar). TLKM harga 4000, vol 100. BBRI harga 4500, vol 80. CUAN harga 1500, vol 50. Kamu mau tahu TOTAL nilai portofolio dalam rupiah (harga × volume untuk tiap saham, lalu dijumlah). Kode mana yang benar?
