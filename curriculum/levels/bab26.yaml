      import pandas as pd
      df = pd.DataFrame({"close": [4000, 3500, 4200, 3800, 4100]})
      di_atas = (df["close"] > df["close"].mean()).mean() * 100
      print(f"Hari di atas rata-rata: {di_atas:.0f}%")
