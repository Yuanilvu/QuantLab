pelajaran:
  - id: "26-1"
    judul: "Series & DataFrame"
    menit: 5
    materi: |
      **Pandas** memberi dua struktur utama:
      - **Series** = satu kolom data berlabel (seperti list + nama).
      - **DataFrame** = tabel: beberapa kolom, seperti spreadsheet.

      ```python
      import pandas as pd
      saham = pd.DataFrame({
          "nama": ["TLKM", "BBRI", "CUAN"],
          "harga": [4000, 4500, 1500],
          "vol": [120000, 80000, 25000],
      })
      print(saham["harga"])        # ambil satu kolom → Series
      print(saham["harga"].mean()) # 3333.33
      print(saham[saham["harga"] > 2000])  # filter baris
      ```

      Bedanya dengan dict/list: data tersusun rapi per KOLOM. Operasi statistik tinggal `.mean()`, `.max()`, `.describe()`. Filter juga satu baris: `df[df.kolom > nilai]`.

      Di quant: satu baris data = satu hari/aset; kolom = tanggal, harga, volume, return. DataFrame = cara standar menyimpan data pasar.
    kode: |
      import pandas as pd
      df = pd.DataFrame({"harga": [4000, 4500, 1500]})
      print(df.describe())   # statistik lengkap!
    penjelasan: "Series = 1 kolom; DataFrame = tabel. Filter & statistik satu baris — ini Excel yang bisa diprogram."
  - id: "26-2"
    judul: "Baca Data & Filter"
    menit: 5
