soal:
  - id: "p26-1"
    judul: "DataFrame Pertamamu"
    emoji: "🐼"
    tingkat: mudah
    xp: 25
    menit: 6
    cerita: |
      Gunakan pandas! Baca dua baris: nama saham dan harga. Buat DataFrame dengan kolom `nama` dan `harga`, lalu cetak harga dari baris pertama: `df['harga'][0]`.
    input_spec: |
      Baris 1: nama. Baris 2: harga (angka bulat).
    output_spec: |
      Satu baris: harga (angka).
    contoh:
      - input: "TLKM\n4000"
        output: "4000"
      - input: "BBRI\n4500"
        output: "4500"
    tes:
      - input: "TLKM\n4000"
        output: "4000"
      - input: "BBRI\n4500"
        output: "4500"
      - input: "CUAN\n1500"
        output: "1500"
      - input: "BTC\n77221"
        output: "77221"
    solusi: |
      import pandas as pd
      nama = input()
      harga = int(input())
      df = pd.DataFrame({"nama": [nama], "harga": [harga]})
      print(df["harga"][0])
    petunjuk:
      - "pd.DataFrame({'nama': [..], 'harga': [..]})."
      - "Akses kolom df['harga'], elemen [0]."
  - id: "p26-2"
    judul: "Statistik Portofolio"
    emoji: "📊"
    tingkat: sedang
    xp: 40
    menit: 8
    cerita: |
      Pandas! Baca N, lalu N baris `nama harga`. Buat DataFrame dengan kolom `nama` & `harga`. Cetak: baris 1 = harga tertinggi (`int`), baris 2 = rata-rata harga (`int`).
    input_spec: |
      Baris 1: N. N baris berikutnya: `nama harga`.
    output_spec: |
      Baris 1: max (int). Baris 2: mean (int).
    contoh:
      - input: "3\nTLKM 4000\nBBRI 4500\nCUAN 1500"
        output: "4500\n3333"
      - input: "2\nA 100\nB 200"
        output: "200\n150"
    tes:
      - input: "3\nTLKM 4000\nBBRI 4500\nCUAN 1500"
        output: "4500\n3333"
      - input: "2\nA 100\nB 200"
        output: "200\n150"
      - input: "1\nX 777"
        output: "777\n777"
      - input: "4\nA 1000\nB 2000\nC 3000\nD 4000"
        output: "4000\n2500"
    solusi: |
      import pandas as pd
      n = int(input())
      nama, harga = [], []
      for _ in range(n):
          p = input().split()
          nama.append(p[0])
          harga.append(int(p[1]))
      df = pd.DataFrame({"nama": nama, "harga": harga})
      print(int(df["harga"].max()))
      print(int(df["harga"].mean()))
    petunjuk:
      - "Kumpulkan list dulu, lalu DataFrame."
      - "max() dan mean() pada kolom harga."
  - id: "p26-3"
    judul: "Filter di Atas Rata-rata"
    emoji: "🎯"
    tingkat: sulit
    xp: 55
    menit: 10
    cerita: |
      Pandas! Baca N, lalu N baris `nama harga`. Cetak NAMA-NAMA yang harganya DI ATAS rata-rata, satu nama per baris (urutan kemunculan).
    input_spec: |
      Baris 1: N. N baris berikutnya: `nama harga`.
    output_spec: |
      Nama-nama dengan harga > rata-rata, satu per baris.
    contoh:
      - input: "3\nTLKM 4000\nBBRI 4500\nCUAN 1500"
        output: "TLKM\nBBRI"
      - input: "2\nA 100\nB 200"
        output: "B"
    tes:
      - input: "3\nTLKM 4000\nBBRI 4500\nCUAN 1500"
        output: "TLKM\nBBRI"
      - input: "2\nA 100\nB 200"
        output: "B"
      - input: "4\nA 10\nB 20\nC 30\nD 40"
        output: "C\nD"
      - input: "2\nX 50\nY 50"
        output: ""
    solusi: |
      import pandas as pd
      n = int(input())
      nama, harga = [], []
      for _ in range(n):
          p = input().split()
          nama.append(p[0])
          harga.append(int(p[1]))
      df = pd.DataFrame({"nama": nama, "harga": harga})
      rata = df["harga"].mean()
      atas = df[df["harga"] > rata]
      for _, row in atas.iterrows():
          print(row["nama"])
    petunjuk:
      - "Filter: df[df['harga'] > rata]."
      - "Loop hasil filter dengan iterrows() atau zip kolom."
