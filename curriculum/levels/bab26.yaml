    jawaban: 1
    penjelasan: |
      Kolom dikali kolom = satu hasil per baris: TLKM 400.000, BBRI 360.000, CUAN 75.000. Itu nilai tiap saham. Belum total. Tambah `.sum()` → 835.000. Itulah total nilai portofolio. `df.sum()` menjumlahkan tiap kolom SENDIRI: harga 10.000 dan vol 230. Bukan nilai rupiah. `df['vol'].sum()` = 230 lembar — jumlah saham, bukan uang. Pola pandas: operasi kolom dulu, agregasi terakhir.
    kode: |
      import pandas as pd
      df = pd.DataFrame({"nama": ["TLKM", "BBRI", "CUAN"],
