  - id: "s26-7"
    judul: "Dua Syarat Sekaligus"
    emoji: "🧩"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      DataFrame saham punya kolom `harga` dan `vol`. Kamu mau filter: harga > 4000 DAN vol > 50000. Kode mana yang benar?
    pilihan:
      - "`df[df.harga > 4000 and df.vol > 50000]`"
      - "`df[(df['harga'] > 4000) & (df['vol'] > 50000)]`"
      - "`df[df.harga > 4000 or df.vol > 50000]`"
      - "`df[df['harga'] > 4000]`"
    jawaban: 1
    penjelasan: |
      Dua kondisi = dua deretan True/False yang harus digabung. Di pandas, DAN = `&` (bukan kata `and`), dan tiap kondisi WAJIB dikurung: (kondisi1) & (kondisi2). Kurung diperlukan karena `&` dievaluasi lebih dulu daripada `>`. `and` = kata Python untuk nilai tunggal — dipakai di sini muncul error ambigu. `or` = ATAU (salah satu cukup) — artinya beda. Satu kondisi saja = filter tidak lengkap. Uji dengan data: TLKM 4000/120000 gagal syarat harga (4000 tidak > 4000), BBRI 4500/80000 lolos, CUAN 1500/25000 gagal → hasil cuma BBRI.
    kode: |
      import pandas as pd
      df = pd.DataFrame({"nama": ["TLKM", "BBRI", "CUAN"],
                         "harga": [4000, 4500, 1500], "vol": [120000, 80000, 25000]})
      lolos = df[(df["harga"] > 4000) & (df["vol"] > 50000)]
      print(lolos["nama"].tolist())   # ['BBRI']
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "and untuk pandas = error ambigu. Yang benar: & dengan kurung."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Benar: dua kondisi dikurung, digabung &: cuma BBRI yang lolos."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "or = cukup salah satu — TLKM (volume besar) ikut lolos padahal harga tidak > 4000."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Satu syarat saja: filter tidak lengkap, saham yang salah ikut masuk."
    petunjuk:
      - "DAN di pandas pakai &, dan tiap kondisi dalam kurung."
      - "Cek per baris: TLKM harga 4000 tidak > 4000 → gugur."
      - "Hasil: hanya BBRI."
