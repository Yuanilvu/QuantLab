pelajaran:
  - id: "7-1"
    judul: "List: Kumpulan Angka"
    menit: 5
    materi: |
      **List** = kotak besar berisi banyak angka. Ditulis dengan kurung siku:

      ```python
      harga = [4000, 4100, 3900, 4200, 4050]
      ```

      Alat-alat penting:
      - `len(harga)` → 5 (banyaknya angka)
      - `sum(harga)` → 20.250 (jumlah semua)
      - `min(harga)` → 3900 (terkecil)
      - `max(harga)` → 4200 (terbesar)
      - `harga[0]` → 4000 (angka PERTAMA — index mulai dari 0!)
      - `harga[-1]` → 4050 (angka terakhir)

      Hati-hati: `harga[0]` = angka pertama, bukan `harga[1]`. Jebakan klasik pemula. Juga sumber bug bot.

      List = cara alami menyimpan harga harian. Gabung loop (Bab 6): `for h in harga:` memproses semuanya.
    kode: |
      harga = [4000, 4100, 3900, 4200, 4050]
      print(f"Rata-rata harga = {sum(harga) / len(harga)}")
      print(f"Harga tertinggi = {max(harga)}")
      print(f"Harga terendah = {min(harga)}")
    penjelasan: "List = data. len/sum/min/max = rangkuman instan. Index mulai dari 0."
  - id: "7-2"
    judul: "Fungsi: Rumus yang Bisa Dipakai Ulang"
    menit: 5
    materi: |
      **Fungsi** = resep yang diberi nama. Tulis sekali, pakai berkali-kali dengan bahan berbeda.

      ```python
      def untung_persen(beli, jual):
          return (jual - beli) / beli * 100

      print(untung_persen(4000, 4400))   # 10.0
      print(untung_persen(5000, 5500))   # 10.0
      ```

      Bagian-bagiannya:
      - `def` = "definisikan fungsi"
      - `untung_persen(beli, jual)` = nama + bahan (parameter)
      - `return` = hasil yang dikeluarkan
      - Setelah `return`, fungsi berhenti.

      Di quant, fungsi = aturan yang konsisten: `hitung_rata2(harga)`, `hitung_ev(win_rate, reward, loss)`, `cek_sinyal(harga, ma20)`. Aturan berubah? Ubah SATU tempat. Semua pemakai ikut berubah. Ini menjaga konsistensi dan mencegah bug tersebar.
    kode: |
      def hitung_ev(win_rate, reward, loss):
          return win_rate * reward - (1 - win_rate) * loss

      print(f"EV = {hitung_ev(0.6, 5, 5)}")   # 1.0 — EV positif!
    penjelasan: "def = resep, return = hasil. Fungsi membuat aturan dipakai konsisten di mana-mana."
