    penjelasan: |
      `kali2(21)` memanggil fungsi dengan `x` = 21. Fungsi menghitung `21 * 2`, lalu `return` hasilnya = **42**. `print` mencetaknya. Parameter `x` cuma "tempat kosong". Diisi saat fungsi dipanggil. Fungsi = resep. Resepnya tetap, bahannya yang diganti. Ini dasar membangun aturan trading yang bisa dipakai ulang.
    kode: |
      def kali2(x):
          return x * 2

      print(kali2(21))   # 42
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "21 itu bahan yang dimasukkan, bukan hasil. Fungsi mengolahnya dulu."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "42 benar: x diganti 21, lalu 21 × 2."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "'x * 2' itu teks resepnya — hasil nyatanya angka 42."
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "x diisi otomatis saat fungsi dipanggil — tidak error."
    petunjuk:
      - "Ganti x dengan 21 di dalam fungsi."
      - "Lalu 21 × 2 = ?"
  - id: "s7-3"
    judul: "Merakit Bot Pertama"
    emoji: "🛠️"
    sulit: "sulit"
    xp: 50
    menit: 5
    cerita: |
      Kamu sudah bisa: variabel (Bab 4), if (Bab 5), loop (Bab 6), list & fungsi (Bab 7). Mana potongan kode yang PALING MEWAKILI cara kerja bot trading sederhana?
    pilihan:
      - "`def sinyal(harga, ma20): if harga > ma20: return \"BELI\"`"
      - "`print(\"BELI\")`"
      - "`harga = 4000` saja"
      - "`for i in range(100): print(i)` saja"
    jawaban: 0
    penjelasan: |
      Bot = fungsi yang menerima DATA, membandingkan dengan ATURAN (if), lalu mengembalikan KEPUTUSAN. Contoh: `def sinyal(harga, ma20): if harga > ma20: return "BELI"`. Ini menggabungkan semua bahan: parameter (variabel), logika (if), hasil (return).

      `print("BELI")` tanpa logika = stempel. `harga = 4000` tanpa keputusan = data mentah. Loop tanpa aturan = mesin tanpa kemudi. Semua bahan sudah kamu punya. Tinggal dirakit di Proyek Akhir (Bab 21)!
    kode: |
      def sinyal(harga, ma20):
          if harga > ma20:
              return "BELI"
          return "TAHAN"

      print(sinyal(4100, 4000))   # BELI
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 78
        note: "Benar — data + aturan + keputusan. Itulah bot, dalam 3 baris."
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "print tanpa logika = selalu bilang BELI, tidak peduli data. Bukan bot, cuma stempel."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "Variabel saja = data mentah tanpa keputusan."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Loop tanpa aturan = berputar tanpa tujuan. Belum jadi bot."
    petunjuk:
      - "Bot butuh: data + aturan (if) + keputusan (return)."
      - "Cari potongan yang punya ketiganya."

  - id: "s7-4"
    judul: "Ambil Harga Paling Baru"
    emoji: "📍"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      List harga TLKM bertambah tiap hari:
      `harga = [4000, 4100, 3900, 4200]`
      Besok masuk satu angka baru lagi.
      Bot butuh harga PALING BARU untuk sinyal.
      Kode mana yang paling aman dipakai?
    pilihan:
      - "`harga[-1]` — index negatif, hitung dari belakang"
      - "`harga[3]` — index ke-4, angka terakhir hari ini"
      - "`harga[len(harga)]` — pakai panjang list sebagai index"
      - "`harga[0]` — ambil dari awal list"
    jawaban: 0
    penjelasan: |
      `harga[-1]` selalu data terakhir.
      Index negatif dihitung dari belakang. −1 = terakhir. −2 = sebelum terakhir.

      `harga[3]` hari ini memang 4.200. Besok list bertambah — `harga[3]` jadi data kemarin. Bot membaca data basi.
      `harga[len(harga)]`? Index terakhir = len − 1. `len(harga)` melewati batas → IndexError. Bot crash.
      `harga[0]` data terlama.

      Sinyal butuh harga terbaru. Pakai `[-1]`. Aman untuk list sepanjang apa pun.
    kode: |
      harga = [4000, 4100, 3900, 4200, 4300]
      print(harga[-1])   # 4300 — selalu data terbaru
      print(harga[0])    # 4000 — data terlama
