  - id: "s7-2"
    judul: "Baca Kode: Fungsi"
    emoji: "🧪"
    sulit: "sedang"
    xp: 35
    menit: 4
    cerita: |
      ```python
      def kali2(x):
          return x * 2

      print(kali2(21))
      ```
      Apa yang tercetak?
    pilihan:
      - "21"
      - "42"
      - "x * 2"
      - "Error — x tidak dikenal"
