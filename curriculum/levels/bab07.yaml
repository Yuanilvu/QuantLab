  - id: "s7-10"
    judul: "Baca Kode: List Bertambah"
    emoji: "🧲"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Kode bot menambah data harga:
      ```python
      harga = [4000, 4200, 4100]
      harga.append(4300)
      harga.append(4500)
      print(len(harga))
      print(harga[-1] - harga[0])
      ```
      Baris 1 dan baris 2 mencetak apa?
    pilihan:
      - "5 lalu 500"
      - "3 lalu 100"
      - "5 lalu 4500"
      - "5 lalu 400"
    jawaban: 0
    penjelasan: |
      append menambah elemen di belakang: list jadi [4000, 4200, 4100, 4300, 4500].
      len = **5**. harga[-1] = 4500 (terakhir). harga[0] = 4000 (pertama).
      4500 − 4000 = **500**. Baris 1 cetak 5, baris 2 cetak 500.
      Opsi '3 lalu 100' = lupa append (list lama: 4100 − 4000 = 100).
      Opsi '5 lalu 4500' = lupa mengurangi harga[0].
      Opsi '5 lalu 400' = memakai harga[2] (4100) — index 2 bukan elemen pertama.
      [-1] selalu data terbaru, [0] data terlama.
    kode: |
      harga = [4000, 4200, 4100]
      harga.append(4300)
      harga.append(4500)
      print(f"Jumlah = {len(harga)}")                     # 5
