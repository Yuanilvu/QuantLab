      - "`for i in range(100): print(i)` saja"
    jawaban: 0
    penjelasan: |
      Bot = fungsi yang menerima DATA, membandingkan dengan ATURAN (if), lalu mengembalikan KEPUTUSAN. Contoh: `def sinyal(harga, ma20): if harga > ma20: return "BELI"`. Ini menggabungkan semua bahan: parameter (variabel), logika (if), hasil (return).

      `print("BELI")` tanpa logika = stempel. `harga = 4000` tanpa keputusan = data mentah. Loop tanpa aturan = mesin tanpa kemudi. Semua bahan sudah kamu punya. Tinggal dirakit di Proyek Akhir (Bab 21)!
