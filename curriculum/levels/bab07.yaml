    emoji: "🛠️"
    sulit: "sulit"
    xp: 50
    menit: 5
    cerita: |
      Kamu sudah bisa: variabel (Bab 4), if (Bab 5), loop (Bab 6), list & fungsi (Bab 7). Mana potongan kode yang PALING MEWAKILI cara kerja bot trading sederhana?
    pilihan:
