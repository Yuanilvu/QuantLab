  - id: "p7-3"
    judul: "Fungsi Rata-rata"
    emoji: "⚙️"
    tingkat: sulit
    xp: 55
    menit: 10
    cerita: |
      Buat fungsi bernama `rata2` yang menerima list harga dan MENGEMBALIKAN rata-rata (pembulatan ke bawah). Program: baca N, lalu N baris harga ke dalam list, panggil fungsi, cetak hasilnya.
    input_spec: |
      Baris 1: N. N baris berikutnya: harga harian.
    output_spec: |
      Satu baris: hasil fungsi rata2 (bilangan bulat).
    contoh:
      - input: "3\n1000\n2000\n3000"
        output: "2000"
      - input: "2\n500\n700"
        output: "600"
    tes:
      - input: "3\n1000\n2000\n3000"
        output: "2000"
      - input: "4\n1000\n1100\n900\n1000"
        output: "1000"
      - input: "2\n500\n700"
        output: "600"
      - input: "5\n1\n2\n3\n4\n5"
        output: "3"
    solusi: |
      def rata2(lst):
          return sum(lst) // len(lst)

      n = int(input())
      harga = [int(input()) for _ in range(n)]
      print(rata2(harga))
    petunjuk:
      - "Fungsi: def rata2(lst): return sum(lst) // len(lst)."
      - "Isi list dengan list comprehension atau loop + append."
  - id: "p7-4"
    judul: "Fungsi Nilai Harapan"
    emoji: "🎲"
    tingkat: sulit
    xp: 55
    menit: 10
    cerita: |
      Kamu sudah belajar EV di Bab 13. Sekarang buat FUNGSI bernama `ev` yang menerima tiga angka: win rate (persen), reward (persen), dan loss (persen) — lalu MENGEMBALIKAN nilai harapan: `(win_rate/100 * reward) - ((100 - win_rate)/100 * loss)`.
      Program membaca tiga angka itu (tiga baris), memanggil fungsi, mencetak hasilnya (satu angka desimal).
    input_spec: |
      Baris 1: win rate (persen). Baris 2: reward (persen). Baris 3: loss (persen).
    output_spec: |
      Satu baris: EV (angka desimal, cukup 2 angka di belakang koma).
    contoh:
      - input: "60\n5\n5"
        output: "1.00"
      - input: "50\n100\n50"
        output: "25.00"
    tes:
      - input: "60\n5\n5"
        output: "1.00"
      - input: "50\n100\n50"
        output: "25.00"
      - input: "30\n10\n5"
        output: "-0.50"
      - input: "100\n7\n3"
        output: "7.00"
    solusi: |
      def ev(wr, reward, loss):
          return wr / 100 * reward - (100 - wr) / 100 * loss

      wr = int(input())
      reward = int(input())
      loss = int(input())
      print(f"{ev(wr, reward, loss):.2f}")
    petunjuk:
      - "Rumus EV: (peluang menang × reward) − (peluang kalah × loss)."
      - "Format hasil dengan f-string: `print(f\"{hasil:.2f}\")`."
