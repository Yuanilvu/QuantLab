soal:
  - id: "p7-1"
    judul: "Jumlah Tiga Angka"
    emoji: "🧮"
    tingkat: mudah
    xp: 25
    menit: 6
    cerita: |
      Baca tiga angka dalam SATU baris (dipisah spasi). Cetak jumlahnya. Petunjuk: `input().split()` memecah baris jadi bagian-bagian, lalu `map(int, ...)` mengubahnya jadi angka.
    input_spec: |
      Satu baris berisi tiga angka bulat, dipisah spasi.
    output_spec: |
      Satu baris: jumlah ketiga angka.
    contoh:
      - input: "1 2 3"
        output: "6"
      - input: "10 20 30"
        output: "60"
    tes:
      - input: "1 2 3"
        output: "6"
      - input: "10 20 30"
        output: "60"
      - input: "0 0 0"
        output: "0"
      - input: "5 5 5"
        output: "15"
    solusi: |
      a, b, c = map(int, input().split())
      print(a + b + c)
    petunjuk:
      - "input().split() memecah baris menjadi daftar teks."
      - "map(int, ...) mengubah semuanya jadi angka."
  - id: "p7-2"
    judul: "Harga Tertinggi"
    emoji: "📈"
    tingkat: sedang
    xp: 40
    menit: 8
    cerita: |
      Baca N (jumlah hari), lalu N baris harga. Cetak harga TERTINGGI di antara semuanya. Simpan harga di list, lalu pakai `max()`.
    input_spec: |
      Baris 1: N. N baris berikutnya: harga harian (satu per baris).
    output_spec: |
      Satu baris: harga tertinggi.
    contoh:
      - input: "3\n1000\n5000\n2000"
        output: "5000"
      - input: "1\n777"
        output: "777"
    tes:
      - input: "3\n1000\n5000\n2000"
        output: "5000"
      - input: "1\n777"
        output: "777"
      - input: "5\n1\n2\n3\n4\n5"
        output: "5"
      - input: "4\n900\n800\n700\n600"
        output: "900"
    solusi: |
      n = int(input())
      harga = []
      for i in range(n):
          harga.append(int(input()))
      print(max(harga))
    petunjuk:
      - "Buat list kosong: harga = []."
      - "Tambah tiap harga dengan harga.append(...)."
  - id: "p7-3"
    judul: "Fungsi Rata-rata"
    emoji: "⚙️"
    tingkat: sulit
    xp: 55
    menit: 10
    cerita: |
      Buat fungsi bernama `rata2` yang menerima list harga dan MENGEMBALIKAN rata-rata (pembulatan ke bawah). Program: baca N, lalu N baris harga ke dalam list, panggil fungsi, cetak hasilnya.
    input_spec: |
      Baris 1: N. N baris berikutnya: harga harian.
    output_spec: |
      Satu baris: hasil fungsi rata2 (bilangan bulat).
    contoh:
      - input: "3\n1000\n2000\n3000"
        output: "2000"
      - input: "2\n500\n700"
        output: "600"
    tes:
      - input: "3\n1000\n2000\n3000"
        output: "2000"
      - input: "4\n1000\n1100\n900\n1000"
        output: "1000"
      - input: "2\n500\n700"
        output: "600"
      - input: "5\n1\n2\n3\n4\n5"
        output: "3"
    solusi: |
      def rata2(lst):
          return sum(lst) // len(lst)

      n = int(input())
      harga = [int(input()) for _ in range(n)]
      print(rata2(harga))
    petunjuk:
      - "Fungsi: def rata2(lst): return sum(lst) // len(lst)."
      - "Isi list dengan list comprehension atau loop + append."
  - id: "p7-4"
    judul: "Fungsi Nilai Harapan"
    emoji: "🎲"
    tingkat: sulit
    xp: 55
    menit: 10
    cerita: |
      Kamu sudah belajar EV di Bab 13. Sekarang buat FUNGSI bernama `ev` yang menerima tiga angka: win rate (persen), reward (persen), dan loss (persen) — lalu MENGEMBALIKAN nilai harapan: `(win_rate/100 * reward) - ((100 - win_rate)/100 * loss)`.
      Program membaca tiga angka itu (tiga baris), memanggil fungsi, mencetak hasilnya (satu angka desimal).
    input_spec: |
      Baris 1: win rate (persen). Baris 2: reward (persen). Baris 3: loss (persen).
    output_spec: |
      Satu baris: EV (angka desimal, cukup 2 angka di belakang koma).
    contoh:
      - input: "60\n5\n5"
        output: "1.00"
      - input: "50\n100\n50"
        output: "25.00"
    tes:
      - input: "60\n5\n5"
        output: "1.00"
      - input: "50\n100\n50"
        output: "25.00"
      - input: "30\n10\n5"
        output: "-0.50"
      - input: "100\n7\n3"
        output: "7.00"
    solusi: |
      def ev(wr, reward, loss):
          return wr / 100 * reward - (100 - wr) / 100 * loss

      wr = int(input())
      reward = int(input())
      loss = int(input())
      print(f"{ev(wr, reward, loss):.2f}")
    petunjuk:
      - "Rumus EV: (peluang menang × reward) − (peluang kalah × loss)."
      - "Format hasil dengan f-string: `print(f\"{hasil:.2f}\")`."
