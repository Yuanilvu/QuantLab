      - ret: 3.0
        dd: 1.5
        win: 40
        note: "Kamu tetap beli karena alasan salah. Beruntung sektor sedang baik, cuma +3%."
      - ret: -6.0
        dd: 9.0
        win: 22
        note: "Siklus tambang berbalik, harga obligasi turun 8%. Kamu jual panik."
    petunjuk:
      - "Selisih 13% − 7% = 6%. Kompensasi atas apa?"
      - "Kalau penerbit bangkrut, siapa yang menanggung?"
  - id: "s10-7"
    judul: "Bunga vs Inflasi"
    emoji: "🌡️"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Dana pensiunmu Rp100 juta, semua di deposito 5% per tahun. Inflasi rata-rata
      6% per tahun. Kamu tidak menambah atau menarik uang. Setelah 20 tahun, berapa
      kira-kira daya beli uangmu?
    pilihan:
      - "Rp265 juta — deposito mengalahkan inflasi"
      - "Rp83 juta — nominal naik, tapi daya beli turun sekitar 17%"
      - "Rp100 juta — bunga 5% hampir menutup inflasi 6%"
      - "Rp60 juta — inflasi menggerus hampir separuh"
    jawaban: 1
    penjelasan: |
      Saldo nominal: Rp100 juta × 1,05^20 = Rp265 juta. Tapi harga naik 1,06^20 =
      3,2 kali. Daya beli = 265 ÷ 3,2 ≈ Rp83 juta. Rugi daya beli sekitar 17% walau
      saldo naik 165%. Jebakannya: 5% vs 6% cuma beda 1 poin — tapi 20 tahun
      compounding mengubahnya jadi −17%. Ini kenapa uang jangka panjang di deposito
      diam-diam tergerus. "Rp265 juta" = lupa inflasi. "Rp100 juta" = menganggap
      bunga menutup inflasi, padahal gap 1% tetap berlipat. "Rp60 juta" =
      melebih-lebihkan kerusakan.
    kode: |
      dana = 100_000_000
      nominal = dana * 1.05 ** 20
      daya_beli = nominal / (1.06 ** 20)
      print(f"Nominal: Rp{nominal/1e6:.0f} juta")
      print(f"Daya beli: Rp{daya_beli/1e6:.0f} juta")
    hasil:
      - ret: -17.0
        dd: 0.0
        win: 30
        note: "Saldo memang Rp265 juta, tapi daya belinya cuma Rp83 juta. Kamu salah hitung kebutuhan pensiun."
      - ret: 0.0
        dd: 0.0
        win: 74
        note: "Kamu paham nominal vs riil. Sebagian dana dipindah ke aset produktif, sisanya tetap aman."
      - ret: -17.0
        dd: 0.0
        win: 28
        note: "Bunga 5% tidak menutup inflasi 6%. Dua puluh tahun kemudian daya beli turun 17%."
      - ret: -15.0
        dd: 4.0
        win: 25
        note: "Kamu panik, pindah ke produk anti-inflasi abal-abal. Kena biaya, hasil malah negatif."
    petunjuk:
      - "Hitung saldo nominal dulu (1,05^20), lalu bagi dengan kenaikan harga (1,06^20)."
      - "Naik nominal tidak sama dengan naik daya beli."
