    pilihan:
      - "Fund A. Rata-rata 25% per tahun jauh di atas Fund B"
      - "Fund B. Fund A jungkat-jungkit, hasil akhirnya bisa nol"
      - "Fund A, asal jual duluan setelah naik 100%"
      - "Bagi dua 50:50. Separuh A, separuh B"
    jawaban: 1
    penjelasan: |
      Hitung hasil nyata 2 tahun. Fund A: Rp10 juta × 2 = Rp20 juta saat naik. Lalu × 0,5 = Rp10 juta saat turun. Return 0%. Fund B: Rp10 juta × 1,1 × 1,1 = Rp12,1 juta. Return +21%. Rata-rata 25% itu rata-rata aritmetik: (100 - 50) ÷ 2. Angka itu menipu. Loss 50% menghapus profit 100% sebelumnya. Itu asimetri loss-gain. Makin ekstrem naik-turunnya, makin jauh hasil nyata dari rata-rata aritmetik. Jual setelah naik 100%? Kamu tidak tahu kapan turun mulai. Itu menebak, hasilnya tetap 0%. Bagi 50:50: A jadi Rp5 juta, B jadi Rp6,05 juta. Total Rp11,05 juta, return +10,5%. Lebih aman, tapi tetap kalah dari Fund B murni. Return stabil mengalahkan return tinggi yang jungkat-jungkit.
    kode: |
      dana = 10_000_000
      fund_a = dana * 2.0 * 0.5     # Fund A: +100% lalu -50%
      fund_b = dana * 1.1 * 1.1     # Fund B: +10% dua tahun
      print(f"Fund A: Rp{fund_a/1e6:.1f}jt | Fund B: Rp{fund_b/1e6:.1f}jt")
    hasil:
