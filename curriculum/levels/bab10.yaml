        dd: 0.0
        win: 78
        note: "Fund B: 12,1jt. Stabil dan tenang, hasil justru lebih besar."
      - ret: 0.0
        dd: 50.0
        win: 18
        note: "Kamu tunggu tanda turun. Crash datang sekali jalan. Jual tetap di 10jt."
      - ret: 10.5
        dd: 28.7
        win: 52
        note: "Separuh A jadi 5jt, separuh B jadi 6,05jt. Total 11,05jt, tapi sempat turun 28,7% dari puncak."
    petunjuk:
      - "Fund A: 10jt × 2 lalu × 0,5 = berapa?"
      - "Rata-rata (100 - 50) ÷ 2 = 25%. Hasil nyata segitu juga?"


  - id: "s10-6"
    judul: "Premi Risiko"
    emoji: "🏦"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Kamu lihat dua obligasi: obligasi negara (SUN) yield 7% per tahun dan obligasi
      perusahaan tambang yield 13% per tahun. Temanmu bilang: "13% hampir dua kali
      lipat, pasti lebih bagus. Ambil semua!" Penjelasan paling tepat untuk yield
      yang lebih tinggi itu?
    pilihan:
      - "Penerbit perusahaan bisa gagal bayar — yield ekstra adalah bayaran atas risiko itu"
      - "Pemerintah pelit, perusahaan lebih dermawan ke investor"
      - "Obligasi perusahaan bebas pajak, makanya yield-nya lebih tinggi"
      - "Yield tinggi = sinyal perusahaan sedang untung besar"
    jawaban: 0
    penjelasan: |
      Yield 13% vs 7%: selisih 6% per tahun = premi risiko. Penerbit perusahaan bisa
      gagal bayar. Kalau bangkrut, kamu bisa kehilangan sebagian besar pokok.
      Obligasi negara risikonya jauh lebih kecil. "Lebih dermawan" bukan cara pasar
      bekerja. Pajak malah memangkas yield, bukan menaikkannya. Yield tinggi = pasar
      menilai risiko tinggi. Kalau tanpa risiko ekstra, semua orang beli obligasi itu
      dan yield-nya langsung turun. Tanya dulu: risiko apa di balik 6% ekstra itu?
    kode: |
      yield_sun = 0.07
      yield_korporasi = 0.13
      premi_risiko = yield_korporasi - yield_sun
      print(f"Premi risiko: {premi_risiko*100:.0f}% per tahun")
      print("Yield ekstra = bayaran atas risiko gagal bayar")
    hasil:
