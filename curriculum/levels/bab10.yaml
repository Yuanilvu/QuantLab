    penjelasan: |
      Skenario naik (prob 60%): A = 100×1,15 = 115. B = 70×1,15 + 30×1,06 = 80,5 +
      31,8 = 112,3. C = 50×1,15 + 50×1,06 = 57,5 + 53 = 110,5. Skenario turun
      (40%): A = 75. B = 70×0,75 + 30×1,07 = 52,5 + 32,1 = 84,6. C = 50×0,75 +
      50×1,07 = 37,5 + 53,5 = 91. EV = probabilitas × hasil: A = 0,6×115 + 0,4×75
      = 99. B = 0,6×112,3 + 0,4×84,6 = 101,2. C = 0,6×110,5 + 0,4×91 = 102,7.
      Kenapa C menang? EV saham = 0,6×15 + 0,4×(−25) = −1%. EV obligasi = 0,6×6 +
      0,4×7 = +6,4%. Makin berat obligasi, makin tinggi EV dan drawdown terburuknya
      paling dangkal.
    kode: |
      prob_naik = 0.6
      ev_a = prob_naik * 115 + 0.4 * 75
      ev_b = prob_naik * 112.3 + 0.4 * 84.6
      ev_c = prob_naik * 110.5 + 0.4 * 91.0
      print(f"A (100% saham): Rp{ev_a:.1f} juta")
      print(f"B (70/30): Rp{ev_b:.1f} juta")
      print(f"C (50/50): Rp{ev_c:.1f} juta")
