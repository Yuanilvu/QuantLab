      alokasi: A = 100% saham, B = 70% saham + 30% obligasi, C = 50% saham + 50%
      obligasi. Mana yang memberi nilai akhir harapan (expected value) terbesar?
    pilihan:
      - "A — Rp99 juta. Skenario naik memberi 115, turun 75"
      - "B — Rp101,2 juta. Bobot obligasi menahan saat pasar turun"
      - "C — Rp102,7 juta. Obligasi positif di dua skenario, EV saham negatif"
      - "Sama saja — semua alokasi untung di skenario naik"
