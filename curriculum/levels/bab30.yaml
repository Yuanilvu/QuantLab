  - id: "s30-10"
    judul: "Terlalu Banyak Fitur?"
    emoji: "🧪"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Data hanya 620 baris. Kamu menambah kolom sektor dan kota (one-hot) sampai total 17 fitur, lalu berlatih hanya dengan 80 baris. Hasil dua versi: 5 fitur → latih 83,8%, uji 79,1%; 17 fitur → latih 85,0%, uji 76,1%. Mana kesimpulan yang benar?
    pilihan:
      - "17 fitur lebih baik — akurasi latihnya tertinggi (85,0%)"
      - "5 fitur lebih baik: akurasi latih naik 1,2 poin tapi akurasi uji turun 3,0 poin"
      - "Abaikan keduanya — model tidak berguna"
      - "Tambah lagi fitur yang lebih rinci supaya akurasi latih 90%"
    jawaban: 1
    penjelasan: |
      Yang menentukan adalah akurasi data uji, bukan data latih. Menambah 12 kolom kategori menaikkan akurasi latih 83,8% → 85,0% (naik 1,2 poin), tapi akurasi uji justru TURUN 79,1% → 76,1% (turun 3,0 poin). Artinya fitur tambahan itu dipakai untuk menghafal, bukan untuk belajar.

      Masalahnya bukan kategori itu buruk — masalahnya 17 fitur untuk 80 baris (kurang dari 5 baris per fitur). Pedomannya: cukupkan baris untuk setiap fitur (misalnya 20-50 baris per fitur), uji di data yang belum pernah dilihat, dan bandingkan dengan baseline 73,3%. Kalau akurasi uji tidak naik, fitur tambahan cuma menambah risiko.
    kode: |
      import os, pandas as pd
      from sklearn.linear_model import LogisticRegression
      b = "/soaldata" if os.path.exists("/soaldata") else os.path.expanduser("~/quantlab/data/soal")
      df = pd.read_csv(f"{b}/kredit_umkm_bersih.csv")
      X = pd.concat([df[["omzet_bulanan_juta", "lama_usaha_bulan", "pinjaman_diajukan_juta", "riwayat_telat_12m", "skor_kredit"]], pd.get_dummies(df[["sektor", "kota"]])], axis=1)
      y = (df["status"] == "Lancar").astype(int)
      m = LogisticRegression(max_iter=5000, C=1000).fit(X[:80], y[:80])
      print(round(m.score(X[:80], y[:80]), 3), round(m.score(X[80:], y[80:]), 3))
    hasil:
      - ret: 1.5
        dd: 9.0
        win: 43
        note: "Akurasi latih tinggi itu jebakan: yang dinilai adalah data uji."
      - ret: 6.5
        dd: 4.0
        win: 74
        note: "Benar: uji turun 3,0 poin (79,1% → 76,1%). 17 fitur terlalu banyak untuk 80 baris."
      - ret: 1.0
        dd: 9.0
        win: 42
        note: "Model 5 fitur tetap berguna: akurasi uji 79,1% vs baseline 73,3%."
      - ret: 0.5
        dd: 9.5
        win: 38
        note: "Menambah fitur lagi hanya menambah hafalan, bukan pengetahuan."
    petunjuk:
      - "Bandingkan angka LATIH dan UJI kedua versi."
      - "Selisih 79,1% dan 76,1% itu dari data uji — mana yang dipakai menilai model?"
