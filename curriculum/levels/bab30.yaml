        dd: 9.0
        win: 40
        note: "Akurasi 100% itu palsu: kolomnya tidak ada saat pengajuan baru masuk."
      - ret: 6.5
        dd: 4.0
        win: 74
        note: "Benar: bocor. Lancar 1,99 vs Macet 9,02 — model cuma membaca jawabannya."
      - ret: 1.5
        dd: 8.5
        win: 45
        note: "Menambah fitur tidak menyembuhkan kebocoran — malah menambah masalah."
      - ret: 1.0
        dd: 9.0
        win: 42
        note: "Melatih lebih lama tidak mengubah apa pun: kolomnya memang bocor."
    petunjuk:
      - "Tanya satu hal untuk setiap fitur: apakah angkanya ada sebelum pinjaman disetujui?"
      - "Cek rata-rata kolom itu untuk Lancar vs Macet."
