  - id: "s30-4"
    judul: "Fitur yang Bocor"
    emoji: "🚰"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Rekanmu menambah kolom `sisa_tagihan_juta` (sisa utang pengajuan hari ini). Model yang memakainya mendapat akurasi 100% di data latih DAN data uji. Dia sangat senang. Apa masalahnya?
