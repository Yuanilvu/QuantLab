    penjelasan: |
      A = 8,5 ÷ 16,6 = 0,51. B = 16 ÷ 40 = 0,40. Pinjaman B lebih besar, tapi bebannya lebih ringan. Rasio mengubah dua kolom jadi satu angka bermakna.

      Bukti dari 620 data bersih: rata-rata rasio Lancar 0,59 vs Macet 0,76. Nominal pinjaman saja menyesatkan. Omzet saja juga: rata-rata omzet Macet 31,7 vs Lancar 31,3 — nyaris sama, tidak memisahkan. Dua kolom mentah boleh tetap ada, tapi rasio-lah yang memberi sinyal paling jelas dan hemat satu fitur.
