    judul: "Rasio atau Kolom Mentah?"
    emoji: "🧮"
    sulit: "mudah"
    xp: 20
    menit: 3
    cerita: |
      Dua pengajuan. A: pinjaman 8,5 juta, omzet 16,6 juta. B: pinjaman 16 juta, omzet 40 juta. Kamu memilih fitur untuk model penilaian kredit. Mana yang paling berguna?
    pilihan:
      - "Dua kolom mentah (omzet + pinjaman) — biar model belajar sendiri"
      - "Satu fitur rasio pinjaman ÷ omzet (A 0,51 dan B 0,40)"
      - "Cukup nominal pinjaman — B dua kali lebih besar"
      - "Cukup omzet — makin besar pasti makin aman"
