      Tiga calon fitur diuji ke 620 pengajuan. Rata-rata Macet vs Lancar: (1) pinjaman ÷ omzet = 0,76 vs 0,59; (2) pinjaman ÷ karyawan = 8,26 vs 6,39; (3) omzet ÷ karyawan = 10,68 vs 10,65. Kamu hanya boleh memilih satu. Mana yang paling berguna?
