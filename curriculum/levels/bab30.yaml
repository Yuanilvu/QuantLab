# ============================================================
# BAB 30 — FEATURE ENGINEERING (TRACK: DATA SCIENCE)
# Kolom mentah jadi fitur berguna: rasio, binning, encoding, skala.
# Data: /soaldata/kredit_umkm_bersih.csv (620 pengajuan bersih)
# ============================================================
bab: 30
track: ds
judul: "Feature Engineering"
emoji: "🛠️"
deskripsi: "Fitur = kolom masukan untuk model. Ubah kolom mentah (omzet, pinjaman, telat) jadi fitur yang lebih berguna: rasio, binning, encoding, dan skala."
pelajaran:
  - id: "30-1"
    judul: "Dari Kolom Mentah ke Fitur Berguna"
    menit: 5
    materi: |
      **Fitur** = kolom yang dipakai model untuk belajar: omzet, pinjaman, telat. Kolom mentah belum tentu berguna apa adanya.

      Dua pengajuan:
      - A: pinjaman 8,5 juta, omzet 16,6 juta → 8,5 ÷ 16,6 = **0,51**
      - B: pinjaman 16 juta, omzet 40 juta → 16 ÷ 40 = **0,40**

      Pinjaman B lebih besar, tapi bebannya lebih ringan. Angka 0,51 dan 0,40 disebut **rasio** (perbandingan): dibuat dengan membagi dua kolom.

      Hitungan dari 620 data bersih: rata-rata rasio pinjaman ÷ omzet adalah **Lancar 0,59** dan **Macet 0,76**.

      Pola fitur yang sering dipakai:
      - **Rasio**: pinjaman ÷ omzet (beban utang), pinjaman ÷ jumlah karyawan.
      - **Satuan baru**: lama usaha 90 bulan ÷ 12 = **7,5 tahun**.
      - **Binning** (dibuat dua tingkat): telat 0-5 → "sering" kalau telat ≥ 3.
      - **Interaksi**: dua kolom digabung jadi satu angka baru.

      Aturan praktis: satu fitur baru harus bisa dijelaskan dalam satu kalimat. Kalau tidak bisa, jangan dibuat.
    kode: |
      import pandas as pd
      df = pd.read_csv("/soaldata/kredit_umkm_bersih.csv")
      df["rasio_pinjaman"] = df["pinjaman_diajukan_juta"] / df["omzet_bulanan_juta"]
      print(df.groupby("status")["rasio_pinjaman"].mean().round(2).to_dict())
    penjelasan: "Fitur baru = kolom hasil hitungan. Beban utang = pinjaman ÷ omzet (A 0,51 vs B 0,40). Di 620 data bersih: Lancar 0,59 vs Macet 0,76 — pemisahan jelas, model dapat sinyal."
  - id: "30-2"
    judul: "Ubah Kategori & Skala"
    menit: 6
    materi: |
      Model hanya mengerti **angka**. Kolom teks harus diubah dulu:
      - **Peta angka (map)**: "Ya" → 1, "Tidak" → 0. Contoh: punya_npwp.
      - **One-hot (get_dummies)**: satu kolom per kategori, isi 0/1. Untuk kategori TANPA urutan.

      Kenapa sektor tidak diberi nomor 1-6? Karena model membaca Fashion (6) seperti "enam kali Retail (1)" — padahal tidak ada artinya.

      **Skala** juga penting. Bandingkan dua kolom:
      - skor_kredit: rata-rata 533, sebaran 86,9 (nilai sekitar 400-700)
      - omzet: rata-rata 31,4 juta, sebaran 19,5 (nilai 4,5-166)

      Selisih 1 poin skor dan selisih 1 juta omzet itu beda jauh. Cara menyeragamkan (z-score): **z = (nilai - rata-rata) ÷ sebaran**. Contoh omzet 16,6: (16,6 - 31,4) ÷ 19,5 = **-0,76**. Artinya 0,76 sebaran di bawah rata-rata.
    kode: |
      import pandas as pd
      df = pd.read_csv("/soaldata/kredit_umkm_bersih.csv")
      df["npwp_num"] = df["punya_npwp"].map({"Ya": 1, "Tidak": 0})
      print(f"npwp_num = 1: {df['npwp_num'].sum()} dari {len(df)} pengajuan")
      print(df["sektor"].value_counts().to_dict())
    penjelasan: "Teks jadi angka: map untuk ya/tidak (406 Ya, 214 Tidak), get_dummies untuk kategori tanpa urutan (6 sektor jadi 6 kolom 0/1). Skala: z = (x - rata-rata) ÷ sebaran, contoh omzet 16,6 jadi -0,76."
