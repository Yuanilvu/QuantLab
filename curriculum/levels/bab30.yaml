      - "Tidak ada masalah — akurasi 100% berarti model sempurna"
      - "Kebocoran data: kolom itu baru ada setelah pinjaman berjalan, tidak tersedia untuk pengajuan baru"
      - "Modelnya kurang fitur — tambah kolom lain lagi"
      - "Akurasi 100% tanda model kurang lama dilatih"
    jawaban: 1
    penjelasan: |
      Kolom bocor (data leakage) = informasi yang belum ada saat keputusan diambil. Di data ini kolom itu rata-rata 1,99 untuk Lancar dan 9,02 untuk Macet — praktis menuliskan jawabannya, jadi akurasi latih dan uji 100%.

      Di produksi, pengajuan baru tidak punya angka itu: kolomnya kosong dan model langsung tak berguna. Cara memeriksa, satu pertanyaan untuk setiap fitur: "apakah angka ini sudah diketahui SEBELUM pinjaman disetujui?" Kalau tidak, buang — sebagus apa pun akurasinya.
    kode: |
      import numpy as np
      status = np.r_[np.ones(456), np.zeros(164)]
      bocor = np.where(status == 1, 1.99, 9.02)
      print("Lancar:", round(float(bocor[status == 1].mean()), 2), "| Macet:", round(float(bocor[status == 0].mean()), 2))
    hasil:
