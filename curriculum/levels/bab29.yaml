pelajaran:
  - id: "29-1"
    judul: "Ringkasan & Distribusi"
    menit: 5
    materi: |
      Sebelum menghitung apa pun, kenali datamu. Tiga alat utama:

      1. **`describe()`** — ringkasan satu kolom angka: count, mean, std, min, 25%, 50%, 75%, max.
      2. **Kuartil** — 25% berarti seperempat data di bawahnya; 50% = median (nilai tengah); 75% = tiga perempat di bawahnya.
      3. **`value_counts()`** — jumlah kemunculan tiap nilai pada kolom kategori (kota, sektor, status).

      Contoh dari data bersih (620 baris): omzet min 4,5 · Q1 18,2 · median 26,8 · Q3 40,1 · max 166,3 juta. Jadi separuh nasabah beromzet antara 18,2 dan 40,1 juta.

      **Mean** (rata-rata) omzet 31,4 juta; **median** 26,8 juta. Beda 4,6 juta itu petunjuk ada beberapa nilai besar di ekor kanan.

      Pekerjaan ini disebut **EDA** (Exploratory Data Analysis) = menjelajah data sebelum mengolahnya.
    kode: |
      import pandas as pd
      df = pd.read_csv("/soaldata/kredit_umkm_bersih.csv")
      print(df[["omzet_bulanan_juta", "pinjaman_diajukan_juta"]].describe().round(1))
    penjelasan: "`describe()` langsung memberi 8 angka ringkasan. Lihat kolom omzet: mean 31,4 tapi median 26,8 — selisih 4,6 juta tanda ada ekor kanan. Kolom pinjaman berpola sama: mean 20,1 dan median 15,8. Bandingkan mean vs median lebih dulu; kalau jauh berbeda, distribusinya tidak simetris."
  - id: "29-2"
    judul: "Cari Pola & Hubungan"
    menit: 6
    materi: |
      EDA naik satu tingkat: bandingkan kelompok dan lihat hubungan antar kolom.

      **groupby** memecah data per kelompok lalu meringkasnya:

      ```python
      df.groupby("sektor")["status"].apply(lambda s: (s == "Macet").mean() * 100)
      ```

      Hasilnya tingkat Macet per sektor: Kuliner 33,3% · Pertanian 29,0% · Fashion 28,0% · Jasa 24,5% · Kerajinan 23,0% · Retail 22,3%.

      **Bandingkan kelompok**: rata-rata riwayat_telat_12m kelompok Macet 3,02 vs kelompok Lancar 1,91 — Macet lebih sering telat.

      **Korelasi** (`.corr()`) mengukur gerak bersama, nilainya -1 sampai +1. Contoh: riwayat_telat vs skor_kredit = **-0,77** — makin sering telat, makin rendah skornya.

      Ingat: korelasi bukan sebab-akibat. Ia hanya bilang keduanya bergerak bersama.
    kode: |
      import pandas as pd
      df = pd.read_csv("/soaldata/kredit_umkm_bersih.csv")
      print(df.groupby("sektor")["status"].apply(lambda s: (s == "Macet").mean() * 100).round(1).sort_values(ascending=False))
      print(df.groupby("status")["riwayat_telat_12m"].mean().round(2))
    penjelasan: "`groupby` = pisah data per kelompok lalu hitung ringkasannya. Dua contoh: tingkat Macet tiap sektor, dan perbandingan rata-rata telat antara Macet dan Lancar. Perhatikan arah angkanya: Macet 3,02 vs Lancar 1,91. Untuk gerak bersama antar dua kolom angka, pakai `.corr()`."
