      - "Mean 31,4 juta — semua data ikut dihitung"
      - "Omzet terbesar 166,3 juta"
      - "Rata-rata dari mean dan median, yaitu 29,1 juta"
    jawaban: 0
    penjelasan: |
      Distribusi omzet tidak simetris: mean 31,4 lebih besar dari median 26,8, artinya ada ekor panjang ke kanan. Selisihnya 31,4 - 26,8 = **4,6 juta**.

      Tiga nilai terbesar (123,2 · 133,6 · 166,3) jauh di atas median, dan mean tertarik naik olehnya.

      Mean tetap berguna untuk hal lain: total omzet semua nasabah = mean x 620 = 31,4 x 620 = **19.466 juta**.

      Aturan praktis: laporan "tipikal" pakai median; laporan "total" pakai mean. Membagi dua antara mean dan median (29,1) tidak punya arti statistik.
    kode: |
      import os
      import pandas as pd
      base = "/soaldata" if os.path.isdir("/soaldata") else "/home/yuan/quantlab/data/soal"
      df = pd.read_csv(base + "/kredit_umkm_bersih.csv")
      omzet = df["omzet_bulanan_juta"]
      print(f"Mean: {omzet.mean():.1f} juta")
      print(f"Median: {omzet.median():.1f} juta")
      print(f"3 terbesar: {omzet.sort_values().tail(3).tolist()}")
