  - id: "s29-6"
    judul: "Median atau Mean untuk Laporan?"
    emoji: "📈"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Laporanmu menulis "omzet tipikal nasabah kami 31,4 juta". Padahal median 26,8 juta, dan tiga omzet terbesar 123,2, 133,6, serta 166,3 juta. Mana angka yang lebih jujur untuk kata tipikal?
