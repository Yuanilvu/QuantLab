  - id: "p29-2"
    judul: "Bandingkan Dua Kelompok"
    emoji: "🆚"
    tingkat: sedang
    xp: 40
    menit: 7
    cerita: |
      Gunakan pandas! Baca path CSV dari baris 1 dan nama kolom angka dari baris 2. Data punya kolom `status` berisi Lancar dan Macet. Cetak rata-rata kolom itu untuk kelompok Macet, lalu Lancar, lalu selisihnya (Macet dikurangi Lancar). Semua dengan 2 angka desimal.
    input_spec: |
      Baris 1: path file CSV. Baris 2: nama kolom angka.
    output_spec: |
      Baris 1: rata-rata kelompok Macet (2 desimal). Baris 2: rata-rata kelompok Lancar (2 desimal). Baris 3: selisih Macet - Lancar (2 desimal).
    contoh:
      - input: "/soaldata/kredit_umkm_bersih.csv\nskor_kredit"
        output: "487.90\n549.35\n-61.45"
      - input: "/soaldata/kredit_umkm_bersih.csv\nriwayat_telat_12m"
        output: "3.02\n1.91\n1.10"
    tes:
      - input: "/soaldata/kredit_umkm_bersih.csv\nskor_kredit"
        output: "487.90\n549.35\n-61.45"
      - input: "/soaldata/kredit_umkm_bersih.csv\nriwayat_telat_12m"
        output: "3.02\n1.91\n1.10"
      - input: "/soaldata/kredit_umkm_bersih.csv\npinjaman_diajukan_juta"
        output: "24.42\n18.52\n5.91"
      - input: "/soaldata/kredit_umkm_bersih.csv\nlama_usaha_bulan"
        output: "83.25\n101.38\n-18.13"
    solusi: |
      import pandas as pd
      path = input()
      kolom = input()
      df = pd.read_csv(path)
      rata = df.groupby("status")[kolom].mean()
      print(f"{rata['Macet']:.2f}")
      print(f"{rata['Lancar']:.2f}")
      print(f"{rata['Macet'] - rata['Lancar']:.2f}")
    petunjuk:
