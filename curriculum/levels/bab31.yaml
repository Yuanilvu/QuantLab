pelajaran:
  - id: "31-1"
    judul: "Konsep ML & Memisah Data"
    menit: 5
    materi: |
      **Model** = aturan yang belajar dari contoh. Bedanya dengan aturan biasa: model menemukan sendiri polanya dari data.

      Istilah yang dipakai:
      - **Fitur (X)** = kolom masukan: omzet, lama usaha, pinjaman, telat, skor.
      - **Target (y)** = kolom jawaban yang mau diprediksi: status (Lancar = 1, Macet = 0).
      - **Latih (train)** = bagian data untuk belajar. **Uji (test)** = bagian untuk menguji.

      Kenapa harus dipisah? Karena model bisa menghafal. Kalau ia diuji di data yang sudah dihafalnya, nilainya selalu bagus — seperti murid yang diberi soal latihan sebagai ujian. Jadi latih di satu bagian, uji di bagian lain yang belum pernah dilihat.

      **Baseline** = tebakan paling sederhana: "semua Lancar". Dari 620 data, 456 Lancar → 456 ÷ 620 = **73,5%** benar. Model harus mengalahkan angka ini, kalau tidak, ia tidak menambah apa pun.

      Latihan pertama: `train_test_split` dengan test_size 0,25 → 465 baris latih, 155 baris uji.
    kode: |
      import pandas as pd
      from sklearn.model_selection import train_test_split
      df = pd.read_csv("/soaldata/kredit_umkm_bersih.csv")
      y = (df["status"] == "Lancar").astype(int)
      ytr, yte = train_test_split(y, test_size=0.25, random_state=42)
      print(len(ytr), len(yte), round(yte.mean(), 2))
    penjelasan: "Fitur (X) vs target (y). Split: 465 latih, 155 uji. Baseline 'semua Lancar' di data uji = 71,6% (dibulatkan 72%). Model hanya berguna kalau lebih tinggi dari itu."
  - id: "31-2"
    judul: "Model Pertama: Logistic Regression"
    menit: 6
    materi: |
      **Regresi logistik** = model klasifikasi paling dasar. Ia memberi setiap baris sebuah peluang antara 0 dan 1: peluang statusnya Lancar.

      Tiga perintah intinya:
      - `fit` → belajar dari data latih.
      - `predict` → menebak jawaban.
      - `score` → akurasi (berapa persen tebakan yang benar).

      Hasil nyata dengan 5 fitur angka (omzet, lama usaha, pinjaman, telat, skor) pada 620 data bersih:
      - Akurasi data LATIH: **79,6%**
      - Akurasi data UJI: **78,7%** (test_size 0,25, random_state 42)
      - Baseline "semua Lancar": **73,5%**

      Jadi model menambah sekitar 5 poin di atas baseline. Tidak spektakuler, dan itu wajar untuk data kredit yang berisik.

      Membaca **koefisien** (bobot tiap fitur per satu satuan): telat -0,5547 (makin sering telat, makin kecil peluang Lancar); pinjaman -0,1041 per juta; omzet +0,0762 per juta. Koefisien jangan dibandingkan mentah-mentah, karena satuannya beda: skor +0,0034 itu per 1 POIN, sedangkan telat -0,5547 per 1 KALI.
    kode: |
      import pandas as pd
      from sklearn.model_selection import train_test_split
      from sklearn.linear_model import LogisticRegression
      df = pd.read_csv("/soaldata/kredit_umkm_bersih.csv")
      X = df[["omzet_bulanan_juta", "lama_usaha_bulan", "pinjaman_diajukan_juta", "riwayat_telat_12m", "skor_kredit"]]
      y = (df["status"] == "Lancar").astype(int)
      Xtr, Xte, ytr, yte = train_test_split(X, y, test_size=0.25, random_state=42)
      print(round(LogisticRegression(max_iter=1000).fit(Xtr, ytr).score(Xte, yte), 4))
    penjelasan: "fit, predict, score. Lima fitur angka: akurasi uji 0,7871 (78,7%), latih 79,6%, baseline 73,5%. Koefisien telat -0,5547 = penalti terbesar per satuan."
