  - id: "s31-7"
    judul: "Arti Koefisien Model"
    emoji: "🧾"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Model 5 fitur dilatih pada seluruh 620 data dan mencetak koefisien: omzet +0,0773; lama +0,0101; pinjaman -0,1108; telat -0,4788; skor +0,0045. Pernyataan mana yang paling tepat membacanya?
    pilihan:
      - "Telat naik 1 kali membuat peluang Lancar naik"
      - "Telat naik 1 kali menurunkan skor peluang 0,4788, sedangkan skor kredit naik 100 poin hanya menambah 0,45"
      - "Telat tidak berpengaruh karena koefisiennya di bawah 1"
      - "Koefisien cuma pajangan — tidak bisa dipakai menjelaskan model"
    jawaban: 1
    penjelasan: |
      Tanda koefisien menunjukkan arah: negatif berarti peluang Lancar turun. Jadi telat naik 1 kali mengurangi skor model sebesar 0,4788, sedangkan skor kredit naik 100 poin hanya menambah 0,45 (0,0045 × 100).

      Perhatikan satuannya: skor dibaca per 1 POIN, telat per 1 KALI. Jadi membandingkan 0,0045 dengan 0,4788 secara mentah itu salah — naik 100 poin skor (peristiwa wajar) setara dengan turun 1 kali telat. Koefisien berbeda sedikit kalau model dilatih pada data berbeda; yang penting cara membacanya, bukan angka persisnya.
    kode: |
      import os, pandas as pd
      from sklearn.linear_model import LogisticRegression
      b = "/soaldata" if os.path.exists("/soaldata") else os.path.expanduser("~/quantlab/data/soal")
      df = pd.read_csv(f"{b}/kredit_umkm_bersih.csv")
      X = df[["omzet_bulanan_juta", "lama_usaha_bulan", "pinjaman_diajukan_juta", "riwayat_telat_12m", "skor_kredit"]]
      y = (df["status"] == "Lancar").astype(int)
      m = LogisticRegression(max_iter=1000).fit(X, y)
      print(m.coef_[0].round(4))
    hasil:
      - ret: 0.5
        dd: 9.5
        win: 38
        note: "Arahnya kebalik: koefisien negatif berarti peluang Lancar turun."
      - ret: 6.0
        dd: 4.5
        win: 72
        note: "Benar: telat -0,4788 per kali; skor +100 poin hanya +0,45."
      - ret: 1.0
        dd: 9.0
        win: 40
        note: "Angka kecil bisa besar artinya kalau satuannya kecil juga (per poin)."
      - ret: 1.5
        dd: 8.5
        win: 45
        note: "Koefisien bisa dibaca — asal tahu satuannya."
    petunjuk:
      - "Tanda minus berarti peluang Lancar turun, bukan naik."
      - "Skor +100 poin = 0,0045 × 100."
