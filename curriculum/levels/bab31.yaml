    penjelasan: |
      Beda akurasi uji hanya 1,3 poin, dan dengan 155 baris uji satu tebakan bernilai 0,65 poin — jadi selisih itu cuma dua tebakan, mudah terjadi karena keberuntungan.

      CV-5 menguji lima kali di bagian data yang berbeda: A rata-rata 79,7%, B 78,4%. Artinya A lebih stabil waktu datanya berganti, padahal fiturnya lebih sedikit dan lebih mudah dijelaskan. Untuk data 620 baris, model sederhana biasanya menang: risiko overfit lebih kecil. Aturan praktis: mulai dari model sederhana, catat angkanya sebagai patokan, baru coba yang lebih rumit dan buktikan lewat data uji maupun CV.
    kode: |
      import os, pandas as pd
      from sklearn.model_selection import cross_val_score; from sklearn.linear_model import LogisticRegression
      b = "/soaldata" if os.path.exists("/soaldata") else os.path.expanduser("~/quantlab/data/soal")
      df = pd.read_csv(f"{b}/kredit_umkm_bersih.csv")
      X = df[["omzet_bulanan_juta", "lama_usaha_bulan", "pinjaman_diajukan_juta", "riwayat_telat_12m", "skor_kredit"]]; y = (df["status"] == "Lancar").astype(int)
      print("5 fitur: rata-rata CV", round(cross_val_score(LogisticRegression(max_iter=1000), X, y, cv=5).mean(), 4))
      print("17 fitur: rata-rata CV", round(cross_val_score(LogisticRegression(max_iter=1000), pd.concat([X, pd.get_dummies(df[["sektor", "kota"]])], axis=1), y, cv=5).mean(), 4))
    hasil:
      - ret: 2.0
        dd: 8.5
        win: 48
        note: "Unggul 1,3 poin saja, dan CV-nya justru lebih rendah (78,4% vs 79,7%)."
      - ret: 6.5
        dd: 4.0
        win: 74
        note: "Benar: sederhana + CV lebih stabil. Selisih 1,3 poin = dua tebakan."
      - ret: 1.0
        dd: 9.0
        win: 40
        note: "Lebih rumit bukan berarti lebih pintar — lihat angkanya."
      - ret: 1.0
        dd: 9.0
        win: 38
        note: "Keputusan ini tidak butuh perangkat lebih kuat — cukup data uji dan CV."
    petunjuk:
      - "Dengan 155 baris uji, satu tebakan bernilai berapa poin?"
      - "CV menguji lima kali di bagian berbeda — mana yang lebih stabil?"
  - id: "s31-9"
    judul: "Akurasi Bisa Menipu"
    emoji: "🎯"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Di 155 baris data uji ada 44 pengajuan Macet. Model 5 fitur mendapat akurasi 78,7%. Berapa pengajuan Macet yang benar-benar tertangkap model?
    pilihan:
      - "44 dari 44 — akurasi 78,7% cukup tinggi"
      - "19 dari 44 (43,2%)"
      - "128 dari 155"
      - "0 dari 44"
    jawaban: 1
    penjelasan: |
      Akurasi 78,7% berarti 122 tebakan benar dari 155 baris. Tapi rinciannya penting: model menebak "Lancar" 128 kali, dan dari 44 pengajuan yang sebenarnya Macet hanya 19 yang tertangkap (43,2%). Jadi 25 Macet lolos — di dunia nyata itu kredit yang gagal bayar.

      128 = jumlah tebakan "Lancar", bukan jumlah Macet yang tertangkap. Karena Macet hanya 44 dari 155 (28,4%), menebak "semua Lancar" pun sudah 71,6% benar. Jadi akurasi tinggi bisa datang dari menebak kelas mayoritas. Untuk kasus kredit, lihat juga berapa Macet yang tertangkap, bukan hanya akurasinya.
    kode: |
      import os, pandas as pd
      from sklearn.model_selection import train_test_split as tts; from sklearn.linear_model import LogisticRegression as LR
      b = "/soaldata" if os.path.exists("/soaldata") else os.path.expanduser("~/quantlab/data/soal")
      df = pd.read_csv(f"{b}/kredit_umkm_bersih.csv")
      X = df[["omzet_bulanan_juta", "lama_usaha_bulan", "pinjaman_diajukan_juta", "riwayat_telat_12m", "skor_kredit"]]; y = (df["status"] == "Lancar").astype(int)
      Xtr, Xte, ytr, yte = tts(X, y, test_size=0.25, random_state=42)
      pred = LR(max_iter=1000).fit(Xtr, ytr).predict(Xte)
      print("Macet tertangkap:", int(((yte == 0) & (pred == 0)).sum()), "dari", int((yte == 0).sum()))
    hasil:
      - ret: 0.5
        dd: 9.5
        win: 36
        note: "Akurasi 78,7% tidak berarti semua Macet tertangkap — hanya 19 dari 44."
      - ret: 6.5
        dd: 4.0
        win: 74
        note: "Benar: 19 dari 44 Macet tertangkap (43,2%). Sisa 25 lolos."
      - ret: 1.5
        dd: 9.0
        win: 45
        note: "128 itu jumlah tebakan Lancar, bukan jumlah Macet yang tertangkap."
      - ret: 0.5
        dd: 9.5
        win: 34
        note: "Model tetap menangkap 19 Macet — bukan nol, tapi belum cukup."
    petunjuk:
      - "Hitung dulu: 78,7% dari 155 baris = berapa tebakan benar?"
      - "Dari 44 Macet di data uji, berapa yang benar-benar terdeteksi?"
  - id: "s31-10"
    judul: "Uji Sekali atau Cross-Validation?"
    emoji: "🛰️"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Model 5 fitur: satu kali uji (test 25%) memberi 78,7%. Cross-validation 5 lipatan memberi 76,6%, 78,2%, 78,2%, 81,5%, dan 83,9%. Cara pelaporan mana yang paling tepat?
    pilihan:
      - "Laporkan 83,9% — angka terbaik dari CV"
      - "Laporkan rata-rata CV 79,7% dan sebutkan rentangnya 76,6% sampai 83,9%"
      - "Laporkan 78,7% saja — itu dari data uji"
      - "Laporkan 76,6% — angka terburuk supaya aman"
    jawaban: 1
    penjelasan: |
      Satu kali uji pada 155 baris itu berisik: beda 1 tebakan = 0,65 poin. CV-5 membagi data jadi 5 bagian dan menguji 5 kali: 76,6%; 78,2%; 78,2%; 81,5%; 83,9% → rata-ratanya 79,7%. Rata-rata ini lebih stabil daripada satu angka.

      Menyebut rentang itu penting: model yang hasilnya bergoyang lebih dari 7 poin di bagian data berbeda harus dicurigai, bukan dipuji. Memilih 83,9% itu curang (mengambil yang terbaik), memilih 76,6% terlalu pesimis (mengambil yang terburuk). Angka tunggal 78,7% tidak salah, tapi kehilangan informasi sebaran.
    kode: |
      import os, pandas as pd
      from sklearn.model_selection import cross_val_score; from sklearn.linear_model import LogisticRegression
      b = "/soaldata" if os.path.exists("/soaldata") else os.path.expanduser("~/quantlab/data/soal")
      df = pd.read_csv(f"{b}/kredit_umkm_bersih.csv")
      X = df[["omzet_bulanan_juta", "lama_usaha_bulan", "pinjaman_diajukan_juta", "riwayat_telat_12m", "skor_kredit"]]; y = (df["status"] == "Lancar").astype(int)
      cv = cross_val_score(LogisticRegression(max_iter=1000), X, y, cv=5)
      print([round(v, 4) for v in cv], "| rata-rata:", round(cv.mean(), 4))
    hasil:
      - ret: 1.0
        dd: 9.5
        win: 38
        note: "Mengambil angka terbaik dari 5 lipatan = memilih keberuntungan."
      - ret: 6.5
        dd: 4.0
        win: 74
        note: "Benar: rata-rata 79,7% + rentang 76,6%-83,9% itu laporan yang jujur."
      - ret: 2.5
        dd: 8.0
        win: 50
        note: "Tidak salah, tapi satu angka menyembunyikan sebaran hasil."
      - ret: 1.0
        dd: 9.0
        win: 42
        note: "Angka terburuk juga pilih-pilih — sama tidak jujurnya."
    petunjuk:
      - "Rata-rata 5 lipatan: (76,6 + 78,2 + 78,2 + 81,5 + 83,9) ÷ 5 = ?"
      - "Laporan yang baik menyebut pusat dan sebarannya."
