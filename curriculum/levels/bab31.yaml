      Tanpa baseline, angka 78,7% tidak bisa dinilai: kelihatan bagus, padahal tebakan bodoh sudah 73,5%. Model dengan akurasi 72% malah LEBIH BURUK dari tebakan bodoh, walau angkanya terlihat lumayan. Karena itu laporan model yang sehat selalu menulis dua angka: baseline dan hasil model.
