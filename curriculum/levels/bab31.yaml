  - id: "s31-5"
    judul: "Overfit: Hafal vs Paham"
    emoji: "🩺"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Kamu menambah 500 kolom acak (angka random, tanpa arti) ke 5 fitur asli, lalu berlatih hanya dengan 60 baris. Hasilnya akurasi latih 100% dan akurasi uji 72,3% — sedangkan baseline 73,2%. Apa diagnosisnya?
    pilihan:
      - "Model bagus — akurasi latih 100% sempurna"
      - "Overfit: model menghafal derau, akurasi uji jatuh di bawah baseline"
      - "Kurang fitur — tambah 500 kolom acak lagi"
      - "Data uji terlalu kecil — abaikan saja hasilnya"
    jawaban: 1
    penjelasan: |
      Dengan 500 kolom acak, model bisa menemukan pola kebetulan yang hanya cocok untuk 60 baris latih — karena itu akurasi latih 100%. Di data baru pola itu hilang: akurasi uji 72,3%, malah di bawah baseline 73,2%. Jarak 100% - 72,3% = 27,7 poin, tanda khas overfit.

      Kolom acak tidak punya arti apa pun, jadi kenaikan akurasi latih itu murni hafalan. Obatnya: pakai fitur yang bisa dijelaskan, tambah baris data, dan nilai dari akurasi uji. Model 5 fitur asli pada 60 baris yang sama memberi akurasi uji 75,0% — lebih baik daripada 505 kolom.
    kode: |
      import os, numpy as np, pandas as pd
      from sklearn.linear_model import LogisticRegression
      b = "/soaldata" if os.path.exists("/soaldata") else os.path.expanduser("~/quantlab/data/soal")
      df = pd.read_csv(f"{b}/kredit_umkm_bersih.csv")
      X = np.column_stack([df[["omzet_bulanan_juta", "lama_usaha_bulan", "pinjaman_diajukan_juta", "riwayat_telat_12m", "skor_kredit"]], np.random.default_rng(1).normal(size=(620, 500))])
      y = (df["status"] == "Lancar").astype(int).values
      m = LogisticRegression(max_iter=5000, C=1e4).fit(X[:60], y[:60])
      print(round(m.score(X[:60], y[:60]), 3), round(m.score(X[60:], y[60:]), 3))
    hasil:
      - ret: 1.0
        dd: 9.5
        win: 40
        note: "100% hanya di data latih — model menghafal 500 kolom acak."
      - ret: 6.0
        dd: 4.0
        win: 73
        note: "Benar: uji 72,3% di bawah baseline 73,2%. Overfit."
      - ret: 0.5
        dd: 9.5
        win: 35
        note: "Menambah kolom acak menambah hafalan, bukan pengetahuan."
      - ret: 1.5
        dd: 9.0
        win: 44
        note: "Data uji justru satu-satunya ukuran yang jujur."
    petunjuk:
      - "Kolom acak tidak punya arti — kenapa akurasi latih bisa 100%?"
      - "Bandingkan akurasi uji 72,3% dengan baseline 73,2%."
