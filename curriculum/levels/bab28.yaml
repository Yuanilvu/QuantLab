      omzet = pd.to_numeric(df["omzet_bulanan_juta"], errors="coerce")
      print(f"Kosong sebelum: {df['omzet_bulanan_juta'].isna().sum()}")
      print(f"Kosong sesudah: {omzet.isna().sum()}")
