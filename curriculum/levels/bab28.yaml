    input_spec: |
      Baris 1: path file CSV. Baris 2: nama kolom angka.
    output_spec: |
      Baris 1: jumlah baris sesudah buang duplikat (int). Baris 2: median kolom (1 desimal). Baris 3: rata-rata kolom (1 desimal).
    contoh:
      - input: "/soaldata/kredit_umkm.csv\nomzet_bulanan_juta"
        output: "620\n26.8\n45.3"
      - input: "/soaldata/kredit_umkm_bersih.csv\nomzet_bulanan_juta"
        output: "620\n26.8\n31.4"
    tes:
      - input: "/soaldata/kredit_umkm.csv\nomzet_bulanan_juta"
        output: "620\n26.8\n45.3"
