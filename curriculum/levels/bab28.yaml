pelajaran:
  - id: "28-1"
    judul: "Kenali Data Kotor"
    menit: 5
    materi: |
      Data kompetisi hampir selalu kotor. Lima jenis kotoran yang paling sering muncul:

      - **Nilai kosong** (missing): sel yang tidak diisi.
      - **Baris kembar** (duplikat): satu pengajuan tercatat dua kali.
      - **Nilai ekstrem** (outlier): angka kelewat besar atau mustahil, mis. omzet 9.000 juta atau -50 juta.
      - **Format campur**: tanggal ditulis tiga cara berbeda.
      - **Kategori tidak konsisten**: "Jakarta", "jakarta", dan "JKT" — satu kota, tiga nama.

      File `/soaldata/kredit_umkm.csv` = data pengajuan kredit UMKM yang belum dibersihkan: 636 baris, 295 sel kosong, 16 baris kembar.

      Cara memeriksa: `df.isna().sum()` menghitung sel kosong tiap kolom. `df.duplicated().sum()` menghitung baris kembar. Langkah pertama setiap proyek data: ukur dulu kotornya, baru bersihkan.
    kode: |
      import pandas as pd
      df = pd.read_csv("/soaldata/kredit_umkm.csv")
      print(df.isna().sum().sort_values(ascending=False))
      print(f"Baris kembar: {df.duplicated().sum()}")
    penjelasan: "`isna()` menandai sel kosong, `.sum()` menjumlahkannya per kolom — kelihatan kolom mana yang paling bocor. `duplicated()` menandai baris kembar dan `.sum()` menghitungnya: 16 baris. Urutkan dari terbesar supaya tahu mulai dari kolom mana."
  - id: "28-2"
    judul: "Bersihin Langkah demi Langkah"
    menit: 6
    materi: |
      Urutan bersih-bersih yang aman:

      ```python
      df = df.drop_duplicates()                                 # 1. buang baris kembar
      angka = pd.to_numeric(df["omzet_bulanan_juta"], errors="coerce")   # 2. paksa jadi angka
      df["omzet_bulanan_juta"] = angka.fillna(angka.median())    # 3. isi kosong dengan median
      df["kota"] = df["kota"].str.strip().str.lower()            # 4. rapikan teks
      df["kota"] = df["kota"].replace({"jkt": "jakarta"})        # 5. satukan singkatan
      ```

      **`errors="coerce"`** = sel yang gagal jadi angka diubah jadi kosong, kode tidak mati. Setelah itu wajib cetak berapa sel yang jadi kosong — jangan kehilangan data diam-diam.

      **`fillna(median)`** = isi sel kosong dengan nilai tengah. Median tidak tertarik nilai ekstrem: mean omzet 46,5 juta, median 26,7 juta — jauh berbeda gara-gara satu outlier 9.000 juta.

      **`clip(upper=...)`** memotong nilai di luar batas wajar, mis. `df["lama_usaha_bulan"].clip(upper=300)`.

      Dedupe dulu, baru hitung statistik: median omzet 26,7 (masih ada kembar) vs 26,8 (sesudah bersih).
    kode: |
      import pandas as pd
      df = pd.read_csv("/soaldata/kredit_umkm.csv")
      sebelum = len(df)
      df = df.drop_duplicates()
      df["kota"] = df["kota"].str.strip().str.lower()
      omzet = pd.to_numeric(df["omzet_bulanan_juta"], errors="coerce")
      df["omzet_bulanan_juta"] = omzet.fillna(omzet.median())
      print(f"Baris: {sebelum} -> {len(df)} | penulisan kota: 21 -> {df['kota'].nunique()}")
    penjelasan: "Satu pipeline pendek: buang kembar (636 -> 620), seragamkan nama kota (21 -> 13 penulisan), lalu isi omzet kosong dengan median. Empat langkah ini membereskan mayoritas kotoran. Sisanya: outlier (clip) dan tanggal yang formatnya campur."
