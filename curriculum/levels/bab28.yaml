  teori:
  - "Data nyata selalu kotor: diketik manusia dari banyak cabang, sebagian kolom opsional, dan sistem lama mengekspor dengan format sendiri. Karena itu kotor bukan tanda kegagalan — kenali dulu polanya sebelum menghapus apa pun."
  - "Ukur dulu sebelum bersihkan: `df.isna().sum()` menghitung sel kosong per kolom, `df.duplicated().sum()` menghitung baris kembar, dan `df.describe()` memunculkan nilai ekstrem. Setiap langkah bersih-bersih sebaiknya berpola: hitung sebelum, kerjakan, hitung sesudah."
  - "Lima kotoran bab ini: nilai kosong (295 sel dari 7.632), baris kembar (16), nilai ekstrem (omzet 9.000 juta dan -50 juta), tanggal tiga format, serta kategori tidak konsisten (Jakarta lima tulisan, total 179 baris). Semuanya sekadar tidak seragam — tugasmu menyeragamkannya, bukan menghukum datanya."
  - "Urutan aman: buang kembar → paksa angka (`errors=\"coerce\"`) → isi kosong dengan median → rapikan teks (strip + lower) → satukan singkatan (`replace`) → potong nilai mustahil (`clip`). Dedupe selalu paling awal, karena semua angka isian harus dihitung dari data yang sudah bersih."
  - "`errors=\"coerce\"` mengubah sel yang gagal jadi angka menjadi kosong tanpa menghentikan kode. Wajib cetak jumlah kosong sesudah konversi: di file ini 53 sebelum = 53 sesudah; kalau bertambah, ada sel rusak yang perlu diperiksa."
  - "Median mengisi sel kosong karena tahan nilai ekstrem: mean omzet 46,5 juta tertarik omzet 9.000 juta, sedangkan median 26,7 juta (26,8 sesudah dedupe) tetap mewakili nasabah tipikal. Isi dengan mean berarti menularkan pengaruh outlier ke semua sel isian."
  - "Satukan kategori dengan `replace(dict)`, bukan `map(dict)`: map mengubah nilai di luar dict menjadi kosong sehingga kota lain bisa terhapus. Gejalanya khas — jumlah penulisan unik kolaps, dan hanya ketahuan dengan menguji hasilnya."
  - "`clip` memotong nilai di luar batas wajar (lama usaha 999 bulan dipotong ke 300). Nilai mustahil seperti omzet -50 juta tidak dipotong jadi 0, tapi dijadikan kosong lalu diisi median; barisnya tetap dipakai selama info lain lengkap."
  - "Ukuran keberhasilan: 620 baris, 0 sel kosong, 0 baris kembar — cocokkan dengan `kredit_umkm_bersih.csv`. Sel kosong sedikit (3,5%) masih aman diisi, tapi kalau kosongnya mayoritas (61%) lebih jujur kolomnya dibuang atau dicari sumber datanya."
