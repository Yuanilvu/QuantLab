  - id: "s25-4"
    judul: "Berapa Hari Rugi?"
    emoji: "🎯"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Return harian strategimu (dalam persen): `r = np.array([1.2, -0.5, 0.8, -1.1, 0.3])`. Lima hari return. Kamu mau bot menghitung sendiri berapa hari RUGI (return negatif). Kode mana yang benar?
    pilihan:
      - "`r < 0`"
      - "`(r < 0).sum()`"
      - "`r.sum()`"
      - "`r[r < 0]`"
    jawaban: 1
    penjelasan: |
      `r < 0` membandingkan SEMUA elemen sekaligus: hasilnya `[False, True, False, True, False]`. Di Python, True = 1 dan False = 0. `.sum()` menjumlahkan semua True → 2. Berarti 2 hari rugi. Pola ini dipakai untuk win rate, hari hijau/merah, dan syarat lain. `r[r < 0]` mengambil NILAI hari rugi (−0,5 dan −1,1). Gunanya beda: untuk rata-rata kerugian. `r.sum()` = +0,7%, total return — bukan jumlah hari. Urutan bacanya: bandingkan dulu, jumlahkan setelahnya.
    kode: |
      import numpy as np
      r = np.array([1.2, -0.5, 0.8, -1.1, 0.3])
      print(r < 0)          # [False  True False  True False]
      print((r < 0).sum())  # 2 hari rugi
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "Deretan True/False — belum dijumlahkan."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Benar: 2 hari rugi (−0,5 dan −1,1)."
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "+0,7% = total return semua hari, bukan jumlah hari rugi."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Itu mengambil NILAI hari rugi — bukan menghitungnya."
    petunjuk:
      - "True dihitung 1, False dihitung 0."
      - "Bandingkan dulu, lalu jumlahkan dengan .sum()."
  - id: "s25-5"
    judul: "Kurva Ekuitas: Modal Tumbuh Berlapis"
    emoji: "💹"
    sulit: "sulit"
    xp: 50
    menit: 6
    cerita: |
      Return harian strategimu (dalam desimal): `r = np.array([0.01, -0.02, 0.015, 0.01])`. Modal awal $10.000. Ekuitas (modal berjalan) memakai compounding: tiap hari hasil kemarin DIKALI (1 + return), bukan ditambah. Berapa ekuitas setelah hari ke-2 (return -2%)?
    pilihan:
      - "$10.100: hasil hari pertama"
      - "$9.898: 10.000 × 1,01 × 0,98"
      - "$9.900: 10.000 × 0,99"
      - "$10.146,9: hasil hari keempat"
    jawaban: 1
    penjelasan: |
      Ekuitas berjalan = modal awal dikali (1 + return) BERUNTUN. Hari 1: 10.000 × 1,01 = 10.100. Hari 2: 10.100 × 0,98 = 9.898. Bukan 9.900. 9.900 = 10.000 × 0,99, seolah rugi 2% dihitung dari modal awal. Padahal rugi 2% terjadi SETELAH untung 1%: dihitung dari 10.100. Compounding = tiap hari dikali ke hasil kemarin. Di NumPy: `np.cumprod(1 + r)` menghitung semua langkah sekaligus. Hasilnya [1,01; 0,9898; 1,0046; 1,0147]. Dikali 10.000: [10.100; 9.898; 10.046,5; 10.146,9]. Inilah kurva ekuitas, dasar semua laporan performa.
    kode: |
      import numpy as np
      r = np.array([0.01, -0.02, 0.015, 0.01])
      ekuitas = 10000 * np.cumprod(1 + r)
      print(ekuitas.astype(int))   # [10100  9898 10046 10146]
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "10.100 = ekuitas hari ke-1. Kamu minta hari ke-2."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Benar: 10.000 × 1,01 × 0,98 = 9.898. Dikali berlapis."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "9.900 salah: rugi 2% dihitung dari 10.100, bukan dari 10.000."
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "10.146,9 = ekuitas hari ke-4, setelah semua return."
    petunjuk:
      - "Hari 1: 10.000 × 1,01 = ? Hari 2: hasil itu dikali 0,98."
      - "Compounding: kali beruntun, bukan tambah."
soal:
  - id: "p25-1"
    judul: "Rata-rata & Tertinggi"
    emoji: "📈"
    tingkat: mudah
    xp: 25
    menit: 6
    cerita: |
      Gunakan NumPy! Baca N, lalu N baris harga ke dalam `np.array`. Cetak RATA-RATA (dibulatkan ke bawah, `int()`) di baris 1 dan harga TERTINGGI di baris 2.
    input_spec: |
      Baris 1: N. N baris berikutnya: harga.
    output_spec: |
      Baris 1: rata-rata (int). Baris 2: harga tertinggi.
    contoh:
      - input: "4\n1000\n2000\n3000\n4000"
        output: "2500\n4000"
      - input: "3\n500\n700\n900"
        output: "700\n900"
    tes:
      - input: "4\n1000\n2000\n3000\n4000"
        output: "2500\n4000"
      - input: "3\n500\n700\n900"
        output: "700\n900"
      - input: "1\n777"
        output: "777\n777"
      - input: "5\n100\n200\n300\n400\n500"
        output: "300\n500"
    solusi: |
      import numpy as np
      n = int(input())
      harga = np.array([int(input()) for _ in range(n)])
      print(int(harga.mean()))
      print(int(harga.max()))
    petunjuk:
      - "np.array([...]) dari list input."
      - "harga.mean() dan harga.max(), bungkus int()."
