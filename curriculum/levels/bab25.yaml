    emoji: "📅"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Return harian strategimu (dalam persen): [0.5, -0.8, 1.2, -0.3, 0.9]. Vol hariannya = std ≈ 0,75%. Laporan butuh vol TAHUNAN (252 hari trading setahun). Berapa?
