      Vol harian 0,75% itu per HARI — tidak bisa langsung dikali 252: return harian tidak menumpuk linear seperti itu. Aturan pasar: vol tahunan = vol harian x √252. √252 = 15,87 → 0,75 x 15,87 = 11,8%. Hitung presisi dari data: std [0.5, -0.8, 1.2, -0.3, 0.9] = 0,7456% → x15,87 = 11,84 ≈ 11,8% per tahun. 188% = 0,75 x 252 — kesalahan klasik menganggap vol dijumlah linear. 0,75% = lupa annualisasi. 9% = menganggap setahun 12 hari. Vol tahunan dipakai untuk sizing dan batas risiko — salah hitung = posisi kegedean atau kekecilan.
    kode: |
      import numpy as np
      ret = np.array([0.5, -0.8, 1.2, -0.3, 0.9])
      vol_tahunan = ret.std() * np.sqrt(252)
      print(f"Vol tahunan: {vol_tahunan:.1f}%")
