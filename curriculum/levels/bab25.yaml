  - id: "s25-9"
    judul: "Bandingkan yang Sebanding"
    emoji: "🆚"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Dua saham mau dibandingkan performa 4 harinya: TLKM [4000, 4100, 4200, 4050] vs CUAN [1000, 950, 900, 980]. Harganya beda skala (4000-an vs 900-an). Cara paling jujur membandingkan?
    pilihan:
      - "TLKM lebih unggul — harganya sampai 4200, jauh di atas CUAN 900"
      - "Normalisasi: TLKM 4050/4000 = +1,25%; CUAN 980/1000 = -2% → TLKM relatif lebih kuat"
      - "CUAN lebih menarik — harga 900 lebih murah, upside lebih besar"
      - "Bandingkan selisih poin: TLKM +50 (4050-4000) vs CUAN -20 (980-1000) → TLKM"
    jawaban: 1
    penjelasan: |
      Harga absolut tidak bisa dibandingkan lintas saham: skala tiap saham berbeda (riwayat split, right issue, umur listing). Cara jujur: ubah ke RETURN. TLKM: 4050/4000 - 1 = +1,25%. CUAN: 980/1000 - 1 = -2%. Di NumPy: `harga / harga[0] - 1` atau indeks `harga / harga[0] * 100`. TLKM naik 1,25% dalam 4 hari; CUAN turun 2%. "Harga lebih tinggi = lebih unggul" salah: 4.000 bisa saham yang 10 tahun tidak bergerak. "900 lebih murah = upside besar" = fallacy harga murah (murah relatif ke apa?). Selisih poin juga menyesatkan: 50 poin dari 4.000 = 1,25%, tapi 20 poin dari 1.000 = 2% — dua skala berbeda.
    kode: |
      import numpy as np
      tlkm = np.array([4000, 4100, 4200, 4050])
      cuan = np.array([1000, 950, 900, 980])
      print(f"TLKM 4 hari: {(tlkm[-1] / tlkm[0] - 1) * 100:+.2f}%")
      print(f"CUAN 4 hari: {(cuan[-1] / cuan[0] - 1) * 100:+.2f}%")
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "Harga absolut tidak sebanding — skala tiap saham berbeda."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Benar: return relatif +1,25% vs -2%. TLKM pemenang periode ini."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "Murah bukan sinyal — CUAN malah turun 2% di periode ini."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Poin tidak sebanding: 50 dari 4000 = 1,25%; 20 dari 1000 = 2%."
