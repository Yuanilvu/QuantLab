  - id: "p25-3"
    judul: "Rata-rata Return Harian"
    emoji: "📉"
    tingkat: sulit
    xp: 55
    menit: 9
    cerita: |
      NumPy! Baca N, lalu N baris harga. Hitung return harian: `r = harga[1:] / harga[:-1] - 1`. Cetak RATA-RATA return harian dalam PERSEN dengan 2 desimal (format `%.2f`, misal `1.25` artinya 1.25%).
    input_spec: |
      Baris 1: N (≥ 2). N baris berikutnya: harga.
    output_spec: |
      Satu baris: rata-rata return harian (%) dengan 2 desimal.
    contoh:
      - input: "3\n1000\n1100\n1210"
        output: "10.00"
      - input: "4\n4000\n4100\n3900\n4200"
        output: "1.77"
    tes:
      - input: "3\n1000\n1100\n1210"
        output: "10.00"
      - input: "4\n4000\n4100\n3900\n4200"
        output: "1.77"
      - input: "2\n100\n90"
        output: "-10.00"
      - input: "5\n100\n100\n100\n100\n100"
        output: "0.00"
    solusi: |
      import numpy as np
      n = int(input())
      harga = np.array([int(input()) for _ in range(n)])
      r = harga[1:] / harga[:-1] - 1
      print(f"{r.mean() * 100:.2f}")
    petunjuk:
      - "Return harian = harga[1:] / harga[:-1] - 1."
      - "Rata-rata × 100 untuk persen, format %.2f."
