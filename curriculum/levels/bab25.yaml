pelajaran:
  - id: "25-1"
    judul: "Array: List yang Lebih Kuat"
    menit: 5
    materi: |
      **NumPy** = library (paket kode siap pakai) paling dasar untuk angka di Python. Intinya: **array** — seperti list, tapi lebih cepat dan bisa dioperasikan sekaligus.

      ```python
      import numpy as np
      harga = np.array([4000, 4100, 3900, 4200])
      print(harga * 1.10)      # semua dikali sekaligus!
      # [4400. 4510. 4290. 4620.]
      ```

      Perhatikan: `harga * 1.10` mengalikan SEMUA elemen tanpa loop. List biasa: `[4000, 4100] * 1.10` malah error atau menggandakan isi. Ini disebut **operasi vektor** — satu perintah untuk semua angka.

      Bisa juga operasi antar array. Contoh: `harga[1:] / harga[:-1] - 1` menghitung return harian SEMUA hari dalam satu baris. (`harga[1:]` = mulai elemen kedua; `harga[:-1]` = tanpa elemen terakhir.) Coba dengan list Python — butuh loop panjang.

      Kenapa penting? Data pasar = ratusan ribu angka. NumPy memprosesnya dalam milidetik; loop Python bisa berdetik-detikan. Library lain (pandas, sklearn) dibangun di atas NumPy.
    kode: |
      import numpy as np
      harga = np.array([4000, 4100, 3900, 4200, 4050])
      print(harga.mean())     # 4050.0
      print(harga.max())      # 4200
      print(harga.std())      # sebaran (Bab 2!)
    penjelasan: "np.array = list super. Operasi vektor: satu baris, semua elemen. mean/max/std: statistik instan."
  - id: "25-2"
    judul: "Statistik Satu Baris"
    menit: 5
    materi: |
      Semua statistik yang kamu pelajari di Bab 2 & 12 tersedia dalam satu baris:

      ```python
      import numpy as np
      ret = np.array([1.2, -0.5, 0.8, -1.1, 0.3])
      print(ret.mean())    # rata-rata: 0.14
      print(ret.std())     # standar deviasi: 0.88
      print(ret.max())     # 1.2
      print(ret.min())     # -1.1
      print(ret.sum())     # 0.7
      ```

      Yang paling berguna untuk quant: RETURN HARIAN lewat pembagian array berpasangan:

      ```python
      harga = np.array([4000, 4100, 3900, 4200])
      ret_harian = harga[1:] / harga[:-1] - 1
      # array([0.025, -0.0488, 0.0769])  → +2.5%, -4.9%, +7.7%
      ```

      Return harian = bahan bakar SEMUA analisis: Sharpe (Bab 6), volatilitas (Bab 12), drawdown. Satu baris NumPy menggantikan loop 10 baris — dan lebih cepat.
    kode: |
      import numpy as np
      harga = np.array([4000, 4100, 3900, 4200])
      ret_harian = harga[1:] / harga[:-1] - 1
      print(np.round(ret_harian * 100, 2))   # [ 2.5  -4.88  7.69]
    penjelasan: "Potong array berpasangan (`harga[1:]` vs `harga[:-1]`): return harian semua hari dalam satu baris. Statistik: mean/std/max/min/sum."
