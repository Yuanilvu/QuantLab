pelajaran:
  - id: "33-1"
    judul: "Neuron & Jaringan Saraf"
    menit: 5
    materi: |
      **Neuron** = mesin hitung kecil dengan dua langkah:
      1. Jumlahkan semua masukan yang sudah dikali bobot, lalu tambah bias: z = w1·x1 + w2·x2 + w3·x3 + b
      2. Ubah z jadi angka 0 sampai 1 lewat **aktivasi** (contoh: sigmoid, rumusnya 1 / (1 + e pangkat −z)).

      Analoginya: seorang penilai kredit. Tiap fakta (skor kredit, telat bayar, jumlah pinjaman) diberi timbangan (**bobot**). Fakta bagus menambah nilai, fakta buruk mengurangi. **Bias** = nada dasar si penilai — ada yang gampang curiga, ada yang santai.

      Contoh angka nyata. Satu pengajuan: skor_kredit 500, telat 1 kali, pinjaman 20 juta. Bobot: +0,01 untuk skor, −0,6 untuk telat, +0,04 untuk pinjaman; bias −4,5.
      - z = 0,01 x 500 + (−0,6) x 1 + 0,04 x 20 + (−4,5) = 5 − 0,6 + 0,8 − 4,5 = **0,7**
      - aktivasi = 1 / (1 + e pangkat −0,7) = **0,67** → di atas 0,5, jadi model condong bilang Macet.

      **Lapisan tersembunyi**: satu neuron terlalu sederhana. Jaringan saraf menyusun banyak neuron berlapis-lapis. Lapisan pertama menangkap pola sederhana, lapisan berikutnya menggabungkan pola itu jadi pola yang lebih rumit. Contoh arsitektur kecil: 3 masukan → 4 neuron tersembunyi → 1 keluaran.

      Dua hal yang wajib diingat sebelum masuk deep learning: (1) butuh data lebih banyak daripada model biasa; (2) fitur harus diskalakan — angka ratusan seperti skor kredit akan menenggelamkan angka kecil seperti telat 0-5 kalau tidak disetarakan dulu.
    kode: |
      import numpy as np

      # Satu pengajuan: skor_kredit 500, telat 1 kali, pinjaman 20 juta
      x = np.array([500, 1, 20])
      bobot = np.array([0.01, -0.6, 0.04])
      bias = -4.5
      z = bobot @ x + bias
      print(f"z = w.x + b = {z:.2f}")
      print(f"aktivasi = {1 / (1 + np.exp(-z)):.2f} (di atas 0.5 -> cenderung Macet)")

      # Contoh kedua: telat 4 kali, pinjaman 30 juta
      x2 = np.array([450, 4, 30])
      z2 = bobot @ x2 + bias
      print(f"z = {z2:.2f}")
      print(f"aktivasi = {1 / (1 + np.exp(-z2)):.2f} (di bawah 0.5 -> cenderung Lancar)")
    penjelasan: "Neuron = jumlah berbobot + bias, lalu aktivasi. Contoh: z = 5 − 0,6 + 0,8 − 4,5 = 0,7 dan aktivasi 0,67 (condong Macet). Contoh kedua: z = −1,2 dan aktivasi 0,23 (condong Lancar). Jaringan = neuron berlapis-lapis; butuh data banyak dan fitur diskalakan."
  - id: "33-2"
    judul: "MLP Pertamamu"
    menit: 6
    materi: |
      **MLP** (Multi-Layer Perceptron) = jaringan saraf paling sederhana di sklearn: beberapa neuron di lapisan tersembunyi, semuanya saling terhubung. Melatihnya sama singkatnya dengan logreg.

      **Aturan wajib: pakai StandardScaler.** StandardScaler mengubah tiap fitur jadi rata-rata 0 dan sebaran 1, sehingga skor_kredit (400-600) dan riwayat_telat (0-5) punya timbangan sebanding. Buktinya dari data kita: MLP yang sama dilatih tanpa skala → akurasi data uji **0,74** (itu cuma setara baseline 0,735!). Dengan StandardScaler → **0,80**. Di sklearn tulis `make_pipeline(StandardScaler(), MLPClassifier(...))` supaya scaler dan model jadi satu paket; data uji pun otomatis diskalakan dengan cara yang sama.

      Parameter yang perlu kamu tahu: `hidden_layer_sizes=(8,)` artinya satu lapisan tersembunyi berisi 8 neuron; `max_iter` = berapa putaran pelatihan; `random_state=1` supaya hasilnya selalu sama setiap dijalankan. Kalau muncul ConvergenceWarning, artinya pelatihan belum stabil — bisa diabaikan dulu atau `max_iter` dinaikkan.

      Untuk kompetisi nyata, orang biasanya pindah ke **PyTorch** atau **TensorFlow** di Google Colab: lebih kuat untuk gambar, teks, dan data besar. Tapi konsepnya SAMA — skala fitur, lapisan, aktivasi, lalu dinilai dengan data uji. Kalau MLP sklearn sudah paham, pindah ke PyTorch cuma soal sintaks.
    kode: |
      import pandas as pd
      from sklearn.model_selection import train_test_split
      from sklearn.neural_network import MLPClassifier
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler

      data = pd.read_csv("/soaldata/kredit_umkm_bersih.csv")
      fitur = ["omzet_bulanan_juta", "lama_usaha_bulan", "pinjaman_diajukan_juta", "riwayat_telat_12m", "skor_kredit"]
      X = data[fitur]
      y = (data["status"] == "Macet").astype(int)
      X_latih, X_uji, y_latih, y_uji = train_test_split(X, y, test_size=0.25, random_state=1, stratify=y)

      tanpa_skala = MLPClassifier(hidden_layer_sizes=(8,), max_iter=300, random_state=1)
      tanpa_skala.fit(X_latih, y_latih)
      print(f"Tanpa skala: akurasi {tanpa_skala.score(X_uji, y_uji):.2f}")

      pakai_skala = make_pipeline(StandardScaler(), MLPClassifier(hidden_layer_sizes=(8,), max_iter=300, random_state=1))
      pakai_skala.fit(X_latih, y_latih)
      print(f"Pakai StandardScaler: akurasi {pakai_skala.score(X_uji, y_uji):.2f}")
    penjelasan: "StandardScaler = penyetara skala, wajib untuk MLP. Bukti nyata: tanpa skala 0,74 (setara baseline 0,735), dengan skala 0,80. random_state=1 supaya hasil selalu sama. Untuk kompetisi, orang lanjut ke PyTorch/TensorFlow di Colab — konsepnya sama."
