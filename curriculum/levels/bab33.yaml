  - id: "s33-3"
    judul: "Hitung Bobot Jaringan"
    emoji: "⚙️"
    sulit: "mudah"
    xp: 20
    menit: 3
    cerita: |
      Arsitektur jaringan: 3 fitur masukan → lapisan tersembunyi 4 neuron → 1 neuron keluaran. Berapa TOTAL bobot + bias di seluruh jaringan?
    pilihan:
