      for z in [1.9, -1.9]:
          aktivasi = 1 / (1 + math.exp(-z))
          vonis = "Macet" if aktivasi > 0.5 else "Lancar"
          print(f"z = {z:+.1f} -> aktivasi {aktivasi:.2f} -> vonis {vonis}")
