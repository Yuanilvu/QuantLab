    emoji: "🎚️"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Satu neuron menghasilkan z = 1,9. Aktivasi sigmoid mengubahnya jadi angka 0 sampai 1 → 1 / (1 + e pangkat −1,9) = 0,87. Bagaimana kamu membaca 0,87 itu?
    pilihan:
      - "Peluang Macet 0,87 — di atas 0,5, jadi model memvonis Macet"
      - "Ada 87 pengajuan yang Macet"
      - "Nilai aktivasi bisa besar juga, seperti z = 19"
      - "Model salah, karena aktivasi seharusnya sama dengan z"
    jawaban: 0
    penjelasan: |
      Aktivasi selalu berada di antara 0 dan 1 — itulah gunanya: z yang bisa −5 atau +9 diubah jadi angka yang bisa dibaca sebagai peluang. Nilai 0,87 berarti model memberi peluang Macet 87%. Aturan umum: di atas 0,5 → vonis Macet, di bawah 0,5 → vonis Lancar. Bandingkan dengan z = −1,9: aktivasi = 1/(1 + e pangkat 1,9) = 0,13 → peluang Macet 13%, vonis Lancar. Perhatikan 0,87 dan 0,13 itu simetris di sekitar 0,5. Karena itu, jangan pernah membaca z mentah sebagai peluang: z bisa negatif atau lebih besar dari 1. 0,87 juga bukan jumlah orang — itu peluang satu pengajuan.
    kode: |
