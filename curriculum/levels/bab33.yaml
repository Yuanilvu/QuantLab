panduan:
  intro: Jaringan saraf = lanjutan dari semua yang sudah kamu pelajari. Materi ini menunjukkan dari mana asalnya.
  materi:
  - label: '📄 Slide: Rakamin 10.1 — Fundamentals of Deep Learning'
    slug: rakamin
    path: 10 - Deep Learning & Deployment/1 - Fundamentals of Deep Learning.pdf
  - label: '📄 Slide: Rakamin 10.2 — Deep Learning Application'
    slug: rakamin
    path: 10 - Deep Learning & Deployment/2 - Deep Learning Application.pdf
  - label: '📄 Slide: Rakamin 10.3 — Deployment & Monitoring'
    slug: rakamin
    path: 10 - Deep Learning & Deployment/3 - Deployment & Monitoring.pdf
  - label: '📄 Slide: Pacmann — Neural Network Optimization'
    slug: pacmann
    path: Basic Machine Learning Algorithm/Gradient Descent/03 Neural Network Optimization.pdf
  - label: '📄 Slide: Pacmann — Neural Network Hyperparameters'
    slug: pacmann
    path: Basic Machine Learning Algorithm/Gradient Descent/04 Neural Network Hyperparameters.pdf
  teori:
  - "Jaringan saraf adalah lapisan-lapisan kecil yang bertumpuk; tiap lapisan belajar pola, dan makin dalam makin rumit pola yang bisa ditangkap. Kekuatan utamanya: interaksi antar fitur. Kalimat seperti skor kredit buruk baru berbahaya kalau telatnya banyak tidak perlu kamu tuliskan — jaringan mempelajarinya sendiri dari data."
  - "Satu neuron bekerja dua langkah: jumlahkan masukan berbobot lalu tambah bias (z = w·x + b), kemudian ubah lewat fungsi aktivasi. Contoh nyata: z = 5,0 − 0,6 + 0,8 − 4,5 = 0,7 dan aktivasi sigmoid 0,67, jadi model condong bilang Macet. Kuncinya konsisten: jumlah berbobot dulu, bias terakhir, baru aktivasi."
  - Fungsi aktivasi wajib ada karena tanpa itu jaringan sedalam apa pun setara satu persamaan linear — pola berlekuk tidak mungkin terbentuk. ReLU (negatif jadi 0, positif dibiarkan) adalah default lapisan tersembunyi karena murah dan cepat; sigmoid dipakai di keluaran karena memampatkan hasil ke rentang 0 sampai 1, bahasa peluang.
  - "Pacmann: belajar = menuruni lereng error (**gradient descent**); jumlah neuron dan lapisan = **hyperparameter** — kamu yang memilih, model yang belajar. Bobot berawal acak, lalu digeser sedikit demi sedikit ke arah yang menurunkan kesalahan. Analogi yang berguna: menuruni lembah berkabut, satu langkah kecil setiap kali."
  - "Skala fitur wajib untuk jaringan: tanpa StandardScaler, MLP 8 neuron hanya mencapai akurasi uji 0,74 — persis baseline. Dengan scaler naik ke 0,80 (300 putaran) dan 0,83 (400 putaran). Z-score berarti (nilai − rata-rata) ÷ sebaran, sama seperti yang kamu pakai di bab 30."
  - "Epoch (di sklearn bernama max_iter) adalah jumlah putaran belajar. Terlalu banyak membuat model menghafal: jaringan (32, 32) yang dilatih 2.000 putaran mencetak akurasi latih 0,98 tapi akurasi uji cuma 0,70. Selisih lebar antara skor latih dan skor uji adalah tanda overfitting — kecilkan jaringan atau kurangi epoch."
  - "random_state=1 mengunci undian bobot awal supaya hasil selalu sama; ConvergenceWarning berarti pelatihan belum stabil, boleh dinaikkan max_iter. MLP tidak punya keistimewaan apa pun: dia wajib dinilai di data uji seperti model lain, bukan dari skor latih."
  - "Ada dua jenis angka di dalam model: parameter (bobot) yang dicari mesin, dan hyperparameter (learning rate, jumlah epoch, arsitektur) yang kamu tentukan sebelum latih. Ukuran jaringan dinaikkan hanya kalau skor CV masih naik, bukan karena lebih besar terdengar lebih hebat."
  - "Kapan DL tepat dipakai: data besar dan tidak terstruktur (gambar, teks, suara), masalah kompleks, serta penjelasan model bukan prioritas. Untuk 620 baris tabel, CV MLP 0,786 masih di bawah regresi logistik 0,797 — jadi mulai dari model sederhana dulu. Buktikan sendiri di soal p33!"
  - "Slide Rakamin 10.3 mengingatkan: setelah model jadi ada **deployment & monitoring** — model bisa menua kalau data dunia berubah. Untuk lomba atau data besar, orang lanjut ke PyTorch atau TensorFlow di Colab; konsepnya sama, bedanya cuma sintaks."
  praktek:
  - Baca Rakamin 10.1 (Dasar-dasar) + 10.3 (Deployment) — masing-masing bagian ringkasnya saja.
  - Intip slide Pacmann Hyperparameters — catat istilah neuron, learning rate, epoch.
  - Buka 📓 Notebook Latihan bab ini → jalankan MLP, ubah jumlah neuron, amati akurasinya.
  - Kerjakan soal **p33-1 & p33-2** di Tahap 2.
  - Selesaikan 10 skenario keputusan di Tahap 3 — tamat! 🎓
  coba: 'import pandas as pd

    from sklearn.model_selection import train_test_split

    from sklearn.preprocessing import StandardScaler

    from sklearn.neural_network import MLPClassifier

    from sklearn.pipeline import make_pipeline


    df = pd.read_csv("/datasets/kredit_umkm_bersih.csv")

    fitur = ["omzet_bulanan_juta", "lama_usaha_bulan", "pinjaman_diajukan_juta", "riwayat_telat_12m", "skor_kredit"]

    X = df[fitur]

    y = (df["status"] == "Macet").astype(int)

    X_tr, X_te, y_tr, y_te = train_test_split(X, y, test_size=0.25, random_state=1, stratify=y)

    model = make_pipeline(StandardScaler(), MLPClassifier(hidden_layer_sizes=(8,), max_iter=400, random_state=1))

    model.fit(X_tr, y_tr)

    print(f"Akurasi MLP: {model.score(X_te, y_te):.2f}")'
