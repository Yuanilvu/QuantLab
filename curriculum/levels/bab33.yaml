  - id: "s33-8"
    judul: "Forward Pass Dua Neuron"
    emoji: "🧮"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Jaringan kecil untuk satu pengajuan (skor 500, telat 2). Lapisan tersembunyi punya 2 neuron, semua bias 0. Neuron h1 berbobot (0,01; −0,5); h2 berbobot (0,005; −1,0). Neuron keluaran berbobot (0,7; −0,4) dengan bias −0,2. Berapa aktivasi akhirnya, dan apa vonisnya?
    pilihan:
      - "0,56 — vonis Macet"
      - "0,24 — vonis Lancar"
      - "0,98 — vonis Macet"
      - "0,62 — vonis Macet"
    jawaban: 0
    penjelasan: |
      Kerjakan berurutan. h1: z = 0,01 x 500 − 0,5 x 2 = 5 − 1 = 4 → aktivasi 0,98. h2: z = 0,005 x 500 − 1,0 x 2 = 2,5 − 2 = 0,5 → aktivasi 0,62. Neuron keluaran menerima kedua aktivasi itu: z = 0,7 x 0,98 − 0,4 x 0,62 − 0,2 = 0,686 − 0,248 − 0,2 = 0,238 → aktivasi 1/(1 + e pangkat −0,238) = **0,56**. Karena 0,56 di atas 0,5 → vonis **Macet**. Opsi 0,98 dan 0,62 = aktivasi neuron tersembunyi, bukan keluaran akhir. Opsi 0,24 = nilai z keluaran sebelum diaktivasi. Inilah kekuatan lapisan tersembunyi: h1 dan h2 meringkas pola masing-masing, lalu neuron keluaran menggabungkan keduanya.
    kode: |
      import math
      skor, telat = 500, 2
      h1 = 1 / (1 + math.exp(-(0.01 * skor - 0.5 * telat)))
      h2 = 1 / (1 + math.exp(-(0.005 * skor - 1.0 * telat)))
      z_keluar = 0.7 * h1 - 0.4 * h2 - 0.2
      aktivasi = 1 / (1 + math.exp(-z_keluar))
      print(f"h1 = {h1:.2f}, h2 = {h2:.2f}")
      print(f"keluaran = {aktivasi:.2f} -> vonis Macet")
    hasil:
