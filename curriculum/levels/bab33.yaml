  - id: "p33-2"
    judul: "Latih MLP dengan StandardScaler"
    emoji: "🤖"
    tingkat: sedang
    xp: 40
    menit: 7
    cerita: |
      Gunakan sklearn! Data ada di /soaldata/kredit_umkm_bersih.csv. Fitur: omzet_bulanan_juta, lama_usaha_bulan, pinjaman_diajukan_juta, riwayat_telat_12m, skor_kredit. Target: Macet = 1, Lancar = 0. Baca satu angka dari input: jumlah neuron di lapisan tersembunyi. Latih MLP dengan StandardScaler dalam satu pipeline: train_test_split(test_size=0.25, random_state=1, stratify=y) dan MLPClassifier(hidden_layer_sizes=(neuron,), max_iter=400, random_state=1). Cetak akurasi data uji dengan 2 desimal dan kunci hasilnya stabil: bulatkan dengan round(..., 2) sebelum dicetak.
    input_spec: |
      Satu baris: jumlah neuron lapisan tersembunyi (mis. 8).
    output_spec: |
      Satu baris: akurasi data uji dengan 2 desimal (mis. 0.83).
    contoh:
      - input: "8"
        output: "0.83"
      - input: "16"
        output: "0.84"
    tes:
      - input: "3"
        output: "0.80"
      - input: "8"
        output: "0.83"
      - input: "16"
        output: "0.84"
      - input: "32"
        output: "0.83"
    solusi: |
      import pandas as pd
      from sklearn.model_selection import train_test_split
      from sklearn.neural_network import MLPClassifier
      from sklearn.pipeline import make_pipeline
      from sklearn.preprocessing import StandardScaler

      neuron = int(input())
      data = pd.read_csv("/soaldata/kredit_umkm_bersih.csv")
      fitur = ["omzet_bulanan_juta", "lama_usaha_bulan", "pinjaman_diajukan_juta", "riwayat_telat_12m", "skor_kredit"]
      X = data[fitur]
      y = (data["status"] == "Macet").astype(int)
      X_latih, X_uji, y_latih, y_uji = train_test_split(X, y, test_size=0.25, random_state=1, stratify=y)
      model = make_pipeline(StandardScaler(), MLPClassifier(hidden_layer_sizes=(neuron,), max_iter=400, random_state=1))
      model.fit(X_latih, y_latih)
      akurasi = round(model.score(X_uji, y_uji), 2)
      print(f"{akurasi:.2f}")
    petunjuk:
      - "Pipeline: make_pipeline(StandardScaler(), MLPClassifier(...))."
      - "hidden_layer_sizes=(neuron,) — pakai koma supaya dianggap satu lapisan."
      - "Skor data uji: model.score(X_uji, y_uji), lalu round(..., 2)."
    tugas:
      - "Baca jumlah neuron dari input."
      - "Baca CSV /soaldata/kredit_umkm_bersih.csv, ambil 5 fitur, dan buat target Macet (1/0)."
      - "Bagi data dengan train_test_split(test_size=0.25, random_state=1, stratify=y)."
      - "Latih pipeline StandardScaler + MLPClassifier(hidden_layer_sizes=(neuron,), max_iter=400, random_state=1), lalu cetak akurasi data uji dengan 2 desimal."
