      lapis1 = masuk * tersembunyi + tersembunyi
      lapis2 = tersembunyi * keluar + keluar
      print(f"Lapisan 1: {lapis1} (12 bobot + 4 bias)")
      print(f"Lapisan 2: {lapis2} (4 bobot + 1 bias)")
      print(f"Total: {lapis1 + lapis2} parameter")
