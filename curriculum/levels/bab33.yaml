      - "12"
      - "21"
      - "4"
    jawaban: 2
    penjelasan: |
      Hitung per lapisan. Masukan → tersembunyi: setiap neuron tersembunyi menerima 3 masukan, jadi 3 x 4 = 12 bobot, ditambah 4 bias (satu per neuron) = 16. Tersembunyi → keluaran: 4 bobot + 1 bias = 5. Total 16 + 5 = **21**. Opsi 12 hanya bobot lapisan pertama (lupa bias dan lupa lapisan keluaran). Opsi 7 = 3 + 4, salah hitung. Opsi 4 = jumlah neuron tersembunyi. Jumlah parameter ini penting: makin banyak parameter, makin banyak data yang dibutuhkan supaya jaringan tidak menghafal. Jaringan dengan 21 parameter masih wajar untuk 620 baris data.
    kode: |
