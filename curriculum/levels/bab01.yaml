  - id: "s1-8"
    judul: "Impas Setelah Fee"
    emoji: "🧾"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Kamu daytrade TLKM: beli di 4.000. Fee beli 0,15%, fee jual 0,25% dari nilai transaksi.
      Berapa persen minimal harga harus naik supaya setelah semua fee kamu impas?
    pilihan:
      - "0,15%"
      - "0,25%"
      - "0,40%"
      - "0,65%"
    jawaban: 2
    penjelasan: |
      Modal keluar = 4.000 × 1,0015 = 4.006 per lembar.
      Jual di harga P, kamu terima P × (1 − 0,0025) = P × 0,9975.
      Impas: P × 0,9975 = 4.006 → P = 4.016 → naik 16 poin dari 4.000 = **0,40%**.
      Rumus ringkas: (1 + 0,0015) ÷ (1 − 0,0025) − 1 = 0,40%.
      Opsi 0,15% lupa fee jual. Opsi 0,25% lupa fee beli. Opsi 0,65% menghitung fee jual dua kali.
      Fee 0,4% terlihat kecil. Untuk scalper target 0,5%, fee memakan hampir semua profit.
    kode: |
      harga_beli = 4000
      fee_beli = 0.0015
      fee_jual = 0.0025
      naik_minimal = (1 + fee_beli) / (1 - fee_jual) - 1
      print(f"Minimal naik = {naik_minimal * 100:.2f}%")   # 0.40%
    hasil:
      - ret: -0.25
        dd: 0.0
        win: 25
        note: "Target naik 0,15% (4.006): fee jual tetap dipotong — bersih rugi 0,25%."
      - ret: -0.15
        dd: 0.0
        win: 30
        note: "Naik 0,25% (4.010) belum menutup fee total. Rugi bersih 0,15%."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Benar: jual saat naik 0,40% (4.016) — bersih impas, modal utuh."
      - ret: -0.40
        dd: 0.0
        win: 20
        note: "Target 0,65% terlalu tinggi. Harga cuma sempat 4.018, kamu jual pas turun di 4.000."
    petunjuk:
      - "Modal keluar = harga × (1 + fee beli)."
      - "Uang masuk = harga jual × (1 − fee jual)."
      - "Cari harga jual yang membuat keduanya sama."

  - id: "s1-9"
    judul: "Untung Bersih Setelah Fee"
    emoji: "📊"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Kamu beli 500 lembar TLKM di 4.000. Rencana: jual di 4.200.
      Fee broker: beli 0,15%, jual 0,25% dari nilai transaksi.
      Berapa untung bersihmu dalam rupiah?
    pilihan:
      - "Rp100.000"
      - "Rp97.000"
      - "Rp91.750"
      - "Rp92.000"
    jawaban: 2
    penjelasan: |
      Nilai beli = 500 × 4.000 = 2.000.000. Fee beli = 0,15% × 2.000.000 = 3.000.
      Total keluar = 2.003.000.
      Nilai jual = 500 × 4.200 = 2.100.000. Fee jual = 0,25% × 2.100.000 = 5.250.
      Untung bersih = 2.100.000 − 5.250 − 2.003.000 = **Rp91.750** (4,6%, bukan 5%).
      Opsi 100.000 = lupa semua fee. Opsi 97.000 = lupa fee jual.
      Opsi 92.000 = memakai perkiraan fee 0,4% dari modal (2.000.000 × 0,004 = 8.000).
      Hampir benar, tapi kurang 250 — fee jual dihitung dari nilai jual 2.100.000 yang lebih besar.
    kode: |
      modal = 2_000_000
      lembar = 500
      fee_beli = modal * 0.0015
      hasil_jual = lembar * 4200
      fee_jual = hasil_jual * 0.0025
      untung_bersih = hasil_jual - modal - fee_beli - fee_jual
      print(f"Untung bersih = Rp{untung_bersih:,.0f}")   # 91,750
    hasil:
      - ret: 2.0
        dd: 2.0
        win: 25
        note: "Kamu pikir untung 100.000. Bulan depan posisi 2x lipat tanpa hitung fee — satu loss menghapus semuanya."
      - ret: 4.2
        dd: 0.0
