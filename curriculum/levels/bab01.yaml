      Pola: naik X% lalu turun X% = selalu rugi `X²/100` persen. Di sini: 20×20/100 = 4%. Setelah untung besar, hati-hati. Persen turun yang sama menghapus lebih dari yang kamu kira. Trader pro mengunci sebagian profit justru saat untung besar.
