pelajaran:
  - id: "27-1"
    judul: "Gambar Data dengan Matplotlib"
    menit: 5
    materi: |
      **Matplotlib** = library (paket kode siap pakai) chart standar Python. Konsepnya sederhana: beri x dan y, minta digambar.

      ```python
      import matplotlib.pyplot as plt
      hari = [1, 2, 3, 4, 5]
      harga = [4000, 4100, 3900, 4200, 4050]
      plt.plot(hari, harga)          # garis
      plt.xlabel("Hari"); plt.ylabel("Harga")
      plt.title("TLKM 5 Hari")
      plt.savefig("chart.png")       # simpan
      ```

      Jenis chart dan kapan memakainya:
      - **Line plot** (`plt.plot`) → deret waktu: harga harian, kurva ekuitas.
      - **Histogram** (`plt.hist`) → distribusi: sebaran return harian (Bab 12 — bentuknya memberi tahu risiko).
      - **Bar chart** (`plt.bar`) → perbandingan antar kategori: return per saham.

      Di QuantLab: semua chart di **Backtest Lab** dibuat dengan konsep persis ini. Di Live Runner, output-nya teks (chart disimpan ke file di sandbox) — gunakan Lab untuk melihat chart penuh.
    kode: |
      import matplotlib.pyplot as plt
      plt.plot([1, 2, 3], [100, 110, 105])
      plt.savefig("/tmp/chart.png")
      print("Chart tersimpan")
    penjelasan: "plt.plot(x, y) + label + savefig = chart. Line untuk waktu, hist untuk distribusi, bar untuk perbandingan."
  - id: "27-2"
    judul: "Baca Chart, Jangan Tertipu"
    menit: 5
    materi: |
      Chart bisa jujur — dan bisa menipu. Waspadai trik umum:

      1. **Sumbu dipotong (truncated axis)**: chart mulai dari 3.900 padahal harga 3.900-4.100 — pergerakan kecil terlihat dramatis. Selalu cek angka di sumbu Y.
      2. **Skala berbeda**: dua saham di chart yang sama dengan skala Y berbeda = perbandingan bohong.
      3. **Memilih jendela**: "return +40% dalam 3 bulan" padahal 2 tahun sebelumnya -50%. Selalu minta periode penuh.
      4. **Rata-rata tanpa sebaran**: garis rata-rata mulus tanpa band volatilitas menyembunyikan risiko.

      Aturan membaca chart yang sehat: cek sumbu → cek periode → cek apa yang TIDAK ditampilkan. Chart yang jujur menampilkan drawdown, bukan cuma puncak.
    kode: |
      # Trik: sumbu Y dipotong bikin kenaikan 2% terlihat 20%
      import matplotlib.pyplot as plt
      plt.ylim(3900, 4100)   # sumbu mulai 3900 — drama!
      plt.plot([1, 2, 3], [4000, 4040, 4080])
    penjelasan: "Chart menipu lewat sumbu, skala, jendela waktu, dan yang disembunyikan. Baca angka, bukan hanya garis."
