  - id: "s27-7"
    judul: "Rata-rata Tanpa Sebaran"
    emoji: "🎢"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Iklan bot: "return rata-rata +1,2% per hari, kurva mulus naik!" Itu satu-satunya chart yang ditampilkan. Kamu minta data: return hariannya std 3,1% dan pernah -9% dalam sehari. Evaluasimu?
    pilihan:
      - "Bagus — rata-rata +1,2% dengan kurva mulus = strategi stabil"
      - "Menyesatkan: rata-rata tanpa SEBARAN. Realitanya hari bisa -9%. Minta histogram return dan kurva equity dengan drawdown"
      - "-9% sekali tidak masalah — rata-rata tetap positif"
      - "Std 3,1% itu kecil — aman"
    jawaban: 1
    penjelasan: |
      Rata-rata +1,2% hanya setengah cerita. Tanpa sebaran, hari -9% dan +11% bisa "rata-rata" +1%. Std 3,1% per hari itu BESAR: dalam sebulan (21 hari trading), swing wajar sekitar 3,1 x √21 = ±14%. Satu hari -9% menghapus 7-8 hari profit +1,2%. "Kurva mulus" bisa hasil smoothing atau sumbu yang dipotong — bukan bukti stabilitas. Yang jujur (bab 27-2): rata-rata SELALU disertai sebaran — histogram return (bentuknya: normal atau ekor?) dan equity penuh dengan drawdown-nya. "-9% sekali tidak masalah" = menormalisasi risiko ekor. "Std 3,1% kecil" = salah skala: itu per HARI, bukan per tahun.
