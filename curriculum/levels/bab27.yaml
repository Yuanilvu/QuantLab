      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Benar: total minus 30%. Jendela 3 bulan menyembunyikan kejatuhan setahun sebelumnya."
      - ret: 0.0
        dd: 0.0
        win: 15
        note: "Persen tidak bisa dijumlah begitu saja. +40% dari dasar yang sudah minus 50% bukan untung."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "Positif 3 bulan tidak membatalkan minus 50% sebelumnya. Minta periode penuh."
    petunjuk:
      - "+40% itu dihitung dari angka berapa: 500 atau 1.000?"
      - "Balik modal: dari 700 naik ke 1.000 = berapa persen?"
soal:
  - id: "p27-1"
    judul: "Persiapan Chart: Rentang"
    emoji: "📐"
    tingkat: mudah
    xp: 25
    menit: 6
    cerita: |
      Sebelum menggambar chart harga, kamu perlu tahu rentangnya. Baca N, lalu N baris harga. Cetak `min=X max=Y` (harga terendah dan tertinggi) — supaya sumbu Y bisa disetel jujur dari nol.
    input_spec: |
      Baris 1: N. N baris berikutnya: harga.
    output_spec: |
      Satu baris: `min=X max=Y`.
    contoh:
      - input: "3\n4000\n4100\n3900"
        output: "min=3900 max=4100"
      - input: "2\n100\n200"
        output: "min=100 max=200"
    tes:
      - input: "3\n4000\n4100\n3900"
        output: "min=3900 max=4100"
      - input: "2\n100\n200"
        output: "min=100 max=200"
      - input: "1\n777"
        output: "min=777 max=777"
      - input: "4\n50\n80\n20\n60"
        output: "min=20 max=80"
    solusi: |
      import numpy as np
      n = int(input())
      harga = np.array([int(input()) for _ in range(n)])
      print(f"min={int(harga.min())} max={int(harga.max())}")
    petunjuk:
      - "np.array + .min()/.max()."
      - "Format f-string: f\"min={...} max={...}\"."
  - id: "p27-2"
    judul: "Data Histogram Return"
    emoji: "📊"
    tingkat: sedang
    xp: 40
    menit: 8
    cerita: |
      Untuk histogram return (Bab 27-1), kamu perlu data: berapa hari return POSITIF dan berapa hari NEGATIF (abaikan yang 0). Baca N (≥2), lalu N baris harga. Hitung return harian, cetak `positif=X negatif=Y`.
    input_spec: |
      Baris 1: N. N baris berikutnya: harga.
    output_spec: |
      Satu baris: `positif=X negatif=Y`.
    contoh:
      - input: "4\n1000\n1100\n1050\n1200"
        output: "positif=2 negatif=1"
      - input: "3\n100\n100\n100"
        output: "positif=0 negatif=0"
    tes:
      - input: "4\n1000\n1100\n1050\n1200"
        output: "positif=2 negatif=1"
      - input: "3\n100\n100\n100"
        output: "positif=0 negatif=0"
      - input: "3\n100\n90\n80"
        output: "positif=0 negatif=2"
      - input: "5\n10\n20\n10\n30\n20"
        output: "positif=2 negatif=2"
    solusi: |
      import numpy as np
      n = int(input())
      harga = np.array([int(input()) for _ in range(n)])
      r = harga[1:] / harga[:-1] - 1
      print(f"positif={int((r > 0).sum())} negatif={int((r < 0).sum())}")
    petunjuk:
      - "Return: harga[1:] / harga[:-1] - 1."
      - "Hitung: (r > 0).sum() dan (r < 0).sum()."
  - id: "p27-3"
    judul: "Data Bar Chart Portofolio"
    emoji: "📊"
    tingkat: sulit
    xp: 55
    menit: 9
    cerita: |
      Untuk bar chart return per saham, siapkan datanya: baca N, lalu N baris `nama return` (return bisa negatif). Cetak tiap baris `nama:X` (X = return), diurutkan dari return TERTINGGI ke TERENDAH.
    input_spec: |
      Baris 1: N. N baris berikutnya: `nama return`.
    output_spec: |
      N baris: `nama:return`, urut return menurun.
    contoh:
      - input: "3\nTLKM 10\nBBRI 5\nCUAN -3"
        output: "TLKM:10\nBBRI:5\nCUAN:-3"
      - input: "2\nA -10\nB 20"
        output: "B:20\nA:-10"
    tes:
      - input: "3\nTLKM 10\nBBRI 5\nCUAN -3"
        output: "TLKM:10\nBBRI:5\nCUAN:-3"
      - input: "2\nA -10\nB 20"
        output: "B:20\nA:-10"
      - input: "4\nX 1\nY 5\nZ 3\nW -2"
        output: "Y:5\nZ:3\nX:1\nW:-2"
      - input: "1\nSOLO 0"
        output: "SOLO:0"
    solusi: |
      n = int(input())
      data = []
      for _ in range(n):
          p = input().split()
          data.append((p[0], int(p[1])))
      data.sort(key=lambda x: x[1], reverse=True)
      for nama, ret in data:
          print(f"{nama}:{ret}")
    petunjuk:
      - "Simpan pasangan (nama, return) di list."
      - "Urutkan menurun: sort(key=lambda x: x[1], reverse=True)."
