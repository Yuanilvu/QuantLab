      **Histogram** = jawaban untuk pertanyaan "bagaimana SEBARANNYA?" — sumbu X = nilai return, sumbu Y = berapa sering. Bentuknya langsung menunjukkan risiko: sempit = tenang, lebar = liar, ekor panjang = bahaya (Bab 12). Line plot bagus untuk deret waktu (harga), bar untuk perbandingan kategori, pie tidak cocok untuk distribusi.
