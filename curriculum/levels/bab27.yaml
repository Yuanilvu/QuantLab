  - id: "s27-10"
    judul: "Bruto vs Net: Return Bulanan"
    emoji: "🪜"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Bot: return bruto +5% per bulan, 12 bulan berturut-turut. Biaya: 1% ekuitas per bulan. Modal $1.000. Laporan bot menulis: "+79,6% setahun!" (dari 1,05 pangkat 12). Kamu mau angka yang jujur. Berapa?
    pilihan:
      - "+79,6% — biaya 1% kecil, abaikan saja"
      - "+60,1% — net 4% per bulan: 1,04 pangkat 12 = 1,601 → +60,1%"
      - "+48% — 4% x 12 bulan"
      - "+60% — 5% x 12 bulan (bruto, tanpa compounding)"
    jawaban: 1
    penjelasan: |
      Laporan bot menghitung 1,05¹² = 1,7959 → +79,6% — itu BRUTO, tanpa biaya. Padahal biaya 1% diambil dari ekuitas berjalan tiap bulan: return NET = 5% - 1% = 4% per bulan. 1,04¹² = 1,6010 → +60,1%. Modal $1.000 → $1.601. Beda 79,6 vs 60,1 = 19,5 poin — hampir sepertiga keuntungan klaim hilang karena biaya. +48% = 4 x 12 linear — lupa compounding bulanan (return ditumpuk ke modal yang tumbuh). +60% = 5 x 12 bruto linear — dua kesalahan sekaligus. Pelajaran: (1) potong biaya dari return SEBELUM compound; (2) compounding memakai angka net. Laporan jujur: net bulanan → 1,04¹². Kalau bot menulis 79,6%, tanyakan: biayanya di mana?
    kode: |
      modal = 1000
      for bulan in range(12):
          modal = modal * 1.04
      print(f"Modal akhir (net 4%/bulan): ${modal:.0f}")
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 15
        note: "79,6% bruto: biaya 1% x 12 bulan = 12% ekuitas mengalir keluar — tidak kecil."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Benar: net 4%/bulan → 1,04¹² = +60,1%. Modal jadi $1.601."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "48% = 4 x 12 linear — lupa compounding bulanan."
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "60% = bruto linear — dua kesalahan: biaya dan compounding."
    petunjuk:
      - "Net per bulan = 5% - 1% = 4%."
      - "Hitung 1,04 pangkat 12 — bukan 4 x 12."
      - "Bandingkan: 1,05¹² vs 1,04¹²."
