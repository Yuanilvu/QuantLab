  - id: "s27-5"
    judul: "Jendela yang Menipu"
    emoji: "🗓️"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Iklan sebuah bot: "Strategi kami +40% dalam 3 bulan terakhir!" Kamu minta data penuh. Ternyata: awal 2024 modal $1.000 turun ke $500 di akhir 2024 (minus 50%). Lalu Januari-Maret 2025 naik dari $500 ke $700 (+40%). Kesimpulan yang benar?
    pilihan:
      - "Botnya bagus: +40% dalam 3 bulan itu nyata"
      - "Menipu: jendela 3 bulan mulai dari titik terendah. Dari modal awal: $1.000 ke $700 = minus 30%. Butuh +43% lagi cuma untuk balik modal"
      - "+40% lebih besar dari minus 50%, jadi tetap untung"
      - "Tidak masalah: yang penting 3 bulan terakhir positif"
    jawaban: 1
    penjelasan: |
      Ini trik jendela waktu (Bab 27-2): tampilkan periode yang membuat angka terlihat bagus. +40% dihitung dari $500, dasar setelah minus 50%. Bukan dari modal awalmu. Hitung dari awal: $1.000 ke $700 = minus 30%. Balik modal butuh naik dari 700 ke 1.000 = +42,9%. Belum tercapai. "3 bulan terakhir positif" memang benar, tapi tidak menceritakan posisimu. Trader yang sehat selalu minta: periode penuh, modal awal, dan drawdown terbesar. Kalau bot hanya berani menunjukkan jendela terbaiknya, tanyakan apa yang terjadi di luar jendela itu.
    kode: |
