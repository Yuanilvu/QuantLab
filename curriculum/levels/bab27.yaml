      import numpy as np
      import matplotlib.pyplot as plt
      ret = np.array([1.2, -0.5, 3.1, -2.0, 1.5, -9.0, 2.2, 0.8])
      plt.hist(ret, bins=5)
      plt.title("Sebaran return harian — minta chart ini, bukan cuma rata-rata")
      plt.savefig("/tmp/sebaran.png")
      print("Histogram tersimpan")
