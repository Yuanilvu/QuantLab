      - "Bins=250 sudah benar — memang harus satu batang per nilai"
    jawaban: 0
    penjelasan: |
      Bin = keranjang pengelompokan. 250 hari dengan 250 bin → tiap bin cuma berisi sekitar 1 observasi: histogram jadi deretan batang tinggi 1 — itu noise, bukan bentuk. Aturan praktis: untuk ratusan data, bins 10-30; tiap bin idealnya berisi belasan observasi. 250 hari ÷ 15 bin ≈ 17 hari per batang → bentuk distribusi mulai terlihat (normal? ekor kiri? dua puncak?). Menambah data sampai 2.000 tetap tidak membuat bins=250 tepat (8 per bin, masih kasar) dan data tambahan tidak selalu ada. plot = deret waktu, bukan distribusi. Tujuan histogram = bentuk sebaran untuk menilai risiko (bab 27-1). Bin salah bukan bohong — tapi gagal bercerita.
    kode: |
      import numpy as np
      import matplotlib.pyplot as plt
      ret = np.array([0.5, -0.8, 1.2, -0.3, 0.9, -1.5, 2.0, 0.3])
      plt.hist(ret, bins=4)
      plt.title("Return harian — bins wajar")
      plt.savefig("/tmp/hist_wajar.png")
      print("Histogram tersimpan")
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Benar: bins 10-20 untuk 250 hari — bentuk distribusi kelihatan."
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "2.000 hari ÷ 250 bin = 8 per bin — masih kasar, dan data tidak selalu bisa ditambah."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "Line plot untuk deret waktu; distribusi = histogram."
      - ret: 0.0
        dd: 0.0
        win: 15
        note: "Satu batang per nilai = noise, bukan bentuk distribusi."
    petunjuk:
      - "Bin = keranjang. 250 hari ÷ 250 bin = berapa isi tiap keranjang?"
      - "Bentuk muncul kalau tiap bin berisi belasan data."
      - "Coba bins=15."
