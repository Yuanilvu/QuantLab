  - id: "s3-10"
    judul: "EV per Trade vs EV per Bulan"
    emoji: "🚀"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Tiga bot siap dipasang. EV sudah bersih biaya:
      Bot A: EV +0,3% per trade, rata-rata 40 trade per bulan.
      Bot B: EV +0,9% per trade, 12 trade per bulan.
      Bot C: EV +0,5% per trade, 25 trade per bulan.
      Bot mana yang memberi ekspektasi profit bulanan terbesar?
    pilihan:
      - "Bot A — 12% per bulan"
      - "Bot B — EV per trade tertinggi"
      - "Bot C — 12,5% per bulan, lebih besar dari A dan B"
      - "Tidak bisa dibandingkan — EV per trade-nya beda-beda"
    jawaban: 2
    penjelasan: |
      EV bulanan = EV per trade × jumlah trade.
      Bot A: 0,3 × 40 = 12%. Bot B: 0,9 × 12 = 10,8%. Bot C: 0,5 × 25 = **12,5%**.
      Pemenang: Bot C — tipis di atas A, jelas di atas B.
      Jebakan: Bot B punya EV per trade tertinggi (0,9%), tapi cuma 12 kali sebulan.
      EV per trade tinggi tanpa frekuensi = profit kecil.
      Bot A frekuensi tinggi dengan edge tipis — rawan tergerus kalau fee naik sedikit saja.
      Evaluasi bot = EV per trade × frekuensi − biaya. Bukan salah satunya.
    kode: |
      ev_bulanan_a = 0.3 * 40
      ev_bulanan_b = 0.9 * 12
      ev_bulanan_c = 0.5 * 25
      print(f"A = {ev_bulanan_a:+.1f}% | B = {ev_bulanan_b:+.1f}% | C = {ev_bulanan_c:+.1f}%")
    hasil:
      - ret: 12.0
        dd: 5.0
        win: 55
        note: "Bot A: 12%. Bagus, tapi kamu tinggalkan 0,5% — edge tipis A sensitif terhadap fee."
      - ret: 10.8
        dd: 8.0
        win: 40
        note: "Bot B: EV per trade tertinggi tapi jarang trade → 10,8%, paling kecil."
      - ret: 12.5
        dd: 4.0
        win: 62
        note: "Benar: C = 12,5%. Kombinasi edge wajar dan frekuensi memadai."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "Tidak pasang: ketiganya EV positif. Dana menganggur = EV nol."
    petunjuk:
      - "EV bulanan = EV per trade × jumlah trade."
      - "Hitung ketiganya, jangan cuma melihat EV per trade."
