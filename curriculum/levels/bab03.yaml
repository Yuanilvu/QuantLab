# ============================================================
# BAB 3 — PROBABILITAS & NILAI HARAPAN (TRACK: FONDASI MATEMATIKA)
# Peluang, EV, dan kenapa kasino selalu menang.
# ============================================================
bab: 3
track: math
judul: "Probabilitas & Nilai Harapan"
emoji: "🎲"
deskripsi: "Trading itu dunia peluang. Tidak ada yang pasti. Nilai harapan (EV) = kompasmu di tengah ketidakpastian."
pelajaran:
  - id: "3-1"
    judul: "Peluang: Bagian dari Kemungkinan"
    menit: 5
    materi: |
      **Peluang** = seberapa mungkin sesuatu terjadi. Ditulis 0 sampai 1, atau 0% sampai 100%.

      - Koin: peluang kepala = 1/2 = 0,5 = 50%.
      - Dadu: peluang angka 6 = 1/6 ≈ 0,167 ≈ 16,7%.
      - Harga naik besok: tidak ada yang tahu persis. Makanya kita pakai peluang.

      Aturan penting: **peluang tidak menjamin hasil jangka pendek.** Koin 50% bisa keluar kepala 5x berturut. Itu bukan bukti koin rusak. Cuma kebetulan. Makin banyak lemparan, makin mendekati 50%.

      Di trading: strategi win rate (persentase menang) 60% bisa kalah 5x beruntun. Tidak paham peluang? 5 loss beruntun bikin panik. Kamu bisa membuang strategi yang sebenarnya bagus. Paham peluang = tetap tenang saat sedang kurang beruntung.
    kode: |
      # Peluang menang 60% = 0.6
      win_rate = 0.6
      # 5 loss beruntun? Peluangnya kecil TAPI mungkin:
      peluang_5_loss = (1 - win_rate) ** 5
      print(f"Peluang 5 loss beruntun = {peluang_5_loss * 100:.1f}%")
    penjelasan: "Peluang 60% bukan jaminan — tapi dalam ratusan trade, pola 60% akan terlihat. Sabar adalah bagian dari statistik."
  - id: "3-2"
    judul: "Nilai Harapan: Rata-rata Semua Kemungkinan"
    menit: 5
    materi: |
      **Nilai Harapan (Expected Value / EV)** = rata-rata hasil kalau kejadian diulang berkali-kali.

      Rumus: `EV = (peluang menang × hadiah) − (peluang kalah × kerugian)`

      Contoh koin: kepala dapat 100 ribu, ekor bayar 50 ribu. EV = (0,5 × 100.000) − (0,5 × 50.000) = 50.000 − 25.000 = **+25.000**. Main terus, rata-rata untung 25 ribu per lemparan. Taruhan BAGUS.

      Contoh kasino: roulette, taruhan merah. 18 angka merah, 18 hitam, 1 hijau (nol). Peluang menang = 18/37 = 48,6%. EV = (0,486 × 1) − (0,514 × 1) = **−0,027**. Setiap 100 ribu dipasang, kasino rata-rata kantongi 2.700. Kasino selalu menang jangka panjang. Bukan sihir. Cuma EV negatif untukmu.

      **Golden rule trading: hanya ambil trade dengan EV positif.** Hitung dulu: peluang menang, reward kalau menang, loss kalau kalah. EV negatif? Lewati. Sekalipun "rasanya" pasti untung.
    kode: |
      peluang_menang = 0.6    # 60% menang
      reward = 5              # hadiah +5R kalau menang
      kerugian = 5            # kerugian -5R kalau kalah
      nilai_harapan = peluang_menang * reward - (1 - peluang_menang) * kerugian
      print(f"Nilai harapan (EV) = {nilai_harapan:+.2f}R per trade")
    penjelasan: "EV positif = layak diulang. EV negatif = judi, berapa pun 'perasaannya'. Hitung dulu, baru eksekusi."
skenario:
  - id: "s3-1"
    judul: "Lempar Koin yang Menguntungkan"
    emoji: "🪙"
    sulit: "mudah"
    xp: 20
    menit: 3
    cerita: |
      Tawaran: lempar koin. Kepala → kamu dapat Rp100.000. Ekor → kamu bayar Rp50.000. Kamu boleh main 10 kali. Main atau tidak?
    pilihan:
      - "Tidak — judi itu jelek"
      - "Main — EV = (0,5×100rb) − (0,5×50rb) = +25rb per lemparan"
      - "Main sekali saja — kalau kalah berhenti"
      - "Tidak — 50% peluang rugi terlalu besar"
    jawaban: 1
    penjelasan: |
      EV = 0,5 × 100.000 − 0,5 × 50.000 = **+25.000 per lemparan**. Dalam 10 lemparan, ekspektasi untung = 250.000. Bisa lebih atau kurang. Rata-ratanya tetap positif.

      Ini analogi trade bagus: win rate 50%, reward 2x risk (RR 2:1), EV tetap positif. "Judi itu jelek" salah besar kalau EV positif. Trader pro cari EV+. Penjudi cari sensasi.
    kode: |
      nilai_harapan = 0.5 * 100000 - 0.5 * 50000
      print(f"Nilai harapan (EV) = {nilai_harapan:+,} per lemparan")   # +25,000.0
    hasil:
      - ret: 12.5
        dd: 3.0
        win: 70
        note: "Main 10x: kamu kebagian 7 kepala — untung 450rb. EV positif bekerja (kali ini berpihak)."
      - ret: 25.0
        dd: 5.0
        win: 55
        note: "Dalam 20 lemparan kamu untung rata-rata 500rb. Naik turun wajar, trennya naik — itulah EV."
      - ret: -2.5
        dd: 2.5
        win: 40
        note: "Main sekali: kalah 50rb dan berhenti. EV positif tapi kamu menyerah sebelum rata-rata bekerja — salah strategi."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "50% peluang rugi memang ada — tapi reward 2x lipat membuat EV positif. Takut 50% tanpa hitung EV = melewatkan peluang bagus."
    petunjuk:
      - "Hitung: peluang menang × hadiah, dikurangi peluang kalah × kerugian."
      - "EV positif = layak diulang berkali-kali."
  - id: "s3-2"
    judul: "Tiket Lotere"
    emoji: "🎟️"
    sulit: "sedang"
    xp: 35
    menit: 4
    cerita: |
      Lotere: tiket Rp10.000, hadiah utama Rp1.000.000, peluang menang 1 dari 1.000. Temanmu beli 10 tiket: "peluangku jadi 10x lipat!". Evaluasimu?
    pilihan:
      - "Benar — 10 tiket = peluang 10x, makin banyak makin baik"
      - "EV per tiket = 0,001×1jt − 10rb = −Rp9.000. 10 tiket tetap EV negatif — jangan ikut"
      - "Beli 100 tiket — pasti menang"
      - "Ikut 1 tiket saja, buat seru-seruan"
    jawaban: 1
    penjelasan: |
      EV per tiket = (1/1000 × 1.000.000) − 10.000 = 1.000 − 10.000 = **−9.000**. Tiap tiket rata-rata membuang 9 ribu. 10 tiket = ekspektasi rugi 90 ribu. Peluang menang naik ke 1%, tapi tetap 99% kalah. "Makin banyak tiket" cuma memperbesar kerugian rata-rata.

      Jebakan klasik: orang fokus ke hadiah besar, lupa peluangnya. Di trading: jangan masuk trade cuma karena "kalau menang, besar banget". Hitung EV-nya dulu.
    kode: |
      nilai_harapan = (1/1000) * 1_000_000 - 10_000
      print(f"Nilai harapan (EV) per tiket = {nilai_harapan:+,}")   # -9,000.0
    hasil:
      - ret: -9.0
        dd: 0.0
        win: 20
        note: "Kamu beli 10 tiket: tidak menang, rugi 100rb. '10x peluang' tetap 99% kalah."
      - ret: 0.0
        dd: 0.0
        win: 78
        note: "Benar: EV tiap tiket −9rb. Tidak ikut = modal utuh, return 0% — hemat 90rb dibanding ikut 10 tiket."
      - ret: -90.0
        dd: 0.0
        win: 10
        note: "100 tiket = 100rb melayang. Peluang 10% menang 1jt tetap EV −900rb. Bukan 'pasti menang'."
      - ret: -0.9
        dd: 0.0
        win: 35
        note: "1 tiket 'buat seru' = buang 9rb rata-rata. Sadar EV itu bagus, tapi 'seru-seruan' tetap membuang uang."
    petunjuk:
      - "EV = (peluang × hadiah) − harga tiket."
      - "Berapa EV 10 tiket? Lebih besar atau lebih kecil ruginya?"
  - id: "s3-3"
    judul: "Dua Loss Beruntun"
    emoji: "😤"
    sulit: "sulit"
    xp: 50
    menit: 5
    cerita: |
      Strategimu: 60% menang +5%, 40% kalah −5%. EV = +1% per trade. Hari ini kalah 2x berturut (−10% total). Sinyal ke-3 yang sama valid muncul. Temanmu bilang: "udah 2 kali kalah, jangan main lagi — lagi sial". Keputusanmu?
    pilihan:
      - "Berhenti — 2 loss berarti sedang sial"
      - "Main tapi ukuran 2x — biar cepat balik"
      - "Main ukuran normal — 2 loss beruntun itu wajar (peluang 16%), EV tetap positif"
      - "Ganti strategi — sudah terbukti gagal"
    jawaban: 2
    penjelasan: |
      Peluang 2 loss beruntun = 0,4 × 0,4 = **16%**. Itu wajar. Bukan "sial", bukan bukti strategi rusak. EV strategi tidak berubah: tetap +1% per trade. Keputusan benar: eksekusi sinyal ke-3 dengan ukuran NORMAL.

      Berhenti = menyerah pada kebetulan jangka pendek. Ukuran 2x = menggandakan risiko saat emosi. Itu revenge trading (balas dendam pasar, Bab 15). Ganti strategi = terlalu bereaksi pada noise. Disiplin pada EV = sabar sampai statistik bekerja.
    kode: |
      peluang_2_loss = 0.4 ** 2
      print(f"Peluang 2 loss beruntun = {peluang_2_loss * 100:.0f}%")   # 16%
      # wajar — tetap eksekusi sinyal ke-3 dengan ukuran normal
    hasil:
      - ret: -10.0
        dd: 10.0
        win: 25
        note: "Berhenti setelah 2 loss: padahal sinyal ke-3 ternyata MENANG +5%. Hari ditutup −10%, kamu kehilangan peluang balik modal."
      - ret: -20.0
        dd: 20.0
        win: 20
        note: "Ukuran 2x di sinyal ke-3 yang ternyata loss: −10% lalu −10% lagi = −20%. Revenge trading menghancurkan."
      - ret: -5.0
        dd: 10.0
        win: 75
        note: "Sinyal ke-3 menang +5%: total hari −5% (sempat −10%). Kamu patuh EV — benar, sabar sampai statistik bekerja."
      - ret: -18.0
        dd: 18.0
        win: 15
        note: "Ganti strategi setelah 2 loss: strategi baru belum teruji, kalah lagi. Kamu buang edge karena noise."
    petunjuk:
      - "Hitung peluang 2 loss beruntun (0,4 × 0,4)."
      - "Apakah 2 loss mengubah EV strategi?"

  - id: "s3-4"
    judul: "Pilih Bot: EV Dulu"
    emoji: "🧭"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Dua bot minta dipasang di akunmu.
      Bot X: menang 80% trade. Untung +2%, kalah −4%.
      Bot Y: menang 40% trade. Untung +12%, kalah −4%.
      Danamu cukup untuk satu bot.
      Bot mana yang nilai harapannya (EV) lebih besar?
    pilihan:
      - "Bot X — menang 8 dari 10, pasti lebih baik"
      - "Bot Y — EV X = 0,8% per trade. EV Y = 2,4% per trade"
      - "Bot X — kerugiannya sama-sama −4%, X lebih sering menang"
      - "Sama saja — menang dan kalah saling menghapus"
    jawaban: 1
    penjelasan: |
      EV X = 0,8 × 2 − 0,2 × 4 = 1,6 − 0,8 = **+0,8% per trade**.
      EV Y = 0,4 × 12 − 0,6 × 4 = 4,8 − 2,4 = **+2,4% per trade**.
      Bot Y 3x lebih baik, walau cuma menang 40%.

      Win rate tinggi tidak selalu menang. Hitung EV dulu.
      Dalam 10 trade: ekspektasi Y = +24%. X cuma +8%.
      Bot Y kalah lebih sering. Siapkan mentalmu — lihat pelajaran 3-1.
    kode: |
      ev_bot_x = 0.8 * 2 - 0.2 * 4
      ev_bot_y = 0.4 * 12 - 0.6 * 4
      print(f"EV Bot X = {ev_bot_x:+.1f}% per trade")   # +0.8%
      print(f"EV Bot Y = {ev_bot_y:+.1f}% per trade")   # +2.4%
      # Y 3x lebih besar → pasang Bot Y
    hasil:
      - ret: 8.0
        dd: 2.0
        win: 80
        note: "Bot X jalan: untung 8% dalam 10 trade. Aman, tapi kamu meninggalkan EV 3x lebih besar."
      - ret: 24.0
        dd: 8.0
        win: 40
        note: "Bot Y jalan: +24% dalam 10 trade. Kalah 6 kali, reward besar menutup semuanya."
      - ret: 8.0
        dd: 3.0
        win: 78
        note: "Tetap Bot X: hasil 8%. Alasanmu keliru — reward Y 6x lipat dari X."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Tidak memasang bot. Dana menganggur — melewatkan EV positif juga biaya."
    petunjuk:
      - "EV = (peluang menang × hadiah) − (peluang kalah × kerugian)."
      - "Hitung EV kedua bot, baru bandingkan."

  - id: "s3-5"
    judul: "EV Kalah oleh Biaya"
    emoji: "💸"
    sulit: "sulit"
    xp: 50
    menit: 6
    cerita: |
      Bot sinyal kripto: 60% menang, 40% kalah.
      Menang +2%, kalah −1,5%.
      EV kotor +0,6% per trade.
      Tiap trade kena biaya 0,75%.
      Pasang bot ini?
    pilihan:
      - "Pasang — EV positif berarti layak"
      - "Jangan — EV kotor 0,6% lebih kecil dari biaya 0,75%. Bersih −0,15%"
      - "Pasang — untung 2% jauh lebih besar dari biaya"
      - "Pasang setengah dana — biar aman sambil coba"
    jawaban: 1
    penjelasan: |
      EV kotor = 0,6 × 2 − 0,4 × 1,5 = 1,2 − 0,6 = **+0,6%**.
      Biaya 0,75% dipotong dari tiap trade.
      EV bersih = 0,6 − 0,75 = **−0,15% per trade**.
      Rata-rata tiap trade rugi 0,15%. EV bersih negatif.
      Bot "menang" di kertas bisa kalah asli karena biaya.
      Biaya adalah bagian dari EV. Hitung selalu setelah biaya.
      Solusi: cari biaya lebih murah, atau perbaiki strategi dulu.
    kode: |
      ev_kotor = 0.6 * 2 - 0.4 * 1.5
      biaya = 0.75
      ev_bersih = ev_kotor - biaya
      print(f"EV kotor = {ev_kotor:+.2f}% per trade")     # +0.60%
      print(f"EV bersih = {ev_bersih:+.2f}% per trade")   # -0.15%
    hasil:
      - ret: -3.0
        dd: 3.0
        win: 25
        note: "Bot jalan 20 trade. Untung kecil tergerus biaya, total rugi. EV negatif bekerja pelan-pelan."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Tidak pasang. Danamu utuh. EV bersih negatif = kalah pelan."
      - ret: -6.0
        dd: 6.0
        win: 20
        note: "Kamu anggap untung 2% bersih. Padahal biaya 0,75% tiap trade — modal tergerus cepat."
      - ret: -1.5
        dd: 1.5
        win: 30
        note: "Setengah dana tetap rugi 0,15% per trade. Mengecilkan ukuran tidak memperbaiki EV negatif."
    petunjuk:
      - "Hitung EV kotor dulu. Lalu kurangi biaya 0,75%."
      - "EV bersih negatif atau positif?"

  - id: "s3-6"
    judul: "EV Satu Trade"
    emoji: "🃏"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Bot scalper: 70% trade menang +3%, 30% kalah −3% (reward sama dengan risk).
      Berapa nilai harapan (EV) bot ini per trade dalam persen?
    pilihan:
      - "+1,2%"
      - "+2,1%"
      - "+3,0%"
      - "0%"
    jawaban: 0
    penjelasan: |
      EV = (peluang menang × reward) − (peluang kalah × kerugian)
      = 0,70 × 3 − 0,30 × 3 = 2,1 − 0,9 = **+1,2% per trade**.
      Opsi 2,1% = cuma menghitung 0,70 × 3, lupa sisi kalah.
      Opsi 3,0% = menganggap selalu menang. Opsi 0% = menganggap peluang 50:50.
      EV +1,2% artinya: dalam banyak trade, rata-rata untung 1,2% per trade.
      Satu-dua trade bisa kalah. EV baru terlihat setelah puluhan trade.
    kode: |
      peluang_menang = 0.7
      reward = 3
      kerugian = 3
      ev = peluang_menang * reward - (1 - peluang_menang) * kerugian
      print(f"EV = {ev:+.1f}% per trade")   # +1.2
    hasil:
      - ret: 1.2
        dd: 0.0
        win: 80
        note: "Benar: EV +1,2%/trade. Dalam 20 trade ekspektasi +24%, minus drawdown wajar."
      - ret: 0.5
        dd: 0.0
        win: 35
        note: "Kamu pikir EV 2,1%, target evaluasi terlalu tinggi. Bot kena 3 loss beruntun, kamu matikan."
      - ret: -0.5
        dd: 0.0
        win: 25
        note: "Kamu pikir selalu menang 3%. Loss pertama datang, kamu panik dan matikan bot."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Kamu pikir EV 0, bot tidak dipasang. Padahal +1,2% per trade adalah edge yang layak."
    petunjuk:
      - "EV = (0,7 × 3) − (0,3 × 3)."
      - "Hitung dua sisi dulu: menang dan kalah."

  - id: "s3-7"
    judul: "Sepuluh Trade, Pasti Menang?"
    emoji: "🎰"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Strategimu win rate 50% (seperti koin). Kamu akan main 10 trade.
      Berapa peluang paling tidak ada 1 trade yang menang?
    pilihan:
      - "50%"
      - "99,9%"
      - "100%"
      - "10%"
    jawaban: 1
    penjelasan: |
      Hitung kebalikannya dulu: peluang SEMUA 10 trade kalah = 0,5 × 0,5 × ... sepuluh kali
      = 0,5¹⁰ = 0,00098 = 0,098% (sekitar 0,1%).
      Peluang paling tidak 1 menang = 100% − 0,098% = **99,9%**.
      Opsi 50% = peluang per trade, bukan untuk 10 trade.
      Opsi 100% = salah: masih ada 0,1% kemungkinan 10 loss semua.
      Opsi 10% = mengalikan tanpa dasar.
      Kalau kejadian yang ditanya 'paling tidak satu', lebih gampang hitung 'nol sama sekali' dulu.
    kode: |
      peluang_semua_kalah = 0.5 ** 10
      peluang_min_1_menang = (1 - peluang_semua_kalah) * 100
      print(f"Peluang >=1 menang = {peluang_min_1_menang:.1f}%")   # 99.9
    hasil:
      - ret: -3.0
        dd: 3.0
        win: 30
        note: "Kamu pikir tiap trade cuma 50%, ragu terus. Berhenti setelah 3 loss — padahal itu wajar."
      - ret: 6.0
        dd: 4.0
        win: 75
        note: "Benar: 99,9% paling tidak 1 menang. Main 10 trade disiplin, total +6%."
      - ret: -2.0
        dd: 2.0
        win: 25
        note: "'Pasti menang' → semua dana di trade pertama. Kalah, modal langsung jebol."
      - ret: 1.0
        dd: 5.0
        win: 35
        note: "Kamu pikir cuma 10%, main asal-asalan dengan ukuran tidak konsisten. Hasil tipis."
    petunjuk:
      - "Lebih mudah hitung peluang KEBALIKANNYA: semua 10 kalah."
      - "0,5 pangkat 10 = ?"
      - "Kurangi dari 100%."

  - id: "s3-8"
    judul: "Ambil Profit Cepat atau Tahan?"
    emoji: "🧮"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Sinyal bagus muncul. Dua gaya eksekusi:
      Gaya A: target +2%, win rate 65%, stop loss −2%.
      Gaya B: target +5%, win rate 35%, stop loss −2%.
      Kamu pilih gaya mana?
    pilihan:
      - "Gaya B — sekali menang +5% sudah menutup dua kali kalah −2%"
      - "Gaya A — EV +0,6% per trade, lebih tinggi dari B yang +0,45%"
      - "Gaya B — win rate 35% dengan reward 5% itu pola trader pro"
      - "Sama saja — dua-duanya EV positif"
    jawaban: 1
    penjelasan: |
      EV A = 0,65 × 2 − 0,35 × 2 = 1,3 − 0,7 = **+0,6% per trade**.
      EV B = 0,35 × 5 − 0,65 × 2 = 1,75 − 1,3 = **+0,45% per trade**.
      A unggul 0,15% per trade. Dalam 100 trade bedanya 15%.
      Argumen 'sekali menang nutup 2 loss' lupa bahwa B cuma menang 35%.
      Dalam 100 trade: B = 35 × (+5%) − 65 × (−2%) = +45%. A = 65 × (+2%) − 35 × (−2%) = +60%.
      Reward besar itu menggoda. Frekuensi menang ikut menentukan. Hitung EV, bukan imajinasi.
    kode: |
      ev_a = 0.65 * 2 - 0.35 * 2
      ev_b = 0.35 * 5 - 0.65 * 2
      print(f"EV A = {ev_a:+.2f}% | EV B = {ev_b:+.2f}%")   # +0.60 | +0.45
    hasil:
      - ret: 4.5
        dd: 8.0
        win: 40
        note: "Gaya B: 10 trade realisasi +4,5% dengan drawdown 8%. Deg-degan tiap loss beruntun."
      - ret: 6.0
        dd: 3.0
        win: 65
        note: "Benar: EV A lebih tinggi. 10 trade = +6% dengan DD 3%."
      - ret: 4.5
        dd: 8.0
        win: 35
        note: "Tetap B: hasil 4,5% lebih kecil dari 6%. 'Pola pro' tanpa hitung EV tetap kalah."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "Tidak eksekusi: dana menganggur. EV positif yang dilewatkan juga biaya."
    petunjuk:
      - "EV = (peluang menang × reward) − (peluang kalah × loss)."
      - "Hitung EV dua gaya dulu, baru bandingkan."

  - id: "s3-9"
    judul: "Empat Loss Beruntun"
    emoji: "🧯"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Botmu: win rate 60%, menang +5%, kalah −5%. Hari ini kena 4 loss beruntun.
      Peluang 4 loss beruntun berapa persen? Kalau terjadi, modal 10 juta jadi berapa?
