    judul: "Bid Harus Naik Berapa?"
    emoji: "🎯"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Saham sepi: bid 3.990, ask 4.000. Kamu beli 1 lot di ask (4.000).
      Fee beli 0,15%, fee jual 0,25% dari nilai transaksi.
      Berapa poin minimal bid harus naik dari 3.990 supaya setelah semua fee kamu impas?
    pilihan:
      - "10 poin"
      - "16 poin"
      - "26 poin"
      - "36 poin"
    jawaban: 2
    penjelasan: |
      Modal keluar: 4.000 × 100 = 400.000 + fee beli 0,15% (600) = 400.600.
      Jual di bid baru b: masuk b × 100, dipotong fee jual 0,25% → b × 100 × 0,9975 = b × 99,75.
      Impas: b × 99,75 = 400.600 → b = 4.016,04. Bid harus naik dari 3.990 ke 4.016 = **26 poin**.
      Rinciannya: 10 poin spread (beli di ask 4.000, jual di bid awal 3.990)
      + 16 poin fee (0,4% × 4.000).
      Opsi 10 = lupa fee. Opsi 16 = lupa spread: begitu kamu beli, jual cepatmu cuma 3.990.
      Opsi 36 = spread dihitung dua kali — spread cuma sekali: beli di ask, jual di bid.
    kode: |
      harga_ask = 4000
      harga_bid = 3990
      biaya_keluar = harga_ask * 100 * 1.0015
      harga_jual_min = biaya_keluar / (100 * 0.9975)
      naik_minimal = harga_jual_min - harga_bid
      print(f"Bid minimal = {harga_jual_min:.0f}")         # 4016
      print(f"Bid harus naik sekitar {naik_minimal:.0f} poin")   # 26
    hasil:
      - ret: -0.4
        dd: 0.0
        win: 20
        note: "Target 10 poin (bid 4.000): fee makan semuanya — rugi 0,4%."
      - ret: -0.25
        dd: 0.0
        win: 30
        note: "Target 16 poin (bid 4.006): lupa spread awal 10 poin — masih rugi 0,25%."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Benar: tunggu bid 4.016. Tercapai saat puncak 4.018 — impas, modal utuh."
      - ret: -0.15
        dd: 0.0
        win: 25
        note: "Target 36 poin tak tercapai (puncak 4.018). Jual saat bid balik ke 4.010 — rugi 0,15%."
    petunjuk:
      - "Modal keluar = ask × 100 × 1,0015."
      - "Uang masuk = bid × 100 × 0,9975."
      - "Bid minimal = modal keluar ÷ 99,75. Bandingkan dengan 3.990."
