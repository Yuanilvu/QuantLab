      perubahan_tlkm = 0.8
      print(f"Konteks: IHSG {perubahan_ihsg:+.1f}%, TLKM {perubahan_tlkm:+.1f}%, volume TLKM naik")
      print("→ Cek alasan spesifik TLKM, jangan panik")
