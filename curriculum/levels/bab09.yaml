# ============================================================
# BAB 9 — PASAR MODAL & SAHAM (TRACK: FINANCE DASAR)
# Saham, IHSG, lot, bid-ask spread, jam bursa.
# ============================================================
bab: 9
track: finance
judul: "Pasar Modal & Saham"
emoji: "🏦"
deskripsi: "Apa itu saham, gimana belinya, kenapa harga beli-jual bisa beda. Bekal wajib sebelum menyentuh pasar."
pelajaran:
  - id: "9-1"
    judul: "Saham Itu Apa?"
    menit: 5
    materi: |
      **Saham** = bukti kepemilikan sebagian kecil sebuah perusahaan. Beli saham TLKM = ikut memiliki (sedikit) Telkom. Perusahaan untung? Nilai saham bisa naik, kadang bagi dividen (bagian laba). Perusahaan rugi? Bisa turun.

      **IHSG** = Indeks Harga Saham Gabungan. Rata-rata harga banyak saham besar di Bursa Efek Indonesia. IHSG naik = mayoritas pasar bagus. IHSG turun = sebaliknya. Saham di daftar pantauanmu (ALII, BRPT, TPIA, CUAN, MPPA, TLKM) bisa beda arah dari IHSG.

      Beli saham lewat **broker** (aplikasi seperti Ajaib, Stockbit, Bibit). Satuannya **lot** = 100 lembar. Beli 1 lot TLKM di 4.000 = 100 × 4.000 = Rp400.000 (plus fee).

      Harga bergerak karena **permintaan & penawaran**. Banyak yang mau beli → naik. Banyak yang mau jual → turun. Berita, laba, dan sentimen pasar masuk lewat mekanisme ini.
    kode: |
      lot = 100
      harga = 4000
      print(f"1 lot = {lot * harga:,} rupiah")   # 400,000
    penjelasan: "Saham = kepemilikan. 1 lot = 100 lembar. Harga = hasil permintaan & penawaran."
  - id: "9-2"
    judul: "Beli & Jual: Bid, Ask, Spread"
    menit: 5
    materi: |
      Saat buka aplikasi broker, ada DUA harga untuk satu saham:
      - **Bid** = harga tertinggi yang ditawarkan PEMBELI. Ini harga jual cepatmu.
      - **Ask** = harga terendah yang diminta PENJUAL. Ini harga beli cepatmu.
      - **Spread** = selisih keduanya.

      Contoh TLKM: bid 3.995, ask 4.005. Mau beli sekarang? Bayar 4.005 (ask). Mau jual? Dapat 3.995 (bid). Selisih 10 poin = "biaya masuk". Begitu masuk posisi, kamu langsung rugi 0,25%.

      Kenapa penting? Saham likuid (banyak diperjualbelikan, contoh TLKM, BBRI) spread-nya tipis. Saham sepi spread-nya bisa 1-2%. Itu biaya tersembunyi pemakan profit. Di kripto sama: beli di ask, jual di bid.

      Jam bursa IDX: Senin-Jumat 09:00-15:30 WIB. Istirahat 12:00-13:30. Di luar jam itu, pesanan masuk tapi tidak langsung dieksekusi.
    kode: |
      bid = 3995
      ask = 4005
      spread = ask - bid
      print(f"Spread = {spread} poin ({spread / ask * 100:.2f}%)")
    penjelasan: "Bid = harga pembeli, ask = harga penjual. Spread = biaya masuk yang langsung terasa."
