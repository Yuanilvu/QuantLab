        dd: 0.0
        win: 78
        note: "Benar: TLKM 0,2% per eksekusi. Biaya tersembunyi paling kecil."
      - ret: 2.0
        dd: 0.0
        win: 30
        note: "BBRI di harga 4.000: 20 poin = 0,5%, dua setengah kali lebih mahal dari TLKM."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "Bisa dibandingkan — ubah dulu ke persen dari harga. Itu bahasa yang adil."
    petunjuk:
