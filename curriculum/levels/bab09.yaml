  - id: "s9-9"
    judul: "Limit Order Kena Gap"
    emoji: "⛔"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Jumat sore kamu pasang beli 2 lot TLKM, limit 4.000.
      Senin ada kabar bagus: TLKM buka di 4.150 (gap naik) dan seharian tidak pernah turun
      di bawah 4.080. Apa yang terjadi dengan ordermu?
    pilihan:
      - "Terisi di 4.000 — limit order jalan begitu bursa buka"
      - "Tidak terisi — limit beli 4.000 di bawah harga pasar sepanjang hari; order harian batal di akhir sesi"
      - "Terisi otomatis di 4.150 — pakai harga pasar saat buka"
      - "Batal, dan kamu anggap TLKM sudah mahal — pindah ke saham lain"
    jawaban: 1
    penjelasan: |
      Limit beli 4.000 hanya terisi kalau ada penjual di harga ≤ 4.000.
      Harga terendah hari itu 4.080 — tidak pernah menyentuh 4.000.
      Order tidak terisi, dan di IDX order harian umumnya batal di akhir sesi.
      Kamu tidak punya posisi.
      Opsi 'terisi di 4.000' = mitos: limit tidak mengejar harga.
      Opsi 'terisi 4.150' = itu perilaku market order, bukan limit.
      Gap = harga melompat saat buka. Order yang tampak 'tinggal menunggu' bisa meleset total.
      Keputusan setelahnya: pasang ulang limit wajar, atau tunggu. Jangan panik beli market
      di harga yang sudah meloncat 3,75%.
    kode: |
      limit_beli = 4000
      harga_buka = 4150
      harga_terendah = 4080
      terisi = harga_terendah <= limit_beli
      print(f"Order terisi? {terisi}")   # False
    hasil:
      - ret: 1.2
        dd: 0.0
        win: 30
        note: "Kamu mengira posisi ada di 4.000. Baru sadar saat harga 4.250 — beli telat, untung tipis."
      - ret: 4.9
        dd: 0.0
        win: 78
        note: "Benar: order batal. Pasang ulang limit 4.100, terisi saat koreksi — jual di 4.300."
      - ret: 3.6
        dd: 0.0
        win: 35
        note: "Panik beli market 4.150: tetap untung ke 4.300, tapi bayar 50 poin lebih mahal."
      - ret: 2.0
        dd: 0.0
        win: 25
        note: "Pindah ke saham lain yang cuma +2% — TLKM yang kamu analisis malah naik 7,5%."
    petunjuk:
      - "Limit beli 4.000 butuh harga ≤ 4.000. Hari itu ada harga segitu?"
      - "Order harian yang tidak terisi akan batal di akhir sesi."

