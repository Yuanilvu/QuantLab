  - id: "s9-7"
    judul: "Spread dalam Persen"
    emoji: "🔍"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      TLKM di 10.000: bid 9.990, ask 10.010. BBRI di 4.000: bid 3.990, ask 4.010.
      Kamu sering masuk-keluar posisi (scalping). Eksekusi saham mana yang lebih murah?
      Artinya: spread relatif mana yang lebih kecil?
    pilihan:
      - "Sama saja — spread keduanya 20 poin"
      - "TLKM — 20 ÷ 10.000 = 0,2%, sedangkan BBRI 20 ÷ 4.000 = 0,5%"
      - "BBRI — harga murah berarti spread-nya kecil"
      - "Tidak bisa dibandingkan — harga dasarnya beda"
    jawaban: 1
    penjelasan: |
      Spread poin sama (20), tapi harga dasar beda.
      Spread relatif TLKM = 20 ÷ 10.000 = 0,2%. BBRI = 20 ÷ 4.000 = 0,5%.
      Masuk TLKM 'hanya' membayar 0,2%, BBRI 0,5% — 2,5x lebih mahal.
      Untuk scalper yang targetnya 1%, beda 0,3% itu penentu untung-rugi.
      Opsi 'sama 20 poin' = membandingkan poin mentah — menyesatkan seperti membandingkan
      kenaikan harga tanpa persen (Bab 1).
      Justru di harga murah, spread 20 poin terasa lebih berat. Selalu ubah ke persen.
    kode: |
      spread_tlkm = 20 / 10_000 * 100
      spread_bbri = 20 / 4_000 * 100
      print(f"Spread TLKM = {spread_tlkm:.2f}%")   # 0.20%
      print(f"Spread BBRI = {spread_bbri:.2f}%")   # 0.50%
    hasil:
      - ret: 1.0
        dd: 0.0
        win: 35
        note: "Kamu anggap sama, main BBRI sering keluar-masuk. Spread 0,5% tiap eksekusi menggerus profit."
