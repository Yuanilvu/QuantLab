        dd: 25.8
        win: 15
        note: "24% saja sudah 12x aturan. Funding $18 ekstra membuat loss nyata 25,8%."
      - ret: 3.1
        dd: 2.0
        win: 70
        note: "Kamu hitung dulu: 25,8% jauh di atas aturan. Posisi dikecilkan, loss terkendali."
      - ret: -25.8
        dd: 25.8
        win: 10
        note: "Funding tidak mengurangi loss harga — malah menambah. Total −25,8%."
    petunjuk:
      - "Loss harga dalam equity = 8% × 3 (leverage) = ?"
      - "Funding 5 hari: 0,04% × 3 × 5 = ?% dari notional. Dalam dolar?"
      - "Jumlahkan dua-duanya, bandingkan dengan equity $1.000."
soal:
  - id: "p11-1"
    judul: "Cuan Funding Harian"
    emoji: "🪙"
    tingkat: mudah
    xp: 25
    menit: 6
    cerita: |
      Posisi carry kamu menerima funding tiap 8 jam sekali.
      Baca modal (dolar) di baris 1 dan funding rate per 8 jam dalam persen di baris 2.
      Cetak cuan per hari (3 kali funding) dan cuan per 30 hari — dua angka, 2 desimal.
    input_spec: |
      Baris 1: modal dalam dolar (mis. 1000).
      Baris 2: funding rate per 8 jam dalam persen (mis. 0.01 artinya 0,01%).
    output_spec: |
      Baris 1: cuan per hari.
      Baris 2: cuan per 30 hari.
      Keduanya 2 desimal.
    contoh:
      - input: "1000\n0.01"
        output: "0.30\n9.00"
      - input: "5000\n0.02"
        output: "3.00\n90.00"
    tes:
      - input: "1000\n0.01"
        output: "0.30\n9.00"
      - input: "500\n0.02"
        output: "0.30\n9.00"
      - input: "10000\n0.005"
        output: "1.50\n45.00"
      - input: "2000\n0.1"
        output: "6.00\n180.00"
    solusi: |
      modal = float(input())
      rate = float(input())
      cuan_8jam = modal * rate / 100
      cuan_hari = cuan_8jam * 3
      cuan_bulan = cuan_hari * 30
      print(f"{cuan_hari:.2f}")
      print(f"{cuan_bulan:.2f}")
    petunjuk:
      - "Funding dibayar 3 kali sehari (tiap 8 jam)."
      - "Rate dalam persen — bagi 100 dulu: 0,01% = 0,0001."
    tugas:
      - "Baca modal dolar di baris pertama dan funding rate per 8 jam di baris kedua."
      - "Hitung cuan sekali bayar = modal kali rate dibagi 100."
      - "Kalikan dengan 3 untuk cuan sehari, lalu dengan 30 untuk cuan sebulan."
      - "Cetak cuan harian lalu cuan 30 hari, keduanya 2 desimal."
    starter: |
      modal = float(input())
      rate = float(input())
      cuan_8jam = modal * rate / 100
      # TODO: cuan_hari = cuan_8jam * 3
      # TODO: cuan_bulan = cuan_hari * 30
      print(f"{cuan_hari:.2f}")
      print(f"{cuan_bulan:.2f}")
