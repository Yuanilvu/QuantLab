        win: 25
        note: "Kamu yakin 4,5%, pasang leverage di leg short. Harga naik 8%, leg short kena margin call."
      - ret: 0.3
        dd: 0.2
        win: 30
        note: "Short perp tanpa spot = kena risiko harga. Beruntung harga datar: cuma +0,3%."
      - ret: 0.0
        dd: 0.0
        win: 35
        note: "Kamu skip: 3,16% bersih sebulan tanpa arah = peluang carry terlewat."
    petunjuk:
      - "Hitung funding 20 hari di 0,05% lalu 10 hari di 0,01%."
      - "Jangan lupa potong biaya 0,14%."
      - "Apa yang terjadi ke leg short kalau harga naik cepat?"
  - id: "s11-10"
    judul: "Stop, Leverage, dan Funding"
    emoji: "🛟"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Akun $1.000. Kamu long BTC leverage 3x: notional $3.000, stop loss 8% di
      bawah entry. Funding positif 0,04% per 8 jam — long bayar. Harga turun pelan,
      stop kena di hari ke-5. Selama 5 hari kamu bayar funding tiap 8 jam. Berapa
      total loss ke equity saat stop kena? (abaikan fee)
    pilihan:
      - "8% equity — stop 8% ya 8%"
      - "24% equity — lupa funding"
      - "25,8% equity — loss harga 24% + funding 1,8%"
      - "7,4% equity — funding mengurangi loss"
    jawaban: 2
    penjelasan: |
      Stop 8% berlaku ke harga, tapi loss ke equity = 8% × leverage 3x = 24%.
      Funding: 0,04% × 3 × 5 hari = 0,6% dari notional = 0,6% × $3.000 = $18 =
      1,8% equity. Total = $240 + $18 = $258 = 25,8% equity. Satu trade menghapus
      seperempat akun — 13x lipat aturan 2%. Pelajaran: hitung loss dalam % equity,
      bukan % harga; funding dan biaya masuk hitungan skenario terburuk; lev 3x +
      stop 8% + funding = risiko 25,8%, di luar batas wajar. Turunkan leverage atau
      jauhkan stop. "8%" = lupa leverage. "24%" = lupa funding. "7,4%" = arah
      hitung terbalik.
    kode: |
      equity = 1000
      notional = 3000
      loss_harga = notional * 0.08
      loss_funding = notional * 0.0004 * 3 * 5
      total = loss_harga + loss_funding
      print(f"Loss harga: ${loss_harga:.0f} | Funding 5 hari: ${loss_funding:.0f}")
      print(f"Total: ${total:.0f} = {total/equity*100:.1f}% equity")
    hasil:
      - ret: -25.8
        dd: 25.8
        win: 12
        note: "Kamu pikir risiko cuma 8%. Kenyataannya −25,8% equity. Kaget dan panik."
