    menit: 7
    cerita: |
      Modal $10.000. Setup delta-neutral: beli spot BTC $10.000 + short perp BTC
      $10.000. Funding +0,05% per 8 jam kamu terima dari leg short. Biaya sekali
      jalan: spread 0,1% + fee 0,04%. Skenario konservatif: funding bertahan 0,05%
      selama 20 hari, lalu turun ke 0,01% selama 10 hari. Berapa return bersih 30
      hari?
    pilihan:
      - "+3,16% ($316) — 20 hari di 0,05% + 10 hari di 0,01%, dikurangi biaya 0,14%"
      - "+4,5% ($450) — 0,05% × 3 × 30, biaya cuma receh"
      - "+0,3% ($30) — funding cuma untuk posisi short murni"
      - "0% — spread dan fee makan semua carry"
    jawaban: 0
    penjelasan: |
      Fase 1: 0,05% × 3 × 20 = 3,0%. Fase 2: 0,01% × 3 × 10 = 0,3%. Total funding
      3,3%. Biaya sekali jalan: spread 0,1% + fee 0,04% = 0,14%. Bersih = 3,3 −
      0,14 = 3,16% → $316. Delta-neutral: untung-rugi harga saling hapus (spot vs
      perp), jadi carry ini murni. Tapi bukan tanpa risiko: funding bisa berubah
      negatif (kamu malah bayar), dan leg short butuh margin — kalau dipasang
      leverage, harga naik cepat bisa melikuidasi leg short padahal leg spot
      untung. Setup aman = spot penuh + margin leg short longgar. "+4,5%" = lupa
      biaya dan menganggap funding tetap selamanya. "+0,3%" = salah paham
      delta-neutral. "0%" = melewatkan carry yang terukur.
    kode: |
      modal = 10_000
      fase1 = 0.0005 * 3 * 20
      fase2 = 0.0001 * 3 * 10
      biaya = 0.001 + 0.0004
      bersih = modal * (fase1 + fase2 - biaya)
      print(f"Return bersih: ${bersih:.0f} ({bersih/modal*100:.2f}%)")
    hasil:
      - ret: 3.2
