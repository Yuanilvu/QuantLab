    emoji: "📈"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Modal Rp1.000.000. Tabungan A: bunga sederhana 5% per tahun.
      Tabungan B: bunga majemuk 5% per tahun.
      Setelah 3 tahun, berapa SELISIH total bunga A dan B?
    pilihan:
      - "Rp0"
      - "Rp7.625"
      - "Rp157.625"
      - "Rp150.000"
    jawaban: 1
    penjelasan: |
      A (sederhana): bunga = 1.000.000 × 5% × 3 = 150.000.
      B (majemuk): 1.000.000 × 1,05³ − 1.000.000 = 1.157.625 − 1.000.000 = 157.625.
      Selisih = 157.625 − 150.000 = **Rp7.625**.
      Beda kecil di tahun ke-3. Bunga berbunga baru terasa pelan:
      tahun 1 bunga B = 50.000 (sama dengan A), tahun 2 = 52.500, tahun 3 = 55.125.
      Opsi 0 = mengira dua-duanya sama. Opsi 157.625 = bunga B saja. Opsi 150.000 = bunga A saja.
