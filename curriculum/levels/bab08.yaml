        note: "Benar: saldo 5.480.000 (bunga bersih 480.000). Perencanaan pajak tepat."
      - ret: 9.2
        dd: 0.0
        win: 35
        note: "5.540.000 = pajak sekali saja. Padahal pajak dipotong tiap tahun, dua kali."
      - ret: 7.2
