  - id: "s8-2"
    judul: "Aturan 72"
    emoji: "⏰"
    sulit: "sedang"
    xp: 35
    menit: 4
    cerita: |
      Investasi dengan return **9% per tahun** (majemuk). Pakai Aturan 72: kira-kira berapa tahun sampai uangmu berlipat dua?
    pilihan:
      - "72 tahun"
      - "8 tahun"
      - "9 tahun"
      - "4 tahun"
    jawaban: 1
    penjelasan: |
      Aturan 72: `72 ÷ bunga` = tahun untuk dobel. 72 ÷ 9 = **8 tahun**. Opsi lain: 72 tahun = lupa dibagi. 9 tahun = mengira return sama dengan waktu. 4 tahun = 72 ÷ 18, salah angka.

      Ini perkiraan cepat yang berguna: return 12% → 6 tahun. Return 6% → 12 tahun. Makin tinggi return, makin cepat dobel. Return kecil tapi konsisten pun akhirnya besar karena compounding.
    kode: |
      print(f"72 / 9 = {72 / 9:.0f} tahun")   # 8 tahun
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "72 tahun itu kalau bunganya 1% — di sini 9%."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "8 tahun benar: 72 ÷ 9 = 8."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "9 itu bunganya, bukan tahunnya. Bagilah 72 dengan 9."
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "4 tahun itu 72 ÷ 18 — kamu salah ambil angka."
    petunjuk:
      - "Aturan 72: 72 dibagi persen bunga."
      - "72 ÷ 9 = ?"
  - id: "s8-3"
    judul: "Sederhana vs Majemuk"
    emoji: "⚔️"
    sulit: "sulit"
    xp: 50
    menit: 5
    cerita: |
      Dua tawaran untuk Rp10.000.000 selama 5 tahun:
      - **A**: bunga sederhana 12% per tahun
      - **B**: bunga majemuk 10% per tahun

      Mana yang lebih banyak di akhir tahun ke-5? Berapa selisihnya?
    pilihan:
      - "A — 12% lebih besar dari 10%"
      - "B — majemuk 10%: 10jt × 1,1⁵ ≈ 16,1jt vs A: 10jt + (5×1,2jt) = 16jt. B menang tipis ~110rb"
      - "Sama saja — bedanya cuma cara hitung"
      - "A — sederhana lebih aman pasti menang"
    jawaban: 1
    penjelasan: |
      A: 10jt + (10jt × 0,12 × 5) = 10 + 6 = **16jt**. B: 10jt × 1,1⁵ = 10 × 1,6105 = **16,105jt**. B menang ~110 ribu.

      Ajaibnya: bunga B LEBIH KECIL (10% vs 12%), tapi menang karena bunga berbunga. Makin lama waktunya, makin telak kemenangan majemuk. Contoh 10 tahun: A 22jt vs B 25,9jt. Pelajaran: jangan cuma lihat angka persen. Tanya juga: "majemuk atau sederhana?" dan "berapa lama?".
    kode: |
      hasil_a = 10_000_000 * (1 + 0.12 * 5)
      hasil_b = 10_000_000 * (1 + 0.10) ** 5
      print(f"Hasil tawaran A = Rp{hasil_a / 1e6:.1f}jt")
      print(f"Hasil tawaran B = Rp{hasil_b / 1e6:.1f}jt")
      print(f"Selisih = Rp{hasil_b - hasil_a:,.0f}")
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 35
        note: "12% > 10% memang, tapi hitung dulu: A = 16jt, B = 16,1jt. Persen bukan satu-satunya."
      - ret: 0.0
        dd: 0.0
        win: 78
        note: "Benar: B menang tipis di tahun ke-5, dan selisihnya membesar seiring waktu."
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "Tidak sama: majemuk menghitung bunga dari bunga — hasil akhir berbeda."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "'Lebih aman' bukan berarti hasil lebih besar — hitung angkanya."
    petunjuk:
      - "A: modal + (modal × 0,12 × 5)."
      - "B: modal × 1,1 pangkat 5."

