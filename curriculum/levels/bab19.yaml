      Kamu punya 2 strategi saham lintas sektor: vol masing-masing 25%, korelasi antarstrategi 0,5 (semua pasangan). Vol portofolio sekarang 25 x √((1+0,5)/2) = 21,7% — di atas target 19%. Rencana: tambah strategi sejenis (vol 25%, korelasi 0,5 ke semua). Rumus equal weight N aset: σp = σ x √((1+(N-1)ρ)/N). Tambah berapa supaya vol ≤ 19%?
    pilihan:
      - "Tambah 1 (total 3) — 20,4%, tinggal sedikit lagi"
      - "Tambah 2 (total 4) — 19,8%, sudah cukup"
      - "Tambah 5 (total 7) — 18,9%, aman di bawah target"
      - "Tambah 20 (total 22) — 18,1%, makin banyak makin baik"
    jawaban: 2
    penjelasan: |
      Coba N satu per satu. N = 3: √((1 + 2 x 0,5)/3) = √0,667 = 0,816 → 20,4% (lewat). N = 4: √(2,5/4) = 0,791 → 19,8% (lewat). N = 5: √0,6 = 0,775 → 19,4% (lewat). N = 6: √0,583 = 0,764 → 19,1% (lewat, nyaris). N = 7: √(4/7) = 0,756 → 18,9% ≤ 19% — jawabannya: total 7, tambah 5. Bandingkan: N = 22 → 18,1%, cuma 0,8 poin lebih rendah untuk 15 strategi ekstra. Batasnya: N → ∞ → σ√ρ = 25 x 0,707 = 17,7%. Sesudah 7 strategi, tiap tambahan memberi < 0,2 poin penurunan — padahal tiap strategi ada biaya nyata (modal minimum, pantau, slippage) dan korelasi naik ke ~1 saat krisis. Ambil jumlah minimum yang lolos target.
