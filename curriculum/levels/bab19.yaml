# ============================================================
# BAB 19 — PORTOFOLIO & DIVERSIFIKASI
# Korelasi, diversifikasi sejati vs palsu,
# alokasi & rebalancing sederhana.
# ============================================================
bab: 19
track: quant
judul: "Portofolio & Diversifikasi"
emoji: "🧺"
deskripsi: "Satu strategi bisa hancur. Dua strategi yang tidak saling korelatif bisa saling menyelamatkan. Matematika portofolio, bukan cuma jumlah ticker."
pelajaran:
  - id: "19-1"
    judul: "Korelasi: Bahasa Hubungan Antar Aset"
    menit: 5
    materi: |
      Korelasi (dari -1 sampai +1) mengukur seberapa searah dua aset bergerak:

      - **+1**: naik bareng, turun bareng (dua saham perbankan besar, misalnya).
      - **0**: tidak ada hubungan.
      - **-1**: bergerak berlawanan (jarang murni terjadi; emas vs USD kadang mendekati).

      Kenapa penting? **Risiko portofolio tidak dijumlah, dikorelasikan.** Contoh: dua aset sama-sama volatil 20% (volatilitas = seberapa liar harga naik-turun). Kalau korelasi +1, portofolio tetap volatil 20% — tidak ada manfaat. Kalau korelasi 0, volatilitas gabungan ~14%. Risiko turun ~30%, return tetap sama. Kalau -0.5, hasilnya lebih baik lagi.

      Rumus volatilitas portofolio 2 aset (weight w, w2=1-w):
      `σp = √(w²σ1² + w2²σ2² + 2·w·w2·ρ·σ1·σ2)`

      Takeaway: diversifikasi = menambah aset dengan **korelasi rendah**, bukan sekadar menambah jumlah. Korelasi tidak permanen. Saat krisis, korelasi cenderung naik ke 1 — semua jatuh bareng. Karena itu siapkan bantalan: cash, atau strategi yang benar-benar beda.
    kode: |
      bobot = 0.5
      vol_aset1 = 0.20
      vol_aset2 = 0.20
      korelasi = 0.0
      vol_porto = (
          bobot**2 * vol_aset1**2
          + (1 - bobot)**2 * vol_aset2**2
          + 2 * bobot * (1 - bobot) * korelasi * vol_aset1 * vol_aset2
      ) ** 0.5
      print(f"Vol portofolio: {vol_porto*100:.0f}% (vs 20% sendirian)")
    penjelasan: "Korelasi 0 + dua aset vol 20% → portofolio vol 14%. Diversifikasi nyata."
  - id: "19-2"
    judul: "Alokasi & Rebalancing"
    menit: 5
    materi: |
      Setelah tahu korelasi, bagaimana membagi modal? Dua pendekatan sederhana:

      **1. Equal weight** — bagi rata. Sederhana, sulit salah besar, otomatis diversifikasi. Cocok kalau tidak punya alasan kuat untuk lebih berat ke satu aset.

      **2. Risk-based (risk parity sederhana)** — alokasi terbalik dengan volatilitas. Aset volatil dapat porsi kecil; aset tenang dapat porsi besar. Tujuannya: tiap aset menyumbang RISIKO yang sama. Contoh: aset A vol 10%, B vol 30% → alokasi 75/25 (bukan 50/50) supaya risiko 50/50.

      **Rebalancing**: sekali periode (bulanan/kuartalan), jual yang naik, beli yang turun, kembali ke target. Ini memaksa "beli murah jual mahal" secara sistematis. Risiko pun tetap di level yang direncanakan.

      Jebakan umum: menambah aset yang KORELASINYA TINGGI dengan yang sudah dimiliki = diversifikasi palsu (hanya rasa aman, risiko tetap sama). 10 saham perbankan ≠ diversifikasi.
    kode: |
      def vol_porto(bobot, vol_aset1, vol_aset2, korelasi):
          return (
              bobot**2 * vol_aset1**2
              + (1 - bobot)**2 * vol_aset2**2
              + 2 * bobot * (1 - bobot) * korelasi * vol_aset1 * vol_aset2
          ) ** 0.5
      print(f"Vol portofolio (rho 0.85) = {vol_porto(0.5, 0.18, 0.18, 0.85)*100:.0f}%")
      print(f"Vol portofolio (rho -0.2) = {vol_porto(0.5, 0.18, 0.18, -0.2)*100:.0f}%")
    penjelasan: "Equal weight untuk kesederhanaan, risk-based untuk efisiensi; rebalancing memaksa beli murah jual mahal."
