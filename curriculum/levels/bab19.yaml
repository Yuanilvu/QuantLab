  - id: "s19-7"
    judul: "Vol Gabungan, Bukan Jumlah"
    emoji: "📊"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Strategi A dan B sama-sama vol 20% per tahun, korelasi +0,8 (satu sektor). Kamu gabung 50/50 dan butuh angka vol portofolio untuk aturan sizing. Rumus: σp = √(w²σA² + (1-w)²σB² + 2·w·(1-w)·ρ·σA·σB). Angka berapa yang kamu pakai?
    pilihan:
      - "14,1% — risiko terbagi rata: 20% dibagi akar dua"
      - "19,0% — korelasi tinggi tapi tidak sempurna"
      - "40,0% — dua aset berarti dua kali risiko"
      - "20,0% — korelasi +0,8 nyaris 1: anggap satu aset saja"
    jawaban: 1
    penjelasan: |
      Masukkan angkanya: w = 0,5, σ = 0,20, ρ = 0,8. σp² = 0,25 x 0,04 + 0,25 x 0,04 + 2 x 0,25 x 0,8 x 0,04 = 0,01 + 0,01 + 0,016 = 0,036. σp = √0,036 = 18,97% ≈ 19,0%. Pembanding: kalau ρ = 0, vol 14,1% (√0,02); kalau ρ = 1, vol 20,0%. Korelasi +0,8 cuma memberi sedikit penurunan. 40% = menjumlahkan risiko — variance tidak dijumlah begitu saja. 14,1% = menganggap korelasi nol; dipakai untuk sizing, posisimu bisa ~35% lebih besar dari seharusnya. 20% = mengabaikan manfaat kecil yang ada. Untuk sizing, 19% adalah angka yang benar: pas dengan risiko nyata gabungan.
    kode: |
      bobot = 0.5
      vol_a = 0.20
      vol_b = 0.20
      korelasi = 0.8
      vol_porto = (bobot**2 * vol_a**2 + bobot**2 * vol_b**2 + 2 * bobot * bobot * korelasi * vol_a * vol_b) ** 0.5
      print(f"Vol portofolio 50/50 (korelasi 0,8): {vol_porto*100:.1f}%")
    hasil:
      - ret: 5.0
        dd: 16.0
        win: 40
        note: "Asumsi 14,1% → leverage kegedean. Koreksi -10% bikin DD 16%."
      - ret: 12.0
