    menit: 5
    cerita: |
      Satu baris data dari broker: `"CUAN 1500 25000"` (nama, harga, volume). Kamu mau ambil HARGA-nya sebagai angka. Kode yang benar?
    pilihan:
      - "`harga = baris[1]`"
      - "`harga = int(baris.split()[1])`"
      - "`harga = int(baris)`"
      - "`harga = baris.split()`"
    jawaban: 1
    penjelasan: |
      `baris.split()` memecah jadi `['CUAN', '1500', '25000']`, lalu `[1]` mengambil elemen kedua ('1500'), lalu `int()` mengubah teks jadi angka → **1500**. Opsi lain: `baris[1]` = huruf kedua ('U')!; `int(baris)` = error (seluruh baris bukan angka); `baris.split()` = list teks, belum angka. Urutan parse: pecah → pilih → ubah tipe. Ini baris paling penting di dunia data quant.
    kode: |
      baris = "CUAN 1500 25000"
      harga = int(baris.split()[1])
      print(harga, type(harga))   # 1500 <class 'int'>
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "baris[1] mengambil KARAKTER kedua = 'U'. String di-index per huruf!"
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "Benar: split → [1] → int. Parse standar."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "int(baris) error — 'CUAN 1500 25000' bukan angka."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "split() hasilnya list teks ['CUAN','1500','25000'] — belum diambil & belum jadi angka."
    petunjuk:
      - "Pecah dulu dengan split()."
      - "Lalu ambil indeks 1, lalu ubah dengan int()."
