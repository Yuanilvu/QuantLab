soal:
  - id: "p22-1"
    judul: "Kamus Saham"
    emoji: "📖"
    tingkat: mudah
    xp: 25
    menit: 6
    cerita: |
      Baca dua baris: nama saham (baris 1) dan harga (baris 2). Simpan ke dict dengan kunci `nama` dan `harga`, lalu cetak dengan format `nama: harga`.
    input_spec: |
      Baris 1: nama saham. Baris 2: harga (angka bulat).
    output_spec: |
      Satu baris: `nama: harga`.
    contoh:
      - input: "TLKM\n4000"
        output: "TLKM: 4000"
      - input: "BBRI\n4500"
        output: "BBRI: 4500"
    tes:
      - input: "TLKM\n4000"
        output: "TLKM: 4000"
      - input: "BBRI\n4500"
        output: "BBRI: 4500"
      - input: "CUAN\n1500"
        output: "CUAN: 1500"
      - input: "AAPL\n30000"
        output: "AAPL: 30000"
    solusi: |
      nama = input()
      harga = int(input())
      saham = {"nama": nama, "harga": harga}
      print(f"{saham['nama']}: {saham['harga']}")
    petunjuk:
      - "Simpan dengan dict: saham = {'nama': ..., 'harga': ...}."
      - "Cetak dengan f-string memakai kunci dict."
  - id: "p22-2"
    judul: "Total Harga Portofolio"
    emoji: "🧮"
    tingkat: sedang
    xp: 40
    menit: 8
    cerita: |
      Baca N (jumlah saham), lalu N baris berisi `nama harga` (dipisah spasi). Cetak TOTAL semua harga. Petunjuk: `baris.split()` memecah, `int(...)` mengubah ke angka.
    input_spec: |
      Baris 1: N. N baris berikutnya: `nama harga`.
    output_spec: |
      Satu baris: total harga (angka bulat).
    contoh:
      - input: "2\nTLKM 4000\nBBRI 4500"
        output: "8500"
      - input: "3\nCUAN 1500\nBRPT 1000\nMPPA 500"
        output: "3000"
    tes:
      - input: "2\nTLKM 4000\nBBRI 4500"
        output: "8500"
      - input: "3\nCUAN 1500\nBRPT 1000\nMPPA 500"
        output: "3000"
      - input: "1\nUNVR 3000"
        output: "3000"
      - input: "4\nA 100\nB 200\nC 300\nD 400"
        output: "1000"
    solusi: |
      n = int(input())
      total = 0
      for i in range(n):
          p = input().split()
          total += int(p[1])
      print(total)
    petunjuk:
      - "split() memberi [nama, harga]."
      - "Harga ada di indeks 1 — jangan lupa int()."
  - id: "p22-3"
    judul: "Saham Termahal"
    emoji: "👑"
    tingkat: sulit
    xp: 55
    menit: 9
    cerita: |
      Baca N, lalu N baris `nama harga`. Cetak NAMA saham dengan harga TERTINGGI. (Kalau ada yang sama, cetak yang pertama muncul.)
    input_spec: |
      Baris 1: N. N baris berikutnya: `nama harga`.
    output_spec: |
      Satu baris: nama saham termahal.
    contoh:
      - input: "3\nTLKM 4000\nBBRI 4500\nUNVR 3000"
        output: "BBRI"
      - input: "2\nCUAN 1500\nBRPT 1000"
        output: "CUAN"
    tes:
      - input: "3\nTLKM 4000\nBBRI 4500\nUNVR 3000"
        output: "BBRI"
      - input: "2\nCUAN 1500\nBRPT 1000"
        output: "CUAN"
      - input: "1\nMPPA 500"
        output: "MPPA"
      - input: "4\nA 100\nB 500\nC 500\nD 200"
        output: "B"
    solusi: |
      n = int(input())
      terbaik = ""
      tertinggi = -1
      for i in range(n):
          p = input().split()
          nama, harga = p[0], int(p[1])
          if harga > tertinggi:
              tertinggi = harga
              terbaik = nama
      print(terbaik)
    petunjuk:
      - "Simpan nama terbaik + harga tertingginya."
      - "Pakai `>` supaya yang pertama menang saat seri."
