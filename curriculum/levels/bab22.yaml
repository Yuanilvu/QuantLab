pelajaran:
  - id: "22-1"
    judul: "Dict: Kotak dengan Label"
    menit: 5
    materi: |
      Dict (dictionary) = kotak penyimpan yang setiap isinya punya LABEL (kunci). List menyimpan angka berurutan. Dict menyimpan data yang punya nama.

      ```python
      saham = {"nama": "TLKM", "harga": 4000, "lot": 2}
      print(saham["nama"])    # TLKM
      print(saham["harga"])   # 4000
      saham["harga"] = 4100   # ubah nilai
      ```

      Beda dengan list: di list kamu ambil dengan nomor (`harga[0]`). Di dict, dengan label (`saham["harga"]`). Jauh lebih jelas — kamu tidak perlu ingat "kolom ke berapa".

      Di quant, dict = format data paling umum untuk data pasar: satu dict per saham, satu list berisi banyak dict untuk portofolio:
      ```python
      porto = [
          {"nama": "TLKM", "harga": 4000},
          {"nama": "BBRI", "harga": 4500},
      ]
      print(porto[0]["harga"])   # 4000
      ```
    kode: |
      saham = {"nama": "TLKM", "harga": 4000}
      print(saham["nama"], saham["harga"])   # TLKM 4000
    penjelasan: "Dict = data berlabel. List of dict = cara standar menyimpan banyak data pasar."
  - id: "22-2"
    judul: "Baca Baris Data"
    menit: 5
    materi: |
      Data dari exchange/broker biasanya berupa baris teks:
      ```
      TLKM 4000 120000
      BBRI 4500 80000
      ```

      Setiap baris = satu data: nama, harga, volume — dipisah spasi. Cara membacanya di Python:

      ```python
      baris = "TLKM 4000 120000"
      bagian = baris.split()          # ['TLKM', '4000', '120000']
      nama = bagian[0]                # 'TLKM'
      harga = int(bagian[1])          # 4000 (ubah ke angka!)
      ```

      Lalu kamu bisa menyimpan ke dict dan mengumpulkan banyak baris dalam list:
      ```python
      data = []
      for baris in teks:
          p = baris.split()
          data.append({"nama": p[0], "harga": int(p[1])})
      ```

      Pola ini ada di SEMUA bot sungguhan: baca baris → parse (pecah & ubah ke angka) → simpan → analisis. Setelah ini, kamu bisa membaca file CSV (tabel berbasis teks) dari broker mana pun.
    kode: |
      baris = "TLKM 4000"
      p = baris.split()
      print(p[0], int(p[1]))   # TLKM 4000
    penjelasan: "split() memecah baris, int() mengubah teks jadi angka. Parse = baca → ubah → simpan."
