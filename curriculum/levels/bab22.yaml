      List of dict bisa di-loop (diulang satu per satu). `for s in porto` membaca satu dict per putaran. `s['harga'] = ...` mengubah nilai di dalam dict itu. int() membuang desimal, jadi 4400,0 → 4400. Hasilnya: TLKM 4400, BBRI 4950, CUAN 1650. Total naik dari 10.000 ke 11.000 (+10%). `porto * 1.1` error — list tidak bisa dikali angka. `harga = 4000 * 1.1` hanya mengubah variabel baru; data asli tidak tersentuh. print hanya menampilkan, tidak mengubah apa pun.
