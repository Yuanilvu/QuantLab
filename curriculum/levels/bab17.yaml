      ATR CUAN cuma 1% — pasar tenang 2 minggu menunggu keputusan bank sentral AS
      malam ini. Histori 12 rilis: 5 kali harga gap lebih dari 2% saat pembukaan.
      Stop standarmu 2×ATR = 2%. Kamu dapat sinyal entry sore ini. Keputusan
      terbaik?
    pilihan:
      - "Entry sekarang — ATR rendah berarti pasar aman"
      - "Tunda entry sampai besok — probabilitas gap menembus stop 42%, stop 2% bisa dieksekusi jauh lebih buruk"
      - "Entry dengan stop 1% — biar loss kecil kalau gap"
      - "Entry 2x lipat — kalau gap bagus, untung besar"
    jawaban: 1
    penjelasan: |
      ATR rendah sebelum rilis besar = pasar menahan napas, bukan tenang. Begitu
      rilis, volatilitas meledak. Histori: 5 dari 12 rilis (42%) menggerakkan harga
      lebih dari 2% — stop 2% bisa dieksekusi di −4% atau −5% karena gap. Sinyal
      sore ini berdasarkan data lama; besok pagi ada data baru (harga pasca-rilis)
      — sinyalnya lebih baik. Tunda = membayar sedikit slippage, menghindari
      lotere. Stop 1% lebih parah: kena noise biasa. Entry 2x lipat sebelum event =
      menggandakan risiko lotere. Aturan: jangan entry baru tepat sebelum event
      besar.
