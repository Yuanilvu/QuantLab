# ============================================================
# BAB 17 — VOLATILITAS & ATR
# Average True Range untuk stop, regime volatilitas,
# Bollinger squeeze & breakout.
# ============================================================
bab: 17
track: quant
judul: "Volatilitas & ATR"
emoji: "🎢"
deskripsi: "Stop loss asal-asalan = sering kena stop palsu, atau rugi besar. ATR kasih stop yang mengikuti ritme pasar — bukan angka asal."
pelajaran:
  - id: "17-1"
    judul: "ATR: Ukuran Nafas Pasar"
    menit: 5
    materi: |
      **ATR (Average True Range)** = rata-rata pergerakan harga (high-low, termasuk gap) 14 hari terakhir. Angka ini = "seberapa jauh harga biasanya bergerak per hari".

      Guna terbesar ATR: **set stop loss yang menyesuaikan volatilitas**.

      - Stop 1×ATR → terlalu ketat. Noise harian normal saja bisa menyentuhnya. Kena stop palsu terus.
      - Stop 2×ATR → zona nyaman. Harga harus benar-benar melawanmu sejauh 2 hari pergerakan normal. Ini standar umum.
      - Stop 5×ATR → terlalu longgar. Risiko per trade membengkak tanpa alasan.

      Rumus sizing dengan ATR: `ukuran = risiko ÷ (2 × ATR%)`. Saham ATR 2% → stop 4%. ATR 5% → stop 10%, dan ukuran posisi otomatis lebih kecil. **ATR menyeimbangkan risiko antar saham**: saham liar dan saham tenang jadi punya risiko per trade yang SAMA.

      Bonus: ATR juga pembaca regime. ATR menyusut di range (energi terkumpul). Membesar saat harga menembus level penting (breakout) atau panic.
    kode: |
      equity = 1000
      risk_pct = 0.02        # 2% per trade
      atr_pct = 0.025        # ATR 2.5% dari harga
      stop_pct = 2 * atr_pct   # 2x ATR
      size = equity * risk_pct / stop_pct
      print(f"Stop {stop_pct*100:.0f}% | Ukuran ${size:.0f}")
    penjelasan: "Stop 2×ATR + risiko tetap 2% → ukuran posisi menyesuaikan volatilitas otomatis."
  - id: "17-2"
    judul: "Regime Volatilitas & Sizing"
    menit: 5
    materi: |
      Pasar berganti kepribadian: kadang tenang (ATR 1%), kadang liar (ATR 4%). Strategi yang sama harus diperlakukan beda di dua regime ini.

      **Prinsip: risiko per trade TETAP, ukuran menyesuaikan.** Risiko 2% equity (modal akun), stop 2×ATR:

      - ATR 1% → stop 2% → ukuran = 100% equity (1x)
      - ATR 4% → stop 8% → ukuran = 25% equity (0.25x)

      Trader yang tidak menyesuaikan? Ukuran tetap sama. Di regime liar, stop 8% × ukuran penuh = risiko 4x lipat dari aturan. Satu minggu liar bisa menghapus sebulan profit.

      Cara deteksi regime: bandingkan ATR sekarang dengan ATR 50-100 hari (ATR ratio). Atau ukur lebar band Bollinger (pita harga di sekitar rata-rata) — pita sempit = low vol. ATR naik 2x? Otomatis turunkan ukuran 2x.
    kode: |
      atr_sekarang = 0.04
      atr_normal = 0.01
      ukuran = 250 / (atr_sekarang / atr_normal)   # turun 4x
      print(f"Ukuran baru: ${ukuran:.0f}")          # $62
    penjelasan: "ATR naik 4x → ukuran turun 4x. Risiko per trade selalu tetap di semua regime."
skenario:
