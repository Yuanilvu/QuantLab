    pilihan:
      - "Jual semua sekarang — +20% sudah besar"
      - "Geser stop naik ke 1.152 (2×ATR dari harga sekarang) — profit terkunci 15%, ruang naik terbuka"
      - "Biarkan stop di 960 — jangan ganggu rencana awal"
      - "Tambah posisi — trend sudah terbukti"
    jawaban: 1
    penjelasan: |
      Stop awal 960 dibuat saat entry. Fungsinya: membatasi rugi. Sekarang fungsinya selesai — posisi sudah profit 20%. Stop yang sama sekarang membiarkan profit hilang. Koreksi 18% akan mengembalikan harga ke 960. Profit lenyap, kamu keluar impas setelah perjalanan naik. Jawabannya: geser stop mengikuti harga (trailing = stop yang ikut naik). ATR sekarang 2% dari 1.200 = 24 poin. Stop baru = 1.200 − 48 = 1.152. Koreksi? Kamu keluar +15.2%. Trend lanjut? Stop ikut naik, profit makin besar. Jual semua = menutup trend yang masih sehat. Tambah posisi di +20% tanpa rencana = risiko membesar di harga tinggi. ATR untuk exit sama pentingnya dengan ATR untuk entry.
    kode: |
