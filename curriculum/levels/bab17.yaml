  - id: "s17-7"
    judul: "Dua Saham, Satu Risiko"
    emoji: "⚖️"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Equity $1.000, aturan risk 2% ($20) per trade. Saham A ATR 2%, saham B ATR
      5%. Stop 2×ATR masing-masing. Berapa ukuran posisi untuk tiap saham, dan apa
      artinya?
    pilihan:
      - "A $500, B $200 — risiko keduanya sama $20. ATR menyeimbangkan: saham liar dapat posisi kecil"
      - "A $500, B $500 — ukuran sama biar adil"
      - "A $200, B $500 — B lebih volatile = lebih banyak peluang, beri lebih besar"
      - "A $1.000, B $1.000 — dua-duanya aman, stop sudah 2×ATR"
    jawaban: 0
    penjelasan: |
      Stop A = 2 × 2% = 4%. Stop B = 2 × 5% = 10%. Ukuran = risk ÷ stop: A = $20 ÷
      0,04 = $500. B = $20 ÷ 0,10 = $200. Kalau stop kena, dua-duanya rugi $20 —
      persis aturan. Ini keajaiban ATR: saham yang 2,5x lebih liar otomatis dapat
      posisi 2,5x lebih kecil. Ukuran sama untuk semua saham = saham liar diam-diam
      melanggar aturan (5% stop × $500 = $25, bukan $20). "B lebih besar karena
      volatile" = membalik logika risiko. ATR menyamakan risiko antar saham: risiko
      per trade selalu $20 di dunia mana pun.
    kode: |
      risk = 20
      size_a = risk / (2 * 0.02)
      size_b = risk / (2 * 0.05)
      print(f"Saham A (ATR 2%): ${size_a:.0f} | Saham B (ATR 5%): ${size_b:.0f}")
    hasil:
