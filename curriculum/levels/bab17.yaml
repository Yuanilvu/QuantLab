# ============================================================
# BAB 17 — VOLATILITAS & ATR
# Average True Range untuk stop, regime volatilitas,
# Bollinger squeeze & breakout.
# ============================================================
bab: 17
track: quant
judul: "Volatilitas & ATR"
emoji: "🎢"
deskripsi: "Stop loss asal-asalan = sering kena stop palsu, atau rugi besar. ATR kasih stop yang mengikuti ritme pasar — bukan angka asal."
pelajaran:
  - id: "17-1"
    judul: "ATR: Ukuran Nafas Pasar"
    menit: 5
    materi: |
      **ATR (Average True Range)** = rata-rata pergerakan harga (high-low, termasuk gap) 14 hari terakhir. Angka ini = "seberapa jauh harga biasanya bergerak per hari".

      Guna terbesar ATR: **set stop loss yang menyesuaikan volatilitas**.

      - Stop 1×ATR → terlalu ketat. Noise harian normal saja bisa menyentuhnya. Kena stop palsu terus.
      - Stop 2×ATR → zona nyaman. Harga harus benar-benar melawanmu sejauh 2 hari pergerakan normal. Ini standar umum.
      - Stop 5×ATR → terlalu longgar. Risiko per trade membengkak tanpa alasan.

      Rumus sizing dengan ATR: `ukuran = risiko ÷ (2 × ATR%)`. Saham ATR 2% → stop 4%. ATR 5% → stop 10%, dan ukuran posisi otomatis lebih kecil. **ATR menyeimbangkan risiko antar saham**: saham liar dan saham tenang jadi punya risiko per trade yang SAMA.

      Bonus: ATR juga pembaca regime. ATR menyusut di range (energi terkumpul). Membesar saat harga menembus level penting (breakout) atau panic.
    kode: |
      equity, risk_pct = 1000, 0.02
      atr_pct = 0.025          # ATR 2.5% dari harga
      stop_pct = 2 * atr_pct   # 2x ATR
      size = equity * risk_pct / stop_pct
      print(f"Stop {stop_pct*100:.0f}% | Ukuran ${size:.0f}")
    penjelasan: "Stop 2×ATR + risiko tetap 2% → ukuran posisi menyesuaikan volatilitas otomatis."
  - id: "17-2"
    judul: "Regime Volatilitas & Sizing"
    menit: 5
    materi: |
      Pasar berganti kepribadian: kadang tenang (ATR 1%), kadang liar (ATR 4%). Strategi yang sama harus diperlakukan beda di dua regime ini.

      **Prinsip: risiko per trade TETAP, ukuran menyesuaikan.** Risiko 2% equity (modal akun), stop 2×ATR:

      - ATR 1% → stop 2% → ukuran = 100% equity (1x)
      - ATR 4% → stop 8% → ukuran = 25% equity (0.25x)

      Trader yang tidak menyesuaikan? Ukuran tetap sama. Di regime liar, stop 8% × ukuran penuh = risiko 4x lipat dari aturan. Satu minggu liar bisa menghapus sebulan profit.

      Cara deteksi regime: bandingkan ATR sekarang dengan ATR 50-100 hari (ATR ratio). Atau ukur lebar band Bollinger (pita harga di sekitar rata-rata) — pita sempit = low vol. ATR naik 2x? Otomatis turunkan ukuran 2x.
    kode: |
      atr_sekarang, atr_normal = 0.04, 0.01
      ukuran = 250 / (atr_sekarang / atr_normal)   # turun 4x
      print(f"Ukuran baru: ${ukuran:.0f}")          # $62
    penjelasan: "ATR naik 4x → ukuran turun 4x. Risiko per trade selalu tetap di semua regime."
skenario:
  - id: "s17-1"
    judul: "Stop untuk Saham Liar"
    emoji: "🛑"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      CUAN: harga 1.500, ATR(14) = 3% per hari. Aturanmu: risiko maksimal 2% equity per trade. Equity $1.000. Berapa jarak stop yang masuk akal dan ukuran posisinya?
    pilihan:
      - "Stop 1% — ketat, biar cepat cut kalau salah"
      - "Stop 6% (2×ATR), ukuran $333 — risiko tetap 2% equity"
      - "Stop 15% — biar tidak gampang kena stop"
      - "Stop 3% (1×ATR), ukuran $667"
    jawaban: 1
    penjelasan: |
      Stop 2×ATR = 6%. Ukuran = risiko ÷ stop% = $20 ÷ 0.06 = **$333**. Stop kena? Rugi = 6% × $333 = $20 = 2% equity — persis aturan. Stop 1%? Kena noise harian. CUAN bisa gerak 3% sehari tanpa alasan. Stop 3% (1×ATR) masih terlalu ketat. Stop 15% tanpa mengecilkan size? Risiko per trade jadi $50 = 5% equity. ATR kasih jawaban: biarkan pasar bernafas 2 hari, ukur risikonya.
    kode: |
      equity, risk = 1000, 20       # $20 = 2%
      atr = 0.03
      stop = 2 * atr                # 6%
      size = risk / stop
      print(f"Stop {stop*100:.0f}% | size ${size:.0f} | risk ${size*stop:.0f}")
    hasil:
      - ret: -3.6
        dd: 3.6
        win: 22
        note: "Stop 1%: kena stop palsu 6x dalam sebulan (noise harian 3%!). -3.6% padahal arah benar."
      - ret: 7.5
        dd: 2.0
        win: 71
        note: "Stop 6%, size $333: 3 dari 4 trade profit, yang loss kena persis $20. Total +7.5%."
      - ret: -2.8
        dd: 4.5
        win: 45
        note: "Stop 15% tanpa kurangi size: risiko per trade $50 (5% equity). 2 loss berturut = -10%. Diam-diam bocor."
      - ret: 2.1
        dd: 4.4
        win: 40
        note: "Stop 3% (1×ATR): masih sering kena noise. 4 stop palsu, profit cuma +2.1%."
    petunjuk:
      - "Stop = 2 × ATR."
      - "Ukuran = risiko ÷ stop (desimal)."
  - id: "s17-2"
    judul: "Regime Berubah, Ukuran Ikut"
    emoji: "🌊"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Strategimu disetel di pasar tenang: ATR 1%, ukuran posisi $2.000 (risiko 2% equity $1.000, stop 2%). Tiba-tiba ATR naik ke **4%** (berita besar, pasar liar). Kamu tetap pakai ukuran $2.000 dengan stop 8% (2×ATR baru). Apa yang terjadi?
    pilihan:
      - "Aman — stop sudah disesuaikan 8%"
      - "Risiko per trade melonjak ke 8% equity — ukuran harus turun ke $500"
      - "Tidak masalah — ATR tinggi artinya peluang besar, perbesar ukuran"
      - "Hentikan trading sampai ATR normal lagi"
    jawaban: 1
    penjelasan: |
      Ukuran $2.000 × stop 8% = **$160 = 16% equity**. Jauh di atas aturan 2%! Stop naik 4x, ukuran tidak turun → risiko ikut naik 4x. Yang benar: risiko tetap $20. Ukuran = 20 ÷ 0.08 = **$250**. ATR naik 4x? Ukuran harus turun 4x. Bukan berhenti trading — regime liar juga kasih peluang. Tapi sesuaikan ukuran.
    kode: |
      risk = 20
      atr_old, atr_new = 0.01, 0.04
      stop_new = 2 * atr_new
      size_new = risk / stop_new
      print(f"Size baru: ${size_new:.0f} (dari $2000)")   # $250
    hasil:
      - ret: -14.5
        dd: 16.0
        win: 20
        note: "Ukuran tetap: 1 loss = -8% equity, 2 loss = -16%. Sebulan kemudian kamu nyerah di -14.5%."
      - ret: 6.2
        dd: 2.0
        win: 66
        note: "Size turun ke $250: risiko tetap $20. Regime liar justru kasih 2 trade besar, +6.2%."
      - ret: -21.0
        dd: 22.0
        win: 12
        note: "Perbesar ukuran di volatilitas tinggi = menggandakan risiko saat risiko sudah naik. -21%."
      - ret: 0.0
        dd: 0.0
        win: 35
        note: "Berhenti total = aman tapi kehilangan peluang. Regime liar tetap bisa ditradingkan dengan ukuran kecil."
    petunjuk:
      - "Hitung risiko aktual: size × stop baru."
      - "ATR naik 4x → ukuran turun 4x agar risiko tetap."
  - id: "s17-3"
    judul: "Bollinger Squeeze"
    emoji: "💥"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      TPIA: Bollinger bandwidth (lebar band ÷ MA20; MA20 = rata-rata harga 20 hari) **terendah dalam 2 tahun** — band menyempit ekstrem. Volume juga turun 30% dari rata-rata. Harga 3.800, tepat di tengah band. Kamu tahu squeeze sering diikuti breakout besar. Keputusan terbaik?
    pilihan:
      - "Beli sekarang — squeeze = breakout pasti naik"
      - "Short sekarang — kalau breakout, biasanya turun"
      - "Pasang order beli breakout di atas band atas (3.950) dengan stop di bawah squeeze low (3.700), ukuran kecil"
      - "Tunggu sampai bandwidth normal lagi, baru trade"
    jawaban: 2
    penjelasan: |
      Squeeze = energi terkumpul. Tapi ARAH breakout tidak bisa ditebak dari squeeze saja. Jawaban profesional: **trade the breakout, jangan tebak arah**. Entry saat harga menembus band atas. Stop di bawah low squeeze — risiko terukur. Breakout palsu (fakeout)? Stop ketat membatasi luka. Ukuran kecil — ini event berisiko. Beli/short di tengah = menebak. Menunggu bandwidth normal = kehilangan momentum breakout. Breakout besar biasanya muncul di awal ekspansi.
    kode: |
      entry = 3950      # breakout band atas
      stop = 3700       # di bawah low squeeze
      risk = (entry - stop) / entry
      print(f"Risiko per unit: {risk*100:.1f}%")   # 6.3% → size kecil
    hasil:
      - ret: -4.8
        dd: 5.5
        win: 30
        note: "Beli di tengah: breakout malah ke BAWAH (fakeout ke atas dulu). Kamu kena dua arah, -4.8%."
      - ret: -3.9
        dd: 4.5
        win: 28
        note: "Short di tengah: breakout ke atas. Teka-teki arah tanpa bukti = judi. -3.9%."
      - ret: 8.4
        dd: 1.2
        win: 74
        note: "Breakout ke atas terjadi (4.050 dalam 3 hari). Entry 3.950, stop 3.700. 1 fakeout kecil dulu, stop aman, +8.4%."
      - ret: 1.8
        dd: 0.0
        win: 40
        note: "Menunggu bandwidth normal: breakout sudah terjadi duluan (+9% dalam seminggu). Kamu ketinggalan momentum."
    petunjuk:
      - "Squeeze memberi tahu ENERGI, bukan ARAH."
      - "Entry breakout + stop di luar squeeze = risiko terukur."
  - id: "s17-4"
    judul: "Stop yang Ikut Naik"
    emoji: "🧭"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Entry CUAN 1.000, stop awal 960 (2×ATR, ATR 2%). Harga naik ke 1.200 (+20%). Kamu yakin trend belum selesai, tapi tidak mau profit hilang. Stop yang bagaimana sekarang?
    pilihan:
      - "Jual semua sekarang — +20% sudah besar"
      - "Geser stop naik ke 1.152 (2×ATR dari harga sekarang) — profit terkunci 15%, ruang naik terbuka"
      - "Biarkan stop di 960 — jangan ganggu rencana awal"
      - "Tambah posisi — trend sudah terbukti"
    jawaban: 1
    penjelasan: |
      Stop awal 960 dibuat saat entry. Fungsinya: membatasi rugi. Sekarang fungsinya selesai — posisi sudah profit 20%. Stop yang sama sekarang membiarkan profit hilang. Koreksi 18% akan mengembalikan harga ke 960. Profit lenyap, kamu keluar impas setelah perjalanan naik. Jawabannya: geser stop mengikuti harga (trailing = stop yang ikut naik). ATR sekarang 2% dari 1.200 = 24 poin. Stop baru = 1.200 − 48 = 1.152. Koreksi? Kamu keluar +15.2%. Trend lanjut? Stop ikut naik, profit makin besar. Jual semua = menutup trend yang masih sehat. Tambah posisi di +20% tanpa rencana = risiko membesar di harga tinggi. ATR untuk exit sama pentingnya dengan ATR untuk entry.
    kode: |
      harga = 1200
      atr = harga * 0.02          # ATR 2% dari harga
      stop_baru = harga - 2 * atr
      print(f"Stop baru: {stop_baru:.0f}")    # 1152
      print(f"Profit terkunci: {((stop_baru - 1000) / 1000) * 100:.1f}%")   # 15.2%
    hasil:
      - ret: 20.0
        dd: 0.0
        win: 40
        note: "Jual di 1.200. Harga lanjut ke 1.380 tanpa kamu. Profit aman, potensi terpotong."
      - ret: 27.0
        dd: 4.0
        win: 76
        note: "Harga lanjut ke 1.320, lalu koreksi. Stop geser keluar di 1.270: +27% terkunci."
      - ret: -4.0
        dd: 20.0
        win: 22
        note: "Koreksi dalam ke 950. Stop awal kena di 960. Profit 20% sempat ada, lalu hilang."
      - ret: 6.0
        dd: 16.0
        win: 18
        note: "Tambah di 1.200: koreksi menghantam posisi baru. Sisa profit cuma +6%."
    petunjuk:
      - "Stop awal dibuat untuk apa? Tugasnya sudah selesai?"
      - "Geser stop = berapa poin di bawah harga sekarang?"
  - id: "s17-5"
    judul: "Target yang Tidak Layak"
    emoji: "🎯"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      BTC di 60.000. ATR 14 hari = 1.200, sekitar 2%. Sinyal long muncul. Stop standarmu 2×ATR = 2.400. Dari 40 sinyal sejenis: 55% profit. Harga jarang sampai lebih dari 1,5×ATR = 1.800. Trade ini layak?
    pilihan:
      - "Entry. Win rate 55% lebih tinggi dari lempar koin"
      - "Skip. Target maks 1.800, stop 2.400. Hadiah lebih kecil dari risiko"
      - "Entry, target 1.200. Profit kecil tapi sering"
      - "Entry besar. ATR 2% kecil, risiko tetap terkendali"
    jawaban: 1
    penjelasan: |
      RR (rasio hadiah ÷ risiko) = 1.800 ÷ 2.400 = 0,75. Hadiah lebih kecil dari risiko. EV (ekspektasi per trade: win% × hadiah - loss% × risiko) = 0,55 × 1.800 - 0,45 × 2.400 = 990 - 1.080 = -90. Negatif. Tiap trade rata-rata rugi 90 poin. Win rate 55% butuh RR minimal 0,82 agar EV nol. 0,75 di bawah garis itu. Target 1.200? RR 0,5, makin parah. Entry besar di EV negatif = memperbesar luka. Setup ini tidak layak. Skip, atau tunggu entry dengan stop lebih dekat. Contoh: pullback dengan stop 1×ATR dan target 2×ATR. Itu rasio yang sehat.
    kode: |
      atr = 1200
      stop = 2 * atr        # 2.400
      target = 1.5 * atr    # 1.800, maks historis
      ev = 0.55 * target - 0.45 * stop
      print(f"RR {target / stop:.2f} | EV {ev:+.0f} poin")
    hasil:
      - ret: -4.2
        dd: 6.0
        win: 30
        note: "20 trade dijalankan: net -4,2%. EV negatif terbukti di live."
      - ret: 0.0
        dd: 0.0
        win: 68
        note: "Skip. Seminggu kemudian ada pullback: stop 1×ATR, target 2×ATR. Entry di situ, +6,4%."
      - ret: -5.0
        dd: 5.5
        win: 25
        note: "Target 1.200: RR 0,5. 20 trade: -5%. Target kecil tidak menolong EV negatif."
      - ret: -8.0
        dd: 8.0
        win: 12
        note: "Size besar di EV negatif: 20 trade -8%. Risiko terkendali, tapi arahnya salah."
    petunjuk:
      - "Bandingkan target maksimum dengan jarak stop."
      - "Win rate 55% butuh RR minimal berapa agar EV positif?"
