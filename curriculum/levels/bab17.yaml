  - id: "s17-9"
    judul: "Posisi di Pita Bollinger"
    emoji: "📶"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      CUAN: MA20 = 4.000, band Bollinger (MA20 ± 2 std): atas 4.160, bawah 3.840.
      Empat bulan terakhir harga memantul 3.850-4.150, ADX 15. Harga sekarang
      4.140. %B = (harga − band bawah) ÷ (band atas − band bawah) = 0,94. RSI 65.
      Kamu mau main range. Rencana terbaik?
    pilihan:
      - "Long — mendekati band atas = breakout"
      - "Short 4.140, stop 4.180 (di atas band), target 4.000 (middle): risk 40, reward 140, RR 3,5"
      - "Short tanpa stop — band atas = resistance pasti"
      - "Skip — %B 0,94 sudah 6x terjadi, yang ke-7 pasti tembus"
    jawaban: 1
    penjelasan: |
      ADX 15 = tidak ada trend = regime range. Di range: jual di daerah band atas,
      beli di band bawah. %B 0,94 = harga sudah menempuh 94% jarak dari bawah ke
      atas — dekat ekstrem atas. Entry short 4.140, stop di atas band (4.180):
      kalau breakout beneran, keluar −40 poin (0,97%). Target middle band 4.000:
      reward 140 poin. RR = 140 ÷ 40 = 3,5. Enam kali menyentuh atas dan bertahan =
      bukti range kuat, bukan alasan "pasti tembus" (gambler's fallacy). Long di
      band atas = membeli di resistance range. Tanpa stop = melanggar aturan. %B
      tinggi di range = zona jual, bukan beli.
    kode: |
      entry = 4140
      stop = 4180
      target = 4000
      risk = stop - entry
      reward = entry - target
      print(f"Risk {risk} poin | Reward {reward} poin | RR {reward/risk:.1f}")
    hasil:
      - ret: -3.0
        dd: 4.0
        win: 20
        note: "Long di 4.140: harga balik ke 3.980. Stop di bawah MA20 kena. Range tetap range."
      - ret: 3.4
        dd: 1.0
        win: 70
        note: "Harga balik: target 4.000 kena dalam 5 hari. +140 poin (3,4%) dengan risk 40."
      - ret: -1.9
        dd: 2.5
        win: 25
        note: "Harga sempat 4.220: tanpa stop kamu panik dan tutup −1,9%. Itu judi, bukan sistem."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Gambler's fallacy: 6x bertahan = range makin kuat. Peluang RR 3,5 dilewatkan."
    petunjuk:
      - "%B 0,94 di regime range: harga ada di zona apa?"
      - "Hitung RR: (4.180 − 4.140) vs (4.140 − 4.000)."
  - id: "s17-10"
    judul: "Stop Palsu dalam Angka"
    emoji: "🎣"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Backtest 3 tahun TLKM, dua versi stop. Stop fixed 5%: 90 trade, 68% kena stop
      lalu harga balik (stop palsu), win 40%, win rata-rata +3,2%, loss −5%. Stop
      2×ATR: 74 trade, stop palsu 45%, win 55%, win rata-rata +3,5%, loss −4,8%.
      Berapa EV per trade masing-masing, dan apa kesimpulannya?
    pilihan:
      - "Fixed −1,72% vs ATR −0,23% — dua-duanya negatif, stop tidak penting"
      - "Fixed −1,72% vs ATR −0,23% — ATR 7x lebih baik tapi masih negatif: tambah filter arah, stop fixed = bunuh diri pelan"
      - "Fixed +0,6% — lebih banyak trade lebih untung"
      - "ATR +3,5% — pakai ATR, selesai"
    jawaban: 1
    penjelasan: |
      EV = win% × win rata-rata − loss% × loss rata-rata. Fixed: 0,4×3,2 − 0,6×5 =
      1,28 − 3,0 = −1,72% per trade. ATR: 0,55×3,5 − 0,45×4,8 = 1,93 − 2,16 =
      −0,23%. Stop fixed kalah telak: 68% stop palsu — keluar tepat sebelum harga
      balik. ATR 7x lebih baik, TAPI masih negatif: strategi dasarnya belum punya
      edge. Pelajaran: stop 2×ATR menyelamatkanmu dari stop palsu, tapi stop tidak
      menciptakan edge. EV masih negatif? Tambah filter arah (trend) atau akui
      strategi ini gagal. "+3,5%" = lupa loss. "+0,6%" = salah hitung.
    kode: |
      ev_fixed = 0.4 * 3.2 - 0.6 * 5.0
      ev_atr = 0.55 * 3.5 - 0.45 * 4.8
      print(f"EV fixed 5%: {ev_fixed:+.2f}% | EV 2xATR: {ev_atr:+.2f}%")
    hasil:
      - ret: -12.0
        dd: 10.0
        win: 20
        note: "Kamu abaikan: −1,72% per trade selama 2 tahun = akun menyusut parah."
      - ret: 5.0
        dd: 4.0
        win: 66
        note: "Ganti 2×ATR + filter ADX: stop palsu turun ke 30%, EV jadi +0,4%. Setahun +5%."
      - ret: -15.0
        dd: 12.0
        win: 15
        note: "Fixed dipertahankan: 90 trade × −1,72% — makin sering, makin cepat rugi."
      - ret: -2.5
        dd: 5.0
        win: 30
        note: "2×ATR saja tanpa filter: −0,23% per trade = masih bocor. Setahun −2,5%."
    petunjuk:
      - "EV = win% × win rata-rata − loss% × loss rata-rata, untuk dua versi stop."
      - "Stop palsu 68% vs 45%: apa akibatnya ke EV?"
      - "EV masih negatif setelah ganti stop — apa artinya?"
