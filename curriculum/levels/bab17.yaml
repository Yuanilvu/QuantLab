    judul: "Stop untuk Saham Liar"
    emoji: "🛑"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      CUAN: harga 1.500, ATR(14) = 3% per hari. Aturanmu: risiko maksimal 2% equity per trade. Equity $1.000. Berapa jarak stop yang masuk akal dan ukuran posisinya?
    pilihan:
      - "Stop 1% — ketat, biar cepat cut kalau salah"
      - "Stop 6% (2×ATR), ukuran $333 — risiko tetap 2% equity"
      - "Stop 15% — biar tidak gampang kena stop"
      - "Stop 3% (1×ATR), ukuran $667"
    jawaban: 1
    penjelasan: |
      Stop 2×ATR = 6%. Ukuran = risiko ÷ stop% = $20 ÷ 0.06 = **$333**. Stop kena? Rugi = 6% × $333 = $20 = 2% equity — persis aturan. Stop 1%? Kena noise harian. CUAN bisa gerak 3% sehari tanpa alasan. Stop 3% (1×ATR) masih terlalu ketat. Stop 15% tanpa mengecilkan size? Risiko per trade jadi $50 = 5% equity. ATR kasih jawaban: biarkan pasar bernafas 2 hari, ukur risikonya.
    kode: |
      equity = 1000
      risk = 20               # $20 = 2% equity
      atr = 0.03
      stop = 2 * atr          # 6%
      size = risk / stop
      print(f"Stop {stop*100:.0f}% | size ${size:.0f} | risk ${size*stop:.0f}")
