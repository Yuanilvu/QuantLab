pelajaran:
  - id: "5-1"
    judul: "Bandingkan Angka"
    menit: 5
    materi: |
      Komputer mengambil keputusan dengan MEMBANDINGKAN angka. Hasilnya selalu `True` (benar) atau `False` (salah):

      - `10 > 5` → True (10 lebih besar dari 5)
      - `3 < 3` → False (3 TIDAK lebih kecil dari 3)
      - `4 >= 4` → True (lebih besar ATAU sama dengan)
      - `5 == 5` → True (sama dengan — pakai DUA tanda sama dengan!)
      - `5 != 3` → True (tidak sama dengan)

      Hati-hati: satu `=` untuk menyimpan (`harga = 4000`). Dua `==` untuk membandingkan (`harga == 4000`).

      Di trading: "harga >= target" → True artinya saatnya eksekusi. Bot tiap detik membandingkan harga pasar dengan aturanmu. Aturan jelas? Bot bisa mengambil keputusan sendiri.
    kode: |
      harga = 4050
      target = 4000
      print(f"Target tercapai? {harga >= target}")   # True — target tercapai!
      print(f"Harga tepat 4000? {harga == 4000}")    # False — 4050 bukan 4000
    penjelasan: "Perbandingan menghasilkan True/False. Bot = kumpulan perbandingan + keputusan."
  - id: "5-2"
    judul: "Jika-Maka: Keputusan Komputer"
    menit: 5
    materi: |
      Struktur `if` (jika) membuat program memilih:

      ```python
      harga = 4100
      target_jual = 4000
      if harga >= target_jual:
          print("JUAL")       # ini jalan kalau kondisi True
      else:
          print("TAHAN")      # ini jalan kalau False
      ```

      Aturan penting Python: baris di dalam `if` harus **menjorok ke dalam (indentasi)** — biasanya 4 spasi. Python sangat tegas soal ini.

      Bisa juga berantai dengan `elif` (else if):
      ```python
      if harga > 4200:
          print("OVER TARGET")
      elif harga >= 4000:
          print("JUAL")
      else:
          print("TAHAN")
      ```

      Ini persis cara trader berpikir. Bedanya: sekarang bisa dijalankan bot 24 jam tanpa emosi. Aturan = kondisi. Disiplin = selalu menjalankan `if` yang sudah disepakati.
    kode: |
      harga = 4100
      if harga >= 4000:
          print("JUAL")
      else:
          print("TAHAN")
      # JUAL
    penjelasan: "if/elif/else = aturan keputusan. Indentasi 4 spasi wajib. Bot = aturan yang dijalankan konsisten."
