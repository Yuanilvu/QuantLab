      `harga` = 3900. Cek: 3900 >= 4000? **False**. 3900 lebih kecil dari 4000. Karena False, blok `else` yang jalan → cetak **TAHAN**.

      Bot hanya menjalankan SATU cabang. Kondisi benar → `if`. Salah → `else`. Tidak pernah dua-duanya. Ini logika dasar semua sistem trading otomatis.
    kode: |
      harga = 3900
      if harga >= 4000:
          print("JUAL")    # tidak jalan
