        win: 44
        note: "BRPT: return 9.8% tapi DD 18.7% — setengah jalan kamu menyerah di DD 12%. Efisiensi buruk."
      - ret: 0.0
        dd: 0.0
        win: 35
        note: "'Sama saja' = mengabaikan risiko. Kamu pilih BRPT secara acak dan dapat DD 18.7%."
      - ret: -6.5
        dd: 22.0
        win: 30
        note: "'Std besar = naik cepat' salah arah: BRPT turun 8% dalam 2 minggu di bulan 3. Volatilitas dua arah."
    petunjuk:
      - "Hitung return ÷ std untuk keduanya."
      - "Strategi std kecil bisa di-leverage; std besar tidak."
  - id: "s16-2"
    judul: "Return 3-Sigma Hari Ini"
    emoji: "📡"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Bot strategimu: 200 hari terakhir, return harian mean +0.05%, std 1.2%. Hari ini bot mencetak **+3.6%** — itu z-score ≈ 3 (hampir 3 std di atas rata-rata). Kamu lihat dan berpikir "ini sinyal ajaib, perbesar posisi besok!"
    pilihan:
      - "Perbesar posisi — z=3 artinya edge besar sedang terjadi"
      - "Jangan ubah apa pun — z=3 terjadi ~1 dari 333 hari; dengan 200 hari sampel, ini masih dalam kewajaran"
      - "Kurangi posisi — pasti ada yang salah"
      - "Matikan bot — strategi sudah tidak normal"
    jawaban: 1
    penjelasan: |
      Di distribusi normal, z=3 muncul dengan probabilitas ~0.3% ≈ **1 dari 333 hari**. Sampel 200 hari kamu bahkan BELUM cukup untuk melihat z=3. Jadi kemunculan hari ini wajar secara statistik — bukan bukti strategi berubah. Overreact = sizing naik di titik risiko tertinggi. Mean reversion bisa memukul besok. Evaluasi strategi pakai sampel panjang + out-of-sample, bukan satu hari ekstrem. (Kecuali z=4+ atau berulang — itu baru perlu diselidiki.)
    kode: |
      mean = 0.05
      std = 1.2
      today = 3.6
      z = (today - mean) / std
      print(f"z = {z:.1f}")          # 3.0
      # P(z>3) ≈ 0.13% → ~1 dari 769 hari (satu sisi)
      # Kesimpulan: wajar, jangan ubah strategi
    hasil:
      - ret: -3.2
        dd: 5.5
        win: 28
        note: "Perbesar posisi 3x: besok -1.1% (mean reversion). Kamu kehilangan 3.2% dalam 2 hari dari satu keputusan emosional."
      - ret: 6.8
        dd: 2.1
        win: 72
        note: "Tidak mengubah apa pun: bot lanjut normal, +6.8% sebulan berikutnya. Hari ekstrem itu cuma noise."
      - ret: 1.2
        dd: 2.0
        win: 40
        note: "Kurangi posisi di hari terbaik = memotong keuntungan yang sah. +1.2% saja, ketinggalan rally."
      - ret: -1.5
        dd: 1.5
        win: 20
        note: "Mematikan bot karena satu hari bagus = reaksi terbalik. Bot yang konsisten justru perlu dipertahankan."
    petunjuk:
      - "Berapa frekuensi kejadian z=3?"
      - "Satu hari ekstrem ≠ bukti strategi berubah."
  - id: "s16-3"
    judul: "Interval Kepercayaan Win Rate"
    emoji: "🎯"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Strategi barumu: 30 trade, 18 menang (**60% win rate**). Kamu mau klaim "strategi ini menang lebih sering daripada kalah". Standar error win rate = √(0.6×0.4÷30) ≈ 8.9%. Interval kepercayaan = rentang di mana nilai asli kemungkinan besar berada. Berapa interval kepercayaan 95% dari win rate asli, dan apakah klaimmu valid?
    pilihan:
      - "60% ± 8.9% → 51-69%; klaim valid, 50% di luar interval"
      - "60% ± 17.8% → 42-78%; klaim BELUM valid — 50% masih ada di dalam interval"
      - "60% ± 4.5% → 55-65%; sangat valid"
      - "60% ± 30% → 30-90%; tidak ada yang bisa disimpulkan dari apa pun"
    jawaban: 1
    penjelasan: |
      Interval kepercayaan 95% ≈ mean ± 2×SE = 60% ± 17.8% = **42% - 78%**. 50% (tidak punya edge) MASIH ada di dalam interval. Artinya kamu **belum bisa membuktikan** strategi ini menang lebih sering dari kalah. Butuh sampel lebih besar. Dengan 30 trade, butuh win rate ≥ 68% untuk keluar dari interval (SE 8.9% → 68% − 2×8.9% = 50.2%). Ini alasan kenapa backtest 30 trade tidak bisa dijual sebagai bukti. Statistik butuh ratusan trade.
    kode: |
      jumlah_trade = 30
      win_rate = 0.6
      se = (win_rate * (1 - win_rate) / jumlah_trade) ** 0.5
      batas_bawah = (win_rate - 2 * se) * 100
      batas_atas = (win_rate + 2 * se) * 100
      print(f"CI 95%: {batas_bawah:.0f}% - {batas_atas:.0f}%")   # 42% - 78%
      print("50% dalam CI → belum ada bukti edge")
    hasil:
      - ret: -8.0
        dd: 8.0
        win: 25
        note: "Kamu all-in dengan 'strategi 60%': win rate asli 52% (kebetulan sampel). 6 bulan kemudian -8%."
      - ret: 5.5
        dd: 3.0
        win: 70
        note: "Kamu tahu belum terbukti: jalanin modal kecil sambil kumpulkan 100 trade lagi. Win rate asli 58% → terbukti, sizing naik."
      - ret: -5.0
        dd: 5.0
        win: 30
        note: "SE 4.5% itu salah hitung (SE = √(p(1-p)/n), bukan p(1-p)/n). Kepercayaan palsu = modal dipertaruhkan tanpa bukti."
      - ret: 0.0
        dd: 0.0
        win: 45
        note: "30-90% itu interval satu std (68%), bukan 95% — tapi kesimpulan 'belum bisa disimpulkan' sebenarnya benar arahnya."
    petunjuk:
      - "CI 95% ≈ mean ± 2×SE."
      - "Kalau 50% masih di dalam interval, edge belum terbukti."
  - id: "s16-4"
    judul: "Jatuh 5 Sigma"
    emoji: "🚨"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      BTC: return harian rata-rata +0.1%, std 2%. Hari ini BTC turun 9.9%. Berarti z = −5 (lima standar deviasi di bawah rata-rata). Kamu melihat harga "diskon 10%". Apa langkah terbaik?
    pilihan:
      - "Beli besar — diskon 10%, pasti balik"
      - "Jangan beli dulu — z = −5 hampir mustahil dari gerak normal. Pasti ada kabar besar. Cari tahu dulu"
      - "Short — ikut momentum jatuh"
      - "Abaikan — besok normal lagi"
    jawaban: 1
    penjelasan: |
      z = (−9.9 − 0.1) ÷ 2 = −5. Kejadian di luar 3 sigma cuma sekitar 0.3%. z = −5 hampir mustahil dari gerak normal harian. Pasar punya ekor gemuk, tapi tetap: jatuh sebesar itu hampir selalu ada pemicunya. Kabar buruk, kepanikan, atau likuidasi beruntun. Beli "diskon" tanpa tahu pemicunya = menangkap pisau jatuh. Bisa turun 10% lagi. Short juga berbahaya: setelah jatuh ekstrem, bounce 5% dalam sejam itu biasa. Stop short bisa tersapu. Langkah benar: cari tahu kabarnya dulu. Tunggu harga stabil 1-2 hari. Baru nilai entry dengan stop yang jelas.
    kode: |
      mean = 0.1
      std = 2.0
      z = (-9.9 - mean) / std
      print(f"z = {z:.1f}")    # -5.0
      print("z di bawah -4 → ada kabar besar, bukan noise")
    hasil:
      - ret: -8.0
        dd: 8.0
        win: 15
        note: "Kabar ternyata berat. Harga turun 8% lagi. Diskon berubah jadi pisau jatuh."
      - ret: 2.0
        dd: 0.5
        win: 74
        note: "Kamu menunggu 2 hari, harga stabil. Entry kecil dengan stop. Rebound +2%."
      - ret: -4.0
        dd: 5.0
        win: 20
        note: "Bounce 6% dalam sehari. Stop short kena. Dua arah berbahaya tanpa kabar."
      - ret: -3.0
        dd: 6.0
        win: 25
        note: "Besok turun 3% lagi. 'Besok normal' = meremehkan ekor gemuk."
    petunjuk:
      - "Berapa z-score dari -9.9%?"
      - "Pergerakan 5 sigma biasanya karena apa?"
  - id: "s16-5"
    judul: "Satu Trade Menentukan Semua"
    emoji: "⚡"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Backtest 6 bulan strategimu: 80 trade, return +15%. Satu trade menyumbang +11%. Trade itu terjadi saat berita besar, harga gap, untung sekali jalan. Tanpa trade itu, return tinggal +4%. Kamu mau pasang modal dari angka ini. Keputusanmu?
    pilihan:
      - "Pasang normal. +15% itu hasil nyata, trade beruntung tetap sah"
      - "Jangan andalkan trade itu. Edge inti cuma +4%. Selidiki dulu bisa berulang atau tidak"
      - "Buang hari-hari berita dari backtest. Angka jadi bersih"
      - "Perbesar posisi. Satu trade bisa +11%, itu potensi strategi"
    jawaban: 1
    penjelasan: |
      Satu angka ekstrem bisa menggeser rata-rata. Ini outlier, titik data ekstrem yang jauh dari kumpulan lainnya. 11 dari 15 = 73% profit berasal dari satu trade. Itu bukan edge harian. Itu kejadian langka: berita besar, gap, likuidasi beruntun. Hitung ulang: 15 - 11 = 4%. Edge inti cuma +4% per 6 bulan. Kecil. Perbesar posisi karena satu outlier = bertaruh pada kejadian yang tidak bisa direncanakan. Buang hari berita = bias baru. Hari itu tetap datang di live. Evaluasi yang benar: pisahkan return rutin dan return outlier. Tanya: pemicunya bisa berulang? Sizing pakai angka yang rutin. Outlier dihitung sebagai bonus, bukan dasar.
    kode: |
      total = 15.0      # return 6 bulan (%)
      outlier = 11.0    # satu trade terbaik
      inti = total - outlier
      print(f"Edge inti: {inti:.1f}% dari {total:.0f}%")
    hasil:
      - ret: 1.8
        dd: 6.5
        win: 35
        note: "6 bulan berikutnya cuma +1,8%. Outlier tidak terulang, ekspektasi keliru."
      - ret: 8.0
        dd: 2.2
        win: 74
        note: "Size moderat dari edge inti 4%. 6 bulan: +8%, termasuk satu trade berita yang terulang."
      - ret: 3.0
        dd: 3.0
        win: 45
        note: "Backtest bersih, tapi live tetap kena hari berita. Angka bersih menipu. +3%."
      - ret: -12.0
        dd: 12.0
        win: 12
        note: "Sizing 3x: dua loss beruntun saat volatil = -12%. Kamu berhenti."
    petunjuk:
      - "Berapa return tanpa satu trade terbesar?"
      - "Bisakah kamu mengandalkan kejadian yang tidak bisa direncanakan?"


  - id: "s16-6"
    judul: "Di Luar Dua Sigma"
    emoji: "🎚️"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Return harian strategimu: mean +0,1%, std 1%. Aturan praktis distribusi
      normal: dalam ±1 std sekitar 68% hari, dalam ±2 std sekitar 95%. Hari ini
      return +2,4%. Seberapa sering hari se-ekstrem ini muncul?
    pilihan:
      - "Di luar ±2 std sekitar 5% — 1 dari 20 hari. Wajar, jangan overreact"
      - "0,3% — sangat langka, pasti ada kabar besar"
      - "32% — sering terjadi"
      - "50% — setengah hari"
    jawaban: 0
    penjelasan: |
      z = (2,4 − 0,1) ÷ 1 = 2,3. Distribusi normal: ±2 std mencakup 95% kejadian.
      Di luar = 5% (sekitar 2,5% tiap sisi). Artinya hari seperti ini muncul
      kira-kira 1 dari 20 hari — dalam setahun trading (252 hari) sekitar 12 kali.
      Bukan anomali, bukan kabar. Reaksi yang benar: tidak melakukan apa-apa.
      "0,3%" = patokan ±3 std, bukan ±2. "32%" = patokan ±1 std. Overreact ke hari
      2σ = mengganti strategi karena noise.
    kode: |
      mean = 0.1
      std = 1.0
      z = (2.4 - mean) / std
      print(f"z = {z:.1f} — di luar 2 std")
      print("Kejadian di luar 2 std: sekitar 5% hari — rutin, bukan anomali")
    hasil:
      - ret: 6.0
        dd: 2.0
        win: 73
        note: "Kamu biarkan sistem jalan: bulan itu +6%. Hari 2σ cuma noise."
      - ret: -2.0
        dd: 4.0
        win: 20
        note: "Kamu cari kabar yang tidak ada, matikan bot di hari bagus. Ketinggalan 1,5% minggu itu."
      - ret: -3.0
        dd: 5.0
        win: 22
        note: "Kamu takut di hari normal dan sering memotong posisi bagus lebih awal."
      - ret: -1.5
        dd: 3.0
        win: 25
        note: "50% = tidak paham distribusi. Hari 2σ diperlakukan sama dengan hari biasa."
    petunjuk:
      - "z = (2,4 − 0,1) ÷ 1 = ?"
      - "Berapa persen kejadian di luar ±2 std?"
  - id: "s16-7"
    judul: "Volatilitas Naik, z Berubah"
    emoji: "🧊"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Botmu: mean return harian +0,1%. Enam bulan lalu std 0,5%, sekarang std 2%
      (volatilitas naik 4x). Hari ini bot mencetak +1,4%. Dashboardmu masih memakai
      std lama: z = (1,4 − 0,1) ÷ 0,5 = 2,6 — "langka, perbesar posisi!". Apa yang
      sebenarnya terjadi?
    pilihan:
      - "Memang langka — z 2,6, manfaatkan momentum"
      - "z dengan std baru = 0,65 — hari normal. Dashboard std basi bikin salah baca, jangan ubah posisi"
      - "Bot rusak — mean harus ikut naik"
      - "Kurangi posisi — z 2,6 artinya overbought"
    jawaban: 1
    penjelasan: |
      z dihitung dengan std PERIODE ITU. Volatilitas naik 4x (0,5% → 2%), pergerakan
      1,4% sekarang cuma 0,65 std — kejadian normal, muncul hampir tiap minggu.
      Dashboard yang memakai std lama menyesatkan: z 2,6 itu artefak. Pergerakan
      sama, konteks beda. Kalau kamu perbesar posisi karena z palsu, kamu menambah
      risiko tepat saat volatilitas sudah 4x lipat. Hitung ulang std dengan window
      terbaru secara berkala. Volatilitas tinggi = std besar = z kecil untuk
      pergerakan yang sama. Mean tidak ikut naik — bot tidak rusak, std-mu yang
      basi.
    kode: |
      mean = 0.1
      z_lama = (1.4 - mean) / 0.5
      z_baru = (1.4 - mean) / 2.0
      print(f"z std lama: {z_lama:.1f} | z std baru: {z_baru:.2f}")
      print("Pakai std terkini — 0,65 = hari biasa")
    hasil:
      - ret: -3.5
        dd: 6.0
        win: 20
        note: "Posisi 2x di pasar yang std-nya 4x lipat: koreksi 1,5% = −6% equity. Dashboard basi."
      - ret: 5.0
        dd: 2.5
        win: 70
        note: "Dashboard diperbaiki, posisi tetap: +5% sebulan. z yang benar bikin tenang."
      - ret: -2.0
        dd: 4.0
        win: 25
        note: "Mean harian tetap 0,1%. Bot tidak rusak — std-mu yang basi."
      - ret: -1.0
        dd: 3.0
        win: 30
        note: "z bukan RSI. Salah alat baca, keputusan ikut salah."
    petunjuk:
      - "Hitung ulang z dengan std 2%."
      - "Kalau std naik 4x, pergerakan yang sama jadi lebih biasa atau lebih langka?"
  - id: "s16-8"
    judul: "Berapa Hari untuk Membuktikan"
    emoji: "🔭"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Estimasi edge harianmu 0,1% (mean return). Volatilitas harian (std) 1%.
      Standar error mean = std ÷ √n. Supaya edge terbukti (standar error = setengah
      edge = 0,05%), butuh berapa hari sampel?
    pilihan:
      - "40 hari — 1 ÷ 0,05 × 2"
      - "400 hari — (1 ÷ 0,05)² = 400, sekitar 1,5 tahun trading"
      - "100 hari — 1 ÷ 0,01"
      - "20 hari — 0,1% ÷ 0,05%"
    jawaban: 1
    penjelasan: |
      Standar error mean = std ÷ √n = 1 ÷ √n. Target: SE = 0,05% — setengah edge —
      supaya mean 0,1 jelas beda dari nol: 0,1 ± 2×0,05 tepat tidak menyentuh nol.
      1 ÷ √n = 0,05 → √n = 20 → n = 400 hari, sekitar 1,5 tahun trading. Artinya:
      dengan volatilitas 10x lipat edge, 100 hari data TIDAK cukup membuktikan
      apa-apa — padahal itu 4-5 bulan. Ini kenapa strategi baru wajib ukuran kecil
      dulu: bukti statistik butuh waktu. "40 hari" = salah aljabar. "100 hari" =
      SE 0,1, sama besar dengan edge: kesimpulan goyah. "20 hari" = anekdot.
    kode: |
      std = 1.0
      target_se = 0.05
      n = (std / target_se) ** 2
      print(f"Butuh sampel: {n:.0f} hari")
    hasil:
      - ret: -4.0
        dd: 8.0
        win: 18
