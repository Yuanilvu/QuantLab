  - id: "s16-9"
    judul: "Volatilitas Bulanan"
    emoji: "⏫"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Return harian strategimu std 1,5%. Satu bulan trading = 21 hari. Syaratmu:
      dengan patokan ±2 std (sekitar 95%), loss bulanan tidak boleh lebih dari
      10%. Berapa std bulananmu sekarang, dan apakah ukuran posisi perlu diubah?
    pilihan:
      - "Std bulanan 31,5% (×21) — jauh di atas batas, berhenti trading"
      - "Std bulanan 6,9%; 2 std = 13,7% lebih dari 10%. Turunkan ukuran ke sekitar 73%"
      - "Std bulanan 6,9%; 2 std = 13,7% — masih aman, tidak perlu ubah"
      - "Std bulanan 0,33% (÷21) — sangat aman"
    jawaban: 1
    penjelasan: |
      Volatilitas tumbuh dengan akar waktu: std bulanan = 1,5 × √21 = 6,87%.
      Dengan patokan ±2 std, batas loss bulanan = 2 × 6,87 = 13,7% — di atas batas
      10%. Supaya 2 std = 10%, std bulanan harus ≤ 5%: faktor ukuran = 5 ÷ 6,87 =
      0,73. Turunkan ukuran sekitar 27%. Ini vol targeting: risiko diatur dari
      angka, bukan perasaan. "31,5%" (×21) = salah: volatilitas tidak linear
      terhadap waktu. "÷21" = arah terbalik. Setelah ukuran turun, expected return
      ikut turun sekitar 27% — harga wajar untuk batas risiko.
    kode: |
      std_harian = 1.5
      std_bulanan = std_harian * 21 ** 0.5
      batas_2std = 2 * std_bulanan
      faktor = 5.0 / std_bulanan
      print(f"Std bulanan: {std_bulanan:.2f}% | 2 std: {batas_2std:.1f}%")
      print(f"Faktor ukuran: {faktor*100:.0f}%")
    hasil:
