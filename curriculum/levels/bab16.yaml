# ============================================================
# BAB 16 — STATISTIK TRADING
# Mean, volatilitas (std dev), z-score, interval kepercayaan.
# Bahasa angka yang dipakai semua strategi kuantitatif.
# ============================================================
bab: 16
track: quant
judul: "Statistik Trading"
emoji: "📐"
deskripsi: "Semua strategi quant pada akhirnya bicara angka. Rata-rata, volatilitas, seberapa yakin kamu pada sampelmu. Ini bahasa ibunya."
pelajaran:
  - id: "16-1"
    judul: "Rata-rata & Volatilitas"
    menit: 5
    materi: |
      Dua angka pertama dari SERANGKAIAN return:

      - **Mean (rata-rata)**: return tipikal per periode. Positif = strategi menghasilkan.
      - **Std dev / volatilitas**: seberapa lebar return menyebar dari rata-rata. Ini ukuran RISIKO.

      Contoh: strategi dengan return harian rata-rata +0.1%, std 1.5%. Mayoritas hari return-nya antara -1.4% sampai +1.6% (mean ± 1 std ≈ 68% kejadian). Hari lebih ekstrem dari ±2 std cuma ~5% dari waktu.

      Gabungan keduanya = **Sharpe ratio** (return ÷ std). Mean sama, std lebih kecil = lebih baik. Yang std-nya kecil bisa kamu leverage tanpa risiko hancur. Volatilitas menentukan segalanya: sizing, stop, ekspektasi drawdown.

      Aturan praktis: angka rata-rata bagus? SELALU tanya "berapa std-nya?". Strategi +2%/bulan dengan std 8% sangat beda dari +2%/bulan std 2%.
    kode: |
      returns = [0.3, -0.2, 0.5, 0.1, -0.4, 0.6, 0.2]
      mean = sum(returns) / len(returns)
      var = sum((ret_harian - mean) ** 2 for ret_harian in returns) / len(returns)
      std = var ** 0.5
      print(f"mean {mean:.2f}% | std {std:.2f}%")
    penjelasan: "Mean = harapan, std = risiko. Dua-duanya wajib dilaporkan bareng, tidak bisa sendiri-sendiri."
  - id: "16-2"
    judul: "Z-Score: Berapa Langka Kejadian Ini?"
    menit: 5
    materi: |
      Z-score menjawab: "return hari ini (atau pergerakan harga) berapa standar deviasi dari normal?"

      `z = (nilai - mean) / std`

      - z = 1 → kejadian normal (~68% data di dalam ±1)
      - z = 2 → agak langka (~95% di dalam ±2)
      - z = 3 → SANGAT langka (~99.7% di dalam ±3) — terjadi ~1 dari 333 hari
      - z = 4+ → hampir mustahil di distribusi normal. Tapi pasar punya ekor gemuk (kejadian ekstrem lebih sering dari perkiraan) — tetap bisa terjadi

      Guna praktis:
      1. **Deteksi anomali**: pergerakan z=4 kemungkinan ada kabar besar, bukan noise.
      2. **Mean reversion** (harga cenderung balik ke rata-rata): z=-3 dari mean jangka panjang sering memantul. Tapi hati-hati — bisa terus menjauh.
      3. **Konfirmasi regime**: volatilitas tinggi = std besar = z-score kecil untuk pergerakan yang sama.

      Jangan overreact pada z=2 — itu masih wajar (5%). Pasar tiap hari punya puluhan z=2.
    kode: |
      mean = 0.05
      std = 1.2
      z = (3.6 - mean) / std
      print(f"z = {z:.1f}")        # 3.0 — langka, tapi bukan mustahil
    penjelasan: "Z-score memberi konteks: 2σ = wajar, 3σ = langka, 4σ+ = ada kabar. Jangan overreact sebelum 3σ."
skenario:
  - id: "s16-1"
    judul: "Dua Saham, Return Sama"
    emoji: "⚖️"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Dua kandidat untuk modal kecil kamu (data 6 bulan):
      - **ALII**: return harian rata-rata +0.10%, std 1.5%
      - **BRPT**: return harian rata-rata +0.10%, std 4.2%
      Rata-rata sama persis. Mana yang lebih menarik secara risk-adjusted?
    pilihan:
      - "ALII — return sama, risiko jauh lebih kecil (Sharpe lebih tinggi)"
      - "BRPT — volatilitas tinggi = peluang besar"
      - "Sama saja — rata-rata return-nya identik"
      - "BRPT — std besar artinya bisa naik lebih cepat"
    jawaban: 0
    penjelasan: |
      Sharpe ALII = 0.10/1.5 = **0.067**. BRPT = 0.10/4.2 = **0.024**. Return sama, tapi ALII 2.8x lebih efisien. Lebih penting: dengan std 1.5%, ALII bisa di-leverage 2x → return 0.20%/hari dengan std 3%. Masih lebih kecil dari BRPT. Volatilitas bukan peluang. Volatilitas = RISIKO yang harus dibayar. BRPT cuma "lebih seru" — sampai drawdown-nya datang.
    kode: |
      sharpe_alii = 0.10 / 1.5
      sharpe_brpt = 0.10 / 4.2
      print(f"Sharpe ALII: {sharpe_alii:.3f} vs Sharpe BRPT: {sharpe_brpt:.3f}")
      # ALII + leverage 2x: return 0.20, std 3.0 → masih menang
    hasil:
