      - ret: -13.7
        dd: 13.7
        win: 25
        note: "Kamu biarkan: bulan crash −13,7%. Melanggar batas sendiri = aturan mati."
      - ret: 3.0
        dd: 5.0
        win: 30
        note: "0,33% salah arah hitung. Kamu terlalu takut: ukuran 0,2x, return melambat."
    petunjuk:
      - "Std bulanan = std harian × √21."
      - "Bandingkan 2 × std bulanan dengan batas 10%."
      - "Faktor ukuran = 5 ÷ std bulanan."
  - id: "s16-10"
    judul: "Ekor Gemuk"
    emoji: "🐘"
    sulit: "sulit"
    xp: 50
    menit: 8
    cerita: |
      Backtest 500 hari: mean +0,08%, std 1,1%. Model normal: loss 1 hari terburuk
      sekitar −3,5% (3 std). Kenyataan: 1 hari −8,2% (z = −7,5) dan 3 hari di bawah
      −4% (z di bawah −3,7). Loss 99% aktual = −5,1%; model normal = −2,6% (2,33
      std). Buat menentukan ukuran posisi, angka mana yang kamu pakai?
    pilihan:
      - "Normal (−2,6%) — 500 hari cukup, ekor gemuk cuma kebetulan"
      - "Aktual (−5,1%) — ekor gemuk nyata: loss ekstrem 2x lebih sering dari normal. Ukuran harus sekitar 50% dari aman-normal"
      - "Buang hari ekstrem dari data — biar statistiknya bersih"
      - "Pakai mean saja — 0,08% positif, risiko tidak relevan"
    jawaban: 1
    penjelasan: |
      Pasar punya ekor gemuk: kejadian ekstrem jauh lebih sering dari prediksi
      kurva normal. Buktinya di data sendiri: −4% yang "mustahil" (probabilitas
      0,01%) muncul 3 kali dalam 500 hari; −8,2% muncul sekali (normal: sekali
      dalam triliunan hari). Loss 99% aktual −5,1% vs normal −2,6%: hampir 2x.
      Kalau sizing pakai angka normal, kamu 2x over-risk — hari −5% yang "mustahil"
      itu datang tiap beberapa tahun. Buang hari ekstrem = menghapus risiko yang
      akan datang lagi. Ukuran aman = 2,56 ÷ 5,1 ≈ 50% dari ukuran aman-normal.
      Mean tanpa risiko = mengabaikan 99% cerita.
    kode: |
      var_normal = 2.33 * 1.1
      var_aktual = 5.1
      faktor = var_normal / var_aktual
      print(f"Loss 99%: normal {var_normal:.2f}% vs aktual {var_aktual:.1f}%")
      print(f"Faktor ukuran: {faktor*100:.0f}%")
    hasil:
      - ret: -18.0
        dd: 18.0
        win: 15
        note: "Size normal: hari −8,2% datang 2 tahun kemudian = −16,4% equity (lev 2x). Kamu kapok."
      - ret: 5.0
        dd: 4.0
        win: 68
        note: "Size 50%: hari −8,2% = −4,1% equity. Masih hidup, setahun +5% — umur panjang."
      - ret: -9.0
        dd: 10.0
        win: 18
        note: "Data dibersihkan, size besar: hari ekstrem tetap datang di live. −9%."
      - ret: -12.0
        dd: 14.0
        win: 12
        note: "Mean tanpa risiko: kamu 3x leverage, DD 14% pertama bikin menyerah."
    petunjuk:
      - "Bandingkan loss 99% model normal vs aktual."
      - "Ekor gemuk = ekstrem lebih sering dari normal. Siapa yang harus menyesuaikan?"
      - "Faktor ukuran = 2,56 ÷ 5,1."
soal:
  - id: "p16-1"
    judul: "Expectancy per Trade"
    emoji: "🧮"
    tingkat: mudah
    xp: 25
    menit: 6
    cerita: |
      Expectancy = untung rata-rata tiap kali kamu trading.
      Baca 3 angka: win rate (%), rata-rata profit, rata-rata loss (angka positif).
      Rumus: expectancy = (win rate / 100 × profit) − ((100 − win rate) / 100 × loss).
      Cetak expectancy, 2 desimal.
    input_spec: |
      Baris 1: win rate dalam persen.
      Baris 2: rata-rata profit per trade menang.
      Baris 3: rata-rata loss per trade kalah (angka positif).
    output_spec: |
      Satu baris: expectancy, 2 desimal.
    contoh:
      - input: "60\n100\n80"
        output: "28.00"
      - input: "50\n50\n50"
        output: "0.00"
    tes:
      - input: "60\n100\n80"
        output: "28.00"
      - input: "50\n50\n50"
        output: "0.00"
      - input: "40\n200\n100"
        output: "20.00"
      - input: "30\n100\n150"
        output: "-75.00"
    solusi: |
      win_rate = float(input())
      profit = float(input())
      loss = float(input())
      expectancy = (win_rate / 100) * profit - (1 - win_rate / 100) * loss
      print(f"{expectancy:.2f}")
    petunjuk:
      - "Win rate 60% artinya peluang menang 0,60."
      - "Peluang kalah = 1 − 0,60 = 0,40."
    tugas:
      - "Baca win rate, rata-rata profit, dan rata-rata loss dari tiga baris input."
      - "Ubah win rate jadi peluang menang dengan membagi 100."
      - "Peluang kalah = 1 dikurangi peluang menang."
      - "Hitung expectancy lalu cetak 2 desimal."
    starter: |
      win_rate = float(input())
      profit = float(input())
      loss = float(input())
      p_menang = win_rate / 100
      p_kalah = 1 - p_menang
      # TODO: expectancy = p_menang * profit - p_kalah * loss
      print(f"{expectancy:.2f}")
