# ============================================================
# BAB 15 — EKSEKUSI & PSIKOLOGI
# Fee & slippage, revenge trading, konsistensi eksekusi,
# jurnal trading.
# ============================================================
bab: 15
track: quant
judul: "Eksekusi & Psikologi"
emoji: "🧠"
deskripsi: "Strategi terbaik bisa mati di eksekusi yang buruk. Hitung biaya tersembunyi, kendalikan emosi, bangun konsistensi."
pelajaran:
  - id: "15-1"
    judul: "Biaya Tersembunyi: Fee, Slippage, Spread"
    menit: 5
    materi: |
      Setiap trade punya biaya yang jarang dihitung:

      - **Fee**: saham IDX ~0.15-0.3% per transaksi (beli + jual = 0.3-0.6% roundtrip). Kripto di Bybit: maker 0.02-0.1%, taker 0.05-0.1%. Maker = order yang menunggu di antrian. Taker = order yang langsung eksekusi. Lebih murah dari saham, tapi tetap ada.
      - **Spread**: selisih harga beli-jual. Saham tipis bisa spread 1-2% — kamu rugi di situ bahkan sebelum harga bergerak.
      - **Slippage**: order besar di pasar tipis — harga eksekusi lebih buruk dari yang diharapkan.

      Hitungan jujur: profit 0.25% per trade − fee roundtrip 0.3% = **strategi rugi** setelah biaya. Backtest (uji strategi di data lama) tanpa biaya = fiksi.

      Aturan: **backtest selalu hitung bersih setelah biaya (net of fees)**. Target profit per trade minimal 2-3x total biaya roundtrip. Frekuensi tinggi = biaya menumpuk. 100 trade/tahun × 0.5% = 50% modal akun menguap untuk biaya doang.
    kode: |
      profit_per_trade = 0.0025     # 0.25%
      fee_roundtrip = 0.003         # 0.30%
      net = profit_per_trade - fee_roundtrip
      print(f"Net: {net*100:+.2f}%/trade")   # -0.05% → rugi
    penjelasan: "Profit kotor tanpa fee bukan profit. 0.25% − 0.30% = negatif. Strategi mati di biaya."
  - id: "15-2"
    judul: "Revenge Trading & Jurnal"
    menit: 5
    materi: |
      Pola klasik: loss → emosi → entry lagi untuk "balas dendam" → loss lagi → ukuran naik → hancur.

      **Revenge trading** = trading balas dendam. Pembunuh #1 akun kecil. Tandanya: entry tanpa sinyal, sizing lebih besar dari aturan, force trade setelah loss, melanggar aturan sendiri.

      Dua pertahanan terbaik:
      1. **Aturan hard-stop harian** (stop keras): setelah loss X (misal 3% modal atau 2 loss beruntun), trading selesai hari itu. Fisiknya: tutup chart, jalan.
      2. **Jurnal trading**: tulis setiap trade — alasan entry, ekspektasi, hasil, emosi. Setelah 20 trade, polanya kelihatan. Loss terbesar selalu datang dari trade di luar aturan.

      Konsistensi > genius. Trader dengan eksekusi 90% sesuai aturan dan strategi biasa — mengalahkan trader jenius yang eksekusinya cuma 60% sesuai aturan.
    kode: |
      daily_stop = -0.03          # aturan harian
      today = -0.045
      if today <= daily_stop:
          print("SELESAI HARI INI — tutup chart")
    penjelasan: "Aturan harian + jurnal mengubah emosi jadi data. Konsistensi eksekusi adalah edge kedua."
skenario:
  - id: "s15-1"
    judul: "Fee Memakan Profit"
    emoji: "💸"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Strategi scalping kamu (trade cepat, ambil profit kecil-kecil): profit rata-rata **0.25% per trade** sebelum biaya, 4 trade/hari. Biaya roundtrip saham IDX (beli+jual, termasuk pajak) = **0.4%**. Backtest kamu tidak menghitung biaya. Sebulan live = 80 trade. Hasilnya?
    pilihan:
      - "Untung kecil — 0.25% × 80 = 20% kotor"
      - "Rugi — tiap trade net -0.15%, biaya makan semuanya"
      - "Impas — profit dan biaya saling menghapus"
      - "Untung besar — volume tinggi bikin fee makin kecil"
    jawaban: 1
    penjelasan: |
      Net per trade = 0.25% − 0.4% = **-0.15%**. 80 trade = -12% modal, bukan +20%. Backtest tanpa biaya = optimisme palsu. Scalping saham IDX dengan fee 0.4% roundtrip butuh profit kotor minimal ~0.8% per trade (2x biaya) supaya layak. Pelajaran: **selalu hitung bersih setelah biaya**. Strategi dengan edge kecil? Pindah ke aset/venue fee rendah (kripto maker, atau swing yang jarang trade).
    kode: |
      gross = 0.0025
      fee = 0.004
      net = gross - fee
      total = net * 80
      print(f"Net/trade: {net*100:.2f}% | 80 trade: {total*100:.1f}%")  # -12.0%
    hasil:
      - ret: -12.0
        dd: 12.0
        win: 20
        note: "Kenyataan: 80 trade × -0.15% = -12%. Backtest 20% kotor ternyata fiksi. Bulan kedua kamu berhenti."
      - ret: -12.0
        dd: 12.0
        win: 35
        note: "Benar. Ini kenapa 'strategi profit 0.25%' bisa jadi bencana di venue berbiaya tinggi."
      - ret: -6.0
        dd: 6.0
        win: 30
        note: "Tidak impas: 0.25% < 0.4%, selisihnya negatif konsisten. Setiap trade = -0.15%."
      - ret: -12.0
        dd: 12.0
        win: 22
        note: "Volume tidak menurunkan fee persentase di IDX. Lebih banyak trade = lebih banyak biaya."
    petunjuk:
      - "Kurangkan 0.4% dari 0.25%."
      - "Kalikan net negatif dengan 80 trade."
  - id: "s15-2"
    judul: "Tiga Stop Berturut"
    emoji: "🔥"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Hari ini kamu kena stop loss 3x berturut — total -4.5% modal. Jam masih 14:00 WIB. Chart ALII mulai terlihat "mau naik". Dorongan kuat untuk entry lagi, ukuran 2x, biar cepat balik. Apa yang kamu lakukan?
    pilihan:
      - "Entry 2x — kalau benar, loss balik cepat"
      - "Berhenti trading hari ini — aturan harian tercapai, evaluasi besok"
      - "Entry normal 1x — biar tidak ketinggalan"
      - "Pindah ke saham lain dan entry di sana"
    jawaban: 1
    penjelasan: |
      Tiga loss = sinyal. Bisa jadi market hari ini tidak cocok dengan strategimu (harga bergerak sideways, news, dll). Melanjutkan = **revenge trading**. Menaikkan ukuran = mempercepat kehancuran. Aturan hard-stop harian (misal -3% modal = selesai) ada justru untuk momen ini. Berhenti. Evaluasi jurnal: 3 loss itu karena aturan dilanggar, atau strategi kalah di kondisi ini? Besok market masih ada — peluang tidak pernah habis. (Entry "normal" tetap melanggar aturan harian. Pindah saham = revenge dengan wajah baru.)
    kode: |
      daily_stop = -0.03          # aturan: berhenti di -3%
      today = -0.045
      if today <= daily_stop:
          print("TRADING DONE — tutup chart")
    hasil:
      - ret: -9.5
        dd: 9.5
        win: 18
        note: "Entry 2x: kena stop lagi (-3%). Total hari itu -7.5%, dan emosi makin panas. Bulan itu -9.5%."
      - ret: -4.5
        dd: 4.5
        win: 74
        note: "Berhenti di -4.5%: besok market trend normal lagi, kamu entry sesuai aturan dan pulihkan 3.1%. Disiplin menyelamatkan."
      - ret: -6.8
        dd: 6.8
        win: 30
        note: "Entry normal tetap melanggar aturan harian. Kena stop ke-4. Total -6.8%."
      - ret: -7.4
        dd: 7.4
        win: 26
        note: "Pindah saham = revenge trading dengan wajah baru. Saham baru itu juga turun. -7.4%."
    petunjuk:
      - "Apa aturan harianmu? 3 loss sudah lewat batas?"
      - "Market besok masih buka. Peluang tidak habis."
  - id: "s15-3"
    judul: "Sinyal Bagus, Eksekusi Nol"
    emoji: "📭"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Sebulan terakhir, 7 sinyal valid (sesuai sistem) kamu lewatkan: 3 karena "tunggu harga lebih murah", 2 karena ragu, 2 karena sibuk. 6 dari 7 sinyal itu ternyata profit (rata-rata +6%). Sinyal ke-8 muncul sekarang. Sistemmu jelas: entry. Apa masalah terbesarmu? Apa yang harus diperbaiki?
    pilihan:
      - "Sistem entry-nya kurang presisi — cari harga masuk yang lebih baik"
      - "Eksekusi tidak konsisten — sinyal valid harus dieksekusi, pasang order limit otomatis"
      - "Tidak masalah — yang penting tidak loss"
      - "Strategi perlu diubah — 6/7 profit berarti overfit"
    jawaban: 1
    penjelasan: |
      Masalahnya bukan strategi (6/7 profit = edge nyata). Masalahnya **eksekusi**: kamu kehilangan ~36% potensi profit sebulan. Penyebabnya ragu dan nunggu harga sempurna. "Tunggu lebih murah" = market timing tanpa dasar. Ragu = melanggar sistem sendiri. Perbaikan: **otomasi eksekusi** (order limit di zona entry sistem), batasi jumlah missed trade per minggu, dan jurnal "sinyal vs eksekusi" untuk mengukur kebocoran. Sinyal ke-8: eksekusi sekarang, size sesuai aturan, stop terpasang. Konsistensi eksekusi = edge kedua setelah strategi.
    kode: |
      # Ukur leakage: sinyal vs eksekusi
      signals = 7
      executed = 0
      missed_profit = 6 * 0.06      # 6 sinyal profit rata2 6%
      print(f"Leakage bulan ini: {missed_profit*100:.0f}% potensi")
      # fix: order limit otomatis di zona entry
    hasil:
      - ret: 12.4
        dd: 5.0
        win: 78
        note: "Fix eksekusi: 8 sinyal berikutnya dieksekusi semua, 6 profit. Bulan itu +12.4% — leakage ditutup."
      - ret: 0.0
        dd: 0.0
        win: 65
        note: "Kamu cari 'harga lebih baik': sinyal ke-8 jalan tanpa kamu, +5.8%. Analisis benar tapi tidak mengubah perilaku — leakage lanjut."
      - ret: -2.1
        dd: 2.1
        win: 40
        note: "'Tidak masalah' = normalisasi kebocoran. Bulan berikutnya 5 sinyal lagi dilewatkan. Opportunity cost terus."
      - ret: -1.0
        dd: 1.0
        win: 30
        note: "Strategi yang 6/7 profit bukan overfit — itu bagus! Mengubah strategi justru membuang edge yang sudah terbukti."
    petunjuk:
      - "6/7 sinyal profit = masalahnya di mana?"
      - "Kalau sinyal valid tapi tidak dieksekusi, apa namanya?"
  - id: "s15-4"
    judul: "Order Besar, Harga Ikut"
    emoji: "🐋"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Kamu pegang saham tipis senilai Rp40 juta. Harga terlihat 1.000. Antrian beli tipis: tiap level cuma Rp5 juta. Kamu pasang market sell Rp40 juta. Berapa kira-kira harga eksekusimu?
    pilihan:
      - "1.000 — market sell selalu dapat harga yang terlihat"
      - "Sekitar 982 — order makan antrian sampai habis, harga eksekusi turun (slippage)"
      - "Ditolak — terlalu besar untuk pasar tipis"
      - "Di atas 1.000 — order besar menarik pembeli baru"
    jawaban: 1
    penjelasan: |
      Market sell dieksekusi dari antrian terbaik ke bawah. Level 1.000 cuma Rp5 juta. Sisanya Rp35 juta makan level 995, 990, dan seterusnya. Terisi semua? Harga sudah turun ke 965. Harga rata-rata ≈ 982. Rugi slippage ≈ 1.8% dari Rp40 juta = Rp700 ribu. Belum fee. Ini pajak likuiditas untuk order besar. Solusi: pecah jadi order limit kecil di zona wajar. Contoh: 8 order Rp5 juta di 995-1.000. Terisi bertahap, slippage nol. Butuh waktu 1-2 hari — itu harga yang wajar. Takut harga turun? Jual bertahap sambil pantau. Jangan market sekali jalan. Slippage tidak terlihat di chart, tapi dia makan profit nyata.
    kode: |
      nilai = 40_000_000
      slippage = (1000 - 982.5) / 1000     # ~1.75%
      rugi = nilai * slippage
      print(f"Rugi slippage: Rp{rugi:,.0f}")    # Rp700.000
      print("Limit bertahap → slippage nol")
    hasil:
      - ret: -1.8
        dd: 2.0
        win: 20
        note: "Fill rata-rata 982: rugi Rp700 ribu. Harga lalu naik — kamu jual di dasar."
      - ret: 0.0
        dd: 0.0
        win: 72
        note: "Order limit bertahap terisi di 995-1.000 dalam 2 hari. Slippage nol."
      - ret: -1.8
        dd: 2.0
        win: 12
        note: "Market sell tidak pernah ditolak. Dia tetap jalan dan menekan harga."
      - ret: -1.8
        dd: 2.0
        win: 14
        note: "Sell besar menekan harga, bukan menarik pembeli. Slippage tetap terjadi."
    petunjuk:
      - "Antrian 1.000 cuma Rp5 juta. Sisanya Rp35 juta terisi di mana?"
      - "Bagaimana cara jual besar tanpa menggerakkan harga?"
  - id: "s15-5"
    judul: "Jurnal yang Jujur"
    emoji: "📋"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Jurnal 50 trade terakhirmu: 30 menang, 20 kalah. Win rate 60%, tapi total minus. Polanya: win rata-rata +0,4% equity. Kamu potong manual sebelum target +1%. Loss rata-rata -1%. Stop sistem -0,5% sering kamu abaikan. Sistemnya sendiri: target +1%, stop -0,5%. Apa yang salah?
    pilihan:
      - "Tidak apa-apa. Menang 60% sudah bagus, profit kecil lebih aman"
      - "Perilaku yang salah, bukan sistem. Patuhi target +1% dan stop -0,5%"
      - "Ganti sistem. Win rate 60% tapi tetap rugi = sistem jelek"
      - "Hapus target. Biarkan win jalan terus, jangan dipotong"
    jawaban: 1
    penjelasan: |
      Hitung ekspektasi per trade. Perilakumu: 0,6 × 0,4 - 0,4 × 1,0 = -0,16% per trade. Rugi. Sistem asli: 0,6 × 1,0 - 0,4 × 0,5 = +0,4% per trade. Untung. Sistemmu positif, eksekusimu yang negatif. Kamu memotong win sebelum target karena takut profit hilang. Kamu menahan loss karena berharap balik. Ini disposition effect: potong profit cepat, pelihara loss. 25 trade dengan perilaku lama = -4%. Dengan patuh = +10%. Perbaikan: pasang target dan stop otomatis sejak entry, jangan intervensi manual. Ganti sistem = membuang sistem yang sebenarnya untung. Hapus target = win yang balik arah berubah jadi loss.
    kode: |
      exp_lama = 0.6 * 0.4 - 0.4 * 1.0     # potong win, tahan loss
      exp_sistem = 0.6 * 1.0 - 0.4 * 0.5   # patuh target dan stop
      print(f"Perilaku: {exp_lama:.2f}% per trade")
      print(f"Sistem:   {exp_sistem:+.2f}% per trade")
    hasil:
      - ret: -4.0
        dd: 4.0
        win: 25
        note: "25 trade berikutnya: -4%. Kebiasaan sama, hasil sama."
      - ret: 10.0
        dd: 2.5
        win: 78
        note: "Target dan stop dipatuhi: 25 trade = +10%. Konsistensi mengubah rugi jadi profit."
      - ret: -4.0
        dd: 5.0
        win: 30
        note: "Sistem baru, perilaku lama. Win tetap dipotong, loss tetap ditahan. -4% lagi."
      - ret: -7.0
        dd: 8.0
        win: 15
        note: "Tanpa target: win yang sempat +1% balik arah jadi loss. Lebih parah."
    petunjuk:
      - "Hitung ekspektasi: peluang menang × hasil menang, dikurangi peluang kalah × hasil kalah."
      - "Sistem positif tapi hasilmu negatif. Siapa yang salah?"


  - id: "s15-6"
    judul: "Maker vs Taker"
    emoji: "🏭"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Di bursa kripto: fee maker (order limit yang menunggu di antrian) 0,02%, fee
      taker (market order) 0,055% per sisi. Kamu trader 100 roundtrip per bulan.
      Berapa beda total biaya kalau semua pakai limit dibanding semua market?
    pilihan:
      - "0,07% — bedanya kecil, tidak penting"
      - "7% dari notional per bulan — 0,035% × 2 sisi × 100 trade"
      - "3,5% — 0,035% × 100"
      - "Tidak ada beda — fee sama untuk semua jenis order"
    jawaban: 1
    penjelasan: |
      Beda fee per sisi = 0,055 − 0,02 = 0,035%. Satu roundtrip = dua sisi (masuk +
      keluar): 0,07%. Seratus roundtrip = 100 × 0,07% = 7% dari notional. Kalau
      notional rata-rata $10.000: $700 per bulan — untuk aktivitas yang sama, cuma
      beda jenis order. Trader frekuensi tinggi wajib maker. Limit butuh kesabaran
      (tidak selalu terisi) dan risiko harga bergerak, tapi selisihnya besar.
      "0,07%" = menghitung per trade, lupa mengalikan frekuensi. "3,5%" = lupa dua
      sisi. "Tidak ada beda" = salah: taker 2,75x lebih mahal dari maker.
    kode: |
      beda_per_sisi = 0.00055 - 0.0002
      trade_per_bulan = 100
      beda_bulanan = beda_per_sisi * 2 * trade_per_bulan
      print(f"Beda biaya: {beda_bulanan*100:.1f}% notional per bulan")
    hasil:
      - ret: -7.0
        dd: 7.0
        win: 20
        note: "Kamu tetap market: 7% notional menguap per bulan. Setahun akun jeblok."
      - ret: 5.5
        dd: 1.5
        win: 72
        note: "Pindah ke limit: hemat 7% per bulan. Sebagian order tidak terisi — terkompensasi harga lebih baik."
      - ret: -3.5
        dd: 3.5
        win: 30
        note: "3,5% = lupa dua sisi. Biaya nyata 2x lipat hitunganmu."
      - ret: -7.0
        dd: 7.0
        win: 15
        note: "Fee beda: taker 2,75x maker. Kamu bayar mahal tanpa sadar."
    petunjuk:
      - "Beda fee per sisi berapa?"
      - "Satu roundtrip = berapa sisi? Kalikan dengan 100 trade."
  - id: "s15-7"
    judul: "Trade di Luar Aturan"
    emoji: "🗒️"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Jurnal 40 trade: 10 di luar aturan (entry emosi), 8 di antaranya loss. Dari
      30 trade sesuai aturan, 18 win. Berapa win rate masing-masing kelompok, dan
      apa artinya buat tradingmu?
    pilihan:
      - "Sama saja — win rate total 50%, biasa"
      - "Sesuai aturan 60%, di luar aturan 20% — patuh aturan 3x lebih baik; loss terbesar dari trade liar"
      - "Sesuai aturan 60%, liar 20% — tapi cuma 10 trade, tidak masalah"
      - "Sulit dibedakan — trading itu campuran"
    jawaban: 1
    penjelasan: |
      Sesuai aturan: 18 ÷ 30 = 60%. Di luar aturan: 2 ÷ 10 = 20%. Tiga kali lebih
      baik. Kalau ukuran trade liar juga lebih besar (khas revenge trading), kontribusi
      loss-nya makin parah. Ini fungsi jurnal: memisahkan strategi dari perilaku.
      Buang 10 trade liar, win rate naik dari 50% (20/40) ke 60% dan drawdown
      mengecil. "Tidak masalah" salah: 8 loss dari 10 trade emosi = sumber utama
      loss bulan itu. Perbaikan: aturan entry ditulis objektif, dan trade yang tidak
      memenuhi syarat otomatis di-skip. Perilaku diukur, bukan dirasakan.
    kode: |
      win_aturan = 18 / 30
      win_liar = 2 / 10
      print(f"Win rate sesuai aturan: {win_aturan*100:.0f}%")
      print(f"Win rate di luar aturan: {win_liar*100:.0f}%")
    hasil:
      - ret: -4.0
        dd: 6.0
        win: 25
        note: "Total 50% menutupi dua dunia: 60% disiplin vs 20% emosional. Loss besar terus berulang."
      - ret: 9.0
        dd: 2.0
        win: 73
        note: "Trade liar dihentikan: 30 trade patuh = +9% bersih. Pola loss hilang."
      - ret: 4.0
        dd: 4.0
        win: 40
        note: "10 trade kecil? 8 loss-nya = 40% total loss bulan itu. Justru masalah utama."
      - ret: -2.0
        dd: 5.0
        win: 30
        note: "Tanpa pemisahan, tidak ada yang bisa diperbaiki. Kebiasaan lama lanjut: −2%."
    petunjuk:
      - "18 ÷ 30 = ? dan 2 ÷ 10 = ?"
      - "Berapa kontribusi loss trade liar terhadap total loss?"
  - id: "s15-8"
    judul: "Stop Saat Gap"
    emoji: "🚧"
    sulit: "sedang"
    xp: 35
    menit: 6
    cerita: |
      Posisi long saham tipis, stop loss 5% dari entry. Berita buruk semalam: harga
      buka gap turun 7% — langsung di bawah stop. Stop loss-mu order market. Di
      harga berapa kamu keluar, dan kenapa?
    pilihan:
      - "5% — stop loss menjamin harga eksekusi"
      - "Sekitar 7% — gap melompati level stop: market order dieksekusi di harga buka"
      - "0% — stop loss batal kalau terjadi gap"
      - "10% — stop loss malah memperbesar loss"
    jawaban: 1
    penjelasan: |
      Stop loss = order yang berubah jadi market order saat harga menyentuh level.
      Kalau harga buka sudah 7% di bawah entry, level 5% tidak pernah "tersentuh" —
      order langsung market di harga buka. Loss = 7%, bukan 5%. Slippage 2% tak
      terhindarkan di gap. Pelajaran: stop loss bukan jaminan harga di saham tipis
      dan momen berita. Alternatif stop limit 5% lebih parah: tidak terisi (harga
      tak pernah kembali ke 5%), loss bisa 12%+. Proteksi nyata = ukuran posisi:
      kalau gap 7% masih dalam batas risk equity, kamu selamat. Stop ketat di aset
      yang sering gap = ilusi keamanan.
    kode: |
      stop = 0.05
      gap = 0.07
      print(f"Loss direncanakan: {stop*100:.0f}% | Loss nyata: {gap*100:.0f}%")
    hasil:
      - ret: -7.0
        dd: 7.0
        win: 20
        note: "Kamu kira keluar di −5%, nyatanya −7%. Risk 2% equity jadi 3,5% — melanggar diam-diam."
      - ret: 2.0
        dd: 2.0
        win: 64
        note: "Kamu paham gap risk: ukuran dikecilkan sampai gap 7% = 2% equity. Tetap hidup bulan itu."
      - ret: -12.0
        dd: 12.0
        win: 10
        note: "Stop limit 5% tidak terisi: harga jatuh ke −12% baru ada likuiditas. Loss 2x lipat."
      - ret: -7.0
        dd: 7.0
        win: 15
        note: "Stop tidak memperbesar loss — gap yang melakukannya. Salah diagnosis = salah perbaikan."
    petunjuk:
