soal:
  - id: "p12-1"
    judul: "Drawdown Maksimum"
    emoji: "🪂"
    tingkat: sedang
    xp: 40
    menit: 7
    cerita: |
      Kamu punya deret harga harian. Drawdown = seberapa jauh harga turun
      dari PUNCAK tertinggi sejauh ini. Contoh: dari 120 turun ke 90 = drawdown 25%.
      Baca N (baris 1), lalu N baris harga. Cetak drawdown MAKSIMUM selama deret, 2 desimal.
    input_spec: |
      Baris 1: N (jumlah harga).
      N baris berikutnya: satu harga per baris.
    output_spec: |
      Satu baris: drawdown maksimum dalam persen, 2 desimal.
    contoh:
      - input: "5\n100\n120\n90\n110\n80"
        output: "33.33"
      - input: "4\n50\n55\n60\n65"
        output: "0.00"
    tes:
      - input: "5\n100\n120\n90\n110\n80"
        output: "33.33"
      - input: "4\n50\n55\n60\n65"
        output: "0.00"
      - input: "6\n200\n180\n190\n150\n170\n160"
        output: "25.00"
      - input: "3\n100\n100\n90"
        output: "10.00"
    solusi: |
      n = int(input())
      puncak = 0.0
      dd_maks = 0.0
      for _ in range(n):
          harga = float(input())
          if harga > puncak:
              puncak = harga
          else:
              dd = (puncak - harga) / puncak * 100
              if dd > dd_maks:
                  dd_maks = dd
      print(f"{dd_maks:.2f}")
    petunjuk:
      - "Lacak puncak tertinggi sejauh ini saat membaca harga satu per satu."
      - "Drawdown di titik itu = (puncak − harga) / puncak × 100. Simpan yang paling besar."
    tugas:
      - "Baca N di baris pertama, lalu baca N harga satu per satu."
      - "Lacak harga puncak tertinggi yang sudah lewat."
      - "Di setiap harga hitung drawdown dari puncak: (puncak - harga) / puncak x 100."
      - "Simpan drawdown terbesar dan cetak dengan 2 desimal."
    starter: |
      n = int(input())
      puncak = 0.0
      dd_maks = 0.0
      for _ in range(n):
          harga = float(input())
          # TODO: kalau harga lebih tinggi dari puncak, perbarui nilai puncak
          # TODO: kalau tidak, hitung drawdown = (puncak - harga) / puncak * 100
          # TODO: simpan ke dd_maks kalau lebih besar dari dd_maks sekarang
      print(f"{dd_maks:.2f}")
