    xp: 35
    menit: 6
    cerita: |
      Bot membaca 1.000 baris data. Baris ke-7 rusak: `TLKM ???`. Kode memakai satu blok try/except yang mengelilingi SEMUA baris. Bot mati di baris ke-7 — 993 baris valid tidak pernah diproses. Di mana try/except seharusnya diletakkan?
