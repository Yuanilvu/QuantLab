      - "Hapus baris ke-7 dari file sumbernya"
    jawaban: 1
    penjelasan: |
      Letak try/except menentukan perilaku. Di LUAR loop → error pertama menghentikan SEMUA: 1 baris rusak = 1.000 baris hangus. Di DALAM loop → tiap baris dicoba sendiri; baris jelek kena except, dicatat, loop lanjut ke baris berikutnya. 993 baris valid tetap diproses. Ini beda besar di produksi: feed harian selalu punya baris aneh. "Baris rusak harus menghentikan bot" = desain yang salah untuk data massal — kecuali memang mau stop total (bab 24-5: aturan 5%). Bersih manual = tidak scalable tiap hari. Menghapus dari file = memalsukan data; baris itu pernah ada, log yang benar mencatatnya dilewati.
