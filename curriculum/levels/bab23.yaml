  - id: "s23-9"
    judul: "Harga dengan Desimal"
    emoji: "🪙"
    sulit: "sulit"
    xp: 50
    menit: 7
    cerita: |
      Data broker BTC: `BTC 77221.5`. Bot: `harga = int(bagian[1])` → error `ValueError: invalid literal for int() with base 10: '77221.5'`. Kamu mau nilai posisi 0,5 BTC. Apa perbaikan dan hasilnya?
    pilihan:
      - "Ganti int → float: harga 77221.5 x 0.5 = 38610.75"
      - "Biarkan int — ValueError cuma sekali; potong jadi 77221 x 0.5 = 38610.5"
      - "Hapus titik dulu: int('772215') = 772215 x 0.5 = 386107.5"
      - "Bungkus try/except dan skip baris ini"
    jawaban: 0
    penjelasan: |
      Pesan error tepat: int() tidak bisa memproses '77221.5' karena ada titik desimal. Harga kripto dan banyak instrumen lain memakai desimal → `float('77221.5')` = 77221.5. Nilai 0,5 BTC = 77221.5 x 0.5 = 38.610,75. int() MEMOTONG desimal: 77221 x 0.5 = 38.610,5 — selisih 0,25 per transaksi kecil, tapi untuk 10 BTC selisihnya $2,5 dan terus menumpuk (error senyap). Menghapus titik = mengalikan harga 10x: 772.215 — salah besar. Skip baris = data valid dibuang diam-diam: harga desimal itu NORMAL, bukan error. Aturan: baca format data dulu — int untuk harga rupiah, float untuk harga berdesimal.
    kode: |
      baris = "BTC 77221.5"
      harga = float(baris.split()[1])
      nilai = harga * 0.5
      print(f"Nilai 0.5 BTC: {nilai:.2f}")
