# ============================================================
# BAB 23 — ERROR & DEBUGGING (TRACK: ADVANCED)
# Membaca pesan error, try/except, dan menemukan bug logika.
# ============================================================
bab: 23
track: advanced
judul: "Error & Debugging"
emoji: "🐞"
deskripsi: "Error bukan kegagalan — itu pesan dari komputer. Belajar membacanya dan membuat bot yang tahan banting."
pelajaran:
  - id: "23-1"
    judul: "Error Itu Pesan, Bukan Musuh"
    menit: 5
    materi: |
      Programmer pemula panik lihat error. Programmer pro justru BERSYUKUR — error memberi tahu persis apa yang salah. Kenali yang paling umum:

      - `NameError: name 'harga' is not defined` → variabel `harga` belum dibuat / salah eja.
      - `TypeError: can't multiply sequence by non-int` → kamu mengalikan teks dengan angka (lupa `int()`).
      - `ValueError: invalid literal for int()` → `int()` diberi teks yang bukan angka.
      - `IndexError: list index out of range` → indeks melebihi panjang list.
      - `KeyError: 'harga'` → kunci tidak ada di dict.
      - `ZeroDivisionError` → membagi dengan nol.

      Cara membaca: lihat **baris paling bawah** pesan — itulah inti masalahnya. Baris di atasnya hanya jejak panggilan (traceback).

      Di trading: bot yang error dengan pesan jelas = mudah diperbaiki. Bot yang error diam-diam = bom waktu. Selalu buat error TERLIHAT (log + alert).
    kode: |
      # Error umum — coba tebak sebelum menjalankan!
      # print(harga * 2)      → NameError
      # print("5" * 2)        → '55' (teks! bukan 10)
      print(int("5") * 2)     # 10 — pakai int() dulu
    penjelasan: "Error = diagnosis gratis. Baca baris bawah, cari variabel/tipe/indeks yang bermasalah."
  - id: "23-2"
    judul: "try/except: Jaring Pengaman"
    menit: 5
    materi: |
      Bot harus bertahan menghadapi data jelek: input kosong, angka salah format, koneksi putus. **try/except** = jaring pengaman.

      ```python
      try:
          harga = int(input("Harga: "))
          print(harga * 2)
      except ValueError:
          print("Input bukan angka — pakai angka dong!")
      ```

      Cara kerja: Python COBA menjalankan blok `try`. Kalau muncul error yang cocok dengan `except ValueError`, blok except yang jalan. Program TIDAK mati. Kalau tidak ada error, except dilewati.

      Bisa menangkap banyak jenis sekaligus: `except (ValueError, TypeError):`. Ada juga `except Exception:` — jaring terakhir. Tapi hati-hati: itu menyembunyikan semua error.

      Di bot: setiap titik yang menerima data dari luar (input user, API, file) WAJIB punya jaring pengaman. Bot yang baik: data jelek → pesan jelas → tetap jalan. Bukan crash diam-diam.
    kode: |
      try:
          n = int(input())
          print(n * 2)
      except ValueError:
          print("BUKAN ANGKA — bot tetap hidup!")
    penjelasan: "try/except = coba dulu, tangkap errornya, lanjut hidup. Data jelek tidak boleh mematikan bot."
