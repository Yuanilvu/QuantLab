pelajaran:
  - id: "4-1"
    judul: "Cetak & Angka"
    menit: 5
    materi: |
      Program Python paling sederhana: `print("halo")` — mencetak kata ke layar.

      Python juga jago hitung:
      - `print(2 + 3)` → 5
      - `print(10 - 4)` → 6
      - `print(6 * 7)` → 42
      - `print(10 / 4)` → 2.5
      - `print(10 // 4)` → 2 (pembagian, hasil dibulatkan ke bawah)
      - `print(10 % 4)` → 2 (sisa bagi)

      Urutan hitung sama seperti matematika. Kali/bagi dulu, baru tambah/kurang. `print(2 + 3 * 4)` → 14, bukan 20. Mau paksa urutan? Pakai kurung: `print((2 + 3) * 4)` → 20.

      Di dunia quant, angka = bahan bakar: harga, persen, profit, loss. Python menghitungnya cepat dan tidak pernah salah hitung.
    kode: |
      print(2 + 3)        # 5
      print(6 * 7)        # 42
      print(10 / 4)       # 2.5
      print((2 + 3) * 4)  # 20
    penjelasan: "print menampilkan hasil. Operator: + − * / // %. Kurung mengontrol urutan."
  - id: "4-2"
    judul: "Variabel: Kotak Penyimpan Angka"
    menit: 5
    materi: |
      **Variabel** = kotak yang menyimpan angka (atau teks). Isi kotak bisa dipakai berkali-kali.

      ```python
      harga = 4000          # kotak 'harga' berisi 4000
      kenaikan = 0.05       # 5% ditulis 0.05
      harga_baru = harga * (1 + kenaikan)
      print(harga_baru)     # 4200.0
      ```

      Kenapa penting? Di quant kamu menghitung hal yang sama berulang-ulang dengan angka berbeda. Tulis rumusnya sekali. Ganti isi kotaknya. Selesai.

      **f-string** = cara rapi mencampur teks dan angka: `print(f"Harga baru: {harga_baru}")`. Huruf `f` di depan. Angka di dalam kurung kurawal `{}`.

      Aturan nama variabel: huruf kecil dan garis bawah (underscore). Contoh: `harga_beli`, `total_loss`. Jangan pakai spasi.
    kode: |
      harga = 4000
      kenaikan = 0.05
      harga_baru = harga * (1 + kenaikan)
      print(f"Harga baru: {harga_baru}")   # Harga baru: 4200.0
    penjelasan: "Variabel = kotak angka. f-string = cetak rapi. Rumus ditulis sekali, dipakai terus."
