  - id: "s4-4"
    judul: "Berapa Kali Bisa Trade?"
    emoji: "✂️"
    sulit: "sedang"
    xp: 35
    menit: 5
    cerita: |
      Danamu Rp1.000.000.
      Satu trade butuh Rp300.000.
      Botmu ingin trade sebanyak mungkin. Tanpa utang.
      Berapa trade maksimal? Berapa sisa danamu?
    pilihan:
      - "3 trade, sisa Rp100.000"
      - "3,33 trade — hasil bagi 1.000.000 ÷ 300.000"
      - "4 trade — biar maksimal, utang sedikit tidak apa-apa"
      - "2 trade, sisa Rp400.000 — sisanya untuk jaga-jaga"
    jawaban: 0
    penjelasan: |
      1.000.000 ÷ 300.000 = 3,33.
      Trade tidak bisa pecahan. 0,33 trade tidak ada di dunia nyata.

      Python punya alat pas: `//` membagi lalu membulatkan ke bawah.
      1.000.000 // 300.000 = 3.
      `%` memberi sisanya. 1.000.000 % 300.000 = 100.000.

      4 trade butuh 1.200.000. Dana kurang 200.000. Itu jalan ke utang.
      Bot memakai pola ini untuk sizing (menentukan ukuran posisi).
      Jumlah trade selalu dibulatkan ke bawah.
    kode: |
      dana = 1_000_000
      butuh = 300_000
      print(dana // butuh)   # 3 trade
      print(dana % butuh)    # 100000 sisa
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "3 trade, sisa 100.000. Bot jalan tanpa utang. `//` dan `%` jadi alat sizing."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "3,33 trade tidak ada. Trade tidak bisa pecahan — bulatkan ke bawah."
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "4 trade butuh 1,2 juta. Dana kurang 200 ribu — kamu masuk utang."
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "Masih muat 3 trade. 2 trade = 400 ribu dana menganggur."
    petunjuk:
      - "1.000.000 dibagi 300.000: berapa utuh, berapa sisa?"
      - "`//` = hasil bulat ke bawah. `%` = sisa bagi."

  - id: "s4-5"
    judul: "Baca Kode: Rata-rata yang Keliru"
    emoji: "🎯"
    sulit: "mudah"
    xp: 20
    menit: 4
    cerita: |
      Botmu mau mencetak rata-rata 3 harga TLKM (Bab 2).
      Harga: 1.000, 1.100, 900.
      Kodenya:
      ```python
      print(1000 + 1100 + 900 / 3)
      ```
      Berapa yang tercetak?
    pilihan:
      - "1.000 — rata-rata tiga harga"
      - "2.400 — 900 ÷ 3 dihitung dulu, baru ditambah"
      - "800 — 2.400 dibagi 3 lagi"
      - "300 — cuma 900 dibagi 3"
    jawaban: 1
    penjelasan: |
      Python mengerjakan bagi lebih dulu.
      900 ÷ 3 = 300. Lalu 1.000 + 1.100 + 300 = **2.400**.
      Tanpa kurung, hasilnya bukan rata-rata.
      Rata-rata benar butuh kurung: `(1000 + 1100 + 900) / 3` = 1.000.
      Urutan operasi: kali/bagi dulu, tambah/kurang belakangan.
      Bot yang salah urutan mencetak angka menyesatkan.
      Selalu cek kurung saat membaca kode.
    kode: |
      salah = 1000 + 1100 + 900 / 3
      benar = (1000 + 1100 + 900) / 3
      print(salah, benar)   # 2400.0 1000.0
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 30
        note: "1.000 itu rata-rata yang diinginkan. Kode ini mencetak 2.400 — kurungnya hilang."
      - ret: 0.0
        dd: 0.0
        win: 80
        note: "2.400 benar tercetak. Kamu tahu urutan operasi — bug bot langsung ketahuan."
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "800 tidak pernah tercetak. Python tidak membagi hasilnya dua kali."
      - ret: 0.0
        dd: 0.0
        win: 20
        note: "300 cuma bagian 900 ÷ 3. Hasil akhirnya 2.400."
    petunjuk:
      - "Python mengerjakan bagi atau tambah lebih dulu?"
      - "900 ÷ 3 dulu, baru dijumlah ke kiri."
