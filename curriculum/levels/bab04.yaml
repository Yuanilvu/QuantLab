    sulit: "sedang"
    xp: 35
    menit: 4
    cerita: |
      Kamu mau menulis program kecil: harga awal 4.000, naik 10%. Kode mana yang benar untuk menghitung harga baru?
    pilihan:
      - "`print(4000 + 10)`"
      - "`harga = 4000` lalu `print(harga * 1.10)`"
      - "`harga = 4000` lalu `print(harga * 10)`"
      - "`print(4000 * 0.10)`"
    jawaban: 1
    penjelasan: |
      Naik 10% = harga × 1,10 (100% + 10%). Jadi: `harga = 4000`, lalu `print(harga * 1.10)` → **4400**.

      Opsi lain salah: `+10` = tambah 10 rupiah, bukan persen. `* 10` = 40.000, 10x lipat. `* 0.10` = 400, cuma besarannya. Pola yang dipakai terus: `harga * (1 + persen/100)`. Kenaikan 5% → `harga * 1.05`.
    kode: |
      harga = 4000
      print(harga * 1.10)   # 4400.0 — harga setelah naik 10%
    hasil:
      - ret: 0.0
        dd: 0.0
        win: 25
        note: "4000 + 10 = 4010. Itu menambah 10 rupiah, bukan 10 persen."
      - ret: 10.0
        dd: 0.0
        win: 78
        note: "harga * 1.10 = 4400. Benar: 1.10 = 100% + 10%."
      - ret: 900.0
        dd: 0.0
        win: 20
        note: "harga * 10 = 40.000. Itu 10x lipat, bukan naik 10 persen!"
      - ret: -90.0
        dd: 0.0
        win: 30
        note: "4000 * 0.10 = 400 — itu cuma BESARAN kenaikannya, bukan harga barunya."
    petunjuk:
      - "Naik 10% artinya harga × 110/100 = × 1,10."
      - "Cari opsi yang mengalikan harga dengan 1.10."
