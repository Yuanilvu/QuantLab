  - id: "p4-2"
    judul: "Harga Setelah Diskon"
    emoji: "🏷️"
    tingkat: mudah
    xp: 25
    menit: 8
    cerita: |
      Toko saham mainan lagi diskon! Program membaca dua angka: harga asli (baris 1) dan persen diskon (baris 2). Cetak harga setelah diskon, dibulatkan ke bawah.
    input_spec: |
      Baris 1: harga asli (angka bulat). Baris 2: persen diskon (angka bulat).
    output_spec: |
      Satu baris: harga setelah diskon (angka bulat, pembulatan ke bawah).
    contoh:
      - input: "1000\n10"
        output: "900"
      - input: "5000\n20"
        output: "4000"
    tes:
      - input: "1000\n10"
        output: "900"
      - input: "5000\n20"
        output: "4000"
      - input: "250\n5"
        output: "237"
      - input: "999\n90"
        output: "99"
    solusi: |
      harga = int(input())
      diskon = int(input())
      print(harga * (100 - diskon) // 100)
    petunjuk:
      - "Harga setelah diskon = harga × (100 − diskon) ÷ 100."
      - "Gunakan `//` supaya hasilnya bilangan bulat."
